<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>השוואת רכבים - ישראל 2024-2025</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card:#1a1d27;--card2:#232734;--accent:#6c5ce7;--accent2:#a29bfe;--green:#00b894;--red:#e17055;--yellow:#fdcb6e;--text:#e8e8e8;--text2:#8b8fa3;--border:#2d3141;--shadow:0 4px 24px rgba(0,0,0,.4)}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}
a{color:var(--accent2);text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.header{background:linear-gradient(135deg,#1a1d27,#232734);padding:20px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.header h1{font-size:1.8em;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--text2);font-size:.9em}
.nav{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.nav button{background:var(--card2);border:1px solid var(--border);color:var(--text2);padding:8px 18px;border-radius:20px;cursor:pointer;font-size:.85em;transition:.2s}
.nav button:hover,.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.container{max-width:1400px;margin:0 auto;padding:16px}
.search-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-bar input,.search-bar select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:.9em;outline:none;transition:.2s}
.search-bar input:focus,.search-bar select:focus{border-color:var(--accent)}
.search-bar input{flex:1;min-width:200px}
.search-bar select{min-width:140px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filter-chip{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:16px;cursor:pointer;font-size:.8em;transition:.2s;user-select:none}
.filter-chip:hover,.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.price-range{display:flex;align-items:center;gap:8px;background:var(--card);padding:8px 14px;border-radius:10px;border:1px solid var(--border);font-size:.85em}
.price-range input[type=range]{width:120px;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;transition:.3s;cursor:pointer;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card.selected{border-color:var(--green);box-shadow:0 0 20px rgba(0,184,148,.2)}
.card-brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3em;font-weight:700;color:#fff}
.card-brand h3{font-size:1.05em;color:var(--text)}
.card-brand .year{font-size:.8em;color:var(--text2);margin-right:auto}
.card-specs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.spec{display:flex;align-items:center;gap:6px;font-size:.8em;color:var(--text2)}
.spec .val{color:var(--text);font-weight:600}
.spec-icon{font-size:1em}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.card-price{font-size:1.1em;font-weight:700;color:var(--green)}
.card-type{font-size:.75em;padding:3px 10px;border-radius:10px;background:var(--card2);color:var(--text2)}
.btn-compare{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.8em;transition:.2s;white-space:nowrap}
.btn-compare:hover{background:var(--accent2)}
.btn-compare.added{background:var(--green)}
.compare-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--accent);padding:12px 20px;display:flex;align-items:center;gap:12px;z-index:200;transform:translateY(100%);transition:.3s;flex-wrap:wrap}
.compare-bar.show{transform:translateY(0)}
.compare-bar .cars{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.compare-bar .car-chip{background:var(--card2);padding:6px 12px;border-radius:8px;font-size:.8em;display:flex;align-items:center;gap:6px}
.compare-bar .car-chip .remove{cursor:pointer;color:var(--red);font-weight:700}
.compare-bar .btn-go{background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:.9em;font-weight:600}
.compare-table-wrap{overflow-x:auto;margin:16px 0}
table.compare{width:100%;border-collapse:collapse;min-width:600px}
table.compare th,table.compare td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--border);font-size:.85em}
table.compare th{background:var(--card2);color:var(--text);font-weight:600;position:sticky;top:0}
table.compare td{background:var(--card)}
table.compare tr:hover td{background:var(--card2)}
table.compare .best{color:var(--green);font-weight:700}
table.compare .worst{color:var(--red);font-weight:700}
table.compare .label{color:var(--text2);font-weight:600;background:var(--card2);min-width:140px}
.brands-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:16px 0}
.brand-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.2s}
.brand-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.brand-card .icon{font-size:2em;margin-bottom:6px}
.brand-card .name{font-size:.9em;font-weight:600}
.brand-card .count{font-size:.75em;color:var(--text2)}
.similar-section{margin-top:24px}
.similar-section h3{margin-bottom:12px;color:var(--accent2)}
.back-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;margin-bottom:16px;font-size:.85em}
.back-btn:hover{border-color:var(--accent)}
.detail-hero{background:var(--card);border-radius:14px;padding:24px;margin-bottom:16px;border:1px solid var(--border)}
.detail-hero .top{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.detail-hero h2{font-size:1.5em}
.detail-specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.detail-spec{background:var(--card2);padding:12px;border-radius:10px}
.detail-spec .label{font-size:.75em;color:var(--text2);margin-bottom:4px}
.detail-spec .value{font-size:1em;font-weight:600}
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty .icon{font-size:3em;margin-bottom:12px}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stars{color:var(--yellow)}
.engine-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.7em;font-weight:600}
.engine-badge.electric{background:#00b89433;color:var(--green)}
.engine-badge.hybrid{background:#6c5ce733;color:var(--accent2)}
.engine-badge.petrol{background:#fdcb6e33;color:var(--yellow)}
.engine-badge.diesel{background:#e1705533;color:var(--red)}
@media(max-width:768px){
.header h1{font-size:1.3em}
.grid{grid-template-columns:1fr}
.search-bar{flex-direction:column}
.search-bar input,.search-bar select{width:100%}
.brands-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.compare-bar{flex-direction:column;align-items:stretch}
.compare-bar .cars{justify-content:center}
}
.tab-content{display:none}.tab-content.active{display:block}
.count-badge{background:var(--accent);color:#fff;font-size:.7em;padding:1px 7px;border-radius:10px;margin-right:4px}
</style>
</head>

<h1>🚗 השוואת רכבים - ישראל</h1>

</div>
<div class="price-range">
<span>מחיר:</span>
<input type="range" id="price-min" min="50" max="800" value="50" step="10" oninput="updatePriceLabel();filterCars()">
<span id="price-min-label">50K</span>
<span>—</span>
<input type="range" id="price-max" min="50" max="800" value="800" step="10" oninput="updatePriceLabel();filterCars()">
<span id="price-max-label">800K</span>
<span>₪ (אלפים)</span>
</div>
<div id="results-count" style="margin:10px 0;font-size:.85em;color:var(--text2)"></div>
<div class="grid" id="car-grid"></div>
</div>
<div class="tab-content" id="tab-brands">
<div class="brands-grid" id="brands-grid"></div>
<div id="brand-cars" style="display:none">
<button class="back-btn" onclick="showBrandsMain()">→ חזרה למותגים</button>
<h2 id="brand-title" style="margin-bottom:16px"></h2>
<div class="grid" id="brand-car-grid"></div>
</div>
</div>
<div class="tab-content" id="tab-compare">
<div id="compare-empty" class="empty"><div class="icon">📊</div><p>בחרו 2-4 רכבים להשוואה</p><p style="margin-top:8px;font-size:.9em">חזרו לעיון ולחצו "הוסף להשוואה"</p></div>
<div class="compare-table-wrap" id="compare-table-wrap" style="display:none"></div>
<div class="similar-section" id="similar-section" style="display:none">
<h3>🔍 רכבים דומים שאולי יעניינו אתכם</h3>
<div class="grid" id="similar-grid"></div>
</div>
</div>
<div class="tab-content" id="tab-detail"></div>
</div>
<div class="compare-bar" id="compare-bar">
<span style="font-weight:600;white-space:nowrap">📊 השוואה:</span>
<div class="cars" id="compare-chips"></div>
<button class="btn-go" onclick="showTab('compare')">השווה עכשיו</button>
</div>

// State
let compareList=[];
let currentView='browse';
let filteredCars=[...DB];

function fmt(n){return n?n.toLocaleString():'—'}
function fmtPrice(min,max){return `₪${min>999?min:min+'K'}-${max>999?max:max+'K'}`}
function priceStr(min,max){return `₪${min},000 - ₪${max},000`}
function engineClass(e){return e==='חשמלי'?'electric':e==='היברידי'?'hybrid':e==='דיזל'?'diesel':'petrol'}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function getColor(brand){return brandColors[brandKey(brand)]||'#666'}
function initial(brand){return brand.charAt(0)}

function showTab(id){
document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
document.getElementById('tab-'+id).classList.add('active');
document.querySelectorAll('.nav button')[id==='browse'?0:id==='brands'?1:2].classList.add('active');
currentView=id;
if(id==='compare')renderCompare();
if(id==='brands')renderBrands();
}

function updatePriceLabel(){
document.getElementById('price-min-label').textContent=document.getElementById('price-min').value+'K';
document.getElementById('price-max-label').textContent=document.getElementById('price-max').value+'K';
}

function filterCars(){
const q=document.getElementById('search').value.toLowerCase();
const eng=document.getElementById('filter-engine').value;
const body=document.getElementById('filter-body').value;
const drv=document.getElementById('filter-drive').value;
const pmin=+document.getElementById('price-min').value;
const pmax=+document.getElementById('price-max').value;
filteredCars=DB.filter(c=>{
if(q&&!(c.brand.toLowerCase().includes(q)||c.model.toLowerCase().includes(q)||c.engine.includes(q)||c.body.includes(q)))return false;
if(eng&&c.engine!==eng)return false;
if(body&&c.body!==body)return false;
if(drv&&c.drive!==drv)return false;
if(c.priceMax<pmin||c.priceMin>pmax)return false;
return true;
});
renderGrid();
}

function renderGrid(){
const g=document.getElementById('car-grid');
document.getElementById('results-count').textContent=`${filteredCars.length} רכבים נמצאו`;
g.innerHTML=filteredCars.map((c,i)=>carCard(c,i)).join('');
}

function carCard(c,idx){
const inComp=compareList.some(x=>x===c);
const id=DB.indexOf(c);
return `<div class="card fade-in ${inComp?'selected':''}" onclick="showDetail(${id})">
<div class="card-brand">
<div class="brand-icon" style="background:${getColor(c.brand)}">${initial(c.brand)}</div>
<div><h3>${c.brand} ${c.model}</h3><span class="engine-badge ${engineClass(c.engine)}">${c.engine}</span></div>
<span class="year">${c.year}</span>
</div>
<div class="card-specs">
<div class="spec"><span class="spec-icon">🐎</span><span class="val">${c.hp}</span> כ"ס</div>
<div class="spec"><span class="spec-icon">⚡</span><span class="val">${c.acc}</span> שנ׳ 0-100</div>
<div class="spec"><span class="spec-icon">⛽</span><span class="val">${c.fuel}</span> ${c.engine==='חשמלי'?'kWh':'ל/100ק"מ'}</div>
<div class="spec"><span class="spec-icon">📦</span><span class="val">${c.trunk}</span> ליטר</div>
${c.range?`<div class="spec"><span class="spec-icon">🔋</span><span class="val">${c.range}</span> ק"מ טווח</div>`:''}
<div class="spec"><span class="spec-icon">👥</span><span class="val">${c.seats}</span> מושבים</div>
</div>
<div class="card-footer">
<span class="card-price">${priceStr(c.priceMin,c.priceMax)}</span>
<button class="btn-compare ${inComp?'added':''}" onclick="event.stopPropagation();toggleCompare(${id})">${inComp?'✓ נבחר':'הוסף להשוואה'}</button>
</div>
</div>`;
}

function toggleCompare(id){
const c=DB[id];
const idx=compareList.indexOf(c);
if(idx>-1)compareList.splice(idx,1);
else if(compareList.length<4)compareList.push(c);
else{alert('ניתן להשוות עד 4 רכבים');return}
updateCompareBar();
if(currentView==='browse')renderGrid();
else if(currentView==='compare')renderCompare();
else if(currentView==='brands')renderBrandCars(c.brand);
}

function updateCompareBar(){
const bar=document.getElementById('compare-bar');
const chips=document.getElementById('compare-chips');
const cnt=document.getElementById('compare-count');
if(compareList.length>0){
bar.classList.add('show');
cnt.style.display='inline';
cnt.textContent=compareList.length;
}else{
bar.classList.remove('show');
cnt.style.display='none';
}
chips.innerHTML=compareList.map((c,i)=>`<div class="car-chip">${c.brand} ${c.model}<span class="remove" onclick="toggleCompare(${DB.indexOf(c)})">✕</span></div>`).join('');
}

function renderCompare(){
const wrap=document.getElementById('compare-table-wrap');
const empty=document.getElementById('compare-empty');
const sim=document.getElementById('similar-section');
if(compareList.length<2){wrap.style.display='none';empty.style.display='block';sim.style.display='none';return}
empty.style.display='none';wrap.style.display='block';sim.style.display='block';

const specs=[
['מותג','brand',null],['דגם','model',null],['שנה','year',null],
['סוג מנוע','engine',null],['כ"ס','hp','max'],['מומנט (ניוטון-מטר)','torque','max'],
['0-100 קמ"ש (שנ׳)','acc','min'],['צריכה','fuel','min'],['טווח חשמלי (ק"מ)','range','max'],
['תא מטען (ליטר)','trunk','max'],['אורך (מ"מ)','length',null],['רוחב (מ"מ)','width',null],
['גובה (מ"מ)','height',null],['משקל (ק"ג)','weight','min'],['מושבים','seats',null],
['כריות אוויר','airbags','max'],['דירוג בטיחות','safety','max'],['הנעה','drive',null],
['תיבת הילוכים','trans',null],['סוג מרכב','body',null],
['מחיר מינ׳ (אלפי ₪)','priceMin','min'],['מחיר מקס׳ (אלפי ₪)','priceMax','min']
];
let html='<table class="compare"><thead><tr><th>מפרט</th>';
compareList.forEach(c=>{html+=`<th>${c.brand} ${c.model}</th>`});
html+='</tr></thead><tbody>';
specs.forEach(([label,key,opt])=>{
const vals=compareList.map(c=>c[key]);
const nums=vals.filter(v=>typeof v==='number'&&v!==null);
let best=null,worst=null;
if(opt&&nums.length>1){
best=opt==='max'?Math.max(...nums):Math.min(...nums);
worst=opt==='max'?Math.min(...nums):Math.max(...nums);
if(best===worst)best=worst=null;
}
html+=`<tr><td class="label">${label}</td>`;
vals.forEach(v=>{
let cls='';
if(v===best)cls='best';else if(v===worst)cls='worst';
let display=v;
if(key==='safety')display=stars(v);
else if(v===null||v===undefined)display='—';
else if(typeof v==='number')display=fmt(v);
html+=`<td class="${cls}">${display}</td>`;
});
html+='</tr>';
});
html+='</tbody></table>';
wrap.innerHTML=html;

// Similar cars
const ref=compareList[0];
const similar=DB.filter(c=>!compareList.includes(c)&&c.body===ref.body&&Math.abs(c.priceMin-ref.priceMin)<60).slice(0,4);
document.getElementById('similar-grid').innerHTML=similar.map(c=>carCard(c,DB.indexOf(c))).join('');
}

function renderBrands(){
const brands=[...new Set(DB.map(c=>c.brand))].sort();
const main=document.getElementById('brands-grid');
document.getElementById('brand-cars').style.display='none';
main.style.display='grid';
main.innerHTML=brands.map(b=>{
const cnt=DB.filter(c=>c.brand===b).length;
return `<div class="brand-card" onclick="showBrand('${b}')">
<div class="icon" style="color:${getColor(b)}">${initial(b)}</div>
<div class="name">${b}</div>
<div class="count">${cnt} דגמים</div>
</div>`;
}).join('');
}

function showBrand(b){
document.getElementById('brands-grid').style.display='none';
document.getElementById('brand-cars').style.display='block';
document.getElementById('brand-title').textContent=b;
renderBrandCars(b);
}
function renderBrandCars(b){
const cars=DB.filter(c=>c.brand===b);
document.getElementById('brand-car-grid').innerHTML=cars.map(c=>carCard(c,DB.indexOf(c))).join('');
}
function showBrandsMain(){
document.getElementById('brands-grid').style.display='grid';
document.getElementById('brand-cars').style.display='none';
}

function showDetail(id){
const c=DB[id];
showTab('detail');
// Add detail tab temporarily
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
const tab=document.getElementById('tab-detail');
tab.classList.add('active');
document.querySelectorAll('.tab-content').forEach(t=>{if(t!==tab)t.classList.remove('active')});

const specRows=[
['סוג מנוע',c.engine],['כוח סוס',c.hp+' כ"ס'],['מומנט',c.torque+' ניוטון-מטר'],
['0-100 קמ"ש',c.acc+' שניות'],['צריכת דלק/חשמל',c.fuel+(c.engine==='חשמלי'?' kWh/100ק"מ':' ל/100ק"מ')],
c.range?['טווח חשמלי',c.range+' ק"מ']:null,
['תא מטען',c.trunk+' ליטר'],['אורך',fmt(c.length)+' מ"מ'],['רוחב',fmt(c.width)+' מ"מ'],
['גובה',fmt(c.height)+' מ"מ'],['משקל',fmt(c.weight)+' ק"ג'],['מושבים',c.seats],
['כריות אוויר',c.airbags],['בטיחות Euro NCAP',stars(c.safety)],
['הנעה',c.drive],['תיבת הילוכים',c.trans],['סוג מרכב',c.body],
['טווח מחירים',priceStr(c.priceMin,c.priceMax)]
].filter(Boolean);

const inComp=compareList.includes(c);
tab.innerHTML=`<button class="back-btn" onclick="showTab('browse')">→ חזרה לעיון</button>
<div class="detail-hero fade-in">
<div class="top">
<div class="brand-icon" style="background:${getColor(c.brand)};font-size:1.5em;width:56px;height:56px">${initial(c.brand)}</div>
<div><h2>${c.brand} ${c.model}</h2><span class="engine-badge ${engineClass(c.engine)}" style="font-size:.9em">${c.engine}</span> <span style="color:var(--text2)">${c.year}</span></div>
<button class="btn-compare ${inComp?'added':''}" style="margin-right:auto;padding:10px 20px;font-size:.9em" onclick="toggleCompare(${id});showDetail(${id})">${inComp?'✓ בהשוואה':'הוסף להשוואה'}</button>
</div>
<div class="detail-specs">${specRows.map(([l,v])=>`<div class="detail-spec"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('')}</div>
</div>
<div class="similar-section"><h3>🔍 רכבים דומים</h3><div class="grid">${getSimilar(c).map(s=>carCard(s,DB.indexOf(s))).join('')}</div></div>`;
}

function getSimilar(c){
return DB.filter(x=>x!==c&&x.body===c.body&&Math.abs(x.priceMin-c.priceMin)<50).sort((a,b)=>Math.abs(a.priceMin-c.priceMin)-Math.abs(b.priceMin-c.priceMin)).slice(0,4);
}

// Handle detail tab in nav
const origShowTab=showTab;

// Init
filterCars();
</script>
</body>
</html>
