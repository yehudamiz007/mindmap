<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yehuda AI - Analytics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--bg:#0a0a1a;--card:#12122a;--border:#1e1e3a;--text:#e0e0f0;--dim:#8888aa;--accent:#6c63ff;--green:#00d97e;--red:#ff6b6b;--orange:#ff9f43;--cyan:#00d2ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem;direction:ltr}
h1{text-align:center;font-size:1.8rem;margin:1rem 0 .5rem;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h2{text-align:center;font-size:1.3rem;margin:2rem 0 1rem;color:var(--cyan)}
.subtitle{text-align:center;color:var(--dim);font-size:.85rem;margin-bottom:1.5rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;text-align:center}
.card .label{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.card .value{font-size:1.6rem;font-weight:700;margin-top:.3rem}
.card .value.green{color:var(--green)}.card .value.accent{color:var(--accent)}.card .value.orange{color:var(--orange)}.card .value.cyan{color:var(--cyan)}.card .value.red{color:var(--red)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:1.5rem;margin-bottom:2rem}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem}
.chart-box h3{font-size:.95rem;color:var(--dim);margin-bottom:.8rem;text-align:center}
canvas{max-height:300px}
table{width:100%;border-collapse:collapse;direction:ltr}
th,td{padding:.6rem .8rem;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
td{font-size:.85rem}
.pct-bar{display:inline-block;height:6px;border-radius:3px;margin-left:.5rem;vertical-align:middle}
@media(max-width:500px){.charts{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div style="display:flex;justify-content:center;align-items:center;gap:16px;margin:1rem 0 .5rem">
<h1 style="margin:0">Yehuda AI - Analytics Dashboard</h1>
<button id="updateBtn" onclick="updateCosts()" style="background:#6c63ff;color:white;border:none;padding:8px 20px;border-radius:8px;font-family:inherit;font-weight:700;font-size:0.85em;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;box-shadow:0 0 15px rgba(108,99,255,0.3);" onmouseover="this.style.background='#7c73ff';this.style.boxShadow='0 0 25px rgba(108,99,255,0.5)'" onmouseout="this.style.background='#6c63ff';this.style.boxShadow='0 0 15px rgba(108,99,255,0.3)'">🔄 Update</button>
</div>
<div class="subtitle" id="updated"></div>
<script>
function updateCosts(){
  const btn=document.getElementById('updateBtn');
  btn.innerHTML='⏳ Updating...';btn.style.background='#4a42cc';btn.style.cursor='wait';btn.disabled=true;
  fetch('http://localhost:18789/api/cron/wake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'Run the cost dashboard update now: execute node C:\\\\Users\\\\YEHUDA\\\\.openclaw\\\\workspace\\\\scripts\\\\update-costs.js then git add costs.json && git commit -m "Cost dashboard update" && git push. Do this silently.',mode:'now'})}).then(r=>{
    if(r.ok){btn.innerHTML='✅ Sent!';btn.style.background='#00d97e';setTimeout(()=>{btn.innerHTML='🔄 Update';btn.style.background='#6c63ff';btn.style.cursor='pointer';btn.disabled=false;},3000);}
    else throw new Error();
  }).catch(()=>{btn.innerHTML='❌ Error';btn.style.background='#ff6b6b';setTimeout(()=>{btn.innerHTML='🔄 Update';btn.style.background='#6c63ff';btn.style.cursor='pointer';btn.disabled=false;},3000);});
}
</script>
<div class="cards" id="cards"></div>

<h2>📊 Cost by Category</h2>
<div class="charts">
  <div class="chart-box"><h3>Cost Distribution by Category</h3><canvas id="categoryDonut"></canvas></div>
  <div class="chart-box"><h3>Daily Cost by Category</h3><canvas id="dailyCategoryStack"></canvas></div>
</div>
<div class="charts">
  <div class="chart-box" style="grid-column:1/-1">
    <h3>Category Summary</h3>
    <table id="categoryTable">
      <thead><tr><th>Category</th><th>Cost</th><th>Tokens</th><th>Calls</th><th>% of Total</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<h2>📈 Overview</h2>
<div class="charts">
  <div class="chart-box"><h3>Daily Cost ($)</h3><canvas id="dailyCost"></canvas></div>
  <div class="chart-box"><h3>Cost by Model</h3><canvas id="modelDonut"></canvas></div>
  <div class="chart-box"><h3>Daily Token Usage</h3><canvas id="dailyTokens"></canvas></div>
  <div class="chart-box"><h3>Daily Cost by Model</h3><canvas id="dailyModelCost"></canvas></div>
</div>
<script>
const charts = {};
const colors = ['#6c63ff','#00d97e','#ff6b6b','#ff9f43','#00d2ff','#e056fd','#f9ca24','#7ed6df','#686de0','#badc58'];
const catColors = {'Trading':'#ff6b6b','Daily Summary':'#ff9f43','Maintenance':'#00d2ff','WhatsApp / Main Chat':'#6c63ff','Sub-Agents':'#00d97e','Other Jobs':'#e056fd','מסחר':'#ff6b6b','סיכום יומי':'#ff9f43','תחזוקה':'#00d2ff','וואטסאפ / צ\'אט ראשי':'#6c63ff','סאב-אייג\'נטים':'#00d97e','ג\'ובים אחרים':'#e056fd'};
const gridColor = 'rgba(255,255,255,0.06)';
const tickColor = '#8888aa';

function makeCard(label, value, cls) { return `<div class="card"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`; }

function load() {
  fetch('costs.json?t='+Date.now()).then(r=>r.json()).then(d => {
    document.getElementById('updated').textContent = 'Last updated: ' + new Date(d.lastUpdated).toLocaleString('en-US');

    const models = Object.entries(d.byModel).sort((a,b)=>b[1].cost-a[1].cost);
    const topModel = models[0] ? models[0][0] : 'N/A';
    const avgDaily = d.daysActive ? (d.totalCost / d.daysActive).toFixed(2) : '0';

    document.getElementById('cards').innerHTML = [
      makeCard('Total Cost', '$'+d.totalCost.toFixed(2), 'green'),
      makeCard('Tokens', (d.totalTokens/1e6).toFixed(2)+'M', 'accent'),
      makeCard('API Calls', d.totalCalls.toLocaleString(), 'cyan'),
      makeCard('Active Days', d.daysActive, 'orange'),
      makeCard('Top Model', topModel.replace('claude-','c-'), 'red'),
      makeCard('Daily Avg', '$'+avgDaily, 'green'),
    ].join('');

    const dates = d.daily.map(x=>x.date.slice(5));
    const opts = (stacked) => ({responsive:true,plugins:{legend:{labels:{color:tickColor}}},scales:{x:{ticks:{color:tickColor},grid:{color:gridColor},stacked},y:{ticks:{color:tickColor},grid:{color:gridColor},stacked}}});

    // === Category Charts ===
    if (d.byCategory) {
      const cats = Object.entries(d.byCategory).sort((a,b)=>b[1].cost-a[1].cost);
      
      // Category donut
      if(charts.cd) charts.cd.destroy();
      charts.cd = new Chart(document.getElementById('categoryDonut'),{type:'doughnut',data:{
        labels:cats.map(c=>c[0]),
        datasets:[{data:cats.map(c=>c[1].cost),backgroundColor:cats.map(c=>catColors[c[0]]||'#686de0')}]
      },options:{responsive:true,plugins:{legend:{labels:{color:tickColor,font:{size:13}}}}}});

      // Category table
      const tbody = document.querySelector('#categoryTable tbody');
      tbody.innerHTML = cats.map(([name,v]) => {
        const pct = d.totalCost > 0 ? (v.cost/d.totalCost*100) : 0;
        const col = catColors[name]||'#686de0';
        return `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${col};margin-right:6px"></span>${name}</td><td>$${v.cost.toFixed(2)}</td><td>${(v.tokens/1000).toFixed(1)}K</td><td>${v.calls}</td><td><span class="pct-bar" style="width:${Math.max(pct,2)}px;background:${col}"></span>${pct.toFixed(1)}%</td></tr>`;
      }).join('');
    }

    // Daily category stacked bar
    if (d.dailyByCategory && d.dailyByCategory.length) {
      const allCats = Object.keys(d.byCategory || {});
      const dcDates = d.dailyByCategory.map(x=>x.date.slice(5));
      if(charts.dcs) charts.dcs.destroy();
      charts.dcs = new Chart(document.getElementById('dailyCategoryStack'),{type:'bar',data:{
        labels:dcDates,
        datasets:allCats.map(cat=>({label:cat,data:d.dailyByCategory.map(x=>x[cat]||0),backgroundColor:catColors[cat]||'#686de0'}))
      },options:opts(true)});
    }

    // === Existing Charts ===
    if(charts.dc) charts.dc.destroy();
    charts.dc = new Chart(document.getElementById('dailyCost'),{type:'bar',data:{labels:dates,datasets:[{label:'Cost $',data:d.daily.map(x=>x.cost),backgroundColor:'#6c63ff',borderRadius:4}]},options:opts()});

    if(charts.md) charts.md.destroy();
    charts.md = new Chart(document.getElementById('modelDonut'),{type:'doughnut',data:{labels:models.map(m=>m[0]),datasets:[{data:models.map(m=>m[1].cost),backgroundColor:colors.slice(0,models.length)}]},options:{responsive:true,plugins:{legend:{labels:{color:tickColor}}}}});

    if(charts.dt) charts.dt.destroy();
    charts.dt = new Chart(document.getElementById('dailyTokens'),{type:'bar',data:{labels:dates,datasets:[
      {label:'Input',data:d.daily.map(x=>x.inputTokens),backgroundColor:'#6c63ff'},
      {label:'Output',data:d.daily.map(x=>x.outputTokens),backgroundColor:'#00d97e'},
      {label:'Cache Read',data:d.daily.map(x=>x.cacheReadTokens),backgroundColor:'#00d2ff'},
      {label:'Cache Write',data:d.daily.map(x=>x.cacheWriteTokens),backgroundColor:'#ff9f43'},
    ]},options:opts(true)});

    const allModels = [...new Set(d.daily.flatMap(x=>Object.keys(x.byModel)))];
    if(charts.dm) charts.dm.destroy();
    charts.dm = new Chart(document.getElementById('dailyModelCost'),{type:'bar',data:{labels:dates,datasets:allModels.map((m,i)=>({label:m,data:d.daily.map(x=>(x.byModel[m]||{}).cost||0),backgroundColor:colors[i%colors.length]}))},options:opts(true)});
  }).catch(e=>console.error('Failed to load costs.json',e));
}

load();
setInterval(load, 300000);
</script>
</body>
</html>
