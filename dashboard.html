<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yehuda AI - Analytics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--bg:#0a0a1a;--card:#12122a;--border:#1e1e3a;--text:#e0e0f0;--dim:#8888aa;--accent:#6c63ff;--green:#00d97e;--red:#ff6b6b;--orange:#ff9f43;--cyan:#00d2ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem}
h1{text-align:center;font-size:1.8rem;margin:1rem 0 .5rem;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:var(--dim);font-size:.85rem;margin-bottom:1.5rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;text-align:center}
.card .label{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.card .value{font-size:1.6rem;font-weight:700;margin-top:.3rem}
.card .value.green{color:var(--green)}.card .value.accent{color:var(--accent)}.card .value.orange{color:var(--orange)}.card .value.cyan{color:var(--cyan)}.card .value.red{color:var(--red)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:1.5rem}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem}
.chart-box h3{font-size:.95rem;color:var(--dim);margin-bottom:.8rem}
canvas{max-height:300px}
@media(max-width:500px){.charts{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<h1>Yehuda AI - Analytics Dashboard</h1>
<div class="subtitle" id="updated"></div>
<div class="cards" id="cards"></div>
<div class="charts">
  <div class="chart-box"><h3>Daily Cost ($)</h3><canvas id="dailyCost"></canvas></div>
  <div class="chart-box"><h3>Cost by Model</h3><canvas id="modelDonut"></canvas></div>
  <div class="chart-box"><h3>Daily Token Usage</h3><canvas id="dailyTokens"></canvas></div>
  <div class="chart-box"><h3>Daily Cost by Model</h3><canvas id="dailyModelCost"></canvas></div>
</div>
<script>
const charts = {};
const colors = ['#6c63ff','#00d97e','#ff6b6b','#ff9f43','#00d2ff','#e056fd','#f9ca24','#7ed6df','#686de0','#badc58'];
const gridColor = 'rgba(255,255,255,0.06)';
const tickColor = '#8888aa';

function makeCard(label, value, cls) { return `<div class="card"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`; }

function load() {
  fetch('costs.json?t='+Date.now()).then(r=>r.json()).then(d => {
    document.getElementById('updated').textContent = 'Last updated: ' + new Date(d.lastUpdated).toLocaleString();
    
    const models = Object.entries(d.byModel).sort((a,b)=>b[1].cost-a[1].cost);
    const topModel = models[0] ? models[0][0] : 'N/A';
    const avgDaily = d.daysActive ? (d.totalCost / d.daysActive).toFixed(2) : '0';
    
    document.getElementById('cards').innerHTML = [
      makeCard('Total Cost', '$'+d.totalCost.toFixed(2), 'green'),
      makeCard('Total Tokens', (d.totalTokens/1e6).toFixed(2)+'M', 'accent'),
      makeCard('API Calls', d.totalCalls.toLocaleString(), 'cyan'),
      makeCard('Days Active', d.daysActive, 'orange'),
      makeCard('Top Model', topModel.replace('claude-','c-'), 'red'),
      makeCard('Avg Daily', '$'+avgDaily, 'green'),
    ].join('');

    const dates = d.daily.map(x=>x.date.slice(5));
    const opts = (stacked) => ({responsive:true,plugins:{legend:{labels:{color:tickColor}}},scales:{x:{ticks:{color:tickColor},grid:{color:gridColor},stacked},y:{ticks:{color:tickColor},grid:{color:gridColor},stacked}}});

    // Daily cost bar
    if(charts.dc) charts.dc.destroy();
    charts.dc = new Chart(document.getElementById('dailyCost'),{type:'bar',data:{labels:dates,datasets:[{label:'Cost $',data:d.daily.map(x=>x.cost),backgroundColor:'#6c63ff',borderRadius:4}]},options:opts()});

    // Model donut
    if(charts.md) charts.md.destroy();
    charts.md = new Chart(document.getElementById('modelDonut'),{type:'doughnut',data:{labels:models.map(m=>m[0]),datasets:[{data:models.map(m=>m[1].cost),backgroundColor:colors.slice(0,models.length)}]},options:{responsive:true,plugins:{legend:{labels:{color:tickColor}}}}});

    // Daily tokens stacked
    if(charts.dt) charts.dt.destroy();
    charts.dt = new Chart(document.getElementById('dailyTokens'),{type:'bar',data:{labels:dates,datasets:[
      {label:'Input',data:d.daily.map(x=>x.inputTokens),backgroundColor:'#6c63ff'},
      {label:'Output',data:d.daily.map(x=>x.outputTokens),backgroundColor:'#00d97e'},
      {label:'Cache Read',data:d.daily.map(x=>x.cacheReadTokens),backgroundColor:'#00d2ff'},
      {label:'Cache Write',data:d.daily.map(x=>x.cacheWriteTokens),backgroundColor:'#ff9f43'},
    ]},options:opts(true)});

    // Daily cost by model stacked
    const allModels = [...new Set(d.daily.flatMap(x=>Object.keys(x.byModel)))];
    if(charts.dm) charts.dm.destroy();
    charts.dm = new Chart(document.getElementById('dailyModelCost'),{type:'bar',data:{labels:dates,datasets:allModels.map((m,i)=>({label:m,data:d.daily.map(x=>(x.byModel[m]||{}).cost||0),backgroundColor:colors[i%colors.length]}))},options:opts(true)});
  }).catch(e=>console.error('Failed to load costs.json',e));
}

load();
setInterval(load, 300000);
</script>
</body>
</html>
