<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yehuda AI - Analytics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:20px}
h1{text-align:center;font-size:2rem;margin-bottom:30px;background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:30px}
.card{background:linear-gradient(135deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;text-align:center;backdrop-filter:blur(10px)}
.card .label{font-size:.85rem;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.card .value{font-size:2rem;font-weight:700}
.card:nth-child(1) .value{color:#ff6b6b}
.card:nth-child(2) .value{color:#ffd93d}
.card:nth-child(3) .value{color:#6bcb77}
.card:nth-child(4) .value{color:#4d96ff}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px}
.full-width{grid-column:1/-1}
.chart-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px}
.chart-box h2{text-align:center;font-size:1.1rem;color:#aaa;margin-bottom:16px}
canvas{max-height:400px}
</style>
</head>
<body>
<h1>✨ Yehuda AI - Analytics Dashboard</h1>
<div class="cards">
  <div class="card"><div class="label">Total Questions</div><div class="value">569</div></div>
  <div class="card"><div class="label">Total Cost</div><div class="value">$231.17</div></div>
  <div class="card"><div class="label">Categories</div><div class="value">14</div></div>
  <div class="card"><div class="label">Most Expensive</div><div class="value">WhatsApp</div></div>
</div>
<div class="charts">
  <div class="chart-box"><h2>Question Distribution</h2><canvas id="donut"></canvas></div>
  <div class="chart-box"><h2>Cost per Category ($) — sorted descending</h2><canvas id="bar"></canvas></div>
  <div class="chart-box full-width"><h2>Daily Cost Breakdown by Category ($)</h2><canvas id="stacked"></canvas></div>
</div>
<script>
// Category data from transcript analysis (2026-02-18)
// Original categories kept + "General" broken into sub-categories
const data = [
  { cat: 'WhatsApp/Groups',    count: 229, cost: 89.72 },
  { cat: 'Chat/Social',        count: 57,  cost: 24.38 },
  { cat: 'Mindmap',            count: 24,  cost: 19.11 },
  { cat: 'Family',             count: 51,  cost: 18.84 },
  { cat: 'Coding',             count: 21,  cost: 17.45 },
  { cat: 'Dashboard/Analytics',count: 19,  cost: 15.22 },
  { cat: 'Heartbeat',          count: 18,  cost: 10.97 },
  { cat: 'Identity/Setup',     count: 22,  cost: 9.63  },
  { cat: 'System',             count: 20,  cost: 8.60  },
  { cat: 'Memory',             count: 20,  cost: 5.12  },
  { cat: 'Skills',             count: 8,   cost: 4.51  },
  { cat: 'Family Tree',        count: 5,   cost: 3.40  },
  { cat: 'Config',             count: 1,   cost: 0.23  },
  { cat: 'Other',              count: 74,  cost: 3.99  }
];

const colors = [
  '#ff6b6b','#ffd93d','#4d96ff','#6bcb77','#ff922b',
  '#cc5de8','#20c997','#f06595','#868e96','#74c0fc',
  '#fcc419','#a9e34b','#e599f7','#ced4da'
];

// Donut chart - sorted by count descending
const donutData = [...data].sort((a,b) => b.count - a.count);
new Chart(document.getElementById('donut'), {
  type: 'doughnut',
  data: {
    labels: donutData.map(d => `${d.cat} (${d.count})`),
    datasets: [{
      data: donutData.map(d => d.count),
      backgroundColor: colors,
      borderColor: '#0a0a1a',
      borderWidth: 3
    }]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: 'bottom',
        labels: { color: '#ccc', padding: 10, font: { size: 11 } }
      }
    }
  }
});

// Bar chart - sorted by cost descending
const barData = [...data].sort((a,b) => b.cost - a.cost);
new Chart(document.getElementById('bar'), {
  type: 'bar',
  data: {
    labels: barData.map(d => d.cat),
    datasets: [{
      data: barData.map(d => d.cost),
      backgroundColor: colors,
      borderRadius: 6
    }]
  },
  options: {
    responsive: true,
    indexAxis: 'y',
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: ctx => `$${ctx.raw.toFixed(2)}`
        }
      }
    },
    scales: {
      x: {
        ticks: { color: '#aaa', callback: v => '$' + v },
        grid: { color: 'rgba(255,255,255,0.05)' }
      },
      y: {
        ticks: { color: '#ccc', font: { size: 11 } },
        grid: { display: false }
      }
    }
  }
});

// Stacked bar chart - Daily Cost Breakdown by Category
const dailyDates = ["2026-02-17","2026-02-18"];
const dailyData = {"WhatsApp/Groups":[19.0052,95.0796],"Chat/Social":[0.3746,14.8533],"Mindmap":[0,13.1278],"Family":[0.3748,2.6627],"Coding":[0,4.6394],"Dashboard/Analytics":[0,1.5714],"Heartbeat":[0,20.314],"Identity/Setup":[0.1039,0],"System":[0.2956,0.9051],"Memory":[0,0.8642],"Skills":[0.3395,3.7399],"Family Tree":[0,2.3495],"Config":[0,0],"Other":[20.7572,36.2493]};

const stackedDatasets = data.map((d, i) => ({
  label: d.cat,
  data: dailyData[d.cat] || dailyDates.map(() => 0),
  backgroundColor: colors[i],
  borderRadius: 2
}));

new Chart(document.getElementById('stacked'), {
  type: 'bar',
  data: {
    labels: dailyDates,
    datasets: stackedDatasets
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: 'bottom',
        labels: { color: '#ccc', padding: 8, font: { size: 11 }, boxWidth: 14 }
      },
      tooltip: {
        callbacks: {
          label: ctx => `${ctx.dataset.label}: $${ctx.raw.toFixed(4)}`
        }
      }
    },
    scales: {
      x: {
        stacked: true,
        ticks: { color: '#ccc' },
        grid: { color: 'rgba(255,255,255,0.05)' }
      },
      y: {
        stacked: true,
        ticks: { color: '#aaa', callback: v => '$' + v },
        grid: { color: 'rgba(255,255,255,0.05)' }
      }
    }
  }
});
</script>
</body>
</html>
