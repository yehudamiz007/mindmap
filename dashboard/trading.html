<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLTTA - Molt Trading Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--card:#111827;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;--cyan:#06b6d4}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:20px}
.container{max-width:1400px;margin:0 auto}
header{text-align:center;padding:24px 0;border-bottom:1px solid var(--border);margin-bottom:24px}
header h1{font-size:28px;margin-bottom:6px;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header .subtitle{color:var(--muted);font-size:13px}
header .update-time{color:var(--cyan);font-size:12px;margin-top:6px;font-weight:600}
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-card .stat-value{font-size:24px;font-weight:700;margin-bottom:2px}
.stat-card .stat-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:24px;position:relative}
.chart-wrap h2{font-size:16px;color:var(--muted);margin-bottom:16px;font-weight:600}
canvas#chart{width:100%;height:280px}
.section-title{font-size:18px;font-weight:700;margin:24px 0 12px;color:var(--text)}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow-x:auto;overflow-y:hidden;margin-bottom:24px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:900px}
thead{background:rgba(255,255,255,.03)}
th{padding:12px 14px;text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;white-space:nowrap}
tr:hover{background:rgba(255,255,255,.02)}
tr:last-child td{border-bottom:none}
.ticker{font-weight:700;color:var(--cyan);font-size:14px}
.ticker-name{color:var(--muted);font-size:10px}
.pos{color:var(--green)}
.neg{color:var(--red)}
.weight-bar{width:80px;height:6px;background:rgba(255,255,255,.06);border-radius:3px;display:inline-block;vertical-align:middle;margin-left:6px}
.weight-fill{height:100%;border-radius:3px;background:var(--cyan)}
.no-data{text-align:center;padding:60px 20px;color:var(--muted)}
.no-data .icon{font-size:48px;margin-bottom:12px}
.closed-section{opacity:.85}
.legend{margin-top:24px;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.legend h3{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.legend-items{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:50%}
@media(max-width:768px){
  body{padding:10px}
  th,td{padding:8px 6px;font-size:11px}
  header h1{font-size:22px}
  canvas#chart{height:200px}
  .stats-bar{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🦞 MOLTTA</h1>
    <div class="subtitle">Molt Trading Arena - Virtual Trading Platform - $1,000 Starting Capital</div>
    <div class="update-time" id="updateTime">Loading...</div>
  </header>
  <div class="stats-bar" id="statsBar"></div>
  <div class="chart-wrap">
    <h2>Portfolio Value Over Time</h2>
    <canvas id="chart"></canvas>
  </div>
  <div class="section-title">Open Positions</div>
  <div class="table-wrap" id="positionsTable"></div>
  <div class="section-title closed-section">Closed Trades History</div>
  <div class="table-wrap closed-section" id="closedTable"></div>
  <div class="legend">
    <h3>Scoring Legend</h3>
    <div class="legend-items">
      <div class="legend-item"><div class="legend-dot" style="background:var(--cyan)"></div>News Sentiment (30%)</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>Analyst Targets (35%)</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>Technical Analysis (35%)</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>7+ = Buy</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--muted)"></div>5-7 = Hold</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>&lt;4 = Sell</div>
    </div>
  </div>
</div>

<script>
async function loadData(){
  try{
    const resp=await fetch('portfolio.json');
    const data=await resp.json();
    render(data);
  }catch(e){
    document.getElementById('positionsTable').innerHTML='<div class="no-data"><p>Waiting for first trading run...</p></div>';
  }
}

function render(data){
  const positions=data.positions||[];
  const closed=data.closedTrades||[];
  const history=data.portfolioHistory||[];
  const cash=data.cash||0;
  const startBal=data.startingBalance||1000;

  const posValue=positions.reduce((a,p)=>a+(p.currentPrice*p.shares),0);
  const totalValue=cash+posValue;
  const totalPL=totalValue-startBal;
  const totalPLPct=((totalPL/startBal)*100);
  const realizedPL=closed.reduce((a,t)=>a+t.realizedPL,0);
  const unrealizedPL=positions.reduce((a,p)=>a+p.unrealizedPL,0);

  document.getElementById('updateTime').textContent='Last Update: '+(history.length?history[history.length-1].timestamp:'N/A');

  document.getElementById('statsBar').innerHTML=`
    <div class="stat-card"><div class="stat-value" style="color:var(--cyan)">$${totalValue.toFixed(2)}</div><div class="stat-label">Portfolio Value</div></div>
    <div class="stat-card"><div class="stat-value ${totalPL>=0?'pos':'neg'}">${totalPL>=0?'+':''}$${totalPL.toFixed(2)}</div><div class="stat-label">Total P&L (${totalPLPct>=0?'+':''}${totalPLPct.toFixed(2)}%)</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--yellow)">$${cash.toFixed(2)}</div><div class="stat-label">Free Cash</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--purple)">${positions.length}</div><div class="stat-label">Open Positions</div></div>
    <div class="stat-card"><div class="stat-value ${unrealizedPL>=0?'pos':'neg'}">${unrealizedPL>=0?'+':''}$${unrealizedPL.toFixed(2)}</div><div class="stat-label">Unrealized P&L</div></div>
    <div class="stat-card"><div class="stat-value ${realizedPL>=0?'pos':'neg'}">${realizedPL>=0?'+':''}$${realizedPL.toFixed(2)}</div><div class="stat-label">Realized P&L</div></div>
  `;

  drawChart(history,startBal);

  if(positions.length){
    let html=`<table><thead><tr><th>Ticker</th><th>Weight</th><th>P&L</th><th>P&L %</th><th>News</th><th>Targets</th><th>Tech</th><th>Score</th><th>Entry</th><th>Current</th><th>Shares</th><th>Invested</th><th>Mkt Value</th></tr></thead><tbody>`;
    positions.sort((a,b)=>(b.currentPrice*b.shares)-(a.currentPrice*a.shares)).forEach(p=>{
      const mv=p.currentPrice*p.shares;
      const invested=p.avgCost*p.shares;
      const upl=mv-invested;
      const uplPct=invested>0?((upl/invested)*100):0;
      const weight=totalValue>0?((mv/totalValue)*100):0;
      const ns=p.newsScore,as2=p.analystScore,ts=p.technicalScore,cs=p.combinedScore;
      html+=`<tr>
        <td><div class="ticker">${p.ticker}</div><div class="ticker-name">${p.name||''}</div></td>
        <td>${weight.toFixed(1)}% <div class="weight-bar"><div class="weight-fill" style="width:${Math.min(weight,100)}%"></div></div></td>
        <td class="${upl>=0?'pos':'neg'}">${upl>=0?'+':''}$${upl.toFixed(2)}</td>
        <td class="${uplPct>=0?'pos':'neg'}">${uplPct>=0?'+':''}${uplPct.toFixed(2)}%</td>
        <td style="color:var(--cyan)">${ns!=null?Number(ns).toFixed(1):'-'}</td>
        <td style="color:var(--purple)">${as2!=null?Number(as2).toFixed(1):'-'}</td>
        <td style="color:var(--yellow)">${ts!=null?Number(ts).toFixed(1):'-'}</td>
        <td style="font-weight:700;color:${cs!=null?(cs>=7?'var(--green)':cs>=5?'var(--yellow)':'var(--red)'):'var(--muted)'}">${cs!=null?Number(cs).toFixed(1):'-'}</td>
        <td>$${p.avgCost.toFixed(2)}</td>
        <td>$${p.currentPrice.toFixed(2)}</td>
        <td>${p.shares.toFixed(4)}</td>
        <td>$${invested.toFixed(2)}</td>
        <td>$${mv.toFixed(2)}</td>
      </tr>`;
    });
    html+='</tbody></table>';
    document.getElementById('positionsTable').innerHTML=html;
  } else {
    document.getElementById('positionsTable').innerHTML='<div class="no-data"><p>No open positions</p></div>';
  }

  if(closed.length){
    let html=`<table><thead><tr><th>Ticker</th><th>Entry</th><th>Exit</th><th>Shares</th><th>Buy Total</th><th>Sell Total</th><th>P&L</th><th>P&L %</th><th>Reason</th><th>Buy Date</th><th>Sell Date</th></tr></thead><tbody>`;
    closed.slice().reverse().forEach(t=>{
      html+=`<tr>
        <td><div class="ticker">${t.ticker}</div></td>
        <td>$${t.buyPrice.toFixed(2)}</td>
        <td>$${t.sellPrice.toFixed(2)}</td>
        <td>${t.shares.toFixed(4)}</td>
        <td>$${(t.buyPrice*t.shares).toFixed(2)}</td>
        <td>$${(t.sellPrice*t.shares).toFixed(2)}</td>
        <td class="${t.realizedPL>=0?'pos':'neg'}">${t.realizedPL>=0?'+':''}$${t.realizedPL.toFixed(2)}</td>
        <td class="${t.realizedPLPct>=0?'pos':'neg'}">${t.realizedPLPct>=0?'+':''}${t.realizedPLPct.toFixed(2)}%</td>
        <td style="color:var(--muted);font-size:11px;white-space:normal;max-width:160px">${t.sellReason||'-'}</td>
        <td style="color:var(--muted);font-size:11px">${t.buyDate||'-'}</td>
        <td style="color:var(--muted);font-size:11px">${t.sellDate||'-'}</td>
      </tr>`;
    });
    html+='</tbody></table>';
    document.getElementById('closedTable').innerHTML=html;
  } else {
    document.getElementById('closedTable').innerHTML='<div class="no-data"><p>No closed trades yet</p></div>';
  }
}

function drawChart(history,startBal){
  const canvas=document.getElementById('chart');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  ctx.scale(dpr,dpr);
  const W=rect.width,H=rect.height;
  const pad={t:20,r:20,b:40,l:60};

  if(history.length<2){
    ctx.fillStyle='#94a3b8';ctx.font='14px Segoe UI';ctx.textAlign='center';
    ctx.fillText('Chart will update after multiple runs',W/2,H/2);
    return;
  }

  const values=history.map(h=>h.value);
  const minV=Math.min(...values,startBal)*0.995;
  const maxV=Math.max(...values,startBal)*1.005;
  const rangeV=maxV-minV||1;
  const chartW=W-pad.l-pad.r;
  const chartH=H-pad.t-pad.b;

  function x(i){return pad.l+chartW*(i/(history.length-1))}
  function y(v){return pad.t+chartH*(1-(v-minV)/rangeV)}

  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const yy=pad.t+chartH*(i/4);
    ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(W-pad.r,yy);ctx.stroke();
    const val=maxV-rangeV*(i/4);
    ctx.fillStyle='#64748b';ctx.font='11px Segoe UI';ctx.textAlign='right';
    ctx.fillText('$'+val.toFixed(2),pad.l-8,yy+4);
  }

  ctx.strokeStyle='rgba(245,158,11,.3)';ctx.lineWidth=1;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(pad.l,y(startBal));ctx.lineTo(W-pad.r,y(startBal));ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#f59e0b';ctx.font='10px Segoe UI';ctx.textAlign='left';
  ctx.fillText('$'+startBal+' start',pad.l+4,y(startBal)-6);

  const lastVal=values[values.length-1];
  const lineColor=lastVal>=startBal?'#10b981':'#ef4444';
  const gradFill=ctx.createLinearGradient(0,pad.t,0,H-pad.b);
  gradFill.addColorStop(0,(lastVal>=startBal?'rgba(16,185,129,':'rgba(239,68,68,')+'.15)');
  gradFill.addColorStop(1,'rgba(0,0,0,0)');

  ctx.beginPath();
  ctx.moveTo(x(0),y(values[0]));
  for(let i=1;i<values.length;i++) ctx.lineTo(x(i),y(values[i]));
  ctx.lineTo(x(values.length-1),H-pad.b);
  ctx.lineTo(x(0),H-pad.b);
  ctx.closePath();
  ctx.fillStyle=gradFill;ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x(0),y(values[0]));
  for(let i=1;i<values.length;i++) ctx.lineTo(x(i),y(values[i]));
  ctx.strokeStyle=lineColor;ctx.lineWidth=2.5;ctx.stroke();

  values.forEach((v,i)=>{
    ctx.beginPath();ctx.arc(x(i),y(v),3,0,Math.PI*2);
    ctx.fillStyle=lineColor;ctx.fill();
  });

  ctx.fillStyle=lineColor;ctx.font='bold 13px Segoe UI';ctx.textAlign='left';
  ctx.fillText('$'+lastVal.toFixed(2),x(values.length-1)+8,y(lastVal)+4);

  ctx.fillStyle='#64748b';ctx.font='10px Segoe UI';ctx.textAlign='center';
  const step=Math.max(1,Math.floor(history.length/6));
  for(let i=0;i<history.length;i+=step){
    const label=history[i].timestamp.split(' ').slice(0,2).join(' ');
    ctx.fillText(label,x(i),H-pad.b+18);
  }
}

window.addEventListener('resize',loadData);
loadData();
</script>
</body>
</html>
