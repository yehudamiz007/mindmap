<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Databricks Agent Architecture</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; font-family:'Segoe UI',sans-serif; overflow:hidden; }
#header { position:fixed; top:0; left:0; right:0; z-index:10; padding:10px 20px; background:#161b22; border-bottom:1px solid #30363d; display:flex; align-items:center; justify-content:space-between; }
#header h1 { color:#ff6b35; font-size:18px; font-weight:700; }
#header span { color:#8b949e; font-size:12px; }
#legend { position:fixed; bottom:16px; left:16px; display:flex; flex-wrap:wrap; gap:8px; max-width:360px; z-index:10; }
.li { display:flex; align-items:center; gap:5px; font-size:11px; color:#8b949e; background:#161b22; padding:3px 8px; border-radius:12px; border:1px solid #30363d; }
.ld { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
svg { position:fixed; top:44px; left:0; right:0; bottom:0; }
.link { fill:none; stroke-width:1.5px; }
.node circle { stroke-width:2px; cursor:pointer; transition:r 0.12s; }
#tooltip { position:fixed; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:10px 14px; font-size:12px; color:#8b949e; pointer-events:none; display:none; max-width:260px; z-index:100; line-height:1.5; }
#tooltip b { color:#e6edf3; font-size:13px; display:block; margin-bottom:3px; }
</style>
</head>
<body>
<div id="header">
  <h1>🔶 Databricks Agent Architecture</h1>
  <span>Scroll to zoom · Drag to pan · Hover for details</span>
</div>
<div id="legend">
  <div class="li"><div class="ld" style="background:#ff6b35"></div>Root</div>
  <div class="li"><div class="ld" style="background:#388bfd"></div>App</div>
  <div class="li"><div class="ld" style="background:#d2a8ff"></div>Agent</div>
  <div class="li"><div class="ld" style="background:#3fb950"></div>Memory/UC</div>
  <div class="li"><div class="ld" style="background:#ffa657"></div>Skills</div>
  <div class="li"><div class="ld" style="background:#79c0ff"></div>Genie</div>
  <div class="li"><div class="ld" style="background:#58a6ff"></div>Channels</div>
  <div class="li"><div class="ld" style="background:#f78166"></div>Jobs</div>
  <div class="li"><div class="ld" style="background:#56d364"></div>Setup</div>
  <div class="li"><div class="ld" style="background:#8b949e"></div>Config</div>
</div>
<div id="tooltip"></div>
<svg id="svg"></svg>

<script>
const data = {
  name:"databricks-agent", group:"root", desc:"AI Agent Platform on Databricks - OpenClaw-like architecture running natively in Databricks",
  children:[
    { name:"databricks.yml", group:"config", desc:"DAB bundle: defines App + nightly Job, variables (catalog, warehouse_id, genie_space_id), dev/prod targets",
      children:[
        {name:"App Resource", group:"config", desc:"Deploys FastAPI as Databricks App"},
        {name:"Job Resource", group:"config", desc:"Nightly memory maintenance at 02:00 Asia/Jerusalem"},
        {name:"dev target", group:"config", desc:"Uses ai_agent_dev catalog, development mode"},
        {name:"prod target", group:"config", desc:"Uses ai_agent catalog, production mode"},
      ]
    },
    { name:"app/", group:"app", desc:"FastAPI application - the agent brain, deployed as Databricks App",
      children:[
        { name:"app.py", group:"app", desc:"FastAPI with 7 routes: /chat, /webhook/slack, /webhook/generic, /health, /memory, /skills, /admin/sync-skills",
          children:[
            {name:"POST /chat", group:"app", desc:"Main chat: load memory → match skill → Genie → LLM → save → return"},
            {name:"POST /webhook/slack", group:"channels", desc:"Slack Events API handler with challenge verification"},
            {name:"POST /webhook/generic", group:"channels", desc:"Generic webhook for any channel"},
            {name:"GET /memory/{user_id}", group:"memory", desc:"View user memory summary from Delta tables"},
            {name:"GET /skills", group:"skills", desc:"List all available skills from Volume"},
          ]
        },
        { name:"agent/", group:"agent", desc:"Core agent modules",
          children:[
            {name:"runtime.py", group:"agent", desc:"AgentRuntime: 10-step pipeline — memory → skill match → genie → system prompt → LLM (w/ retry) → parse REMEMBER tags → save turn → audit"},
            {name:"memory.py", group:"memory", desc:"Delta CRUD via Statement Execution API (no Spark needed in App). get_user_context, save_memory, save_daily_note, save_preference"},
            {name:"skills.py", group:"skills", desc:"SkillIndex: loads _index.json, keyword matching, load SKILL.md from Volume, load reference files on demand"},
            {name:"genie.py", group:"genie", desc:"Detect data questions by keywords, query Genie API via SDK, format results into text"},
            {name:"context.py", group:"agent", desc:"Assemble system prompt: base persona + user memory + preferences + skill + Genie data + session history"},
          ]
        },
        { name:"channels/", group:"channels", desc:"Messaging channel handlers",
          children:[
            {name:"slack.py", group:"channels", desc:"Slack Events: url_verification challenge, message events, anti-loop (ignore bot messages)"},
            {name:"webhook.py", group:"channels", desc:"Generic webhook: accepts {user_id, message}, routes to AgentRuntime"},
          ]
        },
        {name:"app.yaml", group:"config", desc:"Databricks App config: uvicorn command, env vars, secret scope references for API keys"},
        {name:"requirements.txt", group:"config", desc:"fastapi, uvicorn, anthropic, databricks-sdk, pydantic, tenacity, httpx"},
      ]
    },
    { name:"Unity Catalog", group:"memory", desc:"ai_agent catalog - all persistent data lives here",
      children:[
        { name:"memory schema", group:"memory", desc:"User memory layer - the agent's persistent brain",
          children:[
            {name:"longterm table", group:"memory", desc:"MEMORY.md equivalent. Columns: user_id, category, key, value, importance(1-10), source, expires_at. CDF enabled. MERGE on upsert"},
            {name:"daily table", group:"memory", desc:"memory/YYYY-MM-DD.md equivalent. Daily notes with tags and session_id"},
            {name:"preferences table", group:"memory", desc:"USER.md equivalent. Key-value preferences: language, timezone, response style"},
          ]
        },
        { name:"sessions schema", group:"memory", desc:"Full conversation history",
          children:[
            {name:"history table", group:"memory", desc:"Every turn: session_id, role, content, skill_used, genie_query, tokens_used, model, created_at"},
          ]
        },
        { name:"skills schema", group:"skills", desc:"Volume storage for skill files",
          children:[
            {name:"library Volume", group:"skills", desc:"/Volumes/ai_agent/skills/library/ — official skills (general, databricks, ...)"},
            {name:"user_skills Volume", group:"skills", desc:"/Volumes/ai_agent/skills/user_skills/ — custom user-defined skills"},
          ]
        },
        { name:"audit schema", group:"config", desc:"Observability & monitoring",
          children:[
            {name:"agent_runs table", group:"config", desc:"Every request logged: latency_ms, skill_matched, genie_used, success, error_message"},
          ]
        },
      ]
    },
    { name:"Skills", group:"skills", desc:"Modular knowledge modules loaded into LLM context on demand",
      children:[
        {name:"general/SKILL.md", group:"skills", desc:"Fallback skill - always active. Teaches agent to use [REMEMBER: category|key|value|importance] tag to save memories"},
        {name:"databricks/SKILL.md", group:"skills", desc:"Databricks expert: notebooks, Unity Catalog, Delta Lake, Genie, clusters, jobs, apps, MLflow, DLT"},
        {name:"_index.json", group:"skills", desc:"Skill registry: names, descriptions, keywords used for matching incoming messages"},
        {name:"custom user skills", group:"skills", desc:"Users can add SKILL.md files to user_skills Volume for personalized knowledge"},
      ]
    },
    { name:"Genie Integration", group:"genie", desc:"Natural language → SQL → structured results via Databricks Genie",
      children:[
        {name:"Question detection", group:"genie", desc:"Keywords: 'how many', 'total', 'count', 'show me', 'list all', 'query', 'what is the'"},
        {name:"Genie API call", group:"genie", desc:"start_conversation → poll for result → get_message_query_result via Databricks SDK"},
        {name:"Result injection", group:"genie", desc:"Formatted Genie results injected into system prompt as data context"},
      ]
    },
    { name:"jobs/", group:"jobs", desc:"Scheduled background tasks",
      children:[
        { name:"memory_maintenance.py", group:"jobs", desc:"Nightly job: reads 7-day daily notes → Claude extracts key facts → MERGE into longterm memory with source='agent'",
          children:[
            {name:"Get active users", group:"jobs", desc:"Find all users with sessions in last 7 days"},
            {name:"Read daily notes", group:"jobs", desc:"Fetch unprocessed notes per user"},
            {name:"Claude extraction", group:"jobs", desc:"LLM identifies key facts/learnings with importance scores"},
            {name:"MERGE to longterm", group:"jobs", desc:"Save extracted memories, mark notes as processed"},
          ]
        }
      ]
    },
    { name:"setup/", group:"setup", desc:"One-time initialization scripts",
      children:[
        {name:"01_init_catalog.sql", group:"setup", desc:"CREATE CATALOG ai_agent + 4 schemas + 5 Delta tables with proper types and CDF"},
        {name:"02_init_volumes.sql", group:"setup", desc:"CREATE VOLUME for library and user_skills"},
        {name:"03_seed_skills.py", group:"setup", desc:"Copy skill files to Volume using dbutils.fs.cp, write _index.json registry"},
        {name:"04_init_genie_space.md", group:"setup", desc:"Manual guide: create Genie Space, add ai_agent tables, write verified answers, set custom instructions"},
      ]
    },
    { name:"CI/CD", group:"config", desc:"Deployment automation",
      children:[
        {name:"deploy.yml", group:"config", desc:"GitHub Actions: push to main → databricks bundle validate → bundle deploy -t prod → Slack notify"},
        {name:"Secret scope setup", group:"config", desc:"databricks secrets create-scope ai-agent-secrets + store anthropic-api-key"},
      ]
    },
  ]
};

const colors = {
  root:"#ff6b35", app:"#388bfd", agent:"#d2a8ff", memory:"#3fb950",
  skills:"#ffa657", genie:"#79c0ff", channels:"#58a6ff",
  jobs:"#f78166", config:"#8b949e", setup:"#56d364"
};

const W = window.innerWidth, H = window.innerHeight - 44;
const margin = { top: 20, right: 280, bottom: 20, left: 160 };

const svg = d3.select("#svg").attr("width", W).attr("height", H);
const g = svg.append("g").attr("transform", `translate(${margin.left},${H/2})`);

svg.call(d3.zoom().scaleExtent([0.1, 3]).on("zoom", e => g.attr("transform",
  `translate(${e.transform.x + margin.left},${e.transform.y + H/2}) scale(${e.transform.k})`)));

const root = d3.hierarchy(data);
const treeH = Math.max(H - 60, root.descendants().length * 18);
const treeLayout = d3.tree().size([treeH, W - margin.left - margin.right]);
treeLayout(root);

// Links
g.selectAll(".link")
  .data(root.links())
  .join("path")
  .attr("class","link")
  .attr("stroke", d => colors[d.target.data.group] || "#30363d")
  .attr("stroke-opacity", 0.4)
  .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

// Nodes
const node = g.selectAll(".node")
  .data(root.descendants())
  .join("g")
  .attr("class","node")
  .attr("transform", d => `translate(${d.y},${d.x})`);

node.append("circle")
  .attr("r", d => d.depth === 0 ? 10 : d.depth === 1 ? 7 : d.depth === 2 ? 5 : 4)
  .attr("fill", d => colors[d.data.group] || "#58a6ff")
  .attr("stroke", d => { const c = d3.color(colors[d.data.group]||"#58a6ff"); return c ? c.brighter(0.7).toString() : "#fff"; })
  .on("mouseover", function(event, d) {
    d3.select(this).transition().duration(100).attr("r", d => d.depth===0?13:d.depth===1?9:d.depth===2?7:6);
    const tip = document.getElementById("tooltip");
    tip.style.display = "block";
    tip.style.left = (event.clientX+14)+"px";
    tip.style.top = (event.clientY-14)+"px";
    tip.innerHTML = `<b>${d.data.name}</b>${d.data.desc?'<span>'+d.data.desc+'</span>':''}`;
  })
  .on("mousemove", e => {
    const tip = document.getElementById("tooltip");
    tip.style.left=(e.clientX+14)+"px"; tip.style.top=(e.clientY-14)+"px";
  })
  .on("mouseout", function(e,d) {
    d3.select(this).transition().duration(100).attr("r", d=>d.depth===0?10:d.depth===1?7:d.depth===2?5:4);
    document.getElementById("tooltip").style.display="none";
  });

// Labels
node.append("text")
  .attr("dy","0.31em")
  .attr("x", d => d.children ? -10 : 8)
  .attr("text-anchor", d => d.children ? "end" : "start")
  .style("font-size", d => d.depth===0?"14px":d.depth===1?"12px":d.depth===2?"11px":"10px")
  .style("font-weight", d => d.depth<=1?"600":"400")
  .style("fill", d => d.depth===0?"#ff6b35":d.depth===1?colors[d.data.group]:"#c9d1d9")
  .text(d => d.data.name);
</script>
</body>
</html>
