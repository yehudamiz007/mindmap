<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEEBOT Controller</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07080f;--surface:rgba(255,255,255,0.05);--surface2:rgba(255,255,255,0.09);
  --border:rgba(255,255,255,0.08);--text:#e4e4e7;--text-dim:#71717a;
  --accent:#818cf8;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--orange:#fb923c;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:20px 16px 40px;
  background-image:radial-gradient(ellipse at 30% 30%,rgba(129,140,248,0.06) 0%,transparent 60%),
                   radial-gradient(ellipse at 70% 70%,rgba(52,211,153,0.04) 0%,transparent 60%);
}
h1{font-size:1.5rem;font-weight:300;letter-spacing:-0.5px;margin-bottom:4px;
   background:linear-gradient(135deg,#e4e4e7,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:.82rem;color:var(--text-dim);margin-bottom:20px}

/* Connection setup */
.setup-card{
  width:100%;max-width:420px;background:rgba(251,191,36,.06);
  border:1px solid rgba(251,191,36,.25);border-radius:16px;padding:16px 18px;
  margin-bottom:16px;
}
.setup-card h3{font-size:.88rem;color:var(--yellow);margin-bottom:8px}
.setup-card p{font-size:.78rem;color:var(--text-dim);margin-bottom:10px;line-height:1.5}
.url-row{display:flex;gap:8px}
.url-input{
  flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:.82rem;font-family:inherit;outline:none;
}
.url-input:focus{border-color:var(--accent)}
.url-input::placeholder{color:var(--text-dim)}
.connect-btn{
  padding:8px 14px;border-radius:10px;background:rgba(129,140,248,.15);
  border:1px solid rgba(129,140,248,.3);color:var(--accent);cursor:pointer;
  font-size:.82rem;font-family:inherit;white-space:nowrap;
}
.connect-btn:active{background:rgba(129,140,248,.25)}

/* Status card */
.status-card{
  width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:16px 20px;margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.status-left{display:flex;flex-direction:column;gap:5px}
.status-name{font-size:.75rem;color:var(--text-dim)}
.status-state{font-size:1rem;font-weight:500;display:flex;align-items:center;gap:7px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);flex-shrink:0}
.status-dot.cleaning{background:var(--green);animation:pulse 1.5s infinite}
.status-dot.returning{background:var(--yellow);animation:pulse 1.5s infinite}
.status-dot.docked{background:var(--accent)}
.status-dot.paused{background:var(--orange)}
.status-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.last-cmd{font-size:.7rem;color:var(--accent);min-height:13px}
.battery-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.battery-icon{font-size:1.5rem;line-height:1}
.battery-pct{font-size:.75rem;color:var(--text-dim)}

/* Robot */
.robot-visual{width:100%;max-width:420px;display:flex;justify-content:center;margin-bottom:18px}
.robot-body{
  width:100px;height:100px;border-radius:50%;
  background:linear-gradient(135deg,rgba(129,140,248,0.12),rgba(52,211,153,0.08));
  border:2px solid rgba(129,140,248,0.25);
  display:flex;align-items:center;justify-content:center;font-size:3rem;
  position:relative;transition:all .3s;
}
.robot-body.spinning{animation:robotSpin 2s linear infinite}
.robot-body.returning{animation:bounce .8s ease-in-out infinite}
.robot-ring{position:absolute;inset:-10px;border-radius:50%;border:2px dashed rgba(129,140,248,0.15);animation:robotSpin 4s linear infinite}
@keyframes robotSpin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* Buttons */
.controls-wrap{width:100%;max-width:420px}
.section-label{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
.main-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:9px}
.btn{
  padding:0;height:70px;border-radius:15px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;transition:all .15s;font-family:inherit;font-size:.74rem;
  -webkit-user-select:none;user-select:none;
}
.btn .icon{font-size:1.5rem;line-height:1}
.btn:active{transform:scale(0.93);background:var(--surface2)}
.btn.clean{border-color:rgba(52,211,153,.3);color:var(--green)}
.btn.stop{border-color:rgba(248,113,113,.3);color:var(--red)}
.btn.charge{border-color:rgba(129,140,248,.3);color:var(--accent)}
.btn.pause{border-color:rgba(251,191,36,.3);color:var(--yellow)}
.btn.resume{border-color:rgba(52,211,153,.2);color:var(--green)}
.btn.sound{border-color:rgba(167,139,250,.2);color:#a78bfa}
.btn.wide{width:100%;height:46px;flex-direction:row;gap:7px;font-size:.82rem;
  border-color:rgba(129,140,248,.2);color:var(--accent);margin-bottom:9px}
.btn.loading{opacity:.55;pointer-events:none}
.btn.loading .icon{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);
  background:rgba(20,20,30,0.95);border:1px solid var(--border);border-radius:11px;
  padding:9px 18px;font-size:.83rem;color:var(--text);transition:transform .25s;
  z-index:100;backdrop-filter:blur(10px);white-space:nowrap;max-width:90vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(52,211,153,.35);color:var(--green)}
.toast.error{border-color:rgba(248,113,113,.35);color:var(--red)}

/* Connection indicator */
.conn-row{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text-dim);
  margin-bottom:14px;padding:7px 12px;background:var(--surface);border-radius:10px;
  border:1px solid var(--border);width:100%;max-width:420px;justify-content:space-between}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
.conn-dot.ok{background:var(--green)}
.conn-url{font-size:.68rem;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
</style>
</head>
<body>

<h1>DEEBOT Controller</h1>
<p class="subtitle">X8 PRO OMNI - שליטה מרחוק</p>

<!-- Connection bar -->
<div class="conn-row">
  <div style="display:flex;align-items:center;gap:6px">
    <div class="conn-dot" id="connDot"></div>
    <span id="connLabel">לא מחובר</span>
  </div>
  <span class="conn-url" id="connUrl"></span>
</div>

<!-- Setup card -->
<div class="setup-card" id="setupCard">
  <h3>⚙️ הגדרת חיבור</h3>
  <p>הפעל על המחשב: <strong>start_deebot.bat</strong><br>
     לאחר מכן הכנס את כתובת ה-Tunnel שתופיע בחלון.</p>
  <div class="url-row">
    <input class="url-input" id="urlInput" type="url" 
      placeholder="https://xxxx.trycloudflare.com" 
      value="" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="connect-btn" onclick="saveAndConnect()">חבר</button>
  </div>
</div>

<!-- Status -->
<div class="status-card">
  <div class="status-left">
    <div class="status-name">DEEBOT X8 PRO OMNI</div>
    <div class="status-state">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">ממתין לחיבור...</span>
    </div>
    <div class="last-cmd" id="lastCmd"></div>
  </div>
  <div class="battery-wrap">
    <div class="battery-icon" id="batteryIcon">🔋</div>
    <div class="battery-pct" id="batteryPct">--%</div>
  </div>
</div>

<!-- Robot visual -->
<div class="robot-visual">
  <div class="robot-body" id="robotBody">
    <div class="robot-ring"></div>
    🤖
  </div>
</div>

<!-- Controls -->
<div class="controls-wrap">
  <div class="section-label">פקודות</div>
  <div class="main-grid">
    <button class="btn clean"  onclick="cmd('clean')"  id="btn-clean">  <span class="icon">🧹</span><span>נקה</span></button>
    <button class="btn pause"  onclick="cmd('pause')"  id="btn-pause">  <span class="icon">⏸️</span><span>השהה</span></button>
    <button class="btn resume" onclick="cmd('resume')" id="btn-resume"> <span class="icon">▶️</span><span>המשך</span></button>
    <button class="btn stop"   onclick="cmd('stop')"   id="btn-stop">   <span class="icon">⏹️</span><span>עצור</span></button>
    <button class="btn charge" onclick="cmd('charge')" id="btn-charge"> <span class="icon">🏠</span><span>בסיס</span></button>
    <button class="btn sound"  onclick="cmd('sound')"  id="btn-sound">  <span class="icon">🔊</span><span>צליל</span></button>
  </div>
  <button class="btn wide" onclick="refresh()" id="btn-refresh">
    <span class="icon">🔄</span><span>רענן סטטוס</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'deebot_server_url';
let serverUrl = localStorage.getItem(STORAGE_KEY) || '';
let busy = false;

// ── Init ──
(function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    document.getElementById('urlInput').value = saved;
    serverUrl = saved;
    document.getElementById('setupCard').style.display = 'none';
    fetchStatus();
  }
})();

function saveAndConnect() {
  const val = document.getElementById('urlInput').value.trim().replace(/\/$/, '');
  if (!val) return;
  serverUrl = val;
  localStorage.setItem(STORAGE_KEY, val);
  document.getElementById('setupCard').style.display = 'none';
  fetchStatus();
}

// ── State helpers ──
function stateClass(s) {
  s = (s||'').toLowerCase();
  if (s.includes('clean')) return 'cleaning';
  if (s.includes('return')||s.includes('dock')) return 'returning';
  if (s.includes('docked')||s.includes('charging')) return 'docked';
  if (s.includes('paused')) return 'paused';
  if (s.includes('error')) return 'error';
  return 'idle';
}

function updateUI(data) {
  document.getElementById('connDot').className = 'conn-dot ok';
  document.getElementById('connLabel').textContent = 'מחובר';
  document.getElementById('connUrl').textContent = serverUrl.replace('https://','');

  const cls = stateClass(data.state);
  document.getElementById('statusDot').className = 'status-dot ' + cls;
  document.getElementById('statusText').textContent = data.state || 'לא ידוע';

  const pct = parseInt((data.battery||'0').replace('%',''));
  document.getElementById('batteryIcon').textContent = pct >= 50 ? '🔋' : '🪫';
  document.getElementById('batteryPct').textContent = data.battery || '--%';

  const rb = document.getElementById('robotBody');
  rb.className = 'robot-body';
  if (cls === 'cleaning') rb.classList.add('spinning');
  if (cls === 'returning') rb.classList.add('returning');

  if (data.action) {
    document.getElementById('lastCmd').textContent = '✓ ' + data.action;
    setTimeout(() => document.getElementById('lastCmd').textContent = '', 4000);
  }
}

function setOffline() {
  document.getElementById('connDot').className = 'conn-dot';
  document.getElementById('connLabel').textContent = 'לא מחובר';
  document.getElementById('statusText').textContent = 'שרת לא זמין';
}

// ── API ──
async function apiFetch(path) {
  if (!serverUrl) { toast('הכנס כתובת שרת', 'error'); return null; }
  const res = await fetch(serverUrl + path, { signal: AbortSignal.timeout(30000) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function fetchStatus() {
  try {
    const d = await apiFetch('/api/status');
    if (d) updateUI(d);
  } catch { setOffline(); }
}

async function cmd(c) {
  if (busy) return;
  busy = true;
  const b = document.getElementById('btn-' + c);
  const origIcon = b.querySelector('.icon').textContent;
  b.classList.add('loading');
  b.querySelector('.icon').textContent = '⏳';
  toast('שולח...', '');
  try {
    const d = await apiFetch('/api/' + c);
    if (d) { updateUI(d); }
    const msgs = {clean:'🧹 מתחיל לנקות!',stop:'⏹️ עצר',pause:'⏸️ מושהה',resume:'▶️ ממשיך',charge:'🏠 חוזר לבסיס',sound:'🔊 מנגן צליל!'};
    toast(msgs[c] || 'בוצע', 'success');
  } catch(e) {
    toast('שגיאה: ' + e.message, 'error');
    setOffline();
  }
  b.classList.remove('loading');
  b.querySelector('.icon').textContent = origIcon;
  busy = false;
}

async function refresh() {
  const b = document.getElementById('btn-refresh');
  b.classList.add('loading');
  b.querySelector('.icon').textContent = '⏳';
  await fetchStatus();
  b.classList.remove('loading');
  b.querySelector('.icon').textContent = '🔄';
  toast('עודכן', 'success');
}

// ── Toast ──
let toastT;
function toast(msg, type) {
  clearTimeout(toastT);
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  toastT = setTimeout(() => el.className = 'toast', 2800);
}

// Auto-refresh every 30s
setInterval(fetchStatus, 30000);
</script>
</body>
</html>
