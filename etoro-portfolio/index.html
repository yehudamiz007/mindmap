<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eToro Portfolio Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card2: #22263a;
      --border: #2e3250;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --blue: #3b82f6;
      --purple: #a855f7;
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .refresh-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .refresh-btn:hover { opacity: 0.85; }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 16px;
    }

    .summary-card .label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .summary-card .value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .neutral  { color: var(--blue); }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span.dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .positions-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 36px;
      font-size: 0.9rem;
    }

    .positions-table th {
      text-align: right;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .positions-table th:hover { color: var(--text); }

    .sort-icon {
      display: inline-block;
      margin-right: 4px;
      opacity: 0.4;
      font-size: 0.7rem;
    }

    .sort-icon.active { opacity: 1; color: var(--accent); }

    .positions-table td {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .positions-table tr:last-child td { border-bottom: none; }

    .positions-table tbody tr {
      background: var(--card);
      transition: background 0.15s;
    }
    .positions-table tbody tr:hover { background: var(--card2); }

    .ticker-badge {
      display: inline-block;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .pnl-bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pnl-bar {
      height: 6px;
      border-radius: 4px;
      min-width: 4px;
      max-width: 80px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* History */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 36px;
    }

    .history-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .history-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .icon-open  { background: rgba(34,197,94,0.15); }
    .icon-close { background: rgba(239,68,68,0.15); }
    .icon-hold  { background: rgba(59,130,246,0.15); }

    .history-body { flex: 1; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .history-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .history-date {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .history-reason {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      margin-left: 6px;
    }

    .tag-open  { background: rgba(34,197,94,0.2);  color: var(--green); }
    .tag-close { background: rgba(239,68,68,0.2);  color: var(--red); }
    .tag-hold  { background: rgba(59,130,246,0.2); color: var(--blue); }

    .error-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 16px;
      color: var(--red);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .last-updated {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      margin-top: 32px;
    }

    .no-data { color: var(--muted); font-size: 0.9rem; padding: 16px 0; }

    @media (max-width: 600px) {
      .positions-table th:nth-child(4),
      .positions-table td:nth-child(4) { display: none; }
    }
  </style>
</head>

// ── HELPERS ──────────────────────────────────────────────────────────────────
function fmt(n, decimals = 2) {
  return (n >= 0 ? '+' : '') + n.toFixed(decimals);
}

function fmtUSD(n) {
  return '$' + Math.abs(n).toFixed(2);
}

function pnlClass(n) {
  return n > 0 ? 'positive' : n < 0 ? 'negative' : 'neutral';
}

function newUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

// ── API ───────────────────────────────────────────────────────────────────────
async function fetchPortfolio() {
  const res = await fetch('https://public-api.etoro.com/api/v1/trading/info/real/pnl', {
    headers: {
      'x-api-key': API_KEY,
      'x-user-key': USER_KEY,
      'x-request-id': newUUID()
    }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  return data.clientPortfolio;
}

// ── SORT STATE ───────────────────────────────────────────────────────────────
let sortCol = null;   // 'symbol' | 'amount' | 'pnl' | 'pnlpct' | 'weight' | 'date'
let sortDir = 1;      // 1 = asc, -1 = desc
let lastPortfolio = null;

function toggleSort(col) {
  if (sortCol === col) {
    sortDir *= -1;
  } else {
    sortCol = col;
    sortDir = col === 'pnl' || col === 'pnlpct' ? -1 : 1; // default desc for pnl
  }
  if (lastPortfolio) renderPositions(lastPortfolio);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderSummary(portfolio) {
  const positions = portfolio.positions || [];
  const credit    = portfolio.credit || 0;

  // totalAmount = sum of original invested per position
  const totalAmount   = positions.reduce((s, p) => s + p.amount, 0);
  // totalExposure = current market value of all positions
  // Filter to agent portfolio only
  const agentPos      = positions.filter(p => new Date(p.openDateTime) >= AGENT_START_DATE);
  const totalExposure = agentPos.reduce((s, p) => s + p.unrealizedPnL.exposureInAccountCurrency, 0);
  const totalPnL      = agentPos.reduce((s, p) => s + p.unrealizedPnL.pnL, 0);
  const totalInvested2 = agentPos.reduce((s, p) => s + p.amount, 0);
  // equity = credit (free cash) + current exposure
  const equity        = credit + totalExposure;
  // pnl% relative to original invested
  const pnlPct        = totalInvested2 > 0 ? (totalPnL / totalInvested2) * 100 : 0;

  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card">
      <div class="label">פוזיציות פתוחות</div>
      <div class="value neutral">${agentPos.length}</div>
    </div>
    <div class="summary-card">
      <div class="label">סה"כ מושקע (עלות)</div>
      <div class="value neutral">${fmtUSD(totalInvested2)}</div>
    </div>
    <div class="summary-card">
      <div class="label">שווי שוק נוכחי</div>
      <div class="value neutral">${fmtUSD(totalExposure)}</div>
    </div>
    <div class="summary-card">
      <div class="label">רווח/הפסד לא ממומש</div>
      <div class="value ${pnlClass(totalPnL)}">${fmt(totalPnL, 2)}$</div>
    </div>
    <div class="summary-card">
      <div class="label">תשואה כוללת</div>
      <div class="value ${pnlClass(pnlPct)}">${fmt(pnlPct, 2)}%</div>
    </div>
    <div class="summary-card">
      <div class="label">מזומן זמין</div>
      <div class="value ${credit > 0 ? 'positive' : 'negative'}">${fmtUSD(credit)}</div>
    </div>
    <div class="summary-card">
      <div class="label">שווי תיק כולל</div>
      <div class="value neutral">${fmtUSD(equity)}</div>
    </div>
  `;
}

function sortIcon(col) {
  if (sortCol !== col) return '<span class="sort-icon">⇅</span>';
  return `<span class="sort-icon active">${sortDir === 1 ? '↑' : '↓'}</span>`;
}

function renderPositions(portfolio) {
  const positions = portfolio.positions || [];
  if (positions.length === 0) {
    document.getElementById('positionsSection').innerHTML = '<p class="no-data">אין פוזיציות פתוחות כרגע.</p>';
    return;
  }

  const totalExposure = positions.reduce((s, p) => s + p.unrealizedPnL.exposureInAccountCurrency, 0);

  // Filter: only agent portfolio positions (opened on/after 15 Apr 2026)
  const agentPositions = positions.filter(p => new Date(p.openDateTime) >= AGENT_START_DATE);

  // Enrich positions with computed fields
  const enriched = agentPositions.map(p => ({
    ...p,
    symbol:  INSTRUMENTS[p.instrumentID] || `#${p.instrumentID}`,
    pnl:     p.unrealizedPnL.pnL,
    exposure: p.unrealizedPnL.exposureInAccountCurrency,
    pnlPct:  p.amount > 0 ? (p.unrealizedPnL.pnL / p.amount) * 100 : 0,
    weight:  totalExposure > 0 ? (p.unrealizedPnL.exposureInAccountCurrency / totalExposure) * 100 : 0,
    openTs:  new Date(p.openDateTime).getTime(),
  }));

  // Sort
  if (sortCol) {
    enriched.sort((a, b) => {
      let va, vb;
      if (sortCol === 'symbol')  { va = a.symbol;  vb = b.symbol;  return sortDir * va.localeCompare(vb); }
      if (sortCol === 'amount')  { va = a.amount;  vb = b.amount; }
      if (sortCol === 'pnl')     { va = a.pnl;     vb = b.pnl; }
      if (sortCol === 'pnlpct')  { va = a.pnlPct;  vb = b.pnlPct; }
      if (sortCol === 'weight')  { va = a.weight;  vb = b.weight; }
      if (sortCol === 'date')    { va = a.openTs;  vb = b.openTs; }
      return sortDir * (va - vb);
    });
  }

  const rows = enriched.map(p => {
    const openDate = new Date(p.openDateTime).toLocaleDateString('he-IL');
    const barColor = p.pnl >= 0 ? 'var(--green)' : 'var(--red)';
    const barWidth = Math.min(Math.abs(p.pnlPct) * 4, 80);

    return `
      <tr>
        <td><span class="ticker-badge">${p.symbol}</span></td>
        <td>${fmtUSD(p.amount)}</td>
        <td>
          <div class="pnl-bar-wrap">
            <span class="${pnlClass(p.pnl)}" style="font-weight:600;">${fmt(p.pnl, 2)}$</span>
            <div class="pnl-bar" style="width:${barWidth}px; background:${barColor};"></div>
          </div>
          <small class="${pnlClass(p.pnlPct)}">${fmt(p.pnlPct, 2)}%</small>
        </td>
        <td style="color: var(--muted); font-size: 0.82rem;">${p.weight.toFixed(1)}%</td>
        <td style="color: var(--muted); font-size: 0.82rem;">${openDate}</td>
      </tr>
    `;
  }).join('');

  document.getElementById('positionsSection').innerHTML = `
    <table class="positions-table">
      <thead>
        <tr>
          <th onclick="toggleSort('symbol')">${sortIcon('symbol')} מניה</th>
          <th onclick="toggleSort('amount')">${sortIcon('amount')} השקעה</th>
          <th onclick="toggleSort('pnl')">${sortIcon('pnl')} רווח/הפסד</th>
          <th onclick="toggleSort('weight')">${sortIcon('weight')} משקל</th>
          <th onclick="toggleSort('date')">${sortIcon('date')} תאריך פתיחה</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderHistory() {
  const items = [...HISTORY].reverse().map(h => {
    let iconClass = 'icon-hold', iconEmoji = '📊', tagClass = 'tag-hold', tagText = 'HOLD';
    if (h.action === 'open')  { iconClass = 'icon-open';  iconEmoji = '✅'; tagClass = 'tag-open';  tagText = 'פתיחה'; }
    if (h.action === 'close') { iconClass = 'icon-close'; iconEmoji = '❌'; tagClass = 'tag-close'; tagText = 'סגירה'; }

    return `
      <div class="history-item">
        <div class="history-icon ${iconClass}">${iconEmoji}</div>
        <div class="history-body">
          <div class="history-header">
            <span class="history-title">
              ${h.title}
              <span class="tag ${tagClass}">${tagText}</span>
            </span>
            <span class="history-date">${h.date}</span>
          </div>
          <div class="history-reason">${h.reason}</div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('historySection').innerHTML = `<div class="history-list">${items}</div>`;
}

// ── MAIN ──────────────────────────────────────────────────────────────────────
async function loadAll() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '⏳ טוען...';

  try {
    const portfolio = await fetchPortfolio();
    lastPortfolio = portfolio;
    renderSummary(portfolio);
    renderPositions(portfolio);
  } catch (err) {
    const errHtml = `<div class="error-box">⚠️ שגיאה בטעינת נתונים מ-eToro API: ${err.message}<br><small>בדוק את חיבור האינטרנט או שה-API key תקף.</small></div>`;
    document.getElementById('summaryGrid').innerHTML = errHtml;
    document.getElementById('positionsSection').innerHTML = '';
  }

  renderHistory();

  const now = new Date().toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem' });
  document.getElementById('lastUpdated').textContent = `עודכן לאחרונה: ${now}`;

  btn.disabled = false;
  btn.textContent = '🔄 רענן';
}

loadAll();
</script>
