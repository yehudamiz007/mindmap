<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eToro Portfolio Dashboard</title>
  <style>
    :root {
      --bg: #0f1117; --card: #1a1d27; --card2: #22263a; --border: #2e3250;
      --green: #22c55e; --red: #ef4444; --blue: #3b82f6; --purple: #a855f7;
      --text: #e2e8f0; --muted: #64748b; --accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 24px 16px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header .subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

    .refresh-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: opacity 0.2s; }
    .refresh-btn:hover { opacity: 0.85; }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 16px; }
    .summary-card .label { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-card .value { font-size: 1.4rem; font-weight: 700; }

    .positive { color: var(--green); } .negative { color: var(--red); } .neutral { color: var(--blue); }

    .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .section-title span.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 36px; font-size: 0.9rem; }
    th { text-align: right; padding: 10px 14px; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
    th:hover { color: var(--text); }
    td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr { background: var(--card); transition: background 0.15s; }
    tbody tr:hover { background: var(--card2); }

    .ticker-badge { display: inline-block; background: var(--card2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-weight: 700; font-size: 0.85rem; }
    .sort-icon { display: inline-block; margin-right: 4px; opacity: 0.4; font-size: 0.7rem; }
    .sort-icon.active { opacity: 1; color: var(--accent); }

    .pnl-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .pnl-bar { height: 6px; border-radius: 4px; min-width: 4px; }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .history-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 36px; }
    .history-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 14px; }
    .history-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
    .icon-open { background: rgba(34,197,94,0.15); } .icon-close { background: rgba(239,68,68,0.15); } .icon-hold { background: rgba(59,130,246,0.15); }
    .history-body { flex: 1; }
    .history-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
    .history-title { font-weight: 600; font-size: 0.95rem; }
    .history-date { font-size: 0.78rem; color: var(--muted); }
    .history-reason { font-size: 0.82rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; margin-left: 6px; }
    .tag-open { background: rgba(34,197,94,0.2); color: var(--green); }
    .tag-close { background: rgba(239,68,68,0.2); color: var(--red); }
    .tag-hold { background: rgba(59,130,246,0.2); color: var(--blue); }

    .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 16px; color: var(--red); font-size: 0.9rem; margin-bottom: 20px; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .last-updated { font-size: 0.78rem; color: var(--muted); text-align: center; margin-top: 32px; }
    .no-data { color: var(--muted); font-size: 0.9rem; padding: 16px 0; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 eToro Portfolio</h1>
    <div class="subtitle">YEHUDACLAW-TMFOK - Live Dashboard</div>
  </div>
  <button class="refresh-btn" id="refreshBtn" onclick="loadAll()">🔄 רענן</button>
</div>

<div class="summary-grid" id="summaryGrid">
  <div class="loading"><div class="spinner"></div><br>טוען...</div>
</div>

<div class="section-title">
  <span class="dot"></span>
  <span class="status-dot"></span>
  פוזיציות פתוחות
</div>
<div id="positionsSection">
  <div class="loading"><div class="spinner"></div><br>טוען פוזיציות...</div>
</div>

<div class="section-title" style="margin-top: 36px;">
  <span class="dot" style="background: var(--purple);"></span>
  היסטוריית פעולות
</div>
<div id="historySection"></div>

<div class="last-updated" id="lastUpdated"></div>

<script>
// ── AGENT PORTFOLIO (source of truth from eToro, last updated 07/05/2026) ────
// units × avgOpen = Invested column in eToro
// Source of truth: eToro screenshot 07/05/2026 15:01
// invested = units × avgOpen (verified against eToro)
const POSITIONS = [
  { sym: 'NVDA',  units: 14.43827, avgOpen: 207.60371, openCount: 6, etoroInvested: 2997.44 },
  { sym: 'GOOG',  units: 1.96377,  avgOpen: 380.10,    openCount: 1, etoroInvested: 746.43  },
  { sym: 'GOOGL', units: 1.59951,  avgOpen: 342.62816, openCount: 3, etoroInvested: 548.04  },
  { sym: 'AMD',   units: 0.76966,  avgOpen: 347.71,    openCount: 1, etoroInvested: 267.62  },
  { sym: 'AAPL',  units: 1.0209,   avgOpen: 267.46,    openCount: 1, etoroInvested: 273.05  },
  { sym: 'AVGO',  units: 0.66397,  avgOpen: 419.19,    openCount: 1, etoroInvested: 278.33  },
];

// eToro verified P/L snapshot (07/05/2026 16:51) - used as fallback if Yahoo price unavailable
// Total P/L: +$190 (+1.54%) | Invested: $5,110.91
const ETORO_SNAPSHOT = {
  NVDA:  { price: 208.43 },
  GOOG:  { price: 393.54 },
  GOOGL: { price: 396.67 },
  AMD:   { price: 414.04 },
  AAPL:  { price: 289.15 },
  AVGO:  { price: 417.08 },
};

// ── HISTORY (from grok-trader logs) ──────────────────────────────────────────
const HISTORY = [
  { date: '16.04.2026', action: 'hold', title: 'HOLD - כל הפוזיציות', reason: 'לא ניתן לגשת לנתוני MA20 ו-news. ברירת מחדל - החזקה.' },
  { date: '21.04.2026', action: 'hold', title: 'HOLD - כל הפוזיציות', reason: 'META +1.56%, AMZN +1.57%, NVDA +2.70%, MSFT +6.31%, AAPL +4.69%, GOOGL +2.02%. כולן מעל MA20.' },
  { date: '22.04.2026', action: 'hold', title: 'HOLD - כל הפוזיציות', reason: 'MSFT +8.47% בולטת. כל הפוזיציות מיושרות עם אסטרטגיית Grok 4.' },
  { date: '23.04.2026', action: 'hold', title: 'HOLD - כל הפוזיציות', reason: 'Equity ~$2,079. אין מזומן פנוי. כל הפוזיציות מעל MA20.' },
  { date: '24.04.2026', action: 'close', title: '❌ סגר META', reason: 'ביצועים נמוכים ביחס ל-MA20 ואי-ודאות בהכנסות פרסום.' },
  { date: '24.04.2026', action: 'open', title: '✅ פתח TSLA (19%)', reason: 'טרנד שורי חזק ו-catalysts חיוביים במספרי משלוחים.' },
  { date: '27.04.2026', action: 'hold', title: 'HOLD - ניסיון נכשל (API error)', reason: 'כוונה לסגור AMD ולפתוח AAPL. נכשל עקב שגיאות API (400 Bad Request).' },
  { date: '27.04.2026', action: 'open', title: '✅ פתח NVDA ($800)', reason: 'ציון 9.0, ביקוש שבבי AI, מעל MA20.' },
  { date: '28.04.2026', action: 'open', title: '✅ פתח NVDA ($2,000)', reason: 'מומנטום יוצא דופן, ביקוש שבבי AI.' },
  { date: '29.04.2026', action: 'open', title: '✅ פתח AAPL ($2,000) + MSFT ($2,000)', reason: 'שניהם עברו כל הקריטריונים. מזומן זמין: $6,700.' },
  { date: '30.04.2026', action: 'close', title: '❌ סגר CRWD', reason: 'הפוזיציה החלשה ביותר, ציון 7.4, PnL שלילי.' },
  { date: '30.04.2026', action: 'open', title: '✅ פתח TSLA ($500)', reason: 'ציון 8.3, מעל MA20, רומורים על דגם חדש.' },
  { date: '01.05.2026', action: 'open', title: '✅ פתח AAPL ($750) + TSLA ($750)', reason: 'מזומן זמין $1,500, שניהם עברו כל הקריטריונים.' },
  { date: '05.05.2026', action: 'close', title: '❌ ניסיון סגירת NVDA', reason: 'תיק מושקע יתר. NVDA הוגדר כחלש ביותר. לא בטוח שבוצע בפועל.' },
  { date: '06.05.2026', action: 'close', title: '❌ ניסיון סגירת AVGO (שגיאת API)', reason: 'ציון 7.9. שגיאה: Route not found. תועד כ-simulated.' },
];

// ── HELPERS ───────────────────────────────────────────────────────────────────
function fmt(n, d = 2) { return (n >= 0 ? '+' : '') + n.toFixed(d); }
function fmtUSD(n) { return '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function pnlClass(n) { return n > 0 ? 'positive' : n < 0 ? 'negative' : 'neutral'; }

// ── SORT STATE ────────────────────────────────────────────────────────────────
let sortCol = null, sortDir = 1, lastPrices = null;

function toggleSort(col) {
  sortDir = (sortCol === col) ? sortDir * -1 : (col === 'pnl' || col === 'pnlpct' ? -1 : 1);
  sortCol = col;
  if (lastPrices) renderPositions(lastPrices);
}

function sortIcon(col) {
  if (sortCol !== col) return '<span class="sort-icon">⇅</span>';
  return `<span class="sort-icon active">${sortDir === 1 ? '↑' : '↓'}</span>`;
}

// ── PRICE FETCH (Yahoo Finance) ───────────────────────────────────────────────
async function fetchPrice(sym) {
  const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1d`);
  if (!res.ok) throw new Error(`Yahoo ${sym} ${res.status}`);
  const data = await res.json();
  return data.chart.result[0].meta.regularMarketPrice;
}

async function fetchAllPrices() {
  const syms = [...new Set(POSITIONS.map(p => p.sym))];
  const prices = {};
  await Promise.all(syms.map(async sym => {
    try {
      const yahooPrice = await fetchPrice(sym);
      // Sanity check: if Yahoo price is wildly off vs eToro snapshot (>10%), use snapshot
      const snap = ETORO_SNAPSHOT[sym];
      if (snap && Math.abs(yahooPrice - snap.price) / snap.price > 0.10) {
        console.warn(`${sym}: Yahoo ${yahooPrice} vs eToro ${snap.price} - using eToro snapshot`);
        prices[sym] = snap.price;
      } else {
        prices[sym] = yahooPrice;
      }
    } catch(e) {
      console.warn('price fetch failed', sym, e);
      // Fallback to eToro snapshot price
      prices[sym] = ETORO_SNAPSHOT[sym]?.price || null;
    }
  }));
  return prices;
}

// ── RENDER SUMMARY ────────────────────────────────────────────────────────────
function renderSummary(prices) {
  let totalInvested = 0, totalValue = 0;
  POSITIONS.forEach(p => {
    if (prices[p.sym] == null) return;
    totalInvested += p.units * p.avgOpen;
    totalValue    += p.units * prices[p.sym];
  });
  const totalPnL = totalValue - totalInvested;
  const pnlPct   = totalInvested > 0 ? (totalPnL / totalInvested) * 100 : 0;

  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card"><div class="label">מניות פתוחות</div><div class="value neutral">${POSITIONS.length}</div></div>
    <div class="summary-card"><div class="label">סה"כ מושקע</div><div class="value neutral">${fmtUSD(totalInvested)}</div></div>
    <div class="summary-card"><div class="label">שווי נוכחי</div><div class="value neutral">${fmtUSD(totalValue)}</div></div>
    <div class="summary-card"><div class="label">רווח/הפסד</div><div class="value ${pnlClass(totalPnL)}">${fmt(totalPnL, 2)}$</div></div>
    <div class="summary-card"><div class="label">תשואה</div><div class="value ${pnlClass(pnlPct)}">${fmt(pnlPct, 2)}%</div></div>
  `;
}

// ── RENDER POSITIONS ──────────────────────────────────────────────────────────
function renderPositions(prices) {
  // Enrich
  let totalValue = 0;
  const enriched = POSITIONS.map(p => {
    const price    = prices[p.sym] || 0;
    const invested = p.units * p.avgOpen;
    const value    = p.units * price;
    const pnl      = value - invested;
    const pnlPct   = invested > 0 ? (pnl / invested) * 100 : 0;
    totalValue += value;
    return { ...p, price, invested, value, pnl, pnlPct };
  });

  // Sort
  if (sortCol) {
    enriched.sort((a, b) => {
      if (sortCol === 'sym')     return sortDir * a.sym.localeCompare(b.sym);
      if (sortCol === 'invested') return sortDir * (a.invested - b.invested);
      if (sortCol === 'pnl')     return sortDir * (a.pnl - b.pnl);
      if (sortCol === 'pnlpct')  return sortDir * (a.pnlPct - b.pnlPct);
      if (sortCol === 'weight')  return sortDir * (a.value - b.value);
      if (sortCol === 'price')   return sortDir * (a.price - b.price);
      return 0;
    });
  }

  const rows = enriched.map(p => {
    const weight   = totalValue > 0 ? (p.value / totalValue) * 100 : 0;
    const barColor = p.pnl >= 0 ? 'var(--green)' : 'var(--red)';
    const barWidth = Math.min(Math.abs(p.pnlPct) * 4, 80);
    const priceStr = p.price ? `$${p.price.toFixed(2)}` : '-';
    return `
      <tr>
        <td>
          <span class="ticker-badge">${p.sym}</span>
          ${p.openCount > 1 ? `<span style="font-size:0.7rem;color:var(--muted);margin-right:6px;">${p.openCount} פוזיציות</span>` : '<span style="font-size:0.7rem;color:var(--muted);margin-right:6px;">1 פוזיציה</span>'}
        </td>
        <td style="color:var(--muted);font-size:0.82rem;">${p.units.toFixed(5)}</td>
        <td style="color:var(--muted);font-size:0.82rem;">$${p.avgOpen.toFixed(3)}</td>
        <td>${fmtUSD(p.invested)}</td>
        <td>
          <div class="pnl-bar-wrap">
            <span class="${pnlClass(p.pnl)}" style="font-weight:600;">${fmt(p.pnl, 2)}$</span>
            <div class="pnl-bar" style="width:${barWidth}px;background:${barColor};"></div>
          </div>
          <small class="${pnlClass(p.pnlPct)}">${fmt(p.pnlPct, 2)}%</small>
        </td>
        <td style="color:var(--muted);font-size:0.82rem;">${weight.toFixed(1)}%</td>
        <td style="color:var(--muted);font-size:0.82rem;">${priceStr}</td>
      </tr>`;
  }).join('');

  document.getElementById('positionsSection').innerHTML = `
    <table>
      <thead><tr>
        <th onclick="toggleSort('sym')">${sortIcon('sym')} מניה</th>
        <th onclick="toggleSort('units')">יחידות</th>
        <th onclick="toggleSort('avgopen')">Avg Open</th>
        <th onclick="toggleSort('invested')">${sortIcon('invested')} Invested</th>
        <th onclick="toggleSort('pnl')">${sortIcon('pnl')} P/L</th>
        <th onclick="toggleSort('weight')">${sortIcon('weight')} משקל</th>
        <th onclick="toggleSort('price')">${sortIcon('price')} מחיר נוכחי</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── RENDER HISTORY ────────────────────────────────────────────────────────────
function renderHistory() {
  const items = [...HISTORY].reverse().map(h => {
    let iconClass = 'icon-hold', iconEmoji = '📊', tagClass = 'tag-hold', tagText = 'HOLD';
    if (h.action === 'open')  { iconClass = 'icon-open';  iconEmoji = '✅'; tagClass = 'tag-open';  tagText = 'פתיחה'; }
    if (h.action === 'close') { iconClass = 'icon-close'; iconEmoji = '❌'; tagClass = 'tag-close'; tagText = 'סגירה'; }
    return `
      <div class="history-item">
        <div class="history-icon ${iconClass}">${iconEmoji}</div>
        <div class="history-body">
          <div class="history-header">
            <span class="history-title">${h.title}<span class="tag ${tagClass}">${tagText}</span></span>
            <span class="history-date">${h.date}</span>
          </div>
          <div class="history-reason">${h.reason}</div>
        </div>
      </div>`;
  }).join('');
  document.getElementById('historySection').innerHTML = `<div class="history-list">${items}</div>`;
}

// ── MAIN ──────────────────────────────────────────────────────────────────────
async function loadAll() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '⏳ טוען...';

  document.getElementById('summaryGrid').innerHTML = '<div class="loading"><div class="spinner"></div><br>טוען מחירים...</div>';
  document.getElementById('positionsSection').innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  try {
    const prices = await fetchAllPrices();
    lastPrices = prices;
    renderSummary(prices);
    renderPositions(prices);
  } catch(err) {
    document.getElementById('summaryGrid').innerHTML = `<div class="error-box">⚠️ שגיאה בטעינת מחירים: ${err.message}</div>`;
    document.getElementById('positionsSection').innerHTML = '';
  }

  renderHistory();
  const now = new Date().toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem' });
  document.getElementById('lastUpdated').textContent = `עודכן: ${now} | מחירים: Yahoo Finance`;

  btn.disabled = false; btn.textContent = '🔄 רענן';
}

loadAll();
</script>
</body>
</html>
