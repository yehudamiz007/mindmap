<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eToro Agent Portfolio</title>
  <style>
    :root {
      --bg:      #0f1117;
      --card:    #1a1d27;
      --card2:   #22263a;
      --border:  #2e3250;
      --green:   #22c55e;
      --red:     #ef4444;
      --blue:    #3b82f6;
      --purple:  #a855f7;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --accent:  #6366f1;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    /* ── Header ───────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; color: #fff;
      letter-spacing: -1px;
    }
    .header h1 { font-size: 1.45rem; font-weight: 700; }
    .header h1 span { color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .updated-label { font-size: 0.75rem; color: var(--muted); }
    #lastUpdated { color: var(--text); font-size: 0.75rem; }

    .btn-refresh {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: opacity .18s;
    }
    .btn-refresh:hover { opacity: .85; }
    .btn-refresh:active { opacity: .7; }
    .spin { display: inline-block; }
    .spinning { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Summary cards ────────────────────────────────── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .summary-card .label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }
    .summary-card .value {
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .summary-card .sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .c-green { color: var(--green); }
    .c-red   { color: var(--red); }
    .c-blue  { color: var(--blue); }
    .c-purple{ color: var(--purple); }
    .c-accent{ color: var(--accent); }

    /* ── Section titles ───────────────────────────────── */
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .pill {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.72rem;
      padding: 2px 10px;
      color: var(--muted);
    }

    /* ── Positions table ──────────────────────────────── */
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow-x: auto;
      margin-bottom: 32px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }
    thead th {
      background: var(--card2);
      padding: 12px 16px;
      text-align: right;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: color .15s;
    }
    thead th:hover { color: var(--text); }
    thead th.sorted { color: var(--accent); }
    thead th .sort-arrow { margin-right: 4px; opacity: .6; font-size: .7rem; }

    tbody tr {
      border-top: 1px solid var(--border);
      transition: background .12s;
    }
    tbody tr:hover { background: var(--card2); }
    tbody td {
      padding: 14px 16px;
      font-size: 0.88rem;
      vertical-align: middle;
    }

    .ticker-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      color: #fff;
      border-radius: 7px;
      padding: 3px 9px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .pos-count {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 3px;
    }
    .muted-val {
      color: var(--muted);
      font-size: 0.83rem;
    }
    .pl-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pl-values {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .pl-pct {
      font-size: 0.78rem;
      font-weight: 600;
    }
    .pl-bar-bg {
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      width: 70px;
      overflow: hidden;
    }
    .pl-bar-fill {
      height: 4px;
      border-radius: 2px;
      min-width: 2px;
    }
    .weight-cell { text-align: center; }
    .weight-badge {
      display: inline-block;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.8rem;
      color: var(--blue);
    }
    .price-cell {
      font-size: 0.92rem;
      font-weight: 600;
    }

    /* ── Trade history ────────────────────────────────── */
    #historySection { margin-top: 4px; }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .trade-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      transition: border-color .18s;
    }
    .trade-card:hover { border-color: var(--accent); }
    .trade-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .trade-ticker {
      display: inline-block;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .04em;
    }
    .trade-date {
      font-size: 0.72rem;
      color: var(--muted);
    }
    .trade-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 7px;
    }
    .trade-row .tl { font-size: 0.75rem; color: var(--muted); }
    .trade-row .tv { font-size: 0.85rem; font-weight: 500; }
    .price-arrow {
      color: var(--muted);
      font-size: 0.8rem;
      margin: 0 4px;
    }
    .pl-trade {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history-loading, .history-error, .history-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.9rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .history-error { color: var(--red); }

    /* ── Loading overlay for prices ───────────────────── */
    .loading-prices {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 520px) {
      .header h1 { font-size: 1.1rem; }
      .summary-card .value { font-size: 1.2rem; }
      .btn-refresh { padding: 7px 12px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────── -->
<div class="header">
  <div class="header-left">
    <div class="logo">eT</div>
    <div>
      <h1>eToro <span>Agent Portfolio</span></h1>
      <div style="font-size:.75rem;color:var(--muted);margin-top:2px;">דשבורד פוזיציות חכם</div>
    </div>
  </div>
  <div class="header-right">
    <span class="updated-label">עודכן:</span>
    <span id="lastUpdated">—</span>
    <button class="btn-refresh" onclick="refresh()">
      <span class="spin" id="refreshIcon">↻</span>
      רענן
    </button>
  </div>
</div>

<!-- ── SUMMARY CARDS ──────────────────────────────────── -->
<div class="summary-grid" id="summaryGrid">
  <div class="summary-card">
    <div class="label">פוזיציות פתוחות</div>
    <div class="value c-accent" id="sumPositions">—</div>
  </div>
  <div class="summary-card">
    <div class="label">סה"כ מושקע</div>
    <div class="value c-blue" id="sumInvested">—</div>
  </div>
  <div class="summary-card">
    <div class="label">שווי נוכחי</div>
    <div class="value" id="sumValue">—</div>
  </div>
  <div class="summary-card">
    <div class="label">רווח/הפסד</div>
    <div class="value" id="sumPL">—</div>
    <div class="sub" id="sumPLSub"></div>
  </div>
  <div class="summary-card">
    <div class="label">תשואה</div>
    <div class="value" id="sumReturn">—</div>
  </div>
</div>

<!-- ── POSITIONS TABLE ────────────────────────────────── -->
<div class="section-title">
  📊 פוזיציות פתוחות
  <span class="pill" id="posCount">טוען...</span>
</div>
<div class="table-wrap">
  <table id="posTable">
    <thead>
      <tr>
        <th data-col="sym"      class="sorted">מניה <span class="sort-arrow" id="arr-sym">↓</span></th>
        <th data-col="units"              >יחידות <span class="sort-arrow" id="arr-units"></span></th>
        <th data-col="avgOpen"            >פתיחה ממוצעת <span class="sort-arrow" id="arr-avgOpen"></span></th>
        <th data-col="invested"           >השקעה ($) <span class="sort-arrow" id="arr-invested"></span></th>
        <th data-col="pl"                 >רווח/הפסד <span class="sort-arrow" id="arr-pl"></span></th>
        <th data-col="weight" class="weight-cell">משקל <span class="sort-arrow" id="arr-weight"></span></th>
        <th data-col="price"              >מחיר נוכחי <span class="sort-arrow" id="arr-price"></span></th>
      </tr>
    </thead>
    <tbody id="posBody">
      <tr><td colspan="7" class="loading-prices">טוען מחירים...</td></tr>
    </tbody>
  </table>
</div>

<!-- ── TRADE HISTORY ──────────────────────────────────── -->
<div id="historySection">
  <div class="section-title">
    📜 היסטוריית עסקאות
    <span class="pill" id="histCount">טוען...</span>
  </div>
  <div id="historyContainer">
    <div class="history-loading">טוען היסטוריית עסקאות...</div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   DATA
══════════════════════════════════════════════════════════ */
const POSITIONS = [
  { sym: 'NVDA',  units: 14.43827, avgOpen: 207.60371, openCount: 6 },
  { sym: 'GOOG',  units: 1.96377,  avgOpen: 380.10,    openCount: 1 },
  { sym: 'GOOGL', units: 1.59951,  avgOpen: 342.62816, openCount: 3 },
  { sym: 'AMD',   units: 0.76966,  avgOpen: 347.71,    openCount: 1 },
  { sym: 'AAPL',  units: 1.0209,   avgOpen: 267.46,    openCount: 1 },
  { sym: 'AVGO',  units: 0.66397,  avgOpen: 419.19,    openCount: 1 },
];

const ETORO_SNAPSHOT = {
  NVDA:  { price: 208.43 },
  GOOG:  { price: 393.54 },
  GOOGL: { price: 396.67 },
  AMD:   { price: 414.04 },
  AAPL:  { price: 289.15 },
  AVGO:  { price: 417.08 },
};

const INSTRUMENTS = {
  1001:'AAPL', 1002:'GOOG', 1003:'META',  1004:'MSFT',
  1005:'AMZN', 1137:'NVDA', 1365:'ARM',   1832:'AMD',
  4236:'AVGO', 5506:'CRWD', 6434:'GOOGL', 7991:'PLTR',
};

const API_KEY  = 'sdgdskldFPLGfjHn1421dgnlxdGTbngdflg6290bRjslfihsjhSDsdgGHH25hjf';
const USER_KEY = 'eyJjaSI6IjYwY2FiYjBiLTU1OTctNDQ4NS04ZjYzLTdlOWUwNTZlMGJiOCIsImVhbiI6IlVucmVnaXN0ZXJlZEFwcGxpY2F0aW9uIiwiZWsiOiJZNWI3dTY4alZjcHRkbVQuUFVDWGouTjJKaGpJcWtrUlg3WXV3MmNWNU1lSTZhelNIZ2lRNHkxd2xYZ1BtVkY0b2VmLjltUllXLUU2Qkd3Q09nMzNENi1kN0toOWMxd2M5QllGdWRtRC4zMF8ifQ__';

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let prices    = {};   // { SYM: number }
let sortCol   = 'sym';
let sortAsc   = true;

/* ══════════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════════ */
const fmt$ = (v, dec=2) =>
  (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });

const fmtPct = v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';

function colorClass(v) { return v >= 0 ? 'c-green' : 'c-red'; }

function setLoading(on) {
  const ico = document.getElementById('refreshIcon');
  ico.classList.toggle('spinning', on);
}

function updateTimestamp() {
  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

/* ══════════════════════════════════════════════════════════
   PRICE FETCHING (Yahoo Finance + snapshot fallback)
══════════════════════════════════════════════════════════ */
async function fetchYahooPrice(sym) {
  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1d`;
    const resp = await fetch(url, { signal: AbortSignal.timeout(6000) });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const livePrice = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
    if (!livePrice || isNaN(livePrice)) throw new Error('no price');

    // Sanity-check: if differs >10% from snapshot, use snapshot
    const snap = ETORO_SNAPSHOT[sym]?.price;
    if (snap && Math.abs((livePrice - snap) / snap) > 0.10) {
      console.warn(`[${sym}] Yahoo price ${livePrice} differs >10% from snapshot ${snap}. Using snapshot.`);
      return snap;
    }
    return livePrice;
  } catch (e) {
    console.warn(`[${sym}] Yahoo fetch failed: ${e.message}. Using snapshot.`);
    return ETORO_SNAPSHOT[sym]?.price ?? null;
  }
}

async function fetchAllPrices() {
  const results = await Promise.allSettled(
    POSITIONS.map(p => fetchYahooPrice(p.sym).then(price => ({ sym: p.sym, price })))
  );
  const map = {};
  results.forEach(r => {
    if (r.status === 'fulfilled' && r.value.price != null) {
      map[r.value.sym] = r.value.price;
    }
  });
  // Fill any missing with snapshot
  POSITIONS.forEach(p => {
    if (!map[p.sym] && ETORO_SNAPSHOT[p.sym]) {
      map[p.sym] = ETORO_SNAPSHOT[p.sym].price;
    }
  });
  return map;
}

/* ══════════════════════════════════════════════════════════
   ETORO HISTORY API
══════════════════════════════════════════════════════════ */
async function fetchHistory() {
  try {
    const url = 'https://public-api.etoro.com/api/v1/trading/info/trade/history?minDate=2026-04-15&pageSize=100';
    const resp = await fetch(url, {
      headers: {
        'x-api-key':    API_KEY,
        'x-user-key':   USER_KEY,
        'x-request-id': crypto.randomUUID(),
      },
      signal: AbortSignal.timeout(10000),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    // Support various response shapes
    const trades = data?.trades ?? data?.data ?? data?.items ?? (Array.isArray(data) ? data : []);
    return { ok: true, trades };
  } catch (e) {
    console.error('eToro history fetch failed:', e.message);
    return { ok: false, error: e.message };
  }
}

/* ══════════════════════════════════════════════════════════
   COMPUTED ROWS
══════════════════════════════════════════════════════════ */
function buildRows(priceMap) {
  return POSITIONS.map(p => {
    const price    = priceMap[p.sym] ?? p.avgOpen;
    const invested = p.units * p.avgOpen;
    const value    = p.units * price;
    const pl       = value - invested;
    const plPct    = (pl / invested) * 100;
    return { ...p, price, invested, value, pl, plPct };
  });
}

/* ══════════════════════════════════════════════════════════
   RENDER: SUMMARY
══════════════════════════════════════════════════════════ */
function renderSummary(rows) {
  const totalInvested = rows.reduce((s, r) => s + r.invested, 0);
  const totalValue    = rows.reduce((s, r) => s + r.value,    0);
  const totalPL       = totalValue - totalInvested;
  const totalRet      = (totalPL / totalInvested) * 100;

  document.getElementById('sumPositions').textContent = rows.length;
  document.getElementById('sumInvested').textContent  = fmt$(totalInvested, 0);

  const valEl = document.getElementById('sumValue');
  valEl.textContent  = fmt$(totalValue, 0);
  valEl.className    = 'value ' + colorClass(totalValue - totalInvested);

  const plEl = document.getElementById('sumPL');
  plEl.textContent = fmt$(totalPL);
  plEl.className   = 'value ' + colorClass(totalPL);
  document.getElementById('sumPLSub').textContent = fmtPct(totalRet);

  const retEl = document.getElementById('sumReturn');
  retEl.textContent = fmtPct(totalRet);
  retEl.className   = 'value ' + colorClass(totalRet);
}

/* ══════════════════════════════════════════════════════════
   RENDER: POSITIONS TABLE
══════════════════════════════════════════════════════════ */
function sortRows(rows) {
  const col = sortCol;
  return [...rows].sort((a, b) => {
    let av = a[col], bv = b[col];
    if (typeof av === 'string') av = av.toLowerCase(), bv = bv.toLowerCase();
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ?  1 : -1;
    return 0;
  });
}

function renderTable(rows) {
  const totalInvested = rows.reduce((s, r) => s + r.invested, 0);
  const sorted = sortRows(rows);

  // Update sort arrows
  ['sym','units','avgOpen','invested','pl','weight','price'].forEach(c => {
    const el = document.getElementById('arr-' + c);
    if (!el) return;
    el.textContent = c === sortCol ? (sortAsc ? '↓' : '↑') : '';
  });

  const maxAbsPL = Math.max(...rows.map(r => Math.abs(r.pl)), 1);

  document.getElementById('posCount').textContent = rows.length + ' מניות';

  const tbody = document.getElementById('posBody');
  tbody.innerHTML = sorted.map(r => {
    const weight  = (r.invested / totalInvested) * 100;
    const barPct  = Math.min(Math.abs(r.pl) / maxAbsPL * 100, 100);
    const barColor= r.pl >= 0 ? 'var(--green)' : 'var(--red)';

    return `<tr>
      <td>
        <span class="ticker-badge">${r.sym}</span>
        <div class="pos-count">${r.openCount} פוזיציות</div>
      </td>
      <td class="muted-val">${r.units.toFixed(5)}</td>
      <td class="muted-val">${fmt$(r.avgOpen)}</td>
      <td><strong>${fmt$(r.invested)}</strong></td>
      <td>
        <div class="pl-bar-wrap">
          <div class="pl-values">
            <span class="${colorClass(r.pl)}" style="font-weight:600">${fmt$(r.pl)}</span>
            <span class="pl-pct ${colorClass(r.pl)}">${fmtPct(r.plPct)}</span>
          </div>
          <div class="pl-bar-bg">
            <div class="pl-bar-fill" style="width:${barPct}%;background:${barColor}"></div>
          </div>
        </div>
      </td>
      <td class="weight-cell"><span class="weight-badge">${weight.toFixed(1)}%</span></td>
      <td class="price-cell">${fmt$(r.price)}</td>
    </tr>`;
  }).join('');
}

/* ══════════════════════════════════════════════════════════
   RENDER: TRADE HISTORY
══════════════════════════════════════════════════════════ */
function renderHistory(result) {
  const container = document.getElementById('historyContainer');
  const countEl   = document.getElementById('histCount');

  if (!result.ok) {
    container.innerHTML = `<div class="history-error">
      ❌ שגיאה בטעינת היסטוריית עסקאות<br>
      <span style="font-size:.78rem;color:var(--muted);margin-top:6px;display:block">${result.error}</span>
    </div>`;
    countEl.textContent = 'שגיאה';
    return;
  }

  const trades = result.trades;

  if (!trades || trades.length === 0) {
    container.innerHTML = `<div class="history-empty">אין עסקאות סגורות בטווח התאריכים שנבחר</div>`;
    countEl.textContent = '0 עסקאות';
    return;
  }

  // Sort by closeTimestamp desc
  const sorted = [...trades].sort((a, b) => {
    const ta = new Date(a.closeTimestamp ?? a.closeDate ?? a.closedAt ?? 0).getTime();
    const tb = new Date(b.closeTimestamp ?? b.closeDate ?? b.closedAt ?? 0).getTime();
    return tb - ta;
  });

  countEl.textContent = sorted.length + ' עסקאות';

  container.innerHTML = `<div class="history-grid">${sorted.map(t => {
    const instrId  = t.instrumentId ?? t.instrument_id;
    const sym      = INSTRUMENTS[instrId] ?? (t.ticker ?? t.symbol ?? instrId ?? '?');
    const closedAt = t.closeTimestamp ?? t.closeDate ?? t.closedAt ?? '';
    const dateStr  = closedAt ? new Date(closedAt).toLocaleDateString('he-IL', {
      day: '2-digit', month: '2-digit', year: '2-digit',
      hour: '2-digit', minute: '2-digit'
    }) : '—';
    const invested = t.amount ?? t.invested ?? t.openAmount ?? 0;
    const openPrice  = t.openRate  ?? t.open_price  ?? t.openPrice  ?? 0;
    const closePrice = t.closeRate ?? t.close_price ?? t.closePrice ?? 0;
    const pl    = t.netProfit ?? t.profit ?? t.pl ?? t.pnl ?? (closePrice && openPrice && invested
      ? (closePrice - openPrice) / openPrice * invested : 0);
    const plPct = invested ? (pl / invested) * 100 : 0;
    const plClass = pl >= 0 ? 'c-green' : 'c-red';

    return `<div class="trade-card">
      <div class="trade-card-header">
        <span class="trade-ticker">${sym}</span>
        <span class="trade-date">${dateStr}</span>
      </div>
      <div class="trade-row">
        <span class="tl">השקעה</span>
        <span class="tv">${fmt$(invested)}</span>
      </div>
      <div class="trade-row">
        <span class="tl">פתיחה → סגירה</span>
        <span class="tv">
          ${fmt$(openPrice)}
          <span class="price-arrow">→</span>
          ${fmt$(closePrice)}
        </span>
      </div>
      <div class="pl-trade">
        <span style="font-size:.78rem;color:var(--muted)">רווח/הפסד</span>
        <span class="${plClass}">
          ${fmt$(pl)} &nbsp;<span style="font-size:.8rem">${fmtPct(plPct)}</span>
        </span>
      </div>
    </div>`;
  }).join('')}</div>`;
}

/* ══════════════════════════════════════════════════════════
   SORT HEADER CLICK
══════════════════════════════════════════════════════════ */
document.getElementById('posTable').addEventListener('click', e => {
  const th = e.target.closest('th[data-col]');
  if (!th) return;
  const col = th.dataset.col;
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }

  // Update header active classes
  document.querySelectorAll('#posTable thead th').forEach(t => t.classList.remove('sorted'));
  th.classList.add('sorted');

  // Re-render table with current price data
  const rows = buildRows(prices);
  renderTable(rows);
});

/* ══════════════════════════════════════════════════════════
   MAIN REFRESH
══════════════════════════════════════════════════════════ */
async function refresh() {
  setLoading(true);

  // Fetch prices and history in parallel
  const [priceMap, histResult] = await Promise.all([
    fetchAllPrices(),
    fetchHistory(),
  ]);

  prices = priceMap;
  const rows = buildRows(prices);

  renderSummary(rows);
  renderTable(rows);
  renderHistory(histResult);
  updateTimestamp();

  setLoading(false);
}

/* ══════════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════════ */
refresh();
</script>
