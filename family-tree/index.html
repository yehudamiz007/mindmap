<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משפחת מזרחי-לבנברג - עץ יוחסין</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=David+Libre:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Heebo', sans-serif;
            background: #f5efe6;
            min-height: 100vh;
            color: #3a2a1a;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(139,90,43,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139,90,43,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(139,90,43,0.05) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }
        .container {
            position: relative; z-index: 1;
            max-width: 1300px; margin: 0 auto; padding: 40px 20px 60px;
        }
        .header {
            text-align: center; margin-bottom: 40px;
            padding-bottom: 25px; border-bottom: 2px solid #c4a265;
        }
        .header .ornament { font-size: 1.5em; color: #c4a265; }
        .header h1 {
            font-family: 'David Libre', serif; font-size: 3em;
            font-weight: 700; color: #5a3a1a; margin: 10px 0;
        }
        .header .subtitle { font-size: 1.1em; color: #8a7a5a; font-weight: 300; }
        .header .established { margin-top: 8px; font-size: 0.9em; color: #c4a265; font-style: italic; }
        
        .toolbar {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .toolbar button {
            font-family: 'Heebo', sans-serif; font-size: 0.95em;
            padding: 10px 24px; border: 2px solid #c4a265; border-radius: 8px;
            background: linear-gradient(135deg, #fff9e6, #f5e6c0);
            color: #5a3a1a; cursor: pointer; font-weight: 500;
            transition: all 0.2s;
        }
        .toolbar button:hover {
            background: linear-gradient(135deg, #f5e6c0, #e8d5a0);
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(90,58,26,0.15);
        }

        .anniversary-banner {
            text-align: center; margin-bottom: 35px; padding: 15px 25px;
            background: linear-gradient(135deg, #fff9e6, #f5e6c0);
            border: 2px solid #c4a265; border-radius: 10px;
            font-family: 'David Libre', serif; color: #5a3a1a; font-size: 1.1em;
        }
        .tree-svg-container {
            width: 100%; display: flex; justify-content: center; overflow-x: auto;
        }
        svg.family-tree { max-width: 100%; }

        .ft-line { stroke: #c4a265; stroke-width: 2; fill: none; }
        .ft-card { fill: #fffdf5; stroke: #c4a265; stroke-width: 2; rx: 10; ry: 10; filter: url(#shadow); }
        .ft-card-founder { fill: #fff9e6; stroke: #a0842e; stroke-width: 3; rx: 12; ry: 12; filter: url(#shadow); }
        .ft-card-ancestor { fill: #f5ede0; stroke: #8b6914; stroke-width: 2.5; rx: 12; ry: 12; filter: url(#shadow); }
        .ft-card-memorial { fill: #f0ebe3; stroke: #a09070; stroke-width: 2; rx: 10; ry: 10; filter: url(#shadow); opacity: 0.85; }
        .ft-name { font-family: 'David Libre', serif; font-size: 15px; font-weight: 700; fill: #3a2a1a; text-anchor: middle; }
        .ft-detail { font-family: 'Heebo', sans-serif; font-size: 11px; fill: #8a7a5a; text-anchor: middle; }
        .ft-emoji { font-size: 22px; text-anchor: middle; }
        .ft-heart { font-size: 16px; fill: #c4a265; text-anchor: middle; }
        .ft-child-name { font-family: 'David Libre', serif; font-size: 13px; font-weight: 700; fill: #3a2a1a; text-anchor: middle; }
        .ft-trait { font-family: 'Heebo', sans-serif; font-size: 10px; fill: #8a7a5a; text-anchor: middle; font-style: italic; }
        .ft-sub { font-family: 'Heebo', sans-serif; font-size: 9px; fill: #b09a6a; text-anchor: middle; }
        .ft-section { font-family: 'David Libre', serif; font-size: 12px; fill: #8b6914; text-anchor: middle; font-weight: 700; }

        /* Clickable nodes */
        .clickable { cursor: pointer; }
        .clickable:hover rect { filter: url(#glow); }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: linear-gradient(145deg, #fffdf5, #f5efe6);
            border: 3px solid #c4a265; border-radius: 16px;
            padding: 35px; max-width: 500px; width: 90%;
            position: relative; box-shadow: 0 10px 40px rgba(90,58,26,0.25);
            max-height: 80vh; overflow-y: auto;
        }
        .modal-close {
            position: absolute; top: 12px; left: 12px;
            background: none; border: none; font-size: 1.5em;
            cursor: pointer; color: #8a7a5a; line-height: 1;
        }
        .modal-close:hover { color: #3a2a1a; }
        .modal-emoji { font-size: 3em; text-align: center; margin-bottom: 10px; }
        .modal-name {
            font-family: 'David Libre', serif; font-size: 1.8em;
            font-weight: 700; color: #5a3a1a; text-align: center; margin-bottom: 5px;
        }
        .modal-role {
            text-align: center; color: #8a7a5a; font-size: 0.95em; margin-bottom: 20px;
        }
        .modal-divider {
            height: 2px; background: #c4a265; margin: 15px 0; opacity: 0.5;
        }
        .modal-section {
            font-family: 'David Libre', serif; font-size: 1.1em;
            color: #5a3a1a; font-weight: 700; margin: 15px 0 8px;
        }
        .modal-text { color: #3a2a1a; line-height: 1.7; font-size: 0.95em; }
        .modal-text p { margin-bottom: 8px; }
        .modal-detail { color: #8a7a5a; font-size: 0.85em; }

        .stats { display: flex; justify-content: center; gap: 40px; margin-top: 50px; flex-wrap: wrap; }
        .stat { text-align: center; }
        .stat .number { font-family: 'David Libre', serif; font-size: 2.5em; font-weight: 700; color: #5a3a1a; }
        .stat .label { font-size: 0.85em; color: #8a7a5a; }
        .footer { text-align: center; margin-top: 50px; padding-top: 20px; border-top: 1px solid #c4a265; color: #b09a6a; font-size: 0.8em; }

        /* Print / PDF styles */
        @media print {
            body { background: white; }
            body::before { display: none; }
            .toolbar { display: none; }
            .modal-overlay { display: none !important; }
            .container { padding: 20px; max-width: 100%; }
            .tree-svg-container { overflow: visible; }
            svg.family-tree { min-width: auto; width: 100%; }
            .page-break { page-break-before: always; }
            .print-stories { display: block !important; }
            .print-stories .story-card {
                border: 2px solid #c4a265; border-radius: 12px;
                padding: 20px; margin-bottom: 20px;
                page-break-inside: avoid;
                background: #fffdf5;
            }
            .print-stories .story-emoji { font-size: 2em; }
            .print-stories .story-name {
                font-family: 'David Libre', serif; font-size: 1.5em;
                font-weight: 700; color: #5a3a1a; margin: 5px 0;
            }
            .print-stories .story-role { color: #8a7a5a; margin-bottom: 10px; }
            .print-stories .story-text { line-height: 1.8; }
        }

        .print-stories { display: none; }

        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            svg.family-tree { min-width: 1100px; }
            .tree-svg-container { justify-content: flex-start; }
        }
    </style>
</head>

    function showPerson(id) {

        let html = `<div class="modal-emoji">${p.emoji}</div>`;

        html += `<div class="modal-role">${p.role}</div>`;
        html += `<div class="modal-divider"></div>`;
        p.sections.forEach(s => {
            html += `<div class="modal-section">${s.title}</div>`;
            html += `<div class="modal-text"><p>${s.text}</p></div>`;
        });
        document.getElementById('modalContent').innerHTML = html;
        document.getElementById('modal').classList.add('active');
    }

            html += `<div style="margin:15px 0"><span style="font-size:2em">${p.emoji}</span>`;
            html += `<span class="modal-name" style="font-size:1.3em;margin-right:10px">${p.name}</span>`;
            html += `<span class="modal-role"> - ${p.role}</span></div>`;
            p.sections.forEach(s => {
                html += `<div class="modal-section">${s.title}</div>`;
                html += `<div class="modal-text"><p>${s.text}</p></div>`;
            });
        });
        document.getElementById('modalContent').innerHTML = `<h2 style="text-align:center;font-family:'David Libre',serif;color:#5a3a1a">📖 סיפורי המשפחה</h2>` + html;
        document.getElementById('modal').classList.add('active');
    }

    // Populate print stories
    window.addEventListener('load', function() {
        let html = '';
        const order = ['yaakov','chaya_sara','uri_moshe','dina','yehuda_mizrahi_sr','rivka_mizrahi','moshe_yosef','yafa','chana_tova','nirit','yisrael_tzvi','yitzchak_bd','yafa_bd','shlomit_bd',
                       'vardit_l','tova_cherna','tamar_pnina','avi','vardit_m',
                       'yehuda','ilana','tamir','meital','sapir','avior','nitai','arbel'];
        order.forEach(id => {
            const p = people[id];
            if (!p) return;
            let card = `<div class="story-card">`;
            card += `<div class="story-emoji">${p.emoji}</div>`;
            card += `<div class="story-name">${p.name}</div>`;
            card += `<div class="story-role">${p.role}</div>`;
            card += `<div class="story-text">`;
            p.sections.forEach(s => {
                card += `<p><strong>${s.title}</strong> ${s.text}</p>`;
            });
            card += `</div></div>`;
            html += card;
        });
        document.getElementById('printStoriesContent').innerHTML = html;
    });
    </script>
