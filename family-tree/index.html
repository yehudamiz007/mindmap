<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משפחת מזרחי-לבנברג - עץ יוחסין</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=David+Libre:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Heebo', sans-serif;
            background: #f5efe6;
            min-height: 100vh;
            color: #3a2a1a;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(139,90,43,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139,90,43,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(139,90,43,0.05) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }
        .container {
            position: relative; z-index: 1;
            max-width: 1300px; margin: 0 auto; padding: 40px 20px 60px;
        }
        .header {
            text-align: center; margin-bottom: 40px;
            padding-bottom: 25px; border-bottom: 2px solid #c4a265;
        }
        .header .ornament { font-size: 1.5em; color: #c4a265; }
        .header h1 {
            font-family: 'David Libre', serif; font-size: 3em;
            font-weight: 700; color: #5a3a1a; margin: 10px 0;
        }
        .header .subtitle { font-size: 1.1em; color: #8a7a5a; font-weight: 300; }
        .header .established { margin-top: 8px; font-size: 0.9em; color: #c4a265; font-style: italic; }
        
        .toolbar {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .toolbar button {
            font-family: 'Heebo', sans-serif; font-size: 0.95em;
            padding: 10px 24px; border: 2px solid #c4a265; border-radius: 8px;
            background: linear-gradient(135deg, #fff9e6, #f5e6c0);
            color: #5a3a1a; cursor: pointer; font-weight: 500;
            transition: all 0.2s;
        }
        .toolbar button:hover {
            background: linear-gradient(135deg, #f5e6c0, #e8d5a0);
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(90,58,26,0.15);
        }

        .anniversary-banner {
            text-align: center; margin-bottom: 35px; padding: 15px 25px;
            background: linear-gradient(135deg, #fff9e6, #f5e6c0);
            border: 2px solid #c4a265; border-radius: 10px;
            font-family: 'David Libre', serif; color: #5a3a1a; font-size: 1.1em;
        }
        .tree-svg-container {
            width: 100%; display: flex; justify-content: center; overflow: hidden;
            position: relative; cursor: grab; user-select: none;
            border: 1px solid #e8d5a0; border-radius: 10px; background: rgba(255,253,245,0.5);
        }
        .tree-svg-container:active { cursor: grabbing; }
        .tree-svg-container.panning { cursor: grabbing; }
        svg.family-tree { max-width: 100%; touch-action: none; }
        .zoom-controls {
            position: absolute; bottom: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 10;
        }
        .zoom-btn {
            width: 36px; height: 36px; border-radius: 8px;
            background: linear-gradient(135deg, #fff9e6, #f5e6c0);
            border: 2px solid #c4a265; color: #5a3a1a;
            font-size: 1.3em; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(90,58,26,0.15); font-weight: bold;
        }
        .zoom-btn:hover { background: #f5e6c0; transform: scale(1.05); }
        .zoom-label {
            font-size: 0.7em; text-align: center; color: #8a7a5a; font-family: Heebo, sans-serif;
        }

        .ft-line { stroke: #c4a265; stroke-width: 2; fill: none; }
        .ft-card { fill: #fffdf5; stroke: #c4a265; stroke-width: 2; rx: 10; ry: 10; filter: url(#shadow); }
        .ft-card-founder { fill: #fff9e6; stroke: #a0842e; stroke-width: 3; rx: 12; ry: 12; filter: url(#shadow); }
        .ft-card-hero { fill: #e8f4fd; stroke: #1a6fa8; stroke-width: 3; rx: 12; ry: 12; filter: url(#shadow); }
        .ft-card-ancestor { fill: #f5ede0; stroke: #8b6914; stroke-width: 2.5; rx: 12; ry: 12; filter: url(#shadow); }
        .ft-card-memorial { fill: #f0ebe3; stroke: #a09070; stroke-width: 2; rx: 10; ry: 10; filter: url(#shadow); opacity: 0.85; }
        .ft-name { font-family: 'David Libre', serif; font-size: 15px; font-weight: 700; fill: #3a2a1a; text-anchor: middle; }
        .ft-detail { font-family: 'Heebo', sans-serif; font-size: 11px; fill: #8a7a5a; text-anchor: middle; }
        .ft-emoji { font-size: 22px; text-anchor: middle; }
        .ft-heart { font-size: 16px; fill: #c4a265; text-anchor: middle; }
        .ft-child-name { font-family: 'David Libre', serif; font-size: 13px; font-weight: 700; fill: #3a2a1a; text-anchor: middle; }
        .ft-trait { font-family: 'Heebo', sans-serif; font-size: 10px; fill: #8a7a5a; text-anchor: middle; font-style: italic; }
        .ft-sub { font-family: 'Heebo', sans-serif; font-size: 9px; fill: #b09a6a; text-anchor: middle; }
        .ft-section { font-family: 'David Libre', serif; font-size: 12px; fill: #8b6914; text-anchor: middle; font-weight: 700; }

        /* Clickable nodes */
        .clickable { cursor: pointer; }
        .clickable:hover rect { filter: url(#glow); }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: linear-gradient(145deg, #fffdf5, #f5efe6);
            border: 3px solid #c4a265; border-radius: 16px;
            padding: 35px; max-width: 500px; width: 90%;
            position: relative; box-shadow: 0 10px 40px rgba(90,58,26,0.25);
            max-height: 80vh; overflow-y: auto;
        }
        .modal-close {
            position: absolute; top: 12px; left: 12px;
            background: none; border: none; font-size: 1.5em;
            cursor: pointer; color: #8a7a5a; line-height: 1;
        }
        .modal-close:hover { color: #3a2a1a; }
        .modal-emoji { font-size: 3em; text-align: center; margin-bottom: 10px; }
        .modal-name {
            font-family: 'David Libre', serif; font-size: 1.8em;
            font-weight: 700; color: #5a3a1a; text-align: center; margin-bottom: 5px;
        }
        .modal-role {
            text-align: center; color: #8a7a5a; font-size: 0.95em; margin-bottom: 20px;
        }
        .modal-divider {
            height: 2px; background: #c4a265; margin: 15px 0; opacity: 0.5;
        }
        .modal-section {
            font-family: 'David Libre', serif; font-size: 1.1em;
            color: #5a3a1a; font-weight: 700; margin: 15px 0 8px;
        }
        .modal-text { color: #3a2a1a; line-height: 1.7; font-size: 0.95em; }
        .modal-text p { margin-bottom: 8px; }
        .modal-detail { color: #8a7a5a; font-size: 0.85em; }

        .stats { display: flex; justify-content: center; gap: 40px; margin-top: 50px; flex-wrap: wrap; }
        .stat { text-align: center; }
        .stat .number { font-family: 'David Libre', serif; font-size: 2.5em; font-weight: 700; color: #5a3a1a; }
        .stat .label { font-size: 0.85em; color: #8a7a5a; }
        .footer { text-align: center; margin-top: 50px; padding-top: 20px; border-top: 1px solid #c4a265; color: #b09a6a; font-size: 0.8em; }

        /* Print / PDF styles */
        @media print {
            body { background: white; }
            body::before { display: none; }
            .toolbar { display: none; }
            .modal-overlay { display: none !important; }
            .container { padding: 20px; max-width: 100%; }
            .tree-svg-container { overflow: visible; }
            svg.family-tree { min-width: auto; width: 100%; }
            .page-break { page-break-before: always; }
            .print-stories { display: block !important; }
            .print-stories .story-card {
                border: 2px solid #c4a265; border-radius: 12px;
                padding: 20px; margin-bottom: 20px;
                page-break-inside: avoid;
                background: #fffdf5;
            }
            .print-stories .story-emoji { font-size: 2em; }
            .print-stories .story-name {
                font-family: 'David Libre', serif; font-size: 1.5em;
                font-weight: 700; color: #5a3a1a; margin: 5px 0;
            }
            .print-stories .story-role { color: #8a7a5a; margin-bottom: 10px; }
            .print-stories .story-text { line-height: 1.8; }
        }

        .print-stories { display: none; }

        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            svg.family-tree { min-width: 1100px; }
            .tree-svg-container { justify-content: flex-start; }
        }
    </style>
</head>
<body>

            <h1>שושלת מזרחי - לבנברג</h1>

    // ──────────────────────────────────────────────────────────────────────────
    // Layout engine
    // ──────────────────────────────────────────────────────────────────────────

    /** Width of a group's footprint on its row (couple = 2 cards + heart, single = 1 card) */
    function groupWidth(grp) {
        return grp.p2 ? W + HEART_W + W : W;
    }

    /** Midpoint X of a group's footprint given its left edge */
    function groupMidX(leftX, grp) {
        return leftX + groupWidth(grp) / 2;
    }

    /**
     * layoutTree()
     * Returns { positions: { id -> { leftX, midX, w } }, rowXCursor: [x per row] }
     *
     * Algorithm (bottom-up then center parents):
     * 1. Assign leaf nodes slots left-to-right at their generation row.
     * 2. For each parent group, center it over the span of its children.
     * 3. If a parent would overlap an already-placed group on its row, shift right.
     * 4. Root (gen 0) is placed last, centered over its children.
     */
    function layoutTree() {
        const pos = {};          // id -> { leftX, midX, w }
        const rowCursor = [0, 0, 0, 0];  // next available x per generation
        // pad from the left
        const LEFT_MARGIN = 30;
        rowCursor[0] = LEFT_MARGIN;
        rowCursor[1] = LEFT_MARGIN;
        rowCursor[2] = LEFT_MARGIN;
        rowCursor[3] = LEFT_MARGIN;

        // Process groups in bottom-up order (gen 3, then 2, then 1, then 0)
        // We do a DFS from root, but collect results bottom-up.

        function placeGroup(id) {
            const grp = TREE_DATA[id];
            if (!grp) return;
            const gw = groupWidth(grp);
            const genIdx = grp.gen;  // 0=root(gen0), 1=gen1, 2=gen2, 3=gen3 leaves
            const rowIdx = genIdx;

            if (grp.children && grp.children.length > 0) {
                // Place children first
                grp.children.forEach(cid => placeGroup(cid));

                // Find span of children
                const childMids = grp.children.map(cid => pos[cid].midX);
                const spanLeft  = Math.min(...grp.children.map(cid => pos[cid].leftX));
                const spanRight = Math.max(...grp.children.map(cid => pos[cid].leftX + pos[cid].w));
                const spanMid   = (spanLeft + spanRight) / 2;

                // Ideal left edge for this parent centered over children
                let idealLeft = spanMid - gw / 2;

                // Must not overlap cursor on this row
                let leftX = Math.max(idealLeft, rowCursor[rowIdx]);
                rowCursor[rowIdx] = leftX + gw + GAP;

                const midX = leftX + gw / 2;
                pos[id] = { leftX, midX, w: gw };
            } else {
                // Leaf: assign next slot
                const leftX = rowCursor[rowIdx];
                rowCursor[rowIdx] = leftX + gw + GAP;
                pos[id] = { leftX, midX: leftX + gw / 2, w: gw };
            }
        }

        // Place the four gen-1 subtrees, then the root
        ['sara_group1', 'sara_group2', 'soli_group', 'avi_vardit'].forEach(id => placeGroup(id));

        // Place root centered over all gen-1 groups
        const gen1groups = ['sara_group1', 'sara_group2', 'soli_group', 'avi_vardit'];
        const spanLeft = Math.min(...gen1groups.map(id => pos[id].leftX));
        const spanRight = Math.max(...gen1groups.map(id => pos[id].leftX + pos[id].w));
        const spanMid   = (spanLeft + spanRight) / 2;
        const rootGw = groupWidth(TREE_DATA.root);
        const rootLeft = spanMid - rootGw / 2;
        pos['root'] = { leftX: rootLeft, midX: rootLeft + rootGw / 2, w: rootGw };

        return pos;
    }

        return el;
    }

    function makeCard(svg, x, y, w, h, styleClass, emoji, nameText, detailText, extraText, personKey) {
        const cx = x + w / 2;
        const g = svgEl('g', { class: 'clickable', onclick: `showPerson('${personKey}')` });
        const rect = svgEl('rect', {
            class: styleClass,
            x, y, width: w, height: h, rx: 10, ry: 10,
            filter: 'url(#shadow)'
        });
        g.appendChild(rect);

        if (extraText) {
            // 4-line layout: emoji, name, detail, extra
            g.appendChild(svgEl('text', { class: 'ft-emoji', x: cx, y: y + 20 }, emoji));
            g.appendChild(svgEl('text', { class: 'ft-child-name', x: cx, y: y + 38 }, nameText));
            g.appendChild(svgEl('text', { class: 'ft-detail',     x: cx, y: y + 53 }, detailText));
            g.appendChild(svgEl('text', { class: 'ft-trait',      x: cx, y: y + 68 }, extraText));
        } else {
            // 3-line layout: emoji, name, detail
            g.appendChild(svgEl('text', { class: 'ft-emoji',  x: cx, y: y + 22 }, emoji));
            g.appendChild(svgEl('text', { class: 'ft-name',   x: cx, y: y + 42 }, nameText));
            g.appendChild(svgEl('text', { class: 'ft-detail', x: cx, y: y + 58 }, detailText));
        }
        svg.appendChild(g);
        return g;
    }

    function makeLine(svg, x1, y1, x2, y2) {
        svg.appendChild(svgEl('line', { class: 'ft-line', x1, y1, x2, y2 }));
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Main render function
    // ──────────────────────────────────────────────────────────────────────────

    function renderMainTree() {
        const svg = document.getElementById('main-tree');

        const pos = layoutTree();

        // Figure out total width for viewBox
        const allRights = Object.values(pos).map(p => p.leftX + p.w);
        const totalWidth = Math.max(...allRights) + 50;
        const totalHeight = ROW_Y[3] + HC + 60;
        svg.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);
        svg.setAttribute('width', totalWidth);
        svg.setAttribute('height', totalHeight);

        // Generation row heights
        const rowH = [H, H, H, HC];

        // Helper: render a single group (couple or single)
        function renderGroup(id) {
            const grp = TREE_DATA[id];
            if (!grp) return;
            const { leftX } = pos[id];
            const genIdx = grp.gen;
            const y = ROW_Y[genIdx];
            const h = rowH[Math.min(genIdx, rowH.length - 1)];

            if (grp.p2) {
                // Couple
                const x1 = leftX;
                const x2 = leftX + W + HEART_W;
                const heartX = leftX + W + HEART_W / 2;
                const heartY = y + h / 2 + 6;

                makeCard(svg, x1, y, W, h, grp.style1 || 'ft-card',
                    grp.emoji1, grp.label1, grp.detail1, grp.extra1 || null, grp.p1);
                svg.appendChild(svgEl('text', { class: 'ft-heart', x: heartX, y: heartY }, '💕'));
                makeCard(svg, x2, y, W, h, grp.style2 || 'ft-card',
                    grp.emoji2, grp.label2, grp.detail2, grp.extra2 || null, grp.p2);
            } else {
                // Single
                makeCard(svg, leftX, y, W, h, grp.style1 || 'ft-card',
                    grp.emoji1, grp.label1, grp.detail1, grp.extra1 || null, grp.p1);
            }

            // (Connectors drawn in a separate pass below)
        }

        // Draw all groups in order: root first (gen0), then gen1, gen2, gen3
        // We draw connectors before the cards so cards render on top
        // Pass 1: connectors (render first so they appear behind cards)
        const allIds = ['root', 'sara_group1','sara_group2','soli_group','avi_vardit',
                        'oded_single','amit_alex','perach_yoel','anat_eli','ofer_single','ravid_single',
                        'yehuda_ilana','tamir_meital','sapir_single',
                        'yuli_leaf','kfir_leaf','arieh_leaf',
                        'tohar_leaf','gaya_leaf','noa_leaf',
                        'roni_leaf','moshe_leaf','rotem_leaf',
                        'avior_leaf','nitai_leaf','arbel_leaf','ella_leaf'];

        // Draw connectors first
        allIds.forEach(id => {
            const grp = TREE_DATA[id];
            if (!grp || !grp.children || grp.children.length === 0) return;
            const { midX } = pos[id];
            const genIdx = grp.gen;
            const h = rowH[Math.min(genIdx, rowH.length - 1)];
            const y = ROW_Y[genIdx];
            const parentBottomY = y + h;

            const childIds = grp.children;
            const validChildIds = childIds.filter(cid => pos[cid]);
            if (!validChildIds.length) return;

            const childMidXs = validChildIds.map(cid => pos[cid].midX);
            const childGen = TREE_DATA[validChildIds[0]].gen;
            const childTopY = ROW_Y[childGen];
            const barY = parentBottomY + Math.floor((childTopY - parentBottomY) / 2);

            makeLine(svg, midX, parentBottomY, midX, barY);
            if (childMidXs.length > 1) {
                const barLeft  = Math.min(...childMidXs);
                const barRight = Math.max(...childMidXs);
                makeLine(svg, barLeft, barY, barRight, barY);
            } else {
                makeLine(svg, midX, barY, childMidXs[0], barY);
            }
            childMidXs.forEach(cx => makeLine(svg, cx, barY, cx, childTopY));
        });

        // Draw cards on top
        allIds.forEach(id => renderGroup(id));

        // Decorative footer text
        const footY = ROW_Y[3] + HC + 30;
        const footX = totalWidth / 2;
        const footEl = svgEl('text', {
            class: 'ft-detail',
            x: footX, y: footY,
            'text-anchor': 'middle',
            'font-style': 'italic'
        }, 'משפחת מזרחי-לבנברג - שורשים חזקים וענפים פורחים 🌳');
        svg.appendChild(footEl);
    }

    window.addEventListener('load', function() {
        renderMainTree();
    });
    </script>

    <script>
    // ===== ZOOM & PAN for each tree container =====
    const treeState = {};

    function initTree(containerId) {
        const container = document.getElementById(containerId);
        if (!container || treeState[containerId]) return;
        const svg = container.querySelector('svg');
        const labelId = containerId === 'container1' ? 'zoom1-label' : 'zoom2-label';
        treeState[containerId] = { scale: 1, tx: 0, ty: 0, dragging: false, startX: 0, startY: 0, svg, labelId };
        applyTransform(containerId);

        // Mouse events
        container.addEventListener('mousedown', e => {
            if (e.target.closest('button')) return;
            const s = treeState[containerId];
            s.dragging = true; s.startX = e.clientX - s.tx; s.startY = e.clientY - s.ty;
            container.classList.add('panning');
        });
        window.addEventListener('mousemove', e => {
            const s = treeState[containerId];
            if (!s || !s.dragging) return;
            s.tx = e.clientX - s.startX; s.ty = e.clientY - s.startY;
            applyTransform(containerId);
        });
        window.addEventListener('mouseup', () => {
            if (treeState[containerId]) treeState[containerId].dragging = false;
            const container = document.getElementById(containerId);
            if (container) container.classList.remove('panning');
        });

        // Wheel zoom
        container.addEventListener('wheel', e => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.1 : 0.9;
            const s = treeState[containerId];
            const rect = container.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            s.tx = mx - factor * (mx - s.tx);
            s.ty = my - factor * (my - s.ty);
            s.scale = Math.min(4, Math.max(0.2, s.scale * factor));
            applyTransform(containerId);
        }, { passive: false });

        // Touch events
        let lastDist = 0;
        container.addEventListener('touchstart', e => {
            const s = treeState[containerId];
            if (e.touches.length === 1) {
                s.dragging = true; s.startX = e.touches[0].clientX - s.tx; s.startY = e.touches[0].clientY - s.ty;
            } else if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }, { passive: true });
        container.addEventListener('touchmove', e => {
            e.preventDefault();
            const s = treeState[containerId];
            if (e.touches.length === 1 && s.dragging) {
                s.tx = e.touches[0].clientX - s.startX; s.ty = e.touches[0].clientY - s.startY;
                applyTransform(containerId);
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const factor = dist / lastDist; lastDist = dist;
                s.scale = Math.min(4, Math.max(0.2, s.scale * factor));
                applyTransform(containerId);
            }
        }, { passive: false });
        container.addEventListener('touchend', () => { if (treeState[containerId]) treeState[containerId].dragging = false; });
    }

    function applyTransform(containerId) {
        const s = treeState[containerId];
        s.svg.style.transform = `translate(${s.tx}px, ${s.ty}px) scale(${s.scale})`;
        s.svg.style.transformOrigin = '0 0';
        const label = document.getElementById(s.labelId);
        if (label) label.textContent = Math.round(s.scale * 100) + '%';
    }

    function zoom(containerId, factor) {
        const s = treeState[containerId];
        const container = document.getElementById(containerId);
        const rect = container.getBoundingClientRect();
        const cx = rect.width / 2; const cy = rect.height / 2;
        s.tx = cx - factor * (cx - s.tx);
        s.ty = cy - factor * (cy - s.ty);
        s.scale = Math.min(4, Math.max(0.2, s.scale * factor));
        applyTransform(containerId);
    }

    function resetZoom(containerId) {
        const s = treeState[containerId];
        s.scale = 1; s.tx = 0; s.ty = 0;
        applyTransform(containerId);
    }

    // Init both trees on load
    window.addEventListener('load', () => {
        initTree('container1');
        initTree('container2');
    });
    </script>
</body>
