<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משפחת מזרחי-לבנברג - עץ יוחסין</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=David+Libre:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Heebo', sans-serif;
            background: #f5efe6;
            min-height: 100vh;
            color: #3a2a1a;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(139,90,43,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139,90,43,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(139,90,43,0.05) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }
        .container {
            position: relative; z-index: 1;
            max-width: 1300px; margin: 0 auto; padding: 40px 20px 60px;
        }
        .header {
            text-align: center; margin-bottom: 40px;
            padding-bottom: 25px; border-bottom: 2px solid #c4a265;
        }
        .header .ornament { font-size: 1.5em; color: #c4a265; }
        .header h1 {
            font-family: 'David Libre', serif; font-size: 3em;
            font-weight: 700; color: #5a3a1a; margin: 10px 0;
        }
        .header .subtitle { font-size: 1.1em; color: #8a7a5a; font-weight: 300; }
        .header .established { margin-top: 8px; font-size: 0.9em; color: #c4a265; font-style: italic; }
        
        .toolbar {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .toolbar button {
            font-family: 'Heebo', sans-serif; font-size: 0.95em;
            padding: 10px 24px; border: 2px solid #c4a265; border-radius: 8px;
            background: linear-gradient(135deg, #fff9e6, #f5e6c0);
            color: #5a3a1a; cursor: pointer; font-weight: 500;
            transition: all 0.2s;
        }
        .toolbar button:hover {
            background: linear-gradient(135deg, #f5e6c0, #e8d5a0);
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(90,58,26,0.15);
        }

        .anniversary-banner {
            text-align: center; margin-bottom: 35px; padding: 15px 25px;
            background: linear-gradient(135deg, #fff9e6, #f5e6c0);
            border: 2px solid #c4a265; border-radius: 10px;
            font-family: 'David Libre', serif; color: #5a3a1a; font-size: 1.1em;
        }
        .tree-svg-container {
            width: 100%; display: flex; justify-content: center; overflow: hidden;
            position: relative; cursor: grab; user-select: none;
            border: 1px solid #e8d5a0; border-radius: 10px; background: rgba(255,253,245,0.5);
        }
        .tree-svg-container:active { cursor: grabbing; }
        .tree-svg-container.panning { cursor: grabbing; }
        svg.family-tree { max-width: 100%; touch-action: none; }
        .zoom-controls {
            position: absolute; bottom: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 10;
        }
        .zoom-btn {
            width: 36px; height: 36px; border-radius: 8px;
            background: linear-gradient(135deg, #fff9e6, #f5e6c0);
            border: 2px solid #c4a265; color: #5a3a1a;
            font-size: 1.3em; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(90,58,26,0.15); font-weight: bold;
        }
        .zoom-btn:hover { background: #f5e6c0; transform: scale(1.05); }
        .zoom-label {
            font-size: 0.7em; text-align: center; color: #8a7a5a; font-family: Heebo, sans-serif;
        }

        .ft-line { stroke: #c4a265; stroke-width: 2; fill: none; }
        .ft-card { fill: #fffdf5; stroke: #c4a265; stroke-width: 2; rx: 10; ry: 10; filter: url(#shadow); }
        .ft-card-founder { fill: #fff9e6; stroke: #a0842e; stroke-width: 3; rx: 12; ry: 12; filter: url(#shadow); }
        .ft-card-hero { fill: #e8f4fd; stroke: #1a6fa8; stroke-width: 3; rx: 12; ry: 12; filter: url(#shadow); }
        .ft-card-ancestor { fill: #f5ede0; stroke: #8b6914; stroke-width: 2.5; rx: 12; ry: 12; filter: url(#shadow); }
        .ft-card-memorial { fill: #f0ebe3; stroke: #a09070; stroke-width: 2; rx: 10; ry: 10; filter: url(#shadow); opacity: 0.85; }
        .ft-name { font-family: 'David Libre', serif; font-size: 15px; font-weight: 700; fill: #3a2a1a; text-anchor: middle; }
        .ft-detail { font-family: 'Heebo', sans-serif; font-size: 11px; fill: #8a7a5a; text-anchor: middle; }
        .ft-emoji { font-size: 22px; text-anchor: middle; }
        .ft-heart { font-size: 16px; fill: #c4a265; text-anchor: middle; }
        .ft-child-name { font-family: 'David Libre', serif; font-size: 13px; font-weight: 700; fill: #3a2a1a; text-anchor: middle; }
        .ft-trait { font-family: 'Heebo', sans-serif; font-size: 10px; fill: #8a7a5a; text-anchor: middle; font-style: italic; }
        .ft-sub { font-family: 'Heebo', sans-serif; font-size: 9px; fill: #b09a6a; text-anchor: middle; }
        .ft-section { font-family: 'David Libre', serif; font-size: 12px; fill: #8b6914; text-anchor: middle; font-weight: 700; }

        /* Clickable nodes */
        .clickable { cursor: pointer; }
        .clickable:hover rect { filter: url(#glow); }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: linear-gradient(145deg, #fffdf5, #f5efe6);
            border: 3px solid #c4a265; border-radius: 16px;
            padding: 35px; max-width: 500px; width: 90%;
            position: relative; box-shadow: 0 10px 40px rgba(90,58,26,0.25);
            max-height: 80vh; overflow-y: auto;
        }
        .modal-close {
            position: absolute; top: 12px; left: 12px;
            background: none; border: none; font-size: 1.5em;
            cursor: pointer; color: #8a7a5a; line-height: 1;
        }
        .modal-close:hover { color: #3a2a1a; }
        .modal-emoji { font-size: 3em; text-align: center; margin-bottom: 10px; }
        .modal-name {
            font-family: 'David Libre', serif; font-size: 1.8em;
            font-weight: 700; color: #5a3a1a; text-align: center; margin-bottom: 5px;
        }
        .modal-role {
            text-align: center; color: #8a7a5a; font-size: 0.95em; margin-bottom: 20px;
        }
        .modal-divider {
            height: 2px; background: #c4a265; margin: 15px 0; opacity: 0.5;
        }
        .modal-section {
            font-family: 'David Libre', serif; font-size: 1.1em;
            color: #5a3a1a; font-weight: 700; margin: 15px 0 8px;
        }
        .modal-text { color: #3a2a1a; line-height: 1.7; font-size: 0.95em; }
        .modal-text p { margin-bottom: 8px; }
        .modal-detail { color: #8a7a5a; font-size: 0.85em; }

        .stats { display: flex; justify-content: center; gap: 40px; margin-top: 50px; flex-wrap: wrap; }
        .stat { text-align: center; }
        .stat .number { font-family: 'David Libre', serif; font-size: 2.5em; font-weight: 700; color: #5a3a1a; }
        .stat .label { font-size: 0.85em; color: #8a7a5a; }
        .footer { text-align: center; margin-top: 50px; padding-top: 20px; border-top: 1px solid #c4a265; color: #b09a6a; font-size: 0.8em; }

        /* Print / PDF styles */
        @media print {
            body { background: white; }
            body::before { display: none; }
            .toolbar { display: none; }
            .modal-overlay { display: none !important; }
            .container { padding: 20px; max-width: 100%; }
            .tree-svg-container { overflow: visible; }
            svg.family-tree { min-width: auto; width: 100%; }
            .page-break { page-break-before: always; }
            .print-stories { display: block !important; }
            .print-stories .story-card {
                border: 2px solid #c4a265; border-radius: 12px;
                padding: 20px; margin-bottom: 20px;
                page-break-inside: avoid;
                background: #fffdf5;
            }
            .print-stories .story-emoji { font-size: 2em; }
            .print-stories .story-name {
                font-family: 'David Libre', serif; font-size: 1.5em;
                font-weight: 700; color: #5a3a1a; margin: 5px 0;
            }
            .print-stories .story-role { color: #8a7a5a; margin-bottom: 10px; }
            .print-stories .story-text { line-height: 1.8; }
        }

        .print-stories { display: none; }

        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            svg.family-tree { min-width: 1100px; }
            .tree-svg-container { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="ornament">✾ ✾ ✾</div>
            <h1>שושלת מזרחי - לבנברג</h1>
            <div class="subtitle">עץ יוחסין</div>
            <div class="established">LEWENBERG - נוסדה בשנת 1986</div>
        </div>

        <div class="toolbar">
            <button onclick="window.print()">🖨️ הדפס / שמור PDF</button>
            <button onclick="showAllStories()">📖 כל הסיפורים</button>
        </div>

        <div class="tree-svg-container" id="container1">
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoom('container1', 1.2)">+</button>
                <span class="zoom-label" id="zoom1-label">100%</span>
                <button class="zoom-btn" onclick="zoom('container1', 0.8)">−</button>
                <button class="zoom-btn" onclick="resetZoom('container1')" title="איפוס">⌂</button>
            </div>
            <svg class="family-tree" viewBox="-1350 0 2850 1300" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
                        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3a2a1a" flood-opacity="0.1"/>
                    </filter>
                    <filter id="glow" x="-10%" y="-10%" width="125%" height="125%">
                        <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#c4a265" flood-opacity="0.5"/>
                    </filter>
                </defs>

                <!-- ===== ROW 0: GREAT-GRANDPARENTS (y=30) ===== -->

                <!-- FAR LEFT: Yaakov + Sol Aboulafiah (Rivka's parents) -->
                <text class="ft-section" x="230" y="18">משפחת אבולעפיה</text>
                <g class="clickable" onclick="showPerson('yaakov_aboulafiah')">
                    <rect class="ft-card-ancestor" x="100" y="30" width="130" height="70"/>
                    <text class="ft-emoji" x="165" y="50">👨</text>
                    <text class="ft-name" x="165" y="68">יעקוב</text>
                    <text class="ft-detail" x="165" y="82">אבולעפיה</text>
                    <text class="ft-detail" x="165" y="95">1908-1971</text>
                </g>
                <text class="ft-heart" x="242" y="68">💕</text>
                <g class="clickable" onclick="showPerson('sol_aboulafiah')">
                    <rect class="ft-card-ancestor" x="253" y="30" width="130" height="70"/>
                    <text class="ft-emoji" x="318" y="50">👩</text>
                    <text class="ft-name" x="318" y="68">סול</text>
                    <text class="ft-detail" x="318" y="82">לבית כהן</text>
                </g>

                <!-- Line from Aboulafiah grandparents down to Rivka -->
                <line class="ft-line" x1="240" y1="100" x2="240" y2="130"/>
                <line class="ft-line" x1="240" y1="130" x2="303" y2="130"/>
                <line class="ft-line" x1="303" y1="130" x2="303" y2="160"/>

                <!-- LEFT: Yaakov + Chaya Sara Levenberg -->
                <text class="ft-section" x="690" y="18">משפחת לבנברג</text>
                <g class="clickable" onclick="showPerson('yaakov')">
                    <rect class="ft-card-ancestor" x="555" y="30" width="130" height="70"/>
                    <text class="ft-emoji" x="620" y="56">👨</text>
                    <text class="ft-name" x="620" y="74">יעקוב</text>
                    <text class="ft-detail" x="620" y="90">לבנברג ז"ל</text>
                </g>
                <text class="ft-heart" x="700" y="68">💕</text>
                <g class="clickable" onclick="showPerson('chaya_sara')">
                    <rect class="ft-card-ancestor" x="715" y="30" width="140" height="70"/>
                    <text class="ft-emoji" x="785" y="56">👩</text>
                    <text class="ft-name" x="785" y="74">חיה שרה</text>
                    <text class="ft-detail" x="785" y="90">לבית שרגא ז"ל</text>
                </g>

                <!-- RIGHT: Uri Moshe + Dina Lishuar -->
                <text class="ft-section" x="1060" y="18">משפחת לישואר</text>
                <g class="clickable" onclick="showPerson('uri_moshe')">
                    <rect class="ft-card-ancestor" x="930" y="30" width="130" height="70"/>
                    <text class="ft-emoji" x="995" y="56">👨</text>
                    <text class="ft-name" x="995" y="74">אורי משה</text>
                    <text class="ft-detail" x="995" y="90">לישואר</text>
                </g>
                <text class="ft-heart" x="1075" y="68">💕</text>
                <g class="clickable" onclick="showPerson('dina')">
                    <rect class="ft-card-ancestor" x="1090" y="30" width="130" height="70"/>
                    <text class="ft-emoji" x="1155" y="56">👩</text>
                    <text class="ft-name" x="1155" y="74">דינה</text>
                    <text class="ft-detail" x="1155" y="90">לבית לוינשטין</text>
                </g>

                <!-- Lines from Levenberg grandparents to their 3 children only -->
                <!-- Center of Yaakov+Chaya Sara couple = midpoint between 620 and 785 = ~700 -->
                <line class="ft-line" x1="700" y1="100" x2="700" y2="130"/>
                <!-- Horizontal bar only spanning the 3 Levenberg children: Chana Tova(515), Moshe Yosef(690), Nirit(1040) -->
                <line class="ft-line" x1="515" y1="130" x2="1040" y2="130"/>
                <line class="ft-line" x1="515" y1="130" x2="515" y2="160"/>
                <line class="ft-line" x1="690" y1="130" x2="690" y2="160"/>
                <line class="ft-line" x1="1040" y1="130" x2="1040" y2="160"/>

                <!-- Line from Lishuar grandparents ONLY to Yafa (their sole child) - separate branch -->
                <!-- Center of Uri Moshe+Dina couple = midpoint between 995 and 1155 = ~1075 -->
                <!-- Yafa is at x=860 in row 1 -->
                <!-- Draw line downward from Lishuar couple, then across to Yafa separately, not touching Levenberg bar -->
                <line class="ft-line" x1="1075" y1="100" x2="1075" y2="145"/>
                <line class="ft-line" x1="860" y1="145" x2="1075" y2="145"/>
                <line class="ft-line" x1="860" y1="145" x2="860" y2="160"/>

                <!-- ===== ROW 1: PARENTS GENERATION (y=160, h=70) ===== -->

                <!-- LEFT: Avi's parents - יהודה מזרחי ז"ל + רבקה -->
                <g class="clickable" onclick="showPerson('yehuda_mizrahi_sr')">
                    <rect class="ft-card-memorial" x="80" y="160" width="130" height="70"/>
                    <text class="ft-emoji" x="145" y="186">🕯️</text>
                    <text class="ft-name" x="145" y="204">יהודה מזרחי</text>
                    <text class="ft-detail" x="145" y="220">ז"ל</text>
                </g>
                <text class="ft-heart" x="222" y="198">💕</text>
                <g class="clickable" onclick="showPerson('rivka_mizrahi')">
                    <rect class="ft-card-memorial" x="233" y="160" width="140" height="70"/>
                    <text class="ft-emoji" x="303" y="186">🕯️</text>
                    <text class="ft-name" x="303" y="204">רבקה (בקי)</text>
                    <text class="ft-detail" x="303" y="220">לבית אבולעפיה | ז״ל</text>
                </g>

                <!-- Chana Tova z"l -->
                <g class="clickable" onclick="showPerson('chana_tova')">
                    <rect class="ft-card-memorial" x="450" y="160" width="130" height="70"/>
                    <text class="ft-emoji" x="515" y="185">🕯️</text>
                    <text class="ft-name" x="515" y="203">חנה טובה</text>
                    <text class="ft-detail" x="515" y="219">ז"ל - הבכורה</text>
                </g>

                <!-- Moshe Yosef -->
                <g class="clickable" onclick="showPerson('moshe_yosef')">
                    <rect class="ft-card-founder" x="620" y="160" width="140" height="70"/>
                    <text class="ft-emoji" x="690" y="185">👨</text>
                    <text class="ft-name" x="690" y="203">משה יוסף</text>
                    <text class="ft-detail" x="690" y="219">לבנברג</text>
                </g>
                <text class="ft-heart" x="775" y="198">💕</text>
                <!-- Yafa -->
                <g class="clickable" onclick="showPerson('yafa')">
                    <rect class="ft-card-founder" x="790" y="160" width="140" height="70"/>
                    <text class="ft-emoji" x="860" y="185">👩</text>
                    <text class="ft-name" x="860" y="203">יפה</text>
                    <text class="ft-detail" x="860" y="219">לבית לישואר</text>
                </g>

                <!-- Nirit Yehudit -->
                <g class="clickable" onclick="showPerson('nirit')">
                    <rect class="ft-card" x="970" y="160" width="140" height="70"/>
                    <text class="ft-emoji" x="1040" y="185">👩</text>
                    <text class="ft-name" x="1040" y="203">נורית יהודית</text>
                    <text class="ft-detail" x="1040" y="219">בן-דוד (לבנברג)</text>
                </g>
                <text class="ft-heart" x="1125" y="198">💕</text>
                <!-- Yisrael Tzvi -->
                <g class="clickable" onclick="showPerson('yisrael_tzvi')">
                    <rect class="ft-card-memorial" x="1140" y="160" width="140" height="70"/>
                    <text class="ft-emoji" x="1210" y="185">🕯️</text>
                    <text class="ft-name" x="1210" y="203">ישראל צבי</text>
                    <text class="ft-detail" x="1210" y="219">בן-דוד ז"ל</text>
                </g>

                <!-- ===== LINES FROM ROW 1 TO ROW 2 ===== -->

                <!-- From מזרחי parents down to אבי + sisters bar (new couple layout) -->
                <line class="ft-line" x1="222" y1="230" x2="222" y2="280"/>
                <line class="ft-line" x1="-1040" y1="280" x2="222" y2="280"/>
                <!-- שרה connector: bar drops to x=-690, then fans to two couple groups -->
                <line class="ft-line" x1="-1040" y1="280" x2="-1040" y2="300"/>
                <line class="ft-line" x1="-1190" y1="300" x2="-945" y2="300"/>
                <line class="ft-line" x1="-1190" y1="300" x2="-1190" y2="340"/>
                <line class="ft-line" x1="-945" y1="300" x2="-945" y2="340"/>
                <!-- סולי connector -->
                <line class="ft-line" x1="-545" y1="280" x2="-545" y2="340"/>
                <!-- אבי connector -->
                <line class="ft-line" x1="222" y1="280" x2="222" y2="340"/>

                <!-- From משה יוסף+יפה (center=775) down to daughters bar -->
                <line class="ft-line" x1="775" y1="230" x2="775" y2="300"/>
                <line class="ft-line" x1="400" y1="300" x2="775" y2="300"/>
                <!-- down to ורדית -->
                <line class="ft-line" x1="400" y1="300" x2="400" y2="340"/>
                <!-- down to טובה צ'רנה -->
                <line class="ft-line" x1="560" y1="300" x2="560" y2="340"/>
                <!-- down to תמר פנינה -->
                <line class="ft-line" x1="710" y1="300" x2="710" y2="340"/>

                <!-- From נורית+ישראל צבי (center=1125) down to children bar -->
                <line class="ft-line" x1="1125" y1="230" x2="1125" y2="300"/>
                <line class="ft-line" x1="940" y1="300" x2="1215" y2="300"/>
                <!-- down to יצחק -->
                <line class="ft-line" x1="940" y1="300" x2="940" y2="340"/>
                <!-- down to יפה -->
                <line class="ft-line" x1="1075" y1="300" x2="1075" y2="340"/>
                <!-- down to שלומית -->
                <line class="ft-line" x1="1215" y1="300" x2="1215" y2="340"/>

                <!-- ===== ROW 2: ALL GRANDCHILDREN (y=340, h=65) ===== -->

                <!-- ===== COUPLE GROUP 1: ישי קמחי + שרה מזרחי (parents of עודד) ===== -->
                <!-- ישי קמחי card: x=-980, center x=-915 -->
                <g class="clickable" onclick="showPerson('yishai_kamchi')">
                    <rect class="ft-card" x="-1330" y="340" width="130" height="70" rx="10" ry="10"/>
                    <text class="ft-emoji" x="-1265" y="365">👨</text>
                    <text class="ft-name" x="-1265" y="382">ישי קמחי</text>
                    <text class="ft-detail" x="-1265" y="397">בן זוג שרה</text>
                </g>
                <text class="ft-heart" x="-1192" y="378">💕</text>
                <!-- שרה מזרחי card (1st instance): x=-830, center x=-765 -->
                <g class="clickable" onclick="showPerson('sara_mizrahi')">
                    <rect class="ft-card" x="-1180" y="340" width="130" height="70" rx="10" ry="10"/>
                    <text class="ft-emoji" x="-1115" y="365">👩</text>
                    <text class="ft-name" x="-1115" y="382">שרה מזרחי</text>
                    <text class="ft-detail" x="-1115" y="397">אחות אבי</text>

    <script>
    // ===== ZOOM & PAN for each tree container =====
    const treeState = {};

    function initTree(containerId) {
        const container = document.getElementById(containerId);
        if (!container || treeState[containerId]) return;
        const svg = container.querySelector('svg');
        const labelId = containerId === 'container1' ? 'zoom1-label' : 'zoom2-label';
        treeState[containerId] = { scale: 1, tx: 0, ty: 0, dragging: false, startX: 0, startY: 0, svg, labelId };
        applyTransform(containerId);

        // Mouse events
        container.addEventListener('mousedown', e => {
            if (e.target.closest('button')) return;
            const s = treeState[containerId];
            s.dragging = true; s.startX = e.clientX - s.tx; s.startY = e.clientY - s.ty;
            container.classList.add('panning');
        });
        window.addEventListener('mousemove', e => {
            const s = treeState[containerId];
            if (!s || !s.dragging) return;
            s.tx = e.clientX - s.startX; s.ty = e.clientY - s.startY;
            applyTransform(containerId);
        });
        window.addEventListener('mouseup', () => {
            if (treeState[containerId]) treeState[containerId].dragging = false;
            container.classList.remove('panning');
        });

        // Wheel zoom
        container.addEventListener('wheel', e => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.1 : 0.9;
            const s = treeState[containerId];
            const rect = container.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            s.tx = mx - factor * (mx - s.tx);
            s.ty = my - factor * (my - s.ty);
            s.scale = Math.min(4, Math.max(0.2, s.scale * factor));
            applyTransform(containerId);
        }, { passive: false });

        // Touch events
        let lastDist = 0;
        container.addEventListener('touchstart', e => {
            const s = treeState[containerId];
            if (e.touches.length === 1) {
                s.dragging = true; s.startX = e.touches[0].clientX - s.tx; s.startY = e.touches[0].clientY - s.ty;
            } else if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }, { passive: true });
        container.addEventListener('touchmove', e => {
            e.preventDefault();
            const s = treeState[containerId];
            if (e.touches.length === 1 && s.dragging) {
                s.tx = e.touches[0].clientX - s.startX; s.ty = e.touches[0].clientY - s.startY;
                applyTransform(containerId);
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const factor = dist / lastDist; lastDist = dist;
                s.scale = Math.min(4, Math.max(0.2, s.scale * factor));
                applyTransform(containerId);
            }
        }, { passive: false });
        container.addEventListener('touchend', () => { if (treeState[containerId]) treeState[containerId].dragging = false; });
    }

    function applyTransform(containerId) {
        const s = treeState[containerId];
        s.svg.style.transform = `translate(${s.tx}px, ${s.ty}px) scale(${s.scale})`;
        s.svg.style.transformOrigin = '0 0';
        const label = document.getElementById(s.labelId);
        if (label) label.textContent = Math.round(s.scale * 100) + '%';
    }

    function zoom(containerId, factor) {
        const s = treeState[containerId];
        const container = document.getElementById(containerId);
        const rect = container.getBoundingClientRect();
        const cx = rect.width / 2; const cy = rect.height / 2;
        s.tx = cx - factor * (cx - s.tx);
        s.ty = cy - factor * (cy - s.ty);
        s.scale = Math.min(4, Math.max(0.2, s.scale * factor));
        applyTransform(containerId);
    }

    function resetZoom(containerId) {
        const s = treeState[containerId];
        s.scale = 1; s.tx = 0; s.ty = 0;
        applyTransform(containerId);
    }

    // Init both trees on load
    window.addEventListener('load', () => {
        initTree('container1');
        initTree('container2');
    });
    </script>
</body>
</html>
