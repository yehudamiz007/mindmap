<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Yehuda's Mind Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;pointer-events:auto;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .3s,opacity .3s,box-shadow .3s;user-select:none;opacity:0;transform:scale(0)}
.node.visible{opacity:1;transform:scale(1)}
.node:hover{transform:scale(1.1)!important;z-index:10}
.center-node{width:140px;height:140px;background:radial-gradient(circle,#1e293b,#0f172a);border:3px solid #64748b;font-size:15px;font-weight:700;color:#e2e8f0;box-shadow:0 0 30px rgba(100,116,139,.4);z-index:5;pointer-events:auto}
.cat-node{width:100px;height:100px;font-size:11px;font-weight:600;color:#fff;z-index:4}
.sub-node{width:76px;height:76px;font-size:9.5px;font-weight:600;color:#fff;z-index:3}
.leaf-node{width:58px;height:58px;font-size:8px;font-weight:500;color:#fff;z-index:2}
.node-label{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2;padding:4px}
.node-emoji{font-size:1.4em}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.cat-node{animation:glow 3s ease-in-out infinite}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="lines"></canvas>
<div id="ui"></div>
<script>
const DATA = [
  {id:'arch',emoji:'🏗️',label:'Chief\nArchitect',color:'#3b82f6',subs:[
    {label:'System\nDesign',leaves:['Microservices','Event-Driven','CQRS','Hexagonal']},
    {label:'Cloud &\nInfra',leaves:['Kubernetes','Serverless','Terraform','Multi-Cloud']},
    {label:'Security\nArch',leaves:['Zero Trust','OAuth2/OIDC','Threat\nModeling','Encryption']},
    {label:'API\nDesign',leaves:['REST/\nOpenAPI','GraphQL','gRPC','AsyncAPI']},
    {label:'DevOps',leaves:['CI/CD','GitOps','Feature\nFlags','Platform\nEng']},
    {label:'LLMs\n& RAG',leaves:['Model\nSelection','Fine-tuning','Vector DBs','Embeddings']},
    {label:'Agentic\nAI',leaves:['ReAct/\nPlanning','Tool Use','Multi-Agent','Memory\nSystems']}
  ]},
  {id:'llm',emoji:'🤖',label:'LLM\nModels',color:'#00c8c8',subs:[
    {label:'Claude\nOpus 4',leaves:['Primary\nModel','200K\nContext','Anthropic\nAPI']},
    {label:'Gemini\n2.0 Flash',leaves:['Fallback','Google API','Fast']},
    {label:'Grok 3',leaves:['xAI','Alternative','200K\nContext']}
  ]},
  {id:'wa',emoji:'💬',label:'WhatsApp',color:'#25d366',subs:[
    {label:'Contacts',leaves:['Yehuda\n(Owner)','Ilana','Sapir','Avi\n(אבא)']},
    {label:'Groups',leaves:['מזרחי\nאימפריה']},
    {label:'Config',leaves:['DM:\nAllowlist','Groups:\nOpen','No Mention\nRequired']}
  ]},
  {id:'husband',emoji:'💑',label:'Husband',color:'#ec4899',subs:[
    {label:'Milestones',leaves:['Wedding\n14.09.2016','Together\n23.10.2010','Birthday\n11.04.1993']},
    {label:'Support',leaves:['WhatsApp\n24/7','Tips &\nReminders','Warm\nWords']}
  ]},
  {id:'parent',emoji:'👨‍👩‍👧‍👦',label:'Parenting',color:'#22c55e',subs:[
    {label:'Avior (6)\n🎨',leaves:['כיתה א׳','Art &\nCreativity','Humor']},
    {label:'Nitai (4)\n⚽',leaves:['גן ילדים','Sports','Charismatic']},
    {label:'Arbel\n(10m) 💙',leaves:['Crawling','Blue Eyes','Baby Care']}
  ]},
  {id:'hebrew',emoji:'🇮🇱',label:'Hebrew',color:'#eab308',subs:[
    {label:'Language',leaves:['Israeli\nSlang','Grammar','Fem/Masc']},
    {label:'Culture',leaves:['Holidays','Traditions','Bilingual']}
  ]},
  {id:'ta',emoji:'📈',label:'Technical\nAnalysis',color:'#a855f7',subs:[
    {label:'Smart\nMoney',leaves:['ICT\nConcepts','Order\nBlocks','Fair Value\nGaps']},
    {label:'Wave\nTheory',leaves:['Elliott\nWave','Wyckoff\nMethod']},
    {label:'Advanced',leaves:['Harmonics','Volume\nProfile','Order\nFlow']}
  ]},
  {id:'sec',emoji:'🛡️',label:'Security\nGate',color:'#ef4444',subs:[
    {label:'Scanning',leaves:['7 Categories','Code\nAnalysis','Prompt\nInjection']},
    {label:'Policy',leaves:['Triple\nConfirm','Boss Only','Full\nLogging']}
  ]},
  {id:'fit',emoji:'💪',label:'Fitness &\nNutrition',color:'#10b981',subs:[
    {label:'Strength',leaves:['Hypertrophy','Progressive\nOverload','PPL/\nUpper-Lower']},
    {label:'Cardio',leaves:['LISS','HIIT','Conditioning']},
    {label:'Nutrition',leaves:['Macros &\nCalories','Meal Plans','Supplements']},
    {label:'Recovery',leaves:['Sleep','Stress','Deload']}
  ]},
  {id:'coffee',emoji:'☕',label:'Coffee\nMaster',color:'#b4783c',subs:[
    {label:'Espresso',leaves:['Grind\nSettings','Dose &\nYield','Extraction']},
    {label:'Milk',leaves:['Steaming','Latte Art','Texturing']},
    {label:'Machine',leaves:['La Marzocco\nMicra','Maintenance','Cleaning']}
  ]}
];

const ui = document.getElementById('ui');
const bgCanvas = document.getElementById('bg');
const lineCanvas = document.getElementById('lines');
const bgCtx = bgCanvas.getContext('2d');
const lineCtx = lineCanvas.getContext('2d');

let W, H, cx, cy, dpr;
let panX = 0, panY = 0, zoom = 1;
let dragging = false, dragStartX, dragStartY, panStartX, panStartY;
let expandedCat = null, expandedSub = null;
let stars = [];
let allNodes = []; // {el, x, y, type}
let lineData = []; // {x1,y1,x2,y2,color,alpha}

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cx = W / 2; cy = H / 2;
  bgCanvas.width = W * dpr; bgCanvas.height = H * dpr;
  bgCanvas.style.width = W + 'px'; bgCanvas.style.height = H + 'px';
  bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lineCanvas.width = W * dpr; lineCanvas.height = H * dpr;
  lineCanvas.style.width = W + 'px'; lineCanvas.style.height = H + 'px';
  lineCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  initStars();
  layout();
}

function initStars() {
  stars = [];
  for (let i = 0; i < 200; i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,a:Math.random(),s:Math.random()*.005+.002});
}

function drawBg() {
  bgCtx.fillStyle = '#0a0a1a';
  bgCtx.fillRect(0, 0, W, H);
  for (const s of stars) {
    s.a += s.s;
    const a = .3 + Math.abs(Math.sin(s.a)) * .7;
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(255,255,255,${a})`;
    bgCtx.fill();
  }
}

function drawLines() {
  lineCtx.clearRect(0, 0, W, H);
  for (const l of lineData) {
    const sx = (l.x1 + panX) * zoom + cx * (1 - zoom);
    const sy = (l.y1 + panY) * zoom + cy * (1 - zoom);
    const ex = (l.x2 + panX) * zoom + cx * (1 - zoom);
    const ey = (l.y2 + panY) * zoom + cy * (1 - zoom);
    lineCtx.beginPath();
    lineCtx.moveTo(sx, sy);
    lineCtx.lineTo(ex, ey);
    lineCtx.strokeStyle = l.color;
    lineCtx.globalAlpha = l.alpha;
    lineCtx.lineWidth = l.width || 1.5;
    lineCtx.stroke();
    lineCtx.globalAlpha = 1;
  }
}

function screenPos(x, y) {
  return {
    x: (x + panX) * zoom + cx * (1 - zoom),
    y: (y + panY) * zoom + cy * (1 - zoom)
  };
}

function posNode(el, x, y) {
  const p = screenPos(x, y);
  const w = el.offsetWidth || 0;
  const h = el.offsetHeight || 0;
  el.style.left = (p.x - w / 2) + 'px';
  el.style.top = (p.y - h / 2) + 'px';
  el.style.transform = `scale(${zoom})`;
}

function makeEl(cls, html, color) {
  const el = document.createElement('div');
  el.className = 'node ' + cls;
  el.innerHTML = `<div class="node-label">${html}</div>`;
  if (color) {
    if (cls === 'cat-node') {
      el.style.background = `radial-gradient(circle, ${color}dd, ${color}88)`;
      el.style.border = `2px solid ${color}`;
      el.style.boxShadow = `0 0 20px ${color}66`;
    } else if (cls === 'sub-node') {
      el.style.background = `radial-gradient(circle, ${color}bb, ${color}66)`;
      el.style.border = `1.5px solid ${color}aa`;
      el.style.boxShadow = `0 0 12px ${color}44`;
    } else if (cls === 'leaf-node') {
      el.style.background = `radial-gradient(circle, ${color}99, ${color}44)`;
      el.style.border = `1px solid ${color}77`;
      el.style.boxShadow = `0 0 8px ${color}33`;
    }
  }
  ui.appendChild(el);
  return el;
}

let centerEl;
let catEls = [];
let subEls = [];
let leafEls = [];

function clearSubs() {
  for (const s of subEls) { s.el.classList.remove('visible'); setTimeout(() => s.el.remove(), 300); }
  subEls = [];
  clearLeaves();
  expandedSub = null;
}

function clearLeaves() {
  for (const l of leafEls) { l.el.classList.remove('visible'); setTimeout(() => l.el.remove(), 300); }
  leafEls = [];
}

function build() {
  // Center
  centerEl = makeEl('center-node', '<span class="node-emoji">🧠</span>8 Skills');
  centerEl.classList.add('visible');

  // Categories
  const n = DATA.length;
  DATA.forEach((cat, i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const r = Math.min(W, H) * 0.3;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    const el = makeEl('cat-node', `<span class="node-emoji">${cat.emoji}</span>${cat.label.replace(/\n/g,'<br>')}`, cat.color);
    el.dataset.idx = i;
    el.addEventListener('click', (e) => { e.stopPropagation(); toggleCat(i); });
    setTimeout(() => el.classList.add('visible'), 50 + i * 40);
    catEls.push({el, x, y, cat, angle: a, radius: r});
  });

  layout();
}

function toggleCat(idx) {
  if (expandedCat === idx) {
    clearSubs();
    expandedCat = null;
    lineData = lineData.filter(l => l.level !== 2 && l.level !== 3);
    drawLines();
    return;
  }
  clearSubs();
  expandedCat = idx;
  expandedSub = null;
  lineData = lineData.filter(l => l.level !== 2 && l.level !== 3);

  const cat = DATA[idx];
  const ce = catEls[idx];
  const sn = cat.subs.length;
  const baseAngle = ce.angle;
  const spread = Math.min(Math.PI * 0.6, sn * 0.3);
  const subR = 110;

  cat.subs.forEach((sub, j) => {
    const sa = baseAngle - spread / 2 + (sn === 1 ? 0 : (j / (sn - 1)) * spread);
    const sx = ce.x + Math.cos(sa) * subR;
    const sy = ce.y + Math.sin(sa) * subR;
    const el = makeEl('sub-node', sub.label.replace(/\n/g,'<br>'), cat.color);
    el.dataset.catIdx = idx;
    el.dataset.subIdx = j;
    el.addEventListener('click', (e) => { e.stopPropagation(); toggleSub(idx, j); });
    setTimeout(() => el.classList.add('visible'), 30 + j * 30);
    subEls.push({el, x: sx, y: sy, sub, angle: sa, parentX: ce.x, parentY: ce.y, catIdx: idx});
    lineData.push({x1: ce.x, y1: ce.y, x2: sx, y2: sy, color: cat.color + '88', alpha: 0.6, width: 1.2, level: 2});
  });

  layout();
}

function toggleSub(catIdx, subIdx) {
  if (expandedSub !== null && expandedSub.cat === catIdx && expandedSub.sub === subIdx) {
    clearLeaves();
    expandedSub = null;
    lineData = lineData.filter(l => l.level !== 3);
    drawLines();
    return;
  }
  clearLeaves();
  lineData = lineData.filter(l => l.level !== 3);
  expandedSub = {cat: catIdx, sub: subIdx};

  const cat = DATA[catIdx];
  const sub = cat.subs[subIdx];
  const se = subEls.find(s => s.catIdx === catIdx && s.sub === sub);
  if (!se) return;

  const ln = sub.leaves.length;
  const baseAngle = se.angle;
  const spread = Math.min(Math.PI * 0.5, ln * 0.35);
  const leafR = 80;

  sub.leaves.forEach((leaf, k) => {
    const la = baseAngle - spread / 2 + (ln === 1 ? 0 : (k / (ln - 1)) * spread);
    const lx = se.x + Math.cos(la) * leafR;
    const ly = se.y + Math.sin(la) * leafR;
    const el = makeEl('leaf-node', leaf.replace(/\n/g,'<br>'), cat.color);
    setTimeout(() => el.classList.add('visible'), 20 + k * 25);
    leafEls.push({el, x: lx, y: ly});
    lineData.push({x1: se.x, y1: se.y, x2: lx, y2: ly, color: cat.color + '66', alpha: 0.4, width: 1, level: 3});
  });

  layout();
}

function layout() {
  if (centerEl) posNode(centerEl, cx, cy);
  for (const c of catEls) posNode(c.el, c.x, c.y);
  for (const s of subEls) posNode(s.el, s.x, s.y);
  for (const l of leafEls) posNode(l.el, l.x, l.y);

  // Update center lines
  lineData = lineData.filter(l => l.level);
  for (const c of catEls) {
    lineData.push({x1: cx, y1: cy, x2: c.x, y2: c.y, color: c.cat.color + '55', alpha: 0.35, width: 1.5, level: 1});
  }

  drawLines();
}

// Pan & Zoom
document.addEventListener('mousedown', e => {
  dragging = true; dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  panX = panStartX + (e.clientX - dragStartX) / zoom;
  panY = panStartY + (e.clientY - dragStartY) / zoom;
  layout();
});
document.addEventListener('mouseup', () => dragging = false);
document.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.3, Math.min(3, zoom - e.deltaY * 0.001));
  layout();
}, {passive: false});

// Touch
let touches0 = null, initDist = 0, initZoom = 1;
document.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true;
    dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
    panStartX = panX; panStartY = panY;
  } else if (e.touches.length === 2) {
    dragging = false;
    initDist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
    initZoom = zoom;
  }
});
document.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    panX = panStartX + (e.touches[0].clientX - dragStartX) / zoom;
    panY = panStartY + (e.touches[0].clientY - dragStartY) / zoom;
    layout();
  } else if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
    zoom = Math.max(0.3, Math.min(3, initZoom * (d / initDist)));
    layout();
  }
}, {passive: false});
document.addEventListener('touchend', () => dragging = false);

function animate() {
  drawBg();
  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
build();
animate();
</script>
</body>
</html>
