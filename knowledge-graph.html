<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yehuda's Knowledge Graph</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 20px;background:#1a1d2e;border-bottom:1px solid #2d3748;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:17px;font-weight:600;color:#7c3aed}
header span{font-size:12px;color:#718096}
.toolbar{padding:8px 16px;background:#161827;border-bottom:1px solid #2d3748;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.btn{padding:5px 12px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-weight:500;background:#2d3748;color:#e2e8f0}
.btn:hover{background:#374151}
select{background:#2d3748;border:1px solid #4a5568;color:#e2e8f0;padding:4px 8px;border-radius:5px;font-size:12px}
.main{display:flex;flex:1;overflow:hidden}
#canvas-wrap{flex:1;position:relative;overflow:hidden}
svg{width:100%;height:100%}
.sidebar{width:280px;background:#1a1d2e;border-left:1px solid #2d3748;overflow-y:auto;flex-shrink:0}
.sb-section{padding:14px 14px 0}
.sb-title{font-size:11px;color:#718096;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat-card{background:#0f1117;border-radius:7px;padding:9px 11px;border:1px solid #2d3748}
.stat-card .v{font-size:20px;font-weight:700;color:#7c3aed}
.stat-card .l{font-size:11px;color:#718096;margin-top:1px}
.legend-item{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12px;cursor:pointer}
.legend-item:hover{color:#a78bfa}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.node-info{padding:14px;display:none}
.node-info.show{display:block}
.ni-title{font-size:14px;font-weight:600;margin-bottom:10px;color:#a78bfa}
.ni-row{display:flex;gap:6px;margin-bottom:5px;font-size:12px}
.ni-key{color:#718096;min-width:70px;flex-shrink:0}
.ni-val{color:#e2e8f0;word-break:break-word}
.ni-rels{margin-top:10px}
.ni-rels h4{font-size:11px;color:#718096;text-transform:uppercase;margin-bottom:6px}
.rel-item{background:#0f1117;border:1px solid #2d3748;border-radius:5px;padding:5px 8px;margin-bottom:4px;font-size:11px}
.rel-type{color:#f59e0b;font-weight:600}
.rel-target{color:#60a5fa}
.link{stroke:#334155;stroke-width:1.5;stroke-opacity:.6}
.link:hover{stroke:#7c3aed;stroke-opacity:1}
.node circle{stroke-width:1.5;cursor:pointer;transition:r .15s}
.node circle:hover{r:10}
.node text{font-size:10px;fill:#cbd5e1;pointer-events:none;text-anchor:middle;dominant-baseline:hanging}
.node.selected circle{stroke:#fff!important;stroke-width:2.5}
</style>
</head>
<body>
<header>
  <h1>🕸️ Yehuda's Knowledge Graph</h1>
  <span id="hdr-stats">Loading...</span>
</header>
<div class="toolbar">
  <button class="btn" onclick="resetZoom()">🔍 Fit</button>
  <button class="btn" onclick="toggleSim()">⚡ <span id="sim-label">Pause</span></button>
  <select id="filter" onchange="applyFilter()">
    <option value="">All types</option>
    <option value="Person">Person</option>
    <option value="Document">Document (Skills)</option>
    <option value="Organization">Organization (Categories)</option>
    <option value="Action">Action (Requests)</option>
    <option value="Note">Note (Knowledge)</option>
  </select>
  <button class="btn" onclick="applyFilter()">Apply</button>
</div>
<div class="main">
  <div id="canvas-wrap"><svg id="svg"></svg></div>
  <div class="sidebar">
    <div class="sb-section">
      <div class="sb-title">Stats</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="v" id="s-nodes">0</div><div class="l">Entities</div></div>
        <div class="stat-card"><div class="v" id="s-links">0</div><div class="l">Relations</div></div>
        <div class="stat-card"><div class="v" id="s-types">5</div><div class="l">Types</div></div>
        <div class="stat-card"><div class="v" id="s-cats">7</div><div class="l">Categories</div></div>
      </div>
      <div class="sb-title">Types</div>
      <div id="legend"></div>
    </div>
    <div class="node-info" id="node-info">
      <div class="ni-title" id="ni-title"></div>
      <div id="ni-props"></div>
      <div class="ni-rels"><h4>Relations</h4><div id="ni-rels"></div></div>
    </div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

const nodes = [

  {id:'person_arbel',type:'Person',label:'Arbel (9mo)',props:{notes:'תינוקת'}},
  // Skills
  {id:'skill_ai_architect',type:'Document',label:'ai-chief-architect',props:{desc:'System design, ADRs'}},
  {id:'skill_husband',type:'Document',label:'husband',props:{desc:'Relationship support'}},

  {id:'skill_technical_analysis',type:'Document',label:'technical-analysis',props:{desc:'Elliott Wave, Wyckoff'}},
  {id:'skill_market_news',type:'Document',label:'market-news-sentiment',props:{desc:'News sentiment, Grok'}},
  {id:'skill_analyst_targets',type:'Document',label:'analyst-price-targets',props:{desc:'Wall Street targets'}},

  {id:'cat_lifestyle',type:'Organization',label:'Lifestyle',props:{type:'category'}},
  {id:'cat_devtools',type:'Organization',label:'Dev Tools',props:{type:'category'}},

  {id:'req_001',type:'Action',label:'ניתוח טכני NVDA',props:{date:'2026-03'}},

  {id:'req_005',type:'Action',label:'Databricks pipeline',props:{date:'2026-03'}},

  {id:'req_013',type:'Action',label:'פעילויות לאביאור',props:{date:'2026-03'}},
  {id:'req_014',type:'Action',label:'תרגום לעברית',props:{date:'2026-03'}},
  {id:'req_015',type:'Action',label:'צור data-engineer',props:{date:'2026-03-25'}},
  {id:'req_016',type:'Action',label:'סרוק סקיל GitHub',props:{date:'2026-03-25'}},
  {id:'req_017',type:'Action',label:'התקן bot-review',props:{date:'2026-03-25'}},
  {id:'req_018',type:'Action',label:'התקן ontology',props:{date:'2026-03-25'}},
  {id:'req_019',type:'Action',label:'dbt incremental model',props:{date:'2026-03'}},
  {id:'req_020',type:'Action',label:'GitHub PR status',props:{date:'2026-03'}},
  // Notes
  {id:'info_ta_1',type:'Note',label:'Elliott Wave 5+3',props:{skill:'technical-analysis'}},
  {id:'info_ta_2',type:'Note',label:'Wyckoff Acc/Dist',props:{skill:'technical-analysis'}},
  {id:'info_db_1',type:'Note',label:'catalog.schema.table',props:{skill:'databricks'}},
  {id:'info_db_2',type:'Note',label:'Delta ACID + time travel',props:{skill:'databricks'}},
  {id:'info_de_1',type:'Note',label:'Bronze→Silver→Gold',props:{skill:'data-engineer'}},
  {id:'info_de_2',type:'Note',label:'dbt staging→marts',props:{skill:'data-engineer'}},
  {id:'info_arch_1',type:'Note',label:'Microservices/Monolith',props:{skill:'ai-chief-architect'}},
  {id:'info_secure_1',type:'Note',label:'Triple confirmation',props:{skill:'secure-skill-downloader'}},
  {id:'info_ont_1',type:'Note',label:'Person/Task/Project types',props:{skill:'ontology'}},
];

const links = [
  // Family
  {source:'skill_husband',target:'cat_family',rel:'belongs_to'},
  {source:'skill_parenting',target:'cat_family',rel:'belongs_to'},
  {source:'skill_hebrew',target:'cat_family',rel:'belongs_to'},
  // Finance
  {source:'skill_technical_analysis',target:'cat_finance',rel:'belongs_to'},
  {source:'skill_market_news',target:'cat_finance',rel:'belongs_to'},
  {source:'skill_analyst_targets',target:'cat_finance',rel:'belongs_to'},
  // Data
  {source:'skill_databricks',target:'cat_data',rel:'belongs_to'},
  {source:'skill_data_engineer',target:'cat_data',rel:'belongs_to'},
  // Dev
  {source:'skill_nextjs_backend',target:'cat_dev',rel:'belongs_to'},
  {source:'skill_nextjs_frontend',target:'cat_dev',rel:'belongs_to'},
  {source:'skill_ai_architect',target:'cat_dev',rel:'belongs_to'},
  // Security
  {source:'skill_secure_dl',target:'cat_security',rel:'belongs_to'},
  {source:'skill_healthcheck',target:'cat_security',rel:'belongs_to'},
  // Lifestyle
  {source:'skill_coffee',target:'cat_lifestyle',rel:'belongs_to'},
  {source:'skill_fitness',target:'cat_lifestyle',rel:'belongs_to'},
  {source:'skill_weather',target:'cat_lifestyle',rel:'belongs_to'},
  {source:'skill_ecovacs',target:'cat_lifestyle',rel:'belongs_to'},
  // DevTools
  {source:'skill_ontology',target:'cat_devtools',rel:'belongs_to'},
  {source:'skill_skill_creator',target:'cat_devtools',rel:'belongs_to'},
  {source:'skill_gh_issues',target:'cat_devtools',rel:'belongs_to'},
  {source:'skill_github',target:'cat_devtools',rel:'belongs_to'},
  {source:'skill_node_connect',target:'cat_devtools',rel:'belongs_to'},
  {source:'skill_video_frames',target:'cat_devtools',rel:'belongs_to'},
  // Requests → Skills
  {source:'req_001',target:'skill_technical_analysis',rel:'triggered'},
  {source:'req_002',target:'skill_market_news',rel:'triggered'},
  {source:'req_003',target:'skill_analyst_targets',rel:'triggered'},
  {source:'req_004',target:'skill_ai_architect',rel:'triggered'},
  {source:'req_005',target:'skill_databricks',rel:'triggered'},
  {source:'req_006',target:'skill_nextjs_backend',rel:'triggered'},
  {source:'req_007',target:'skill_nextjs_frontend',rel:'triggered'},
  {source:'req_008',target:'skill_ecovacs',rel:'triggered'},
  {source:'req_009',target:'skill_coffee',rel:'triggered'},
  {source:'req_010',target:'skill_fitness',rel:'triggered'},
  {source:'req_011',target:'skill_weather',rel:'triggered'},
  {source:'req_012',target:'skill_husband',rel:'triggered'},
  {source:'req_013',target:'skill_parenting',rel:'triggered'},
  {source:'req_014',target:'skill_hebrew',rel:'triggered'},
  {source:'req_015',target:'skill_skill_creator',rel:'triggered'},
  {source:'req_016',target:'skill_secure_dl',rel:'triggered'},
  {source:'req_017',target:'skill_node_connect',rel:'triggered'},
  {source:'req_018',target:'skill_ontology',rel:'triggered'},
  {source:'req_019',target:'skill_data_engineer',rel:'triggered'},
  {source:'req_020',target:'skill_github',rel:'triggered'},
  // People
  {source:'person_yehuda',target:'person_ilana',rel:'spouse'},
  {source:'person_yehuda',target:'person_avior',rel:'parent_of'},
  {source:'person_yehuda',target:'person_nitai',rel:'parent_of'},
  {source:'person_yehuda',target:'person_arbel',rel:'parent_of'},
  {source:'skill_husband',target:'person_ilana',rel:'supports'},
  {source:'skill_parenting',target:'person_avior',rel:'supports'},
  {source:'skill_parenting',target:'person_nitai',rel:'supports'},
  {source:'skill_parenting',target:'person_arbel',rel:'supports'},
  {source:'person_yehuda',target:'skill_databricks',rel:'owns'},
  {source:'person_yehuda',target:'skill_data_engineer',rel:'owns'},
  {source:'person_yehuda',target:'skill_nextjs_backend',rel:'owns'},
  // Notes
  {source:'info_ta_1',target:'skill_technical_analysis',rel:'knowledge_in'},
  {source:'info_ta_2',target:'skill_technical_analysis',rel:'knowledge_in'},
  {source:'info_db_1',target:'skill_databricks',rel:'knowledge_in'},
  {source:'info_db_2',target:'skill_databricks',rel:'knowledge_in'},
  {source:'info_de_1',target:'skill_data_engineer',rel:'knowledge_in'},
  {source:'info_de_2',target:'skill_data_engineer',rel:'knowledge_in'},
  {source:'info_arch_1',target:'skill_ai_architect',rel:'knowledge_in'},
  {source:'info_secure_1',target:'skill_secure_dl',rel:'knowledge_in'},
  {source:'info_ont_1',target:'skill_ontology',rel:'knowledge_in'},
  // Complements
  {source:'skill_databricks',target:'skill_data_engineer',rel:'complements'},
  {source:'skill_technical_analysis',target:'skill_market_news',rel:'complements'},
  {source:'skill_market_news',target:'skill_analyst_targets',rel:'complements'},
  {source:'skill_gh_issues',target:'skill_github',rel:'uses'},
  {source:'skill_secure_dl',target:'skill_skill_creator',rel:'guards'},
];

// Build adjacency for sidebar
const adj = {};
nodes.forEach(n=>adj[n.id]=[]);
links.forEach(l=>{
  const s=typeof l.source==='object'?l.source.id:l.source;
  const t=typeof l.target==='object'?l.target.id:l.target;
  adj[s]&&adj[s].push({dir:'→',rel:l.rel,other:t});
  adj[t]&&adj[t].push({dir:'←',rel:l.rel,other:s});
});

const nodeMap={};
nodes.forEach(n=>nodeMap[n.id]=n);

// Update stats
document.getElementById('s-nodes').textContent=nodes.length;
document.getElementById('s-links').textContent=links.length;
document.getElementById('hdr-stats').textContent=`${nodes.length} entities · ${links.length} relations`;

// Legend
const types=[...new Set(nodes.map(n=>n.type))];
document.getElementById('legend').innerHTML=types.map(t=>`
  <div class="legend-item" onclick="filterType('${t}')">
    <div class="dot" style="background:${COLORS[t]||'#6b7280'}"></div>
    ${t} <span style="color:#4a5568;font-size:11px;margin-left:auto">${nodes.filter(n=>n.type===t).length}</span>
  </div>`).join('');

// D3
const wrap=document.getElementById('canvas-wrap');
const W=wrap.clientWidth||800, H=wrap.clientHeight||600;
const svg=d3.select('#svg').attr('width',W).attr('height',H);
const g=svg.append('g');

svg.call(d3.zoom().scaleExtent([.1,4]).on('zoom',e=>g.attr('transform',e.transform)));

const sim=d3.forceSimulation(nodes)
  .force('link',d3.forceLink(links).id(d=>d.id).distance(90).strength(0.5))
  .force('charge',d3.forceManyBody().strength(-220))
  .force('center',d3.forceCenter(W/2,H/2))
  .force('collision',d3.forceCollide(20));

const link=g.append('g').selectAll('line').data(links).join('line').attr('class','link');

const defs=svg.append('defs');
defs.append('marker').attr('id','arrow').attr('viewBox','0 -4 8 8').attr('refX',18).attr('refY',0)
  .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
  .append('path').attr('d','M0,-4L8,0L0,4').attr('fill','#4a5568');
link.attr('marker-end','url(#arrow)');

let selectedId=null;
const node=g.append('g').selectAll('g').data(nodes).join('g')
  .attr('class','node')
  .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}))
  .on('click',(e,d)=>showNode(d));

node.append('circle').attr('r',7)
  .attr('fill',d=>COLORS[d.type]||'#6b7280')
  .attr('stroke',d=>COLORS[d.type]||'#6b7280');

node.append('text').attr('dy',13).text(d=>d.label.length>18?d.label.substring(0,16)+'…':d.label);

sim.on('tick',()=>{
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
});

function showNode(d){
  selectedId=d.id;
  node.classed('selected',n=>n.id===d.id);
  document.getElementById('ni-title').textContent=`${d.type}: ${d.label}`;
  document.getElementById('ni-props').innerHTML=Object.entries(d.props||{})
    .map(([k,v])=>`<div class="ni-row"><span class="ni-key">${k}</span><span class="ni-val">${v}</span></div>`).join('');
  const rels=adj[d.id]||[];
  document.getElementById('ni-rels').innerHTML=rels.length
    ?rels.map(r=>`<div class="rel-item"><span class="rel-type">${r.dir} ${r.rel}</span><br><span class="rel-target">${nodeMap[r.other]?.label||r.other}</span></div>`).join('')
    :'<div style="color:#4a5568;font-size:12px">No relations</div>';
  document.getElementById('node-info').classList.add('show');
}

let simRunning=true;
function toggleSim(){
  simRunning=!simRunning;
  simRunning?sim.alphaTarget(.1).restart():sim.stop();
  document.getElementById('sim-label').textContent=simRunning?'Pause':'Resume';
}

function resetZoom(){
  svg.transition().duration(500).call(d3.zoom().transform,d3.zoomIdentity.translate(W/2,H/2).scale(.7));
  sim.alpha(.3).restart();
}

function filterType(t){document.getElementById('filter').value=t;applyFilter();}
function applyFilter(){
  const t=document.getElementById('filter').value;
  node.style('display',d=>(!t||d.type===t)?null:'none');
  link.style('display',l=>{
    const s=l.source.type||'',tar=l.target.type||'';
    return(!t||s===t||tar===t)?null:'none';
  });
}
</script>
</body>
</html>
