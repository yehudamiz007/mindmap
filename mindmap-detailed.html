<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OpenClaw Architecture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .3s,opacity .3s;user-select:none}
.node.hidden{opacity:0;transform:scale(0)!important;pointer-events:none}
.node.visible{opacity:1;transform:scale(1)}
.node:hover{transform:scale(1.1)!important;z-index:10}
.node-circle{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.node-text{margin-top:4px;white-space:nowrap;max-width:120px;overflow:visible;text-overflow:clip;line-height:1.2;text-shadow:0 0 6px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.7);transform-origin:center top}
.center-node .node-circle{width:70px;height:70px;background:radial-gradient(circle,#1e293b,#0f172a);border:3px solid #64748b;box-shadow:0 0 30px rgba(100,116,139,.4)}
.center-node .node-text{font-size:12px;font-weight:700;color:#e2e8f0;white-space:normal;max-width:140px}
.center-node{z-index:5}
.cat-node .node-circle{width:40px;height:40px}
.cat-node .node-text{font-size:13px;font-weight:600;color:#fff}
.cat-node{z-index:4}
.sub-node .node-circle{width:28px;height:28px}
.sub-node .node-text{font-size:11px;font-weight:600;color:#fff}
.sub-node{z-index:3}
.leaf-node .node-circle{width:20px;height:20px}
.leaf-node .node-text{font-size:10px;font-weight:500;color:#fff}
.leaf-node{z-index:2}
.node-emoji{font-size:1.2em}
.cat-node .node-emoji{font-size:1em}
.sub-node .node-emoji,.leaf-node .node-emoji{font-size:0.7em}
.collapse-badge{position:absolute;bottom:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#475569;color:#e2e8f0;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.cat-node .node-circle{animation:glow 3s ease-in-out infinite}
#panel{position:fixed;top:0;right:-340px;width:340px;height:100%;background:rgba(15,23,42,.95);border-left:1px solid #334155;backdrop-filter:blur(12px);z-index:50;transition:right .3s ease;overflow-y:auto;pointer-events:auto}
#panel.open{right:0}
#panel-close{position:absolute;top:12px;right:12px;background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px}
#panel-close:hover{color:#e2e8f0;background:rgba(255,255,255,.1)}
#panel-header{padding:24px 20px 16px;border-bottom:1px solid #1e293b}
#panel-emoji{font-size:36px;margin-bottom:8px}
#panel-title{font-size:18px;font-weight:700;color:#e2e8f0;margin-bottom:4px}
#panel-level{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px}
#panel-body{padding:16px 20px}
#panel-desc{color:#cbd5e1;font-size:13px;line-height:1.6;margin-bottom:16px}
#panel-children-title{color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.panel-child{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:4px;cursor:pointer;transition:background .2s}
.panel-child:hover{background:rgba(255,255,255,.06)}
.panel-child-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.panel-child-name{color:#e2e8f0;font-size:13px}
#panel-path{padding:0 20px 16px}
#panel-path span{color:#64748b;font-size:11px}
#panel-path a{color:#94a3b8;font-size:11px;cursor:pointer;text-decoration:none}
#panel-path a:hover{color:#e2e8f0}
.panel-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
</style>
</head>

const byId={};
const children={};
DATA.forEach(d=>{const o={id:d[0],parent:d[1],level:d[2],emoji:d[3],label:d[4],color:d[5],wx:0,wy:0};byId[o.id]=o;if(o.parent){(children[o.parent]=children[o.parent]||[]).push(o)}});

// Collapse tracking - empty = all expanded
const collapsed=new Set();

function hasChildren(id){return children[id]&&children[id].length>0}

function isVisible(id){
  // Walk up ancestors; if any ancestor is collapsed, this node is hidden
  let cur=byId[id];
  while(cur.parent){
    if(collapsed.has(cur.parent))return false;
    cur=byId[cur.parent];
  }
  return true;
}

function layout(){
  const center=byId["center"];
  center.wx=0;center.wy=0;
  const cats=children["center"]||[];
  const catCount=cats.length;
  cats.forEach((cat,i)=>{
    const a=(2*Math.PI*i/catCount)-Math.PI/2;
    cat.wx=Math.cos(a)*350;
    cat.wy=Math.sin(a)*350;
    const subs=children[cat.id]||[];
    const catAngle=a;
    const minGap=0.25;
    const subSpread=Math.max(subs.length*minGap,Math.PI*0.5);
    const subRadius=200+subs.length*15;
    subs.forEach((sub,j)=>{
      const sa=catAngle-subSpread/2+subSpread*(subs.length===1?0.5:j/(subs.length-1));
      sub.wx=cat.wx+Math.cos(sa)*subRadius;
      sub.wy=cat.wy+Math.sin(sa)*subRadius;
      const leaves=children[sub.id]||[];
      const subAngle=Math.atan2(sub.wy-cat.wy,sub.wx-cat.wx);
      const leafMinGap=0.22;
      const leafSpread=Math.max(leaves.length*leafMinGap,Math.PI*0.4);
      const leafRadius=120+leaves.length*12;
      leaves.forEach((leaf,k)=>{
        const la=subAngle-leafSpread/2+leafSpread*(leaves.length===1?0.5:k/(leaves.length-1));
        leaf.wx=sub.wx+Math.cos(la)*leafRadius;
        leaf.wy=sub.wy+Math.sin(la)*leafRadius;
      });
    });
  });
  const allNodes=DATA.map(d=>byId[d[0]]);
  for(let iter=0;iter<80;iter++){
    let moved=false;
    for(let i=0;i<allNodes.length;i++){
      for(let j=i+1;j<allNodes.length;j++){
        const a=allNodes[i],b=allNodes[j];
        const dx=b.wx-a.wx,dy=b.wy-a.wy;
        const dist=Math.sqrt(dx*dx+dy*dy);
        const minDist=[60,50,40,35];
        const req=minDist[a.level]+minDist[b.level];
        if(dist<req&&dist>0){
          const push=(req-dist)/2*0.5;
          const nx=dx/dist,ny=dy/dist;
          if(a.id!=="center"){a.wx-=nx*push;a.wy-=ny*push;}
          if(b.id!=="center"){b.wx+=nx*push;b.wy+=ny*push;}
          moved=true;
        }
      }
    }
    if(!moved)break;
  }
}
layout();

const bgC=document.getElementById("bg");
const lnC=document.getElementById("lines");
const bgCtx=bgC.getContext("2d");
const lnCtx=lnC.getContext("2d");

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  bgC.width=w;bgC.height=h;
  lnC.width=w;lnC.height=h;
}
window.addEventListener("resize",resize);
resize();

var TILE=2000;
var starTile=Array.from({length:80},function(){return{x:Math.random()*TILE,y:Math.random()*TILE,r:Math.random()*0.6+0.2,b:Math.random()}});
function drawStars(t){
  bgCtx.clearRect(0,0,bgC.width,bgC.height);
  var cx=bgC.width/2,cy=bgC.height/2;
  var parallax=0.3;
  var offX=camX*parallax,offY=camY*parallax;
  var left=-cx/(zoom*parallax)+offX;
  var right=cx/(zoom*parallax)+offX;
  var top2=-cy/(zoom*parallax)+offY;
  var bottom=cy/(zoom*parallax)+offY;
  var tileXmin=Math.floor(left/TILE);
  var tileXmax=Math.floor(right/TILE);
  var tileYmin=Math.floor(top2/TILE);
  var tileYmax=Math.floor(bottom/TILE);
  for(var tx=tileXmin;tx<=tileXmax;tx++){
    for(var ty=tileYmin;ty<=tileYmax;ty++){
      for(var i=0;i<starTile.length;i++){
        var s=starTile[i];
        var wx=s.x+tx*TILE;
        var wy=s.y+ty*TILE;
        var sx=cx+(wx-offX)*zoom*parallax;
        var sy=cy+(wy-offY)*zoom*parallax;
        if(sx<-5||sx>bgC.width+5||sy<-5||sy>bgC.height+5)continue;
        var a=0.4+0.6*Math.sin(t*0.001+s.b*6.28);
        bgCtx.beginPath();bgCtx.arc(sx,sy,s.r,0,6.28);
        bgCtx.fillStyle="rgba(255,255,255,"+a+")";bgCtx.fill();
      }
    }
  }
}

    circle.style.boxShadow=`0 0 8px ${o.color}22`;
  }
  if(o.emoji) circle.innerHTML=`<span class="node-emoji">${o.emoji}</span>`;
  // Collapse badge
  if(hasChildren(o.id)){
    const badge=document.createElement("div");
    badge.className="collapse-badge";
    badge.textContent="+";
    badge.style.display="none";
    circle.appendChild(badge);
    badgeEls[o.id]=badge;
  }
  el.appendChild(circle);
  const text=document.createElement("div");
  text.className="node-text";
  text.textContent=o.label;
  el.appendChild(text);
  el.addEventListener("click",(e)=>{
    e.stopPropagation();
    if(dragMoved)return;
    // Toggle collapse if has children
    if(hasChildren(o.id)){
      if(collapsed.has(o.id)){collapsed.delete(o.id)}else{collapsed.add(o.id)}
      updateBadges();
    }
    openPanel(o.id);
  });
  ui.appendChild(el);
  nodeEls[o.id]=el;
  setTimeout(()=>el.classList.add("visible"),100+i*25);
});

function updateBadges(){
  for(const id in badgeEls){
    badgeEls[id].style.display=collapsed.has(id)?"flex":"none";
  }
}

function drawLines(){
  const cx=lnC.width/2,cy=lnC.height/2;
  lnCtx.clearRect(0,0,lnC.width,lnC.height);
  DATA.forEach(d=>{
    const o=byId[d[0]];
    if(!o.parent)return;
    if(!isVisible(o.id))return;
    const p=byId[o.parent];
    const x1=cx+(p.wx-camX)*zoom;
    const y1=cy+(p.wy-camY)*zoom;
    const x2=cx+(o.wx-camX)*zoom;
    const y2=cy+(o.wy-camY)*zoom;
    const grad=lnCtx.createLinearGradient(x1,y1,x2,y2);
    grad.addColorStop(0,p.color+"88");
    grad.addColorStop(1,o.color+"44");
    lnCtx.beginPath();lnCtx.moveTo(x1,y1);lnCtx.lineTo(x2,y2);
    lnCtx.strokeStyle=grad;
    lnCtx.lineWidth=o.level===1?2:o.level===2?1.5:1;
    lnCtx.stroke();
  });
}

function updatePositions(){
  const cx=lnC.width/2,cy=lnC.height/2;
  const halfSizes=[35,20,14,10];
  DATA.forEach(d=>{
    const o=byId[d[0]];
    const el=nodeEls[o.id];
    const vis=isVisible(o.id);
    if(!vis){
      el.classList.add("hidden");
      el.classList.remove("visible");
      return;
    }
    el.classList.remove("hidden");
    if(!el.classList.contains("visible"))el.classList.add("visible");
    const hs=halfSizes[o.level];
    const sx=cx+(o.wx-camX)*zoom-hs;
    const sy=cy+(o.wy-camY)*zoom-hs;
    el.style.left=sx+"px";
    el.style.top=sy+"px";
    const textEl=el.querySelector('.node-text');
    if(textEl){
      const compensate=zoom<0.3?1.8:zoom<0.45?1.4:zoom<0.6?1.15:1;
      textEl.style.transform=`scale(${compensate})`;
    }
  });
}

let dragging=false,lastX,lastY,dragMoved=false;
document.addEventListener("pointerdown",e=>{dragging=true;dragMoved=false;lastX=e.clientX;lastY=e.clientY});
document.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  if(Math.abs(dx)>3||Math.abs(dy)>3)dragMoved=true;
  camX-=dx/zoom;camY-=dy/zoom;
  lastX=e.clientX;lastY=e.clientY;
});
document.addEventListener("pointerup",(e)=>{dragging=false;if(!dragMoved&&!e.target.closest('.node,.panel-child,#panel'))panel.classList.remove("open");});
document.addEventListener("wheel",e=>{
  e.preventDefault();
  const f=e.deltaY>0?0.9:1.1;
  zoom=Math.max(0.1,Math.min(3,zoom*f));
},{passive:false});

const LEVELS=["Core","Category","Component","Detail"];

const panel=document.getElementById("panel");
const panelClose=document.getElementById("panel-close");
const panelEmoji=document.getElementById("panel-emoji");
const panelTitle=document.getElementById("panel-title");
const panelLevel=document.getElementById("panel-level");
const panelPath=document.getElementById("panel-path");
const panelDesc=document.getElementById("panel-desc");
const panelChildrenTitle=document.getElementById("panel-children-title");
const panelChildrenEl=document.getElementById("panel-children");

function openPanel(id){
  const o=byId[id];
  if(!o)return;
  panelEmoji.textContent=o.emoji||"";
  panelTitle.textContent=o.label;
  panelLevel.innerHTML=`<span class="panel-dot" style="background:${o.color}"></span>${LEVELS[o.level]}`;
  const path=[];
  let cur=o;
  while(cur){path.unshift(cur);cur=cur.parent?byId[cur.parent]:null;}
  panelPath.innerHTML=path.map((p,i)=>
    i<path.length-1?`<a onclick="openPanel('${p.id}')">${p.emoji||""} ${p.label}</a>`:
    `<span>${p.emoji||""} ${p.label}</span>`
  ).join(' <span style="color:#475569"> › </span> ');
  panelDesc.textContent=DESC[id]||"No description available.";
  const kids=children[id]||[];
  if(kids.length>0){
    panelChildrenTitle.textContent=o.level===0?"Categories":o.level===1?"Components":"Children";
    panelChildrenEl.innerHTML=kids.map(k=>
      `<div class="panel-child" onclick="openPanel('${k.id}')">
        <div class="panel-child-dot" style="background:${k.color}"></div>
        <div class="panel-child-name">${k.emoji?k.emoji+" ":""}${k.label}</div>
      </div>`
    ).join("");
  } else {
    panelChildrenTitle.textContent="";
    panelChildrenEl.innerHTML="";
  }
  panel.classList.add("open");
}
panelClose.addEventListener("click",()=>panel.classList.remove("open"));

function frame(t){
  drawStars(t);
  drawLines();
  updatePositions();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
