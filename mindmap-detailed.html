<meta charset="UTF-8">

<title>OpenClaw Architecture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .3s,opacity .3s,box-shadow .3s;user-select:none;opacity:0;transform:scale(0)}
.node.visible{opacity:1;transform:scale(1)}
.node:hover{transform:scale(1.1)!important;z-index:10}
.node-circle{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.node-text{margin-top:4px;white-space:nowrap;max-width:120px;overflow:visible;text-overflow:clip;line-height:1.2;text-shadow:0 0 6px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.7);transform-origin:center top}
.center-node .node-circle{width:50px;height:50px;background:radial-gradient(circle,#1e293b,#0f172a);border:3px solid #64748b;box-shadow:0 0 30px rgba(100,116,139,.4)}
.center-node .node-text{font-size:14px;font-weight:700;color:#e2e8f0}
.center-node{z-index:5}
.cat-node .node-circle{width:40px;height:40px}
.cat-node .node-text{font-size:13px;font-weight:600;color:#fff}
.cat-node{z-index:4}
.sub-node .node-circle{width:28px;height:28px}
.sub-node .node-text{font-size:11px;font-weight:600;color:#fff}
.sub-node{z-index:3}
.leaf-node .node-circle{width:20px;height:20px}
.leaf-node .node-text{font-size:10px;font-weight:500;color:#fff}
.leaf-node{z-index:2}
.node-emoji{font-size:1.2em}
.cat-node .node-emoji{font-size:1em}
.sub-node .node-emoji,.leaf-node .node-emoji{font-size:0.7em}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.cat-node .node-circle{animation:glow 3s ease-in-out infinite}
</style>
</head>

// Build lookup
const byId={};
const children={};
DATA.forEach(d=>{const o={id:d[0],parent:d[1],level:d[2],emoji:d[3],label:d[4],color:d[5],wx:0,wy:0};byId[o.id]=o;if(o.parent){(children[o.parent]=children[o.parent]||[]).push(o)}});

// Layout
function layout(){
  const center=byId["center"];
  center.wx=0;center.wy=0;
  const cats=children["center"]||[];
  const catCount=cats.length;
  cats.forEach((cat,i)=>{
    const a=(2*Math.PI*i/catCount)-Math.PI/2;
    cat.wx=Math.cos(a)*280;
    cat.wy=Math.sin(a)*280;
    const subs=children[cat.id]||[];
    // angle sector for this category: spread subs within a wedge pointing outward
    const catAngle=a;
    const subSpread=Math.min(Math.PI*0.6, Math.PI*0.4+subs.length*0.12);
    subs.forEach((sub,j)=>{
      const sa=catAngle-subSpread/2+subSpread*(subs.length===1?0.5:j/(subs.length-1));
      sub.wx=cat.wx+Math.cos(sa)*180;
      sub.wy=cat.wy+Math.sin(sa)*180;
      const leaves=children[sub.id]||[];
      const leafSpread=Math.min(Math.PI*0.7, Math.PI*0.3+leaves.length*0.1);
      const subAngle=Math.atan2(sub.wy-cat.wy,sub.wx-cat.wx);
      leaves.forEach((leaf,k)=>{
        const la=subAngle-leafSpread/2+leafSpread*(leaves.length===1?0.5:k/(leaves.length-1));
        leaf.wx=sub.wx+Math.cos(la)*130;
        leaf.wy=sub.wy+Math.sin(la)*130;
      });
    });
  });
}
layout();

// Camera
let camX=0,camY=0,zoom=0.45;
const ui=document.getElementById("ui");
const bgC=document.getElementById("bg");
const lnC=document.getElementById("lines");
const bgCtx=bgC.getContext("2d");
const lnCtx=lnC.getContext("2d");

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  bgC.width=w;bgC.height=h;
  lnC.width=w;lnC.height=h;
}
window.addEventListener("resize",resize);
resize();

// Stars
const stars=Array.from({length:200},()=>({x:Math.random()*4000-2000,y:Math.random()*4000-2000,r:Math.random()*1.5+0.5,b:Math.random()}));
function drawStars(t){
  bgCtx.clearRect(0,0,bgC.width,bgC.height);
  const cx=bgC.width/2,cy=bgC.height/2;
  stars.forEach(s=>{
    const sx=cx+(s.x-camX)*zoom*0.3;
    const sy=cy+(s.y-camY)*zoom*0.3;
    if(sx<-5||sx>bgC.width+5||sy<-5||sy>bgC.height+5)return;
    const a=0.4+0.6*Math.sin(t*0.001+s.b*6.28);
    bgCtx.beginPath();bgCtx.arc(sx,sy,s.r,0,6.28);
    bgCtx.fillStyle=`rgba(255,255,255,${a})`;bgCtx.fill();
  });
}

// Create DOM nodes
const nodeEls={};
const circleSizes=[50,40,28,20];
DATA.forEach((d,i)=>{
  const o=byId[d[0]];
  const el=document.createElement("div");
  const cls=["center-node","cat-node","sub-node","leaf-node"][o.level];
  el.className="node "+cls;
  const circle=document.createElement("div");
  circle.className="node-circle";
  if(o.level===0){
    // center styled via CSS
  } else if(o.level===1){
    circle.style.background=`radial-gradient(circle,${o.color}dd,${o.color}88)`;
    circle.style.border=`2px solid ${o.color}`;
    circle.style.boxShadow=`0 0 20px ${o.color}66`;
  } else if(o.level===2){
    circle.style.background=`radial-gradient(circle,${o.color}99,${o.color}55)`;
    circle.style.border=`2px solid ${o.color}88`;
    circle.style.boxShadow=`0 0 12px ${o.color}44`;
  } else if(o.level===3){
    circle.style.background=`radial-gradient(circle,${o.color}66,${o.color}33)`;
    circle.style.border=`1px solid ${o.color}66`;
    circle.style.boxShadow=`0 0 8px ${o.color}22`;
  }
  if(o.emoji) circle.innerHTML=`<span class="node-emoji">${o.emoji}</span>`;
  el.appendChild(circle);
  const text=document.createElement("div");
  text.className="node-text";
  text.textContent=o.label;
  el.appendChild(text);
  ui.appendChild(el);
  nodeEls[o.id]=el;
  setTimeout(()=>el.classList.add("visible"),100+i*25);
});

// Draw lines
function drawLines(){
  const cx=lnC.width/2,cy=lnC.height/2;
  lnCtx.clearRect(0,0,lnC.width,lnC.height);
  DATA.forEach(d=>{
    const o=byId[d[0]];
    if(!o.parent)return;
    const p=byId[o.parent];
    const x1=cx+(p.wx-camX)*zoom;
    const y1=cy+(p.wy-camY)*zoom;
    const x2=cx+(o.wx-camX)*zoom;
    const y2=cy+(o.wy-camY)*zoom;
    const grad=lnCtx.createLinearGradient(x1,y1,x2,y2);
    grad.addColorStop(0,p.color+"88");
    grad.addColorStop(1,o.color+"44");
    lnCtx.beginPath();lnCtx.moveTo(x1,y1);lnCtx.lineTo(x2,y2);
    lnCtx.strokeStyle=grad;
    lnCtx.lineWidth=o.level===1?2:o.level===2?1.5:1;
    lnCtx.stroke();
  });
}

// Position nodes
function updatePositions(){
  const cx=lnC.width/2,cy=lnC.height/2;
  const halfSizes=[25,20,14,10];
  DATA.forEach(d=>{
    const o=byId[d[0]];
    const el=nodeEls[o.id];
    const hs=halfSizes[o.level];
    const sx=cx+(o.wx-camX)*zoom-hs;
    const sy=cy+(o.wy-camY)*zoom-hs;
    el.style.left=sx+"px";
    el.style.top=sy+"px";
    // Keep text readable at zoom out: scale text inversely
    const textEl=el.querySelector('.node-text');
    if(textEl){
      const compensate=zoom<0.3?1.8:zoom<0.45?1.4:zoom<0.6?1.15:1;
      textEl.style.transform=`scale(${compensate})`;
    }
    el.style.transform=el.classList.contains("visible")?`scale(1)`:"scale(0)";
  });
}

// Interaction
let dragging=false,lastX,lastY;
document.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});
document.addEventListener("pointermove",e=>{
  if(!dragging)return;
  camX-=(e.clientX-lastX)/zoom;
  camY-=(e.clientY-lastY)/zoom;
  lastX=e.clientX;lastY=e.clientY;
});
document.addEventListener("pointerup",()=>dragging=false);
document.addEventListener("wheel",e=>{
  e.preventDefault();
  const f=e.deltaY>0?0.9:1.1;
  zoom=Math.max(0.1,Math.min(3,zoom*f));
},{passive:false});

// Render loop
function frame(t){
  drawStars(t);
  drawLines();
  updatePositions();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
