<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .3s,opacity .3s;user-select:none;transform:translate(-50%,-50%)}
.node.hidden{opacity:0;transform:translate(-50%,-50%) scale(0)!important;pointer-events:none}
.node.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
.node:hover{transform:translate(-50%,-50%) scale(1.1)!important;z-index:10}
.node-circle{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.node-text{margin-top:4px;white-space:nowrap;max-width:120px;overflow:visible;text-overflow:clip;line-height:1.2;text-shadow:0 0 6px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.7);transform-origin:center top}
.center-node .node-circle{width:70px;height:70px;background:radial-gradient(circle,#1e293b,#0f172a);border:3px solid #64748b;box-shadow:0 0 30px rgba(100,116,139,.4)}
.center-node .node-text{font-size:12px;font-weight:700;color:#e2e8f0;white-space:normal;max-width:140px}
.center-node{z-index:5}
.cat-node .node-circle{width:40px;height:40px}
.cat-node .node-text{font-size:13px;font-weight:600;color:#fff}
.cat-node{z-index:4}
.sub-node .node-circle{width:28px;height:28px}
.sub-node .node-text{font-size:11px;font-weight:600;color:#fff}
.sub-node{z-index:3}
.node-emoji{font-size:1.2em}
.cat-node .node-emoji{font-size:1em}
.sub-node .node-emoji{font-size:0.7em}
.collapse-badge{position:absolute;bottom:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#475569;color:#e2e8f0;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.cat-node .node-circle{animation:glow 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(100,116,139,.4)}50%{box-shadow:0 0 50px rgba(100,116,139,.7)}}
.center-node .node-circle{animation:pulse 4s ease-in-out infinite}
#panel{position:fixed;top:0;right:-340px;width:340px;height:100%;background:rgba(15,23,42,.95);border-left:1px solid #334155;backdrop-filter:blur(12px);z-index:50;transition:right .3s ease;overflow-y:auto;pointer-events:auto}
#panel.open{right:0}
#panel-close{position:absolute;top:12px;right:12px;background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px}
#panel-close:hover{color:#e2e8f0;background:rgba(255,255,255,.1)}
#panel-header{padding:24px 20px 16px;border-bottom:1px solid #1e293b}
#panel-emoji{font-size:36px;margin-bottom:8px}
#panel-title{font-size:18px;font-weight:700;color:#e2e8f0;margin-bottom:4px}

.panel-child{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:4px;cursor:pointer;transition:background .2s}
.panel-child:hover{background:rgba(255,255,255,.06)}
.panel-child-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

#panel-path{padding:0 20px 16px}

#panel-path a{color:#94a3b8;font-size:11px;cursor:pointer;text-decoration:none}

.panel-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
#title{position:fixed;top:20px;left:20px;pointer-events:none;z-index:20}
#title h1{color:#e2e8f0;font-size:18px;font-weight:700;letter-spacing:-.5px}

#nav{position:fixed;top:20px;right:20px;pointer-events:auto;display:flex;flex-direction:column;gap:8px;z-index:20}
#nav a{background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:8px;padding:8px 14px;color:#94a3b8;font-size:11px;text-decoration:none;text-align:center;backdrop-filter:blur(8px);transition:all .2s}

#legend .leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

<script>
// DATA: [id, parentId, level, emoji, label, color]
const DATA = [
  // Center
  ["center", null, 0, "&#128395;", "OpenClaw", "#64748b"],

  // 12 Categories
  ["gw",  "center", 1, "&#127760;", "Gateway",         "#3b82f6"],
  ["ch",  "center", 1, "&#128172;", "Channels",        "#8b5cf6"],
  ["ag",  "center", 1, "&#129302;", "Agent",           "#ec4899"],
  ["mo",  "center", 1, "&#129504;", "Models",          "#f59e0b"],
  ["to",  "center", 1, "&#128295;", "Tools",           "#10b981"],
  ["no",  "center", 1, "&#128241;", "Nodes",           "#06b6d4"],
  ["ws",  "center", 1, "&#128194;", "Workspace",       "#f97316"],
  ["au",  "center", 1, "&#9889;",   "Automation",      "#ef4444"],
  ["ui",  "center", 1, "&#128421;", "Interfaces",      "#a855f7"],
  ["se",  "center", 1, "&#128274;", "Security",        "#64748b"],
  ["sh",  "center", 1, "&#127968;", "Smart Home",      "#14b8a6"],

  ["gw-d",  "gw", 2, "", "Daemon :18789",  "#3b82f6"],

  ["ch-sl",   "ch", 2, "", "Slack",      "#8b5cf6"],
  ["ch-im",   "ch", 2, "", "iMessage",   "#8b5cf6"],
  ["ch-more", "ch", 2, "", "+9 more",    "#8b5cf6"],

  // Agent

  ["ag-al", "ag", 2, "", "Agent Loop", "#ec4899"],

  // Models

  ["mo-gk", "mo", 2, "", "Grok",       "#f59e0b"],
  ["mo-go", "mo", 2, "", "Google",     "#f59e0b"],
  ["mo-ol", "mo", 2, "", "Ollama",     "#f59e0b"],
  ["mo-or", "mo", 2, "", "OpenRouter", "#f59e0b"],

  // Tools
  ["to-ex",  "to", 2, "", "exec",    "#10b981"],
  ["to-br",  "to", 2, "", "browser", "#10b981"],
  ["to-web", "to", 2, "", "web",     "#10b981"],
  ["to-sk",  "to", 2, "", "Skills",  "#10b981"],
  ["to-pl",  "to", 2, "", "Plugins", "#10b981"],

  // Nodes
  ["no-ios", "no", 2, "", "iOS",     "#06b6d4"],
  ["no-and", "no", 2, "", "Android", "#06b6d4"],
  ["no-mac", "no", 2, "", "macOS",   "#06b6d4"],
  ["no-cam", "no", 2, "", "Camera",  "#06b6d4"],
  ["no-can", "no", 2, "", "Canvas",  "#06b6d4"],

  // Workspace
  ["ws-ag",  "ws", 2, "", "AGENTS.md",     "#f97316"],
  ["ws-so",  "ws", 2, "", "SOUL.md",       "#f97316"],
  ["ws-mem", "ws", 2, "", "MEMORY.md",     "#f97316"],
  ["ws-sk",  "ws", 2, "", "12 Skills",     "#f97316"],
  ["ws-sc",  "ws", 2, "", "Scripts",       "#f97316"],

  // Automation
  ["au-cr", "au", 2, "", "Cron Jobs",  "#ef4444"],
  ["au-hb", "au", 2, "", "Heartbeat",  "#ef4444"],
  ["au-wh", "au", 2, "", "Webhooks",   "#ef4444"],

  // Interfaces
  ["ui-wc", "ui", 2, "", "WebChat",    "#a855f7"],
  ["ui-cu", "ui", 2, "", "Control UI", "#a855f7"],
  ["ui-cl", "ui", 2, "", "CLI",        "#a855f7"],
  ["ui-ma", "ui", 2, "", "macOS App",  "#a855f7"],

  // Security
  ["se-tk", "se", 2, "", "Token Auth",    "#64748b"],
  ["se-pr", "se", 2, "", "Dev Pairing",   "#64748b"],
  ["se-sb", "se", 2, "", "Sandbox",       "#64748b"],

  // Smart Home
  ["sh-db", "sh", 2, "", "DEEBOT X8 PRO", "#14b8a6"],
  ["sh-cl", "sh", 2, "", "Clean Control", "#14b8a6"],
  ["sh-mo", "sh", 2, "", "Work Modes",    "#14b8a6"],
  ["sh-cf", "sh", 2, "", "CF Tunnel",     "#14b8a6"],

  // Dashboards & Apps
  ["da-hub",    "da", 2, "", "Hub",            "#e11d48"],
  ["da-mm",     "da", 2, "", "Mindmap",        "#e11d48"],
  ["da-stocks", "da", 2, "", "Stock Scanner",  "#e11d48"],
  ["da-trader", "da", 2, "", "Virtual Trader", "#e11d48"],
  ["da-iran",   "da", 2, "", "Iran Dashboard", "#e11d48"],
  ["da-costs",  "da", 2, "", "Cost Dashboard", "#e11d48"],
  ["da-agents", "da", 2, "", "Subagents",      "#e11d48"],
  ["da-deebot", "da", 2, "", "DEEBOT App",     "#e11d48"],
  ["da-arch",   "da", 2, "", "Architecture",   "#e11d48"],
  ["da-family", "da", 2, "", "Family Tree",    "#e11d48"],
];

const byId = {};
const children = {};
DATA.forEach(d => {
  const o = {id:d[0], parent:d[1], level:d[2], emoji:d[3], label:d[4], color:d[5], wx:0, wy:0};
  byId[o.id] = o;
  if (o.parent) { (children[o.parent] = children[o.parent] || []).push(o); }
});

const collapsed = new Set();
function hasChildren(id) { return children[id] && children[id].length > 0; }
function isVisible(id) {
  let cur = byId[id];
  while (cur.parent) {
    if (collapsed.has(cur.parent)) return false;
    cur = byId[cur.parent];
  }
  return true;
}

function layout() {
  const center = byId["center"];
  center.wx = 0; center.wy = 0;
  const cats = children["center"] || [];
  const catCount = cats.length;
  cats.forEach((cat, i) => {
    const a = (2 * Math.PI * i / catCount) - Math.PI / 2;
    cat.wx = Math.cos(a) * 320;
    cat.wy = Math.sin(a) * 320;
    const subs = children[cat.id] || [];
    const catAngle = a;
    const minGap = 0.28;
    const subSpread = Math.max(subs.length * minGap, Math.PI * 0.45);
    const subRadius = 180 + subs.length * 12;
    subs.forEach((sub, j) => {
      const sa = catAngle - subSpread/2 + subSpread * (subs.length === 1 ? 0.5 : j/(subs.length-1));
      sub.wx = cat.wx + Math.cos(sa) * subRadius;
      sub.wy = cat.wy + Math.sin(sa) * subRadius;
    });
  });
  // Repulsion
  const allNodes = DATA.map(d => byId[d[0]]);
  for (let iter = 0; iter < 60; iter++) {
    let moved = false;
    for (let i = 0; i < allNodes.length; i++) {
      for (let j = i+1; j < allNodes.length; j++) {
        const a = allNodes[i], b = allNodes[j];
        const dx = b.wx - a.wx, dy = b.wy - a.wy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const minDist = [55, 45, 36];
        const req = (minDist[Math.min(a.level,2)] || 30) + (minDist[Math.min(b.level,2)] || 30);
        if (dist < req && dist > 0) {
          const push = (req - dist) / 2 * 0.5;
          const nx = dx/dist, ny = dy/dist;
          if (a.id !== "center") { a.wx -= nx*push; a.wy -= ny*push; }
          if (b.id !== "center") { b.wx += nx*push; b.wy += ny*push; }
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
}
layout();

let camX = 0, camY = 0, zoom = 0.42;
const ui = document.getElementById("ui");
const bgC = document.getElementById("bg");
const lnC = document.getElementById("lines");
const bgCtx = bgC.getContext("2d");
const lnCtx = lnC.getContext("2d");

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  bgC.width = w; bgC.height = h;
  lnC.width = w; lnC.height = h;
}
window.addEventListener("resize", resize);
resize();

var TILE = 2000;
var starTile = Array.from({length:80}, function() {
  return {x:Math.random()*TILE, y:Math.random()*TILE, r:Math.random()*0.6+0.2, b:Math.random()};
});
function drawStars(t) {
  bgCtx.clearRect(0,0,bgC.width,bgC.height);
  var cx=bgC.width/2, cy=bgC.height/2;
  var parallax=0.3;
  var offX=camX*parallax, offY=camY*parallax;
  var left=-cx/(zoom*parallax)+offX, right=cx/(zoom*parallax)+offX;
  var top2=-cy/(zoom*parallax)+offY, bottom=cy/(zoom*parallax)+offY;
  var tXmin=Math.floor(left/TILE), tXmax=Math.floor(right/TILE);
  var tYmin=Math.floor(top2/TILE), tYmax=Math.floor(bottom/TILE);
  for (var tx=tXmin; tx<=tXmax; tx++) {
    for (var ty=tYmin; ty<=tYmax; ty++) {
      for (var i=0; i<starTile.length; i++) {
        var s=starTile[i];
        var wx=s.x+tx*TILE, wy=s.y+ty*TILE;
        var sx=cx+(wx-offX)*zoom*parallax;
        var sy=cy+(wy-offY)*zoom*parallax;
        if (sx<-5||sx>bgC.width+5||sy<-5||sy>bgC.height+5) continue;
        var a=0.4+0.6*Math.sin(t*0.001+s.b*6.28);
        bgCtx.beginPath(); bgCtx.arc(sx,sy,s.r,0,6.28);
        bgCtx.fillStyle="rgba(255,255,255,"+a+")"; bgCtx.fill();
      }
    }
  }
}

// Create nodes
const nodeEls = {};
const badgeEls = {};
DATA.forEach((d, i) => {
  const o = byId[d[0]];
  const el = document.createElement("div");
  const cls = ["center-node","cat-node","sub-node"][Math.min(o.level,2)];
  el.className = "node " + cls;

  const circle = document.createElement("div");
  circle.className = "node-circle";
  if (o.level === 0) {
    // center already styled in CSS
  } else if (o.level === 1) {
    circle.style.background = `radial-gradient(circle,${o.color}dd,${o.color}88)`;
    circle.style.border = `2px solid ${o.color}`;
    circle.style.boxShadow = `0 0 20px ${o.color}66`;
  } else {
    circle.style.background = `radial-gradient(circle,${o.color}99,${o.color}55)`;
    circle.style.border = `2px solid ${o.color}88`;
    circle.style.boxShadow = `0 0 12px ${o.color}44`;
  }

  if (o.emoji) {
    const sp = document.createElement("span");
    sp.className = "node-emoji";
    sp.innerHTML = o.emoji;
    circle.appendChild(sp);
  }

  if (hasChildren(o.id)) {
    const badge = document.createElement("div");
    badge.className = "collapse-badge";
    badge.textContent = "+";
    badge.style.display = "none";
    circle.appendChild(badge);
    badgeEls[o.id] = badge;
  }

  el.appendChild(circle);

  const text = document.createElement("div");
  text.className = "node-text";
  text.textContent = o.label;
  el.appendChild(text);

  el.addEventListener("click", e => {
    e.stopPropagation();
    if (dragMoved) return;
    if (hasChildren(o.id)) {
      if (collapsed.has(o.id)) collapsed.delete(o.id);
      else collapsed.add(o.id);
      updateBadges();
    }
    openPanel(o.id);
  });

  ui.appendChild(el);
  nodeEls[o.id] = el;
  setTimeout(() => el.classList.add("visible"), 80 + i * 20);
});

function updateBadges() {
  for (const id in badgeEls) {
    badgeEls[id].style.display = collapsed.has(id) ? "flex" : "none";
  }
}

function drawLines() {
  const cx = lnC.width/2, cy = lnC.height/2;
  lnCtx.clearRect(0, 0, lnC.width, lnC.height);
  DATA.forEach(d => {
    const o = byId[d[0]];
    if (!o.parent) return;
    if (!isVisible(o.id)) return;
    const p = byId[o.parent];
    const x1 = cx + (p.wx - camX)*zoom;
    const y1 = cy + (p.wy - camY)*zoom;
    const x2 = cx + (o.wx - camX)*zoom;
    const y2 = cy + (o.wy - camY)*zoom;
    const grad = lnCtx.createLinearGradient(x1,y1,x2,y2);
    grad.addColorStop(0, p.color + "88");
    grad.addColorStop(1, o.color + "44");
    lnCtx.beginPath(); lnCtx.moveTo(x1,y1); lnCtx.lineTo(x2,y2);
    lnCtx.strokeStyle = grad;
    lnCtx.lineWidth = o.level === 1 ? 2 : 1.5;
    lnCtx.stroke();
  });
}

function updatePositions() {
  const cx = lnC.width/2, cy = lnC.height/2;
  DATA.forEach(d => {
    const o = byId[d[0]];
    const el = nodeEls[o.id];
    const vis = isVisible(o.id);
    if (!vis) { el.classList.add("hidden"); el.classList.remove("visible"); return; }
    el.classList.remove("hidden");
    if (!el.classList.contains("visible")) el.classList.add("visible");
    const sx = cx + (o.wx - camX)*zoom;
    const sy = cy + (o.wy - camY)*zoom;
    el.style.left = sx + "px";
    el.style.top = sy + "px";
    const textEl = el.querySelector(".node-text");
    if (textEl) {
      // Scale text WITH zoom - small when zoomed out, normal when zoomed in
      const scale = Math.min(1, zoom / 0.6);
      textEl.style.transform = `scale(${scale})`;
    }
  });
}

let dragging = false, lastX, lastY, dragMoved = false;
document.addEventListener("pointerdown", e => { dragging = true; dragMoved = false; lastX = e.clientX; lastY = e.clientY; });
document.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
  camX -= dx/zoom; camY -= dy/zoom;
  lastX = e.clientX; lastY = e.clientY;
});
document.addEventListener("pointerup", e => {
  dragging = false;
  if (!dragMoved && !e.target.closest(".node,.panel-child,#panel")) {
    document.getElementById("panel").classList.remove("open");
  }
});
document.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.max(0.1, Math.min(3, zoom * f));
}, {passive: false});

// Touch pinch
let lastDist = 0;
document.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastDist = Math.sqrt(dx*dx + dy*dy);
  }
});
document.addEventListener("touchmove", e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (lastDist > 0) zoom = Math.max(0.1, Math.min(3, zoom * dist/lastDist));
    lastDist = dist;
    e.preventDefault();
  }
}, {passive: false});

const LEVELS = ["Core", "Category", "Component", "Detail"];
const panel = document.getElementById("panel");
const panelClose = document.getElementById("panel-close");
const panelEmoji = document.getElementById("panel-emoji");
const panelTitle = document.getElementById("panel-title");
const panelLevel = document.getElementById("panel-level");
const panelPath = document.getElementById("panel-path");
const panelDesc = document.getElementById("panel-desc");
const panelChildrenTitle = document.getElementById("panel-children-title");
const panelChildrenEl = document.getElementById("panel-children");

function openPanel(id) {
  const o = byId[id];
  if (!o) return;
  panelEmoji.innerHTML = o.emoji || "";
  panelTitle.textContent = o.label;
  panelLevel.innerHTML = `<span class="panel-dot" style="background:${o.color}"></span>${LEVELS[Math.min(o.level,3)]}`;
  const path = [];
  let cur = o;
  while (cur) { path.unshift(cur); cur = cur.parent ? byId[cur.parent] : null; }
  panelPath.innerHTML = path.map((p, i) =>
    i < path.length-1
      ? `<a onclick="openPanel('${p.id}')">${p.label}</a>`
      : `<span>${p.label}</span>`
  ).join(' <span style="color:#475569"> › </span> ');
  panelDesc.textContent = DESC[id] || "No description available.";
  const kids = children[id] || [];
  if (kids.length > 0) {
    panelChildrenTitle.textContent = o.level === 0 ? "Categories" : "Components";
    panelChildrenEl.innerHTML = kids.map(k =>
      `<div class="panel-child" onclick="openPanel('${k.id}')">
        <div class="panel-child-dot" style="background:${k.color}"></div>
        <div class="panel-child-name">${k.label}</div>
      </div>`
    ).join("");
  } else {
    panelChildrenTitle.textContent = "";
    panelChildrenEl.innerHTML = "";
  }
  panel.classList.add("open");
}
panelClose.addEventListener("click", () => panel.classList.remove("open"));

function frame(t) {
  drawStars(t);
  drawLines();
  updatePositions();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
