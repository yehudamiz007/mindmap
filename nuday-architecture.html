<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>OpenClaw – Azure Architecture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0f1a;font-family:'Segoe UI',system-ui,sans-serif;color:#cdd6f4;overflow-x:hidden}

h1{text-align:center;padding:32px 20px 6px;font-size:22px;font-weight:700;color:#e2e8f0;letter-spacing:-.3px}
.subtitle{text-align:center;color:#4a5568;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding-bottom:28px}

/* SVG canvas */
#arch{display:block;width:100%;max-width:1300px;margin:0 auto;padding:0 20px 60px}

/* Node boxes */
.node rect{rx:6;stroke-width:1.5}
.node text{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;fill:#e2e8f0;font-weight:600;text-anchor:middle}
.node .sub{font-size:9.5px;fill:#64748b;font-weight:400}
.node .icon-text{font-size:13px;fill:#94a3b8;font-weight:400}

/* Layer backgrounds */
.layer-bg{rx:10;fill-opacity:.03;stroke-width:1;stroke-dasharray:4,3}
.layer-label{font-family:'Segoe UI',system-ui,sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;fill-opacity:.5}

/* Animated paths */
.flow-path{fill:none;stroke-width:1.5;opacity:.8}

/* Dash animation */
@keyframes dash{to{stroke-dashoffset:0}}
.animated-path{fill:none;stroke-width:1.5;stroke-dasharray:6,4;animation:dash 1.2s linear infinite}

/* Dot pulse on nodes */
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.pulse-dot{animation:pulse 2s ease-in-out infinite}

/* Legend */
#legend{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:0 24px 40px}
.leg{display:flex;align-items:center;gap:7px;font-size:11px;color:#64748b}
.leg-line{width:28px;height:2px;border-radius:2px}
.leg-dash{width:28px;height:0;border-top:2px dashed}
</style>
</head>

    .f-teal   {stroke:#14b8a6; stroke-dashoffset:200; stroke-dasharray:6,4; animation:dash 1.8s linear infinite}
    @keyframes dash{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
