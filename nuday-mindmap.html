<title>NuDay AI - Mental Health Intelligence Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060b14;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}

.node{position:absolute;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .3s,opacity .3s;user-select:none;transform:translate(-50%,-50%)}
.node.hidden{opacity:0;transform:translate(-50%,-50%) scale(0)!important;pointer-events:none}
.node.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
.node:hover{transform:translate(-50%,-50%) scale(1.1)!important;z-index:10}
.node-circle{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.node-text{margin-top:4px;white-space:nowrap;max-width:120px;overflow:visible;text-overflow:clip;line-height:1.2;text-shadow:0 0 6px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.7);transform-origin:center top;font-family:'Segoe UI',system-ui,sans-serif}
.node-emoji{font-size:1.2em}
.cat-node .node-emoji{font-size:1em}
.sub-node .node-emoji,.leaf-node .node-emoji{font-size:0.7em}
.collapse-badge{position:absolute;bottom:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#475569;color:#e2e8f0;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}

.center-node .node-circle{width:70px;height:70px;background:radial-gradient(circle,#0f2744,#060b14);border:3px solid #38bdf8;box-shadow:0 0 40px rgba(56,189,248,.5)}
.center-node .node-text{font-size:12px;font-weight:700;color:#e2e8f0;white-space:normal;max-width:140px}
.center-node{z-index:5}
.cat-node .node-circle{width:40px;height:40px}
.cat-node .node-text{font-size:12px;font-weight:600;color:#fff}
.cat-node{z-index:4}
.sub-node .node-circle{width:28px;height:28px}
.sub-node .node-text{font-size:12px;font-weight:600;color:#fff}
.sub-node{z-index:3}
.leaf-node .node-circle{width:18px;height:18px}
.leaf-node .node-text{font-size:12px;font-weight:500;color:#cbd5e1}
.leaf-node{z-index:2}
.treatment-node .node-circle{width:14px;height:14px}
.treatment-node .node-text{font-size:11px;font-weight:500;color:#fdba74}
.treatment-node{z-index:1}

@media (min-width:768px) and (max-width:1199px),(min-width:768px) and (pointer:coarse){
  .center-node .node-circle{width:62px;height:62px}
  .cat-node .node-circle{width:38px;height:38px}
  .sub-node .node-circle{width:26px;height:26px}
  .leaf-node .node-circle{width:17px;height:17px}
}
@media (max-width:767px){
  .center-node .node-circle{width:54px;height:54px;border:2px solid #38bdf8}
  .center-node .node-text{font-size:12px;max-width:110px}
  .cat-node .node-circle{width:34px;height:34px}
  .sub-node .node-circle{width:23px;height:23px}
  .leaf-node .node-circle{width:15px;height:15px}
  .treatment-node .node-circle{width:12px;height:12px}
  .treatment-node .node-text{font-size:10px}
  .collapse-badge{width:12px;height:12px;font-size:9px}
}

@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.cat-node .node-circle{animation:glow 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 40px rgba(56,189,248,.5)}50%{box-shadow:0 0 70px rgba(56,189,248,.9)}}
.center-node .node-circle{animation:pulse 4s ease-in-out infinite}

#panel{
  position:fixed;bottom:-200px;left:50%;transform:translateX(-50%);
  width:min(560px,96vw);max-height:180px;
  background:rgba(6,11,20,.97);border:1px solid #1e3a5f;border-radius:14px 14px 0 0;
  backdrop-filter:blur(16px);z-index:50;transition:bottom .28s cubic-bezier(.4,0,.2,1);
  overflow:hidden;pointer-events:auto;box-shadow:0 -8px 40px rgba(0,0,0,.6)
}
#panel.open{bottom:0}
#panel-close{position:absolute;top:10px;right:12px;background:none;border:none;color:#64748b;font-size:18px;cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1;z-index:2}
#panel-close:hover{color:#e2e8f0;background:rgba(255,255,255,.08)}
#panel-header{padding:12px 36px 8px 14px;border-bottom:1px solid #1e3a5f;display:flex;align-items:center;gap:10px}
#panel-emoji{font-size:22px;flex-shrink:0}
#panel-title{font-size:15px;font-weight:700;color:#e2e8f0}
#panel-level{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-left:6px}
#panel-body{padding:8px 14px 10px;display:flex;gap:16px;align-items:flex-start}
#panel-desc{color:#94a3b8;font-size:12px;line-height:1.5;flex:1;min-width:0}
.panel-child{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:20px;cursor:pointer;transition:background .15s;margin:2px;background:rgba(255,255,255,.04);border:1px solid #1e3a5f}
.panel-child:hover{background:rgba(255,255,255,.1)}
.panel-child-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.panel-child-name{color:#cbd5e1;font-size:11px}
#panel-children-wrap{flex-shrink:0;max-width:220px;display:flex;flex-wrap:wrap;align-content:flex-start}
.panel-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}

@media (max-width:767px){
  #panel{width:100%;max-height:58vh;border-radius:18px 18px 0 0;bottom:-60vh}
  #panel.open{bottom:0}
  #panel-header{padding:14px 44px 10px 16px}
  #panel-emoji{font-size:24px}
  #panel-title{font-size:16px}
  #panel-body{flex-direction:column;padding:10px 16px 20px;gap:10px}
  #panel-desc{font-size:13px;line-height:1.6}
  #panel-children-wrap{max-width:100%;width:100%}
  #panel-close{font-size:24px;top:12px;right:16px;padding:4px 8px}
  .panel-child{padding:6px 12px;margin:3px}
  .panel-child-name{font-size:12px}
  #panel::before{content:'';display:block;width:40px;height:4px;background:#1e3a5f;border-radius:2px;margin:10px auto 0}
}

#title{position:fixed;top:20px;left:20px;pointer-events:none;z-index:20}
#title h1{color:#e2e8f0;font-size:18px;font-weight:700;letter-spacing:-.5px}
#title p{color:#38bdf8;font-size:12px;margin-top:4px;letter-spacing:.5px}
@media (max-width:767px){
  #title{top:14px;left:14px}
  #title h1{font-size:15px}
  #title p{font-size:11px;margin-top:2px}

#legend{position:fixed;bottom:20px;left:20px;pointer-events:auto;background:rgba(6,11,20,.9);border:1px solid #1e3a5f;border-radius:12px;padding:14px 18px;color:#94a3b8;font-size:11px;backdrop-filter:blur(8px);z-index:20;max-width:220px}
#legend h3{color:#e2e8f0;font-size:13px;margin-bottom:8px}
#legend .leg-item{display:flex;align-items:center;gap:8px;margin:4px 0}
#legend .leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
@media (max-width:767px){#legend{display:none}}

  #legend{bottom:auto;top:80px;left:20px;max-width:180px;padding:10px 14px}

  #legend .leg-item{gap:6px;margin:2px 0}
  #legend .leg-dot{width:8px;height:8px}

#device-badge{position:fixed;bottom:20px;right:20px;background:rgba(6,11,20,.9);border:1px solid #1e3a5f;border-radius:8px;padding:6px 12px;color:#64748b;font-size:10px;backdrop-filter:blur(8px);z-index:20;display:flex;align-items:center;gap:6px;pointer-events:none}
#device-badge span{color:#94a3b8;font-weight:600}
@media (max-width:767px){#device-badge{bottom:12px;right:12px;font-size:9px;padding:4px 10px}}

#zoom-controls{display:none;position:fixed;right:20px;bottom:60px;flex-direction:column;gap:6px;z-index:20;pointer-events:auto}
#zoom-controls button{width:40px;height:40px;border-radius:50%;background:rgba(6,11,20,.9);border:1px solid #1e3a5f;color:#94a3b8;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:all .2s;user-select:none}
#zoom-controls button:hover,#zoom-controls button:active{color:#e2e8f0;border-color:#38bdf8;background:rgba(15,39,68,.95)}
@media (max-width:1199px){#zoom-controls{display:flex}}

// ── DEVICE DETECTION ─────────────────────────────────────────────────────────
const Device=(function(){
  const ua=navigator.userAgent;
  const touch='ontouchstart' in window||navigator.maxTouchPoints>0;
  const W=window.innerWidth,H=window.innerHeight;
  const isIPad=/iPad/.test(ua)||(/Macintosh/.test(ua)&&touch);
  const isIPhone=/iPhone/.test(ua);
  const isAndTablet=/Android/.test(ua)&&!/Mobile/.test(ua);
  const isAndPhone=/Android/.test(ua)&&/Mobile/.test(ua);
  const isMobile=isIPhone||isAndPhone||(touch&&W<768);
  const isTablet=isIPad||isAndTablet||(touch&&W>=768&&W<1200);
  const isDesktop=!isMobile&&!isTablet;
  const type=isMobile?'mobile':isTablet?'tablet':'desktop';
  const params={
    desktop:{defaultZoom:0.36,catRadius:340,subRadiusBase:195,subRadiusMult:10,leafRadiusBase:115,leafRadiusMult:10,minD:[60,50,38,28],repIter:80},
    tablet:{defaultZoom:0.28,catRadius:310,subRadiusBase:185,subRadiusMult:10,leafRadiusBase:108,leafRadiusMult:9,minD:[58,48,36,26],repIter:80},
    mobile:{defaultZoom:0.20,catRadius:270,subRadiusBase:170,subRadiusMult:9,leafRadiusBase:98,leafRadiusMult:8,minD:[52,42,32,22],repIter:70},
  };
  const labelMap={desktop:'💻 Desktop',tablet:isIPad?'📱 iPad':'📱 Tablet',mobile:'📱 Mobile'};
  return{type,params:params[type],label:labelMap[type],isMobile,isTablet,isDesktop};
})();

document.getElementById('device-label').textContent=Device.label;

}

// ── LAYOUT ───────────────────────────────────────────────────────────────────
function layout(){
  const P=Device.params;
  const center=byId["center"];center.wx=0;center.wy=0;

  // Generic recursive layout — works for any depth
  function placeChildren(parentNode, parentAngle, spreadMult, radiusBase, radiusMult){
    const kids=children[parentNode.id]||[];
    if(!kids.length)return;
    const spread=Math.max(kids.length*spreadMult, Math.PI*0.35);
    const radius=radiusBase+kids.length*radiusMult;
    kids.forEach((kid,i)=>{
      const a=parentAngle-spread/2+spread*(kids.length===1?0.5:i/(kids.length-1));
      kid.wx=parentNode.wx+Math.cos(a)*radius;
      kid.wy=parentNode.wy+Math.sin(a)*radius;
      // recurse with tighter params for deeper levels
      const childAngle=Math.atan2(kid.wy-parentNode.wy,kid.wx-parentNode.wx);
      const nextRadius=Math.max(radiusBase*0.65,70);
      const nextMult=Math.max(radiusMult*0.6,5);
      const nextSpread=spreadMult*0.75;
      placeChildren(kid,childAngle,nextSpread,nextRadius,nextMult);
    });
  }

  // Level 1 cats around center
  const cats=children["center"]||[];
  cats.forEach((cat,i)=>{
    const a=(2*Math.PI*i/cats.length)-Math.PI/2;
    cat.wx=Math.cos(a)*P.catRadius;
    cat.wy=Math.sin(a)*P.catRadius;
    const catAngle=Math.atan2(cat.wy,cat.wx);
    placeChildren(cat, catAngle, 0.32, P.subRadiusBase, P.subRadiusMult);
  });

  // Repulsion passes
  const all=DATA.map(d=>byId[d[0]]);
  const minD=[60,50,38,26,20];
  for(let iter=0;iter<P.repIter;iter++){
    let moved=false;
    for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
      const a=all[i],b=all[j];
      const dx=b.wx-a.wx,dy=b.wy-a.wy,dist=Math.sqrt(dx*dx+dy*dy);
      const req=minD[Math.min(a.level,4)]+minD[Math.min(b.level,4)];
      if(dist<req&&dist>0){
        const push=(req-dist)/2*0.5,nx=dx/dist,ny=dy/dist;
        if(a.id!=="center"){a.wx-=nx*push;a.wy-=ny*push;}
        if(b.id!=="center"){b.wx+=nx*push;b.wy+=ny*push;}
        moved=true;
      }
    }
    if(!moved)break;
  }
}
layout();

// ── STARS ─────────────────────────────────────────────────────────────────────
const TILE=2000;
const starTile=Array.from({length:80},()=>({x:Math.random()*TILE,y:Math.random()*TILE,r:Math.random()*.6+.2,b:Math.random()}));
function drawStars(t){
  bgCtx.clearRect(0,0,bgC.width,bgC.height);
  const cx=bgC.width/2,cy=bgC.height/2,p=0.3;
  const ox=camX*p,oy=camY*p;
  const txMin=Math.floor((-cx/(zoom*p)+ox)/TILE),txMax=Math.floor((cx/(zoom*p)+ox)/TILE);
  const tyMin=Math.floor((-cy/(zoom*p)+oy)/TILE),tyMax=Math.floor((cy/(zoom*p)+oy)/TILE);
  for(let tx=txMin;tx<=txMax;tx++)for(let ty=tyMin;ty<=tyMax;ty++)
    for(const s of starTile){
      const sx=cx+(s.x+tx*TILE-ox)*zoom*p,sy=cy+(s.y+ty*TILE-oy)*zoom*p;
      if(sx<-5||sx>bgC.width+5||sy<-5||sy>bgC.height+5)continue;
      const a=0.4+0.6*Math.sin(t*.001+s.b*6.28);
      bgCtx.beginPath();bgCtx.arc(sx,sy,s.r,0,6.28);
      bgCtx.fillStyle=`rgba(180,220,255,${a*0.6})`;bgCtx.fill();
    }
}

const nodeEls={},badgeEls={};
DATA.forEach((d,i)=>{
  const o=byId[d[0]];
  const clsArr=["center-node","cat-node","sub-node","leaf-node","treatment-node"];
  const el=document.createElement("div");
  el.className="node "+clsArr[Math.min(o.level,4)];
  const circle=document.createElement("div");circle.className="node-circle";
  if(o.level===0){}
  else if(o.level===1){circle.style.cssText=`background:radial-gradient(circle,${o.color}dd,${o.color}88);border:2px solid ${o.color};box-shadow:0 0 20px ${o.color}66`;}
  else if(o.level===2){circle.style.cssText=`background:radial-gradient(circle,${o.color}99,${o.color}55);border:2px solid ${o.color}88;box-shadow:0 0 12px ${o.color}44`;}
  else if(o.level===3){circle.style.cssText=`background:radial-gradient(circle,${o.color}66,${o.color}33);border:1px solid ${o.color}66;box-shadow:0 0 6px ${o.color}22`;}
  else{circle.style.cssText=`background:radial-gradient(circle,${o.color}cc,${o.color}88);border:2px solid ${o.color};box-shadow:0 0 8px ${o.color}66`;}
  if(o.emoji){const sp=document.createElement("span");sp.className="node-emoji";sp.innerHTML=o.emoji;circle.appendChild(sp);}
  if(hasChildren(o.id)){
    const badge=document.createElement("div");badge.className="collapse-badge";badge.textContent="+";badge.style.display="none";
    circle.appendChild(badge);badgeEls[o.id]=badge;
  }
  el.appendChild(circle);
  const text=document.createElement("div");text.className="node-text";text.textContent=o.label;el.appendChild(text);
  el.addEventListener("click",e=>{
    e.stopPropagation();if(dragMoved)return;
    if(hasChildren(o.id)){collapsed.has(o.id)?collapsed.delete(o.id):collapsed.add(o.id);updateBadges();}
    openPanel(o.id);
  });
  uiEl.appendChild(el);nodeEls[o.id]=el;
  setTimeout(()=>el.classList.add("visible"),60+i*10);
});

function updateBadges(){for(const id in badgeEls)badgeEls[id].style.display=collapsed.has(id)?"flex":"none";}

// ── DRAW LINES ────────────────────────────────────────────────────────────────
function drawLines(){
  const cx=lnC.width/2,cy=lnC.height/2;
  lnCtx.clearRect(0,0,lnC.width,lnC.height);
  DATA.forEach(d=>{
    const o=byId[d[0]];if(!o.parent||!isVisible(o.id))return;
    const p=byId[o.parent];
    const x1=cx+(p.wx-camX)*zoom,y1=cy+(p.wy-camY)*zoom;
    const x2=cx+(o.wx-camX)*zoom,y2=cy+(o.wy-camY)*zoom;
    const g=lnCtx.createLinearGradient(x1,y1,x2,y2);
    g.addColorStop(0,p.color+"88");g.addColorStop(1,o.color+"44");
    lnCtx.beginPath();lnCtx.moveTo(x1,y1);lnCtx.lineTo(x2,y2);
    lnCtx.strokeStyle=g;lnCtx.lineWidth=o.level===1?2:o.level===2?1.5:1;lnCtx.stroke();
  });
}

// ── POSITIONS ─────────────────────────────────────────────────────────────────
function updatePositions(){
  const cx=lnC.width/2,cy=lnC.height/2;
  DATA.forEach(d=>{
    const o=byId[d[0]];const el=nodeEls[o.id];
    if(!isVisible(o.id)){el.classList.add("hidden");el.classList.remove("visible");return;}
    el.classList.remove("hidden");if(!el.classList.contains("visible"))el.classList.add("visible");
    el.style.left=cx+(o.wx-camX)*zoom+"px";
    el.style.top=cy+(o.wy-camY)*zoom+"px";
    const t=el.querySelector(".node-text");
    if(t){const s=Math.min(1,zoom/0.55);t.style.transform=`scale(${s})`;}
  });
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
let dragging=false,lastX,lastY,dragMoved=false;
document.addEventListener("pointerdown",e=>{dragging=true;dragMoved=false;lastX=e.clientX;lastY=e.clientY;});
document.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  if(Math.abs(dx)>3||Math.abs(dy)>3)dragMoved=true;
  camX-=dx/zoom;camY-=dy/zoom;lastX=e.clientX;lastY=e.clientY;
});
document.addEventListener("pointerup",e=>{
  dragging=false;
  if(!dragMoved&&!e.target.closest(".node,.panel-child,#panel,#zoom-controls"))
    document.getElementById("panel").classList.remove("open");
});
document.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(0.1,Math.min(3,zoom*(e.deltaY>0?.9:1.1)));},{passive:false});

let lastDist=0;
document.addEventListener("touchstart",e=>{
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lastDist=Math.sqrt(dx*dx+dy*dy);}
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy);
    const midX=(e.touches[0].clientX+e.touches[1].clientX)/2,midY=(e.touches[0].clientY+e.touches[1].clientY)/2;
    if(lastDist>0){
      const scale=d/lastDist,cx=lnC.width/2,cy=lnC.height/2;
      const wx=(midX-cx)/zoom+camX,wy=(midY-cy)/zoom+camY;
      zoom=Math.max(0.1,Math.min(3,zoom*scale));
      camX=wx-(midX-cx)/zoom;camY=wy-(midY-cy)/zoom;
    }
    lastDist=d;e.preventDefault();
  }
},{passive:false});
document.addEventListener("touchend",e=>{if(e.touches.length<2)lastDist=0;});

document.getElementById("zoom-in").addEventListener("click",e=>{e.stopPropagation();zoom=Math.min(3,zoom*1.2);});
document.getElementById("zoom-out").addEventListener("click",e=>{e.stopPropagation();zoom=Math.max(0.1,zoom*0.83);});
document.getElementById("zoom-reset").addEventListener("click",e=>{e.stopPropagation();zoom=DEFAULT_ZOOM;camX=0;camY=0;});

const LEVELS=["Platform","Branch","Module","Disorder","🟠 Treatment"];
const panel=document.getElementById("panel");
const panelClose=document.getElementById("panel-close");
function openPanel(id){
  const o=byId[id];if(!o)return;
  document.getElementById("panel-emoji").innerHTML=o.emoji||"";
  document.getElementById("panel-title").textContent=o.label;
  document.getElementById("panel-level").innerHTML=`<span class="panel-dot" style="background:${o.color}"></span>${LEVELS[Math.min(o.level,3)]}`;
  document.getElementById("panel-desc").textContent=DESC[id]||"";
  const kids=children[id]||[];
  document.getElementById("panel-children").innerHTML=kids.map(k=>
    `<div class="panel-child" onclick="openPanel('${k.id}')"><div class="panel-child-dot" style="background:${k.color}"></div><div class="panel-child-name">${k.label}</div></div>`
  ).join("");
  panel.classList.add("open");
}
panelClose.addEventListener("click",()=>panel.classList.remove("open"));

let panelTouchStartY=0;
panel.addEventListener("touchstart",e=>{panelTouchStartY=e.touches[0].clientY;},{passive:true});
panel.addEventListener("touchend",e=>{
  const dy=e.changedTouches[0].clientY-panelTouchStartY;
  if(dy>60)panel.classList.remove("open");
},{passive:true});

// ── RENDER LOOP ───────────────────────────────────────────────────────────────
function frame(t){drawStars(t);drawLines();updatePositions();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
