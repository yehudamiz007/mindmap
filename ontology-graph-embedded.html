    * { margin: 0; padding: 0; box-sizing: border-box; }

    header { padding: 14px 20px; background: #1a1d2e; border-bottom: 1px solid #2d3748; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 18px; font-weight: 600; color: #7c3aed; }
    header span { font-size: 13px; color: #718096; }
    .toolbar { padding: 10px 20px; background: #161827; border-bottom: 1px solid #2d3748; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.15s; }
    .btn-secondary { background: #2d3748; color: #e2e8f0; }
    .btn-secondary:hover { background: #374151; }
    .filter-group { display: flex; gap: 6px; align-items: center; margin-left: auto; }
    .filter-group label { font-size: 12px; color: #718096; }
    select { background: #2d3748; border: 1px solid #4a5568; color: #e2e8f0; padding: 5px 10px; border-radius: 6px; font-size: 13px; }
    .main { display: flex; flex: 1; overflow: hidden; }
    #network { flex: 1; height: 100%; }
    .sidebar { width: 300px; background: #1a1d2e; border-left: 1px solid #2d3748; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 14px 16px; border-bottom: 1px solid #2d3748; font-size: 13px; font-weight: 600; color: #a78bfa; }
    .sidebar-content { padding: 14px 16px; overflow-y: auto; flex: 1; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-card { background: #0f1117; border-radius: 8px; padding: 10px 12px; border: 1px solid #2d3748; }
    .stat-card .val { font-size: 22px; font-weight: 700; color: #7c3aed; }
    .stat-card .lbl { font-size: 11px; color: #718096; margin-top: 2px; }
    .type-legend { margin-bottom: 16px; }
    .type-legend h3 { font-size: 12px; color: #718096; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .type-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; cursor: pointer; }
    .type-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .node-detail { display: none; }
    .node-detail.active { display: block; }
    .node-detail h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    .prop-row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 12px; }
    .prop-key { color: #718096; min-width: 80px; flex-shrink: 0; }
    .prop-val { color: #e2e8f0; word-break: break-all; }
    .relations-list { margin-top: 12px; }
    .relation-item { background: #0f1117; border: 1px solid #2d3748; border-radius: 6px; padding: 7px 10px; margin-bottom: 6px; font-size: 12px; }
    .relation-type { color: #f59e0b; font-weight: 600; }
    .relation-target { color: #60a5fa; }
    #toast { position: fixed; bottom: 20px; right: 20px; background: #065f46; color: #ecfdf5; padding: 10px 18px; border-radius: 8px; font-size: 13px; display: none; z-index: 1000; }
  </style>
</head>
<body>
<header>
  <h1>🕸️ Yehuda's Knowledge Graph</h1>

</header>
<div class="toolbar">

  <div class="filter-group">
    <label>Filter:</label>
    <select id="type-filter" onchange="applyFilter()"><option value="">All types</option></select>
  </div>
</div>
<div class="main">
  <div id="network"></div>
  <div class="sidebar">

      <div class="type-legend"><h3>Entity Types</h3><div id="legend"></div></div>

const TYPE_COLORS = {
  Person:'#7c3aed', Organization:'#2563eb', Document:'#059669',
  Action:'#d97706', Note:'#0891b2', Project:'#dc2626', Task:'#65a30d'
};
function typeColor(t){ return TYPE_COLORS[t]||'#6b7280'; }

let network=null, physicsEnabled=true;
let allNodes=new vis.DataSet(), allEdges=new vis.DataSet();
let rawEntities={}, rawRelations=[];

function getLabel(e){
  const p=e.properties||{};
  return p.name||p.title||p.content?.substring(0,28)||e.id;
}

function loadData(){
  for(const op of GRAPH_DATA){
    if(op.op==='create'&&op.entity){
      const e=op.entity;
      rawEntities[e.id]=e;
      const c=typeColor(e.type);
      allNodes.update({id:e.id,label:getLabel(e),group:e.type,
        color:{background:c,border:c,highlight:{background:c,border:'#fff'}},
        title:`<b>${e.type}</b><br>${JSON.stringify(e.properties,null,2)}`});
    } else if(op.op==='relate'&&op.from&&op.to){
      rawRelations.push({from:op.from,rel:op.rel,to:op.to});
      allEdges.update({id:`${op.from}-${op.rel}-${op.to}`,from:op.from,to:op.to,label:op.rel});
    }
  }
}

function initNetwork(){
  const container=document.getElementById('network');
  network=new vis.Network(container,{nodes:allNodes,edges:allEdges},{
    physics:{enabled:true,stabilization:{iterations:200},barnesHut:{gravitationalConstant:-3000,springLength:150}},
    nodes:{shape:'dot',size:18,font:{color:'#e2e8f0',size:12},borderWidth:2,shadow:true},
    edges:{arrows:{to:{enabled:true,scaleFactor:0.6}},color:{color:'#4a5568',highlight:'#7c3aed'},
      font:{color:'#a0aec0',size:10,align:'middle'},smooth:{type:'curvedCW',roundness:0.2},width:1.5},
    interaction:{hover:true}
  });
  network.on('selectNode',onSelectNode);
  network.on('deselectNode',()=>document.getElementById('node-detail').classList.remove('active'));
}

function onSelectNode(params){
  if(!params.nodes.length)return;
  const id=params.nodes[0], entity=rawEntities[id];
  if(!entity)return;
  document.getElementById('detail-title').textContent=`${entity.type}: ${getLabel(entity)}`;
  let propsHtml='';
  for(const[k,v]of Object.entries(entity.properties||{}))
    propsHtml+=`<div class="prop-row"><span class="prop-key">${k}</span><span class="prop-val">${v}</span></div>`;
  document.getElementById('detail-props').innerHTML=propsHtml;
  const related=rawRelations.filter(r=>r.from===id||r.to===id);
  let relHtml=related.length?'':'<div style="color:#4a5568;font-size:12px;">No relations</div>';
  for(const r of related){
    const isFrom=r.from===id, other=rawEntities[isFrom?r.to:r.from];
    relHtml+=`<div class="relation-item"><span class="relation-type">${isFrom?'→':'←'} ${r.rel}</span><br><span class="relation-target">${other?getLabel(other):(isFrom?r.to:r.from)}</span></div>`;
  }
  document.getElementById('detail-relations').innerHTML=relHtml;
  document.getElementById('node-detail').classList.add('active');
}

function updateUI(){
  const nodes=allNodes.get(), edges=allEdges.get();
  document.getElementById('stat-nodes').textContent=nodes.length;
  document.getElementById('stat-edges').textContent=edges.length;
  document.getElementById('stat-ops').textContent=GRAPH_DATA.length;
  const types=[...new Set(nodes.map(n=>n.group).filter(Boolean))];
  document.getElementById('stat-types').textContent=types.length;
  document.getElementById('stats-label').textContent=`${nodes.length} entities · ${edges.length} relations`;
  document.getElementById('legend').innerHTML=types.map(t=>
    `<div class="type-item" onclick="filterByType('${t}')">
      <div class="type-dot" style="background:${typeColor(t)}"></div>${t}
      <span style="color:#4a5568;font-size:11px;margin-left:auto">${nodes.filter(n=>n.group===t).length}</span>
    </div>`).join('');
  const sel=document.getElementById('type-filter');
  const cur=sel.value;
  sel.innerHTML='<option value="">All types</option>'+types.map(t=>`<option value="${t}" ${t===cur?'selected':''}>${t}</option>`).join('');
}

function filterByType(t){ document.getElementById('type-filter').value=t; applyFilter(); }
function applyFilter(){
  const type=document.getElementById('type-filter').value;
  allNodes.update(Object.values(rawEntities).map(e=>({id:e.id,hidden:type?e.type!==type:false})));
}
function fitGraph(){ if(network)network.fit({animation:true}); }
function togglePhysics(){
  physicsEnabled=!physicsEnabled;
  if(network)network.setOptions({physics:{enabled:physicsEnabled}});
  const t=document.getElementById('toast');
  t.textContent=physicsEnabled?'⚡ Physics ON':'🧊 Physics OFF';
  t.style.display='block'; setTimeout(()=>t.style.display='none',2000);
}

loadData(); initNetwork(); updateUI();
