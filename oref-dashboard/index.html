<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛡️ מתי בטוח לצאת?</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0a0f1e;
  color: #e0e6ff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== HERO / SEARCH SCREEN ===== */
#heroScreen {
  width: 100%;
  max-width: 520px;
  padding: 60px 24px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

.hero-icon { font-size: 3.5em; margin-bottom: 10px; }
.hero-title { font-size: 1.7em; color: #7eb3ff; font-weight: 700; text-align: center; }
.hero-sub { font-size: 0.88em; color: #556688; margin-top: 6px; margin-bottom: 36px; text-align: center; }

/* GPS Button */
#gpsBtn {
  width: 100%;
  background: linear-gradient(135deg, #1e4ba8, #2560cc);
  border: none; border-radius: 14px;
  color: white; font-size: 1.05em; font-weight: 600;
  padding: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: opacity 0.2s, transform 0.1s;
  margin-bottom: 16px;
}
#gpsBtn:hover { opacity: 0.9; }
#gpsBtn:active { transform: scale(0.98); }
#gpsBtn.loading { opacity: 0.7; pointer-events: none; }

.divider {
  width: 100%; display: flex; align-items: center; gap: 12px;
  color: #334466; font-size: 0.82em; margin-bottom: 16px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: #1e2d4d;
}

/* Search field */
.search-wrap { position: relative; width: 100%; margin-bottom: 8px; }
#searchInput {
  width: 100%;
  background: #111827; border: 2px solid #1e2d4d; border-radius: 14px;
  color: #e0e6ff; font-size: 1em;
  padding: 14px 16px 14px 48px;
  outline: none; transition: border-color 0.2s;
  text-align: right;
}
#searchInput:focus { border-color: #2a3f6e; }
#searchInput::placeholder { color: #334466; }
.search-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  font-size: 1.2em; pointer-events: none;
}
#searchBtn {
  width: 100%;
  background: #111827; border: 2px solid #1e2d4d; border-radius: 14px;
  color: #7eb3ff; font-size: 0.95em; font-weight: 600;
  padding: 13px;
  cursor: pointer; transition: border-color 0.2s;
  margin-top: 8px;
}
#searchBtn:hover { border-color: #2a3f6e; }

/* Dropdown */
#dropdown {
  position: absolute; top: calc(100% + 6px); right: 0; left: 0;
  background: #111827; border: 2px solid #1e2d4d; border-radius: 14px;
  max-height: 260px; overflow-y: auto;
  z-index: 100; display: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
#dropdown .drop-item {
  padding: 13px 16px;
  cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #1a2540;
  transition: background 0.1s;
}
#dropdown .drop-item:last-child { border-bottom: none; }
#dropdown .drop-item:hover { background: #1a2540; }
#dropdown .drop-name { font-size: 0.92em; }
#dropdown .drop-count {
  font-size: 0.8em; color: #556688;
  background: #1a2540; border-radius: 6px; padding: 2px 8px;
}
#dropdown .drop-item:hover .drop-count { background: #2a3a5e; }

#statusMsg {
  font-size: 0.82em; color: #556688; text-align: center; min-height: 20px; margin-top: 4px;
}

/* ===== RESULTS SCREEN ===== */
#resultsScreen { width: 100%; max-width: 900px; padding: 0 16px 40px; display: none; }

.results-header {
  background: #111827; border-bottom: 1px solid #1e2d4d;
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  position: sticky; top: 0; z-index: 50;
  flex-wrap: wrap;
}
.results-title { font-size: 1.1em; color: #7eb3ff; font-weight: 700; }
.results-sub { font-size: 0.76em; color: #556688; margin-top: 2px; }
#backBtn {
  background: #1a2540; border: 1px solid #2a3f6e; border-radius: 10px;
  color: #7eb3ff; font-size: 0.84em; padding: 7px 14px; cursor: pointer;
  white-space: nowrap;
}
#backBtn:hover { background: #2a3a5e; }

.big-count-card {
  background: linear-gradient(135deg, #111827, #0d1528);
  border: 1px solid #1e2d4d; border-radius: 18px;
  padding: 32px 20px; text-align: center; margin: 20px 0;
}
.big-count-label { font-size: 0.88em; color: #556688; margin-bottom: 8px; }
.big-count-num { font-size: 4em; font-weight: 800; color: #7eb3ff; line-height: 1; }
.big-count-period { font-size: 0.8em; color: #334466; margin-top: 8px; }
.big-count-avg { font-size: 0.92em; color: #8899bb; margin-top: 12px; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.card { background: #111827; border: 1px solid #1e2d4d; border-radius: 14px; padding: 18px; }
.card.wide { grid-column: 1 / -1; }
.card h2 { font-size: 0.95em; color: #7eb3ff; margin-bottom: 14px; }

/* Activities */
.activities { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.act-card { background: #0d1528; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid #1e2d4d; }
.act-icon { font-size: 2em; margin-bottom: 6px; }
.act-name { font-size: 0.8em; color: #8899bb; }
.act-best { font-size: 1.4em; font-weight: bold; margin: 6px 0 2px; }
.act-dur { font-size: 0.7em; color: #556688; }
.act-bar { height: 5px; background: #1a2540; border-radius: 3px; margin: 8px 0 4px; overflow: hidden; }
.act-fill { height: 100%; border-radius: 3px; }
.act-alts { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.alt-chip { background: #1a2540; border-radius: 5px; padding: 2px 7px; font-size: 0.72em; color: #7eb3ff; }

.c-safe { color: #22c55e; } .c-mod { color: #f59e0b; } .c-risky { color: #ef4444; }
.bg-safe { background: #22c55e; } .bg-mod { background: #f59e0b; } .bg-risky { background: #ef4444; }

/* Heatmap */
.hour-labels { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin-bottom: 4px; }
.hour-label { font-size: 0.54em; color: #556688; text-align: center; }
.hour-grid { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; }
.hour-cell { height: 36px; border-radius: 4px; cursor: pointer; }
.hour-cell:hover { opacity: 0.75; }

/* Best windows */
.bw { background: #0d2a0d; border: 1px solid #1a4d1a; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.bw h3 { color: #22c55e; font-size: 0.86em; margin-bottom: 8px; }
.bw-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.bw-chip { background: #1a3d1a; border-radius: 6px; padding: 4px 10px; font-size: 0.78em; color: #86efac; }

/* Danger */
.dr { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.dr-h { width: 48px; font-size: 0.8em; color: #ff6b6b; }
.dr-bar { flex: 1; background: #1a2540; border-radius: 4px; height: 13px; overflow: hidden; }
.dr-fill { height: 100%; background: linear-gradient(90deg, #cc2200, #ff4400); }
.dr-cnt { width: 34px; font-size: 0.74em; color: #ff6b6b; text-align: left; }

.chart-wrap { height: 200px; position: relative; }

.tooltip-box { position: fixed; background: #1a2540; border: 1px solid #2a3f6e; border-radius: 8px; padding: 8px 12px; font-size: 0.8em; pointer-events: none; z-index: 1000; display: none; }

/* Loading spinner */
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

footer { color: #2a3a5e; font-size: 0.7em; padding: 20px; text-align: center; }

@media (max-width: 500px) {
  .hero-title { font-size: 1.4em; }
  .big-count-num { font-size: 3em; }
  .hour-cell { height: 26px; }
  .hour-label { font-size: 0.44em; }
}
</style>
</head>
<body>

<!-- ===== HERO SCREEN ===== -->
<div id="heroScreen">
  <div class="hero-icon">🛡️</div>
  <div class="hero-title">מתי בטוח לצאת?</div>
  <div class="hero-sub">ניתוח אזעקות פיקוד העורף | 28.02.2026 - היום</div>

  <button id="gpsBtn" onclick="useGPS()">
    <span>📡</span>
    <span>השתמש במיקום שלי (GPS)</span>
  </button>

  <div class="divider">או</div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="הקלד שם ישוב..." oninput="onType()" onkeydown="onKey(event)" autocomplete="off" />
    <div id="dropdown"></div>
  </div>
  <button id="searchBtn" onclick="doSearch()">חפש מיקום</button>

  <div id="statusMsg">טוען נתונים...</div>
</div>

<!-- ===== RESULTS SCREEN ===== -->
<div id="resultsScreen">
  <div class="results-header">
    <div>
      <div class="results-title" id="resultsTitle">📍 </div>
      <div class="results-sub" id="resultsSub"></div>
    </div>
    <button id="backBtn" onclick="goBack()">← חזור לחיפוש</button>
  </div>

  <div id="resultsContent"></div>
</div>

<div class="tooltip-box" id="tip"></div>

<script>
// ===== CONSTANTS =====
const STORAGE_KEY = 'oref_v5';
const API = 'https://alerts-history.oref.org.il/Shared/Ajax/GetAlarmsHistory.aspx';
const START = '28.02.2026';
const ACTIVITIES = [
  { name: 'מקלחת',     icon: '🚿', dur: 15, desc: '~15 דקות' },
  { name: 'קניות סופר', icon: '🛒', dur: 60, desc: '~60 דקות' },
  { name: 'ריצה בחוץ',  icon: '🏃', dur: 45, desc: '~45 דקות' },
];

// ===== STATE =====
let allAlerts = [];
let locIndex = {};   // { "שדרות, איבים": [...], ... }
let locCounts = {};  // { "שדרות, איבים": 42, ... }
let sortedLocs = []; // sorted by name
let charts = {};
let dataReady = false;

// ===== STORAGE =====
function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { allAlerts = JSON.parse(raw); return true; }
  } catch {}
  return false;
}
function saveStorage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(allAlerts)); } catch {}
}

// ===== FETCH =====
async function fetchAlerts() {
  const today = todayOref();
  const url = `${API}?lang=he&fromDate=${START}&toDate=${today}&mode=1`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function todayOref() {
  const d = new Date();
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
}
function pad(n) { return String(n).padStart(2,'0'); }
function fmt(h) { return `${pad(h)}:00`; }

function mergeAlerts(data) {
  const rids = new Set(allAlerts.map(a => a.rid));
  let added = 0;
  for (const a of data) {
    if (!rids.has(a.rid)) { allAlerts.push(a); rids.add(a.rid); added++; }
  }
  return added;
}

function buildIndex() {
  locIndex = {};
  locCounts = {};
  for (const a of allAlerts) {
    const loc = a.data || '';
    if (!loc) continue;
    if (!locIndex[loc]) locIndex[loc] = [];
    locIndex[loc].push(a);
  }
  for (const [k, v] of Object.entries(locIndex)) locCounts[k] = v.length;
  sortedLocs = Object.keys(locIndex).sort();
}

// ===== SEARCH / FILTER =====
// Given user text, find matching locations (handles "שדרות" → "שדרות, איבים")
function matchLocs(query) {
  if (!query) return [];
  const q = query.trim();
  return sortedLocs.filter(l => l.includes(q)).sort((a,b) => {
    // Exact match first, then startsWith, then contains
    const ae = a === q, be = b === q;
    if (ae && !be) return -1; if (be && !ae) return 1;
    const as = a.startsWith(q), bs = b.startsWith(q);
    if (as && !bs) return -1; if (bs && !as) return 1;
    return (locCounts[b]||0) - (locCounts[a]||0); // most alerts first
  });
}

function getAlertsForQuery(query) {
  const matches = matchLocs(query);
  if (matches.length === 0) return { alerts: [], matchedLocs: [] };
  const combined = matches.flatMap(l => locIndex[l] || []);
  return { alerts: combined, matchedLocs: matches };
}

// ===== UI: DROPDOWN =====
function onType() {
  const q = document.getElementById('searchInput').value.trim();
  const dd = document.getElementById('dropdown');
  if (q.length < 1) { dd.style.display = 'none'; return; }

  const matches = matchLocs(q).slice(0, 20);
  if (!matches.length) {
    dd.innerHTML = '<div class="drop-item"><span class="drop-name" style="color:#556688">לא נמצאו תוצאות</span></div>';
    dd.style.display = 'block';
    return;
  }

  dd.innerHTML = matches.map(loc => `
    <div class="drop-item" onclick="selectLoc('${loc.replace(/'/g,"\\'")}')">
      <span class="drop-name">📍 ${loc}</span>
      <span class="drop-count">${(locCounts[loc]||0).toLocaleString()} אזעקות</span>
    </div>`).join('');
  dd.style.display = 'block';
}

function onKey(e) {
  if (e.key === 'Enter') doSearch();
  if (e.key === 'Escape') document.getElementById('dropdown').style.display = 'none';
}

function selectLoc(loc) {
  document.getElementById('searchInput').value = loc;
  document.getElementById('dropdown').style.display = 'none';
  showResults(loc);
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  document.getElementById('dropdown').style.display = 'none';
  if (!q) return;
  const { matchedLocs } = getAlertsForQuery(q);
  if (matchedLocs.length === 0) {
    setStatus(`⚠️ "${q}" לא נמצא. נסה שם אחר.`);
    return;
  }
  showResults(q);
}

// ===== GPS =====
async function useGPS() {
  const btn = document.getElementById('gpsBtn');
  btn.classList.add('loading');
  btn.innerHTML = '<div class="spinner"></div><span>מאתר מיקום...</span>';
  setStatus('');

  if (!navigator.geolocation) {
    setStatus('GPS לא זמין בדפדפן זה');
    resetGPS(); return;
  }

  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      setStatus('מזהה עיר...');
      const r = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&accept-language=he`
      );
      const d = await r.json();
      const city = d.address?.city || d.address?.town || d.address?.village || d.address?.suburb || '';
      resetGPS();
      if (!city) { setStatus('לא ניתן לזהות עיר מה-GPS'); return; }
      document.getElementById('searchInput').value = city;
      const { matchedLocs } = getAlertsForQuery(city);
      if (matchedLocs.length === 0) {
        setStatus(`📍 ${city} - לא נמצאו אזעקות (ייתכן שהעיר לא הופיעה בדיווחים)`);
      } else {
        showResults(city);
      }
    } catch(e) {
      setStatus('שגיאה בזיהוי מיקום'); resetGPS();
    }
  }, err => {
    setStatus(err.code === 1 ? 'לא אושר גישה ל-GPS' : 'שגיאת GPS');
    resetGPS();
  }, { timeout: 10000 });
}

function resetGPS() {
  const btn = document.getElementById('gpsBtn');
  btn.classList.remove('loading');
  btn.innerHTML = '<span>📡</span><span>השתמש במיקום שלי (GPS)</span>';
}

function setStatus(msg) { document.getElementById('statusMsg').textContent = msg; }

// ===== RESULTS =====
function goBack() {
  document.getElementById('heroScreen').style.display = 'flex';
  document.getElementById('resultsScreen').style.display = 'none';
  Object.values(charts).forEach(c => { try { c.destroy(); } catch {} });
  charts = {};
}

function showResults(query) {
  const { alerts: locAlerts, matchedLocs } = getAlertsForQuery(query);
  if (locAlerts.length === 0) { setStatus(`"${query}" - לא נמצאו אזעקות`); return; }

  // Switch screens
  document.getElementById('heroScreen').style.display = 'none';
  document.getElementById('resultsScreen').style.display = 'block';

  const locLabel = matchedLocs.length === 1 ? matchedLocs[0] : query;
  document.getElementById('resultsTitle').textContent = '📍 ' + locLabel;
  document.getElementById('resultsSub').textContent =
    `${locAlerts.length.toLocaleString()} אזעקות | 28.02.2026 - היום | ${allAlerts.length.toLocaleString()} סה"כ בכל הארץ`;

  // Destroy old charts
  Object.values(charts).forEach(c => { try { c.destroy(); } catch {} });
  charts = {};

  const hourly = computeHourly(locAlerts);
  const hourlyAll = computeHourly(allAlerts);
  const daily = computeDaily(locAlerts);
  const allDates = Object.keys(computeDaily(allAlerts)).sort();
  const max = Math.max(...hourly, 1);
  const days = Math.max(Object.keys(daily).length, 1);
  const quietest = hourly.indexOf(Math.min(...hourly));
  const busiest = hourly.indexOf(Math.max(...hourly));

  document.getElementById('resultsContent').innerHTML = `

    <!-- Big number -->
    <div class="big-count-card">
      <div class="big-count-label">מספר האזעקות ב${locLabel}</div>
      <div class="big-count-num">${locAlerts.length.toLocaleString()}</div>
      <div class="big-count-period">מה-28.02.2026 ועד היום</div>
      <div class="big-count-avg">ממוצע: ${(locAlerts.length/days).toFixed(1)} אזעקות ליום | הכי שקט: ${fmt(quietest)} | הכי עמוס: ${fmt(busiest)}</div>
    </div>

    <div class="grid">

      <!-- Heatmap -->
      <div class="card wide">
        <h2>🌡️ מפת חום - אזעקות לפי שעה</h2>
        <div class="hour-labels">${Array.from({length:24},(_,i)=>`<div class="hour-label">${pad(i)}</div>`).join('')}</div>
        <div class="hour-grid">${hourly.map((c,h)=>`
          <div class="hour-cell" style="background:${cellColor(c,max)}"
            onmouseenter="showTip(event,${h},${c})" onmouseleave="hideTip()"></div>`).join('')}
        </div>
        <div style="display:flex;gap:14px;font-size:0.68em;color:#556688;flex-wrap:wrap;margin-top:8px;">
          <span>🟢 שקט</span><span>🟡 בינוני</span><span>🔴 פעיל</span>
        </div>
      </div>

      <!-- Activities -->
      <div class="card wide">
        <h2>🎯 השעה הכי טובה לכל פעילות</h2>
        <div class="activities">
          ${ACTIVITIES.map(act => {
            const wins = bestWindows(hourly, act.dur, 4);
            const best = wins[0];
            return `<div class="act-card">
              <div class="act-icon">${act.icon}</div>
              <div class="act-name">${act.name}</div>
              <div class="act-best ${sc(best.score)}">${fmt(best.hour)}</div>
              <div class="act-dur">${act.desc}</div>
              <div class="act-bar"><div class="act-fill ${sb(best.score)}" style="width:${best.score}%"></div></div>
              <div style="font-size:0.68em;color:#556688;">ניקוד: ${best.score}/100</div>
              <div class="act-alts">${wins.slice(1).map(w=>`<div class="alt-chip">${fmt(w.hour)}</div>`).join('')}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Chart hourly -->
      <div class="card">
        <h2>📈 אזעקות לפי שעה</h2>
        <div class="chart-wrap"><canvas id="chartH"></canvas></div>
      </div>

      <!-- Chart daily -->
      <div class="card">
        <h2>📅 אזעקות לפי יום</h2>
        <div class="chart-wrap"><canvas id="chartD"></canvas></div>
      </div>

      <!-- Best windows -->
      <div class="card">
        <h2>✅ חלונות זמן מומלצים</h2>
        ${ACTIVITIES.map(act => {
          const wins = bestWindows(hourly, act.dur, 5);
          return `<div class="bw">
            <h3>${act.icon} ${act.name} (${act.desc}):</h3>
            <div class="bw-chips">${wins.map(w=>`<div class="bw-chip">${fmt(w.hour)} <span style="color:#4ade80">${w.score}%</span></div>`).join('')}</div>
          </div>`;
        }).join('')}
      </div>

      <!-- Danger hours -->
      <div class="card">
        <h2>⚠️ שעות סכנה</h2>
        ${[...hourly.map((c,h)=>({h,c}))].sort((a,b)=>b.c-a.c).slice(0,8).map(({h,c})=>`
          <div class="dr">
            <div class="dr-h">${fmt(h)}</div>
            <div class="dr-bar"><div class="dr-fill" style="width:${Math.round(c/max*100)}%"></div></div>
            <div class="dr-cnt">${c}</div>
          </div>`).join('')}
      </div>

    </div>
    <footer>נתונים: פיקוד העורף | ${locAlerts.length.toLocaleString()} אזעקות ב${locLabel} | ${allAlerts.length.toLocaleString()} סה"כ בכל הארץ</footer>
  `;

  // Charts
  const cOpts = { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
    scales:{ x:{ticks:{color:'#556688',font:{size:9}},grid:{color:'#1a2540'}}, y:{ticks:{color:'#556688'},grid:{color:'#1a2540'}} }};
  const maxH = Math.max(...hourly,1);
  const hEl = document.getElementById('chartH');
  if (hEl) charts.h = new Chart(hEl.getContext('2d'), { type:'bar', data:{
    labels: Array.from({length:24},(_,i)=>`${pad(i)}:00`),
    datasets:[{data:hourly, backgroundColor:hourly.map(c=>{const r=c/maxH;return r<0.2?'#22c55e88':r<0.5?'#f59e0b88':'#ef444488';}), borderRadius:4}]
  }, options:{...cOpts}});

  const dEl = document.getElementById('chartD');
  if (dEl) {
    const sortedDates = allDates;
    charts.d = new Chart(dEl.getContext('2d'), { type:'line', data:{
      labels: sortedDates.map(d=>d.slice(5)),
      datasets:[{
        data: sortedDates.map(d => {
          const oref = `${d.slice(8)}.${d.slice(5,7)}.${d.slice(0,4)}`;
          return daily[oref] || 0;
        }),
        borderColor:'#7eb3ff', backgroundColor:'#7eb3ff22',
        fill:true, tension:0.3, pointBackgroundColor:'#7eb3ff', pointRadius:4
      }]
    }, options:{...cOpts}});
  }

  window.scrollTo(0,0);
}

// ===== CALCULATIONS =====
function computeHourly(list) {
  const h = new Array(24).fill(0);
  for (const a of list) if (a.time) { const hr=parseInt(a.time); if(hr>=0&&hr<24) h[hr]++; }
  return h;
}
function computeDaily(list) {
  const d = {};
  for (const a of list) if (a.date) d[a.date] = (d[a.date]||0)+1;
  return d;
}
function safetyScore(h,dur,hourly) {
  const n=Math.ceil(dur/60); let tot=0;
  for(let i=0;i<n;i++) tot+=hourly[(h+i)%24]||0;
  return Math.max(0,Math.round(100-(tot/(Math.max(...hourly,1)*n))*100));
}
function bestWindows(hourly,dur,n=5) {
  return Array.from({length:24},(_,h)=>({hour:h,score:safetyScore(h,dur,hourly)})).sort((a,b)=>b.score-a.score).slice(0,n);
}
function cellColor(c,max) {
  if(c===0) return '#0d3d1a';
  const r=c/max;
  return r<0.15?'#1a5c1a':r<0.30?'#5c5c00':r<0.50?'#7a4000':r<0.70?'#993000':'#cc1a00';
}
function sc(s){return s>=70?'c-safe':s>=40?'c-mod':'c-risky';}
function sb(s){return s>=70?'bg-safe':s>=40?'bg-mod':'bg-risky';}

// ===== TOOLTIP =====
function showTip(e,h,c){
  const t=document.getElementById('tip');
  t.style.display='block'; t.style.left=(e.clientX+14)+'px'; t.style.top=(e.clientY-38)+'px';
  t.innerHTML=`<b>${pad(h)}:00 - ${pad((h+1)%24)}:00</b><br>${c} אזעקות`;
}
function hideTip(){document.getElementById('tip').style.display='none';}

document.addEventListener('click', e=>{
  if (!e.target.closest('.search-wrap')) document.getElementById('dropdown').style.display='none';
});

// ===== INIT =====
async function init() {
  loadStorage();
  try {
    const fresh = await fetchAlerts();
    const added = mergeAlerts(fresh);
    if (added > 0) saveStorage();
  } catch(e) { console.warn('Fetch failed:', e); }
  buildIndex();
  dataReady = true;
  const total = allAlerts.length;
  setStatus(total > 0 ? `✅ ${total.toLocaleString()} אזעקות נטענו | ${sortedLocs.length.toLocaleString()} יישובים` : '⚠️ לא ניתן לטעון נתונים');
}

init();
</script>
