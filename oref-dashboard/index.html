function pad(n) { return String(n).padStart(2, '0'); }

function getTodayStr() {
  const d = new Date();
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
}

function dateRange(from, to) {
  const dates = [];
  const d = parseDate(from);
  const end = parseDate(to);
  while (d <= end) {
    dates.push(`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`);
    d.setDate(d.getDate() + 1);
  }
  return dates;
}

function parseDate(str) {
  const [dd, mm, yyyy] = str.split('.');
  return new Date(+yyyy, +mm-1, +dd);
}

async function fetchDay(dateStr) {
  const url = `${OREF_BASE}?lang=he&fromDate=${dateStr}&toDate=${dateStr}&mode=1`;
  try {
    const r = await fetch(url);
    if (!r.ok) return [];
    const json = await r.json();
    return Array.isArray(json) ? json : [];
  } catch { return []; }
}

async function loadAllAlerts() {
  const today = getTodayStr();
  const dates = dateRange(START_DATE, today);
  const results = await Promise.all(dates.map(fetchDay));

}

// ========== PROCESSING ==========
function computeHourly(alerts) {
  const counts = new Array(24).fill(0);
  for (const a of alerts) {
    if (!a.time) continue;
    const h = parseInt(a.time.split(':')[0]);
    if (h >= 0 && h < 24) counts[h]++;
  }
  return counts;
}

function safetyScore(hour, durationMin, hourly) {
  // Check alerts in window [hour, hour+duration/60)
  const hours = Math.ceil(durationMin / 60);
  let total = 0;
  for (let i = 0; i < hours; i++) {
    total += (hourly[(hour + i) % 24] || 0);
  }
  const max = Math.max(...hourly, 1);
  // Score 0-100, lower alerts = higher score
  return Math.max(0, Math.round(100 - (total / (max * hours)) * 100));
}

function getScoreClass(score) {
  if (score >= 70) return 'safe';
  if (score >= 40) return 'moderate';
  return 'risky';
}

function getFillClass(score) {
  if (score >= 70) return 'fill-safe';
  if (score >= 40) return 'fill-moderate';
  return 'fill-risky';
}

function bestWindows(hourly, durationMin, n = 3) {
  const scores = [];
  for (let h = 0; h < 24; h++) {
    scores.push({ hour: h, score: safetyScore(h, durationMin, hourly) });
  }
  scores.sort((a, b) => b.score - a.score);
  return scores.slice(0, n);
}

function formatHour(h) {
  return `${pad(h)}:00`;
}

// ========== RENDER ==========
function colorFromCount(count, max) {
  if (max === 0) return '#1a2540';
  const ratio = count / max;
  if (ratio === 0) return '#0d3d1a';
  if (ratio < 0.2) return '#1a5c1a';
  if (ratio < 0.4) return '#7a5c00';
  if (ratio < 0.6) return '#9a4000';
  if (ratio < 0.8) return '#b32000';
  return '#cc0000';
}

  for (const d of dates) dayCounts[d] = 0;
  for (const a of filteredAlerts) {
    if (a.date && dayCounts[a.date] !== undefined) dayCounts[a.date]++;
  }

  const ctx = document.getElementById('chartDays').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: dates,
      datasets: [{
        label: '╫É╫û╫ó╫º╫ò╫¬ ╫£╫Ö╫ò╫¥',
        data: dates.map(d => dayCounts[d]),
        borderColor: '#7eb3ff',
        backgroundColor: '#7eb3ff22',
        fill: true,
        tension: 0.3,
        pointBackgroundColor: '#7eb3ff',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#556688', font: { size: 9 }, maxRotation: 45 }, grid: { color: '#1a2540' } },
        y: { ticks: { color: '#556688' }, grid: { color: '#1a2540' } }
      }
    }
  });
}

// ========== LOCATION ==========
function filterByLocation(loc) {
  if (!loc || loc === '╫¢╫£ ╫ö╫É╫¿╫Ñ') return allAlerts;
  const l = loc.trim().toLowerCase();
  return allAlerts.filter(a => a.data && a.data.includes(l));
}

function updateLocation() {
  const val = document.getElementById('locationInput').value.trim();
  currentLocation = val || '╫¢╫£ ╫ö╫É╫¿╫Ñ';
  document.getElementById('locationStatus').textContent = `╫₧╫Ö╫º╫ò╫¥: ${currentLocation}`;
  filteredAlerts = filterByLocation(currentLocation);
  if (filteredAlerts.length === 0 && val) {
    document.getElementById('locationStatus').textContent = `ΓÜá∩╕Å ╫£╫É ╫á╫₧╫ª╫É╫ò ╫É╫û╫ó╫º╫ò╫¬ ╫£"${val}" - ╫₧╫ª╫Ö╫Æ ╫¢╫£ ╫ö╫É╫¿╫Ñ`;
    filteredAlerts = allAlerts;
    currentLocation = '╫¢╫£ ╫ö╫É╫¿╫Ñ';
  }
  renderDashboard();
}

function useGPS() {
  document.getElementById('locationStatus').textContent = '≡ƒôí ╫₧╫É╫¬╫¿...';
  if (!navigator.geolocation) {
    document.getElementById('locationStatus').textContent = 'GPS ╫£╫É ╫û╫₧╫Ö╫ƒ';
    return;
  }
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=he`);
      const d = await r.json();
      const city = d.address?.city || d.address?.town || d.address?.village || d.address?.suburb || '';
      if (city) {
        document.getElementById('locationInput').value = city;
        document.getElementById('locationStatus').textContent = `≡ƒôì ${city}`;
        currentLocation = city;
        filteredAlerts = filterByLocation(city);
        if (filteredAlerts.length === 0) {
          filteredAlerts = allAlerts;
          currentLocation = '╫¢╫£ ╫ö╫É╫¿╫Ñ';
          document.getElementById('locationStatus').textContent = `≡ƒôì ${city} (╫₧╫ª╫Ö╫Æ ╫¢╫£ ╫ö╫É╫¿╫Ñ)`;
        }
        renderDashboard();
      }
    } catch {
      document.getElementById('locationStatus').textContent = '╫⌐╫Æ╫Ö╫É╫ö ╫æ╫û╫Ö╫ö╫ò╫Ö ╫₧╫Ö╫º╫ò╫¥';
    }
  }, () => {
    document.getElementById('locationStatus').textContent = '╫£╫É ╫É╫ò╫⌐╫¿ GPS';
  });
}

// ========== TOOLTIP ==========
function showTooltip(e, h, count) {
  const t = document.getElementById('tooltip');
  t.style.display = 'block';
  t.style.left = (e.clientX + 12) + 'px';
  t.style.top = (e.clientY - 30) + 'px';
  t.innerHTML = `<strong>${pad(h)}:00 - ${pad(h+1 < 24 ? h+1 : 0)}:00</strong><br>${count} ╫É╫û╫ó╫º╫ò╫¬`;
}
function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ========== INIT ==========
async function init() {
  document.getElementById('mainContent').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>╫ÿ╫ò╫ó╫ƒ ╫á╫¬╫ò╫á╫Ö ╫É╫û╫ó╫º╫ò╫¬ ╫₧╫ñ╫Ö╫º╫ò╫ô ╫ö╫ó╫ò╫¿╫ú...</div>
    </div>`;

  await loadAllAlerts();
  filteredAlerts = allAlerts;

  // Auto-GPS on load
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(async pos => {
      try {
        const { latitude: lat, longitude: lon } = pos.coords;
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=he`);
        const d = await r.json();
        const city = d.address?.city || d.address?.town || d.address?.village || '';
        if (city) {
          document.getElementById('locationInput').value = city;
          document.getElementById('locationStatus').textContent = `≡ƒôì ${city}`;
          currentLocation = city;
          const filtered = filterByLocation(city);
          if (filtered.length > 0) {
            filteredAlerts = filtered;
            currentLocation = city;
          }
        }
      } catch {}
      renderDashboard();
    }, () => { renderDashboard(); });
  } else {
    renderDashboard();
  }

  // Auto-refresh every 10 min
  setInterval(async () => {
    await loadAllAlerts();
    filteredAlerts = filterByLocation(currentLocation);
    if (filteredAlerts.length === 0) filteredAlerts = allAlerts;
    renderDashboard();
  }, 10 * 60 * 1000);
}

init();
</script>
