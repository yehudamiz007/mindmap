<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛡️ מתי בטוח לצאת? | פיקוד העורף</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="alerts_data.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0f1e; color: #e0e6ff; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #1a1f35, #0d1528);
    border-bottom: 2px solid #2a3a6e;
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 1.4em; color: #7eb3ff; }
  header .subtitle { font-size: 0.82em; color: #8899bb; margin-top: 3px; }

  .location-bar {
    background: #111827; border-bottom: 1px solid #1e2d4d;
    padding: 12px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .location-bar label { font-size: 0.85em; color: #7eb3ff; white-space: nowrap; }
  #locationInput {
    background: #1a2540; border: 1px solid #2a3f6e; border-radius: 8px;
    color: #e0e6ff; padding: 7px 12px; font-size: 0.9em; width: 200px;
  }
  #suggestions {
    position: absolute; background: #1a2540; border: 1px solid #2a3f6e; border-radius: 8px;
    max-height: 200px; overflow-y: auto; z-index: 100; min-width: 200px; display: none;
  }
  #suggestions div { padding: 7px 12px; cursor: pointer; font-size: 0.85em; }
  #suggestions div:hover { background: #2a3f6e; }
  .loc-wrap { position: relative; }
  .btn { background: #1e4ba8; border: none; border-radius: 8px; color: white; padding: 7px 14px; cursor: pointer; font-size: 0.85em; }
  .btn:hover { background: #2560cc; }
  #locationStatus { font-size: 0.78em; color: #556688; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  .card { background: #111827; border: 1px solid #1e2d4d; border-radius: 14px; padding: 18px; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 1em; color: #7eb3ff; margin-bottom: 14px; }

  /* Stats */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat-box { background: #0d1528; border-radius: 10px; padding: 12px; text-align: center; border: 1px solid #1e2d4d; }
  .stat-num { font-size: 1.5em; font-weight: bold; color: #7eb3ff; }
  .stat-label { font-size: 0.7em; color: #556688; margin-top: 3px; }

  /* Heatmap */
  .hour-labels { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin-bottom: 4px; }
  .hour-label { font-size: 0.58em; color: #556688; text-align: center; }
  .hour-grid { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin-bottom: 6px; }
  .hour-cell { height: 38px; border-radius: 4px; cursor: pointer; transition: opacity 0.1s; position: relative; }
  .hour-cell:hover { opacity: 0.8; }

  /* Activities */
  .activities { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; }
  .act-card { background: #0d1528; border-radius: 12px; padding: 16px; border: 1px solid #1e2d4d; text-align: center; }
  .act-icon { font-size: 2.2em; margin-bottom: 6px; }
  .act-name { font-size: 0.82em; color: #8899bb; }
  .act-best { font-size: 1.4em; font-weight: bold; margin: 6px 0 2px; }
  .act-dur { font-size: 0.72em; color: #556688; }
  .act-score-bar { height: 6px; background: #1a2540; border-radius: 3px; margin: 8px 0 4px; overflow: hidden; }
  .act-score-fill { height: 100%; border-radius: 3px; }
  .act-alts { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .alt-chip { background: #1a2540; border-radius: 5px; padding: 2px 8px; font-size: 0.75em; color: #7eb3ff; }

  /* Color classes */
  .c-safe { color: #22c55e; } .c-mod { color: #f59e0b; } .c-risky { color: #ef4444; }
  .bg-safe { background: #22c55e; } .bg-mod { background: #f59e0b; } .bg-risky { background: #ef4444; }

  /* Best windows */
  .best-win { background: #0d2a0d; border: 1px solid #1a4d1a; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .best-win h3 { color: #22c55e; font-size: 0.88em; margin-bottom: 8px; }
  .win-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .win-chip { background: #1a3d1a; border-radius: 6px; padding: 4px 10px; font-size: 0.8em; color: #86efac; }

  /* Danger bars */
  .danger-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .danger-hour { width: 50px; font-size: 0.82em; color: #ff6b6b; }
  .danger-bar-wrap { flex: 1; background: #1a2540; border-radius: 4px; height: 14px; overflow: hidden; }
  .danger-bar-fill { height: 100%; background: linear-gradient(90deg, #cc2200, #ff4400); }
  .danger-count { width: 36px; font-size: 0.75em; color: #ff6b6b; text-align: left; }

  .chart-wrap { position: relative; height: 200px; }

  /* Tooltip */
  .tooltip { position: fixed; background: #1a2540; border: 1px solid #2a3f6e; border-radius: 8px; padding: 8px 12px; font-size: 0.8em; pointer-events: none; z-index: 1000; display: none; }

  footer { text-align: center; padding: 20px; color: #334466; font-size: 0.73em; }

  @media (max-width: 600px) {
    .hour-cell { height: 26px; } .hour-label { font-size: 0.48em; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🛡️ מתי בטוח לצאת?</h1>
    <div class="subtitle">ניתוח אזעקות פיקוד העורף | 28.02.2026 - 03.03.2026</div>
  </div>
  <div style="font-size:0.72em; color:#556688;" id="dataInfo">טוען...</div>
</header>

<div class="location-bar">
  <label>📍 מיקום:</label>
  <div class="loc-wrap">
    <input type="text" id="locationInput" placeholder="הקלד עיר / ישוב..." oninput="onLocationInput()" />
    <div id="suggestions"></div>
  </div>
  <button class="btn" onclick="applyLocation()">עדכן</button>
  <button class="btn" onclick="useGPS()">📡 GPS</button>
  <button class="btn" style="background:#1a3a1a;" onclick="resetLocation()">🌍 כל הארץ</button>
  <span id="locationStatus">כל הארץ</span>
</div>

<div id="app"></div>
<div class="tooltip" id="tooltip"></div>

<script>
// ===================== STATE =====================
let currentLocation = 'כל הארץ';
let currentHourly = [];
let charts = {};

const ACTIVITIES = [
  { id: 'shower',   name: 'מקלחת',      icon: '🚿', duration: 15, desc: '~15 דקות' },
  { id: 'shopping', name: 'קניות סופר',  icon: '🛒', duration: 60, desc: '~60 דקות' },
  { id: 'running',  name: 'ריצה בחוץ',   icon: '🏃', duration: 45, desc: '~45 דקות' },
];

// ===================== INIT =====================
function init() {
  document.getElementById('dataInfo').textContent =
    `נתונים: ${ALERTS_DATA.total.toLocaleString()} אזעקות | ${ALERTS_DATA.unique_locations.length} יישובים`;
  currentHourly = ALERTS_DATA.hourly_all;
  render();

  // Auto-GPS
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(async pos => {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&accept-language=he`);
        const d = await r.json();
        const city = d.address?.city || d.address?.town || d.address?.village || '';
        if (city) setLocation(city);
      } catch {}
    }, () => {});
  }
}

// ===================== LOCATION =====================
function getHourlyForLocation(loc) {
  if (!loc || loc === 'כל הארץ') return ALERTS_DATA.hourly_all;
  // Exact match first
  if (ALERTS_DATA.locations[loc]) return ALERTS_DATA.locations[loc];
  // Partial match - find best
  const l = loc.trim();
  const matches = ALERTS_DATA.unique_locations.filter(u => u.includes(l) || l.includes(u.split(' ')[0]));
  if (matches.length === 0) return null;
  // Merge all matching locations
  const merged = new Array(24).fill(0);
  for (const m of matches) {
    const h = ALERTS_DATA.locations[m];
    if (h) h.forEach((v,i) => merged[i] += v);
  }
  return merged;
}

function setLocation(loc) {
  const hourly = getHourlyForLocation(loc);
  if (!hourly || hourly.every(v => v === 0)) {
    document.getElementById('locationStatus').textContent = `⚠️ "${loc}" - לא נמצאו אזעקות, מציג כל הארץ`;
    currentLocation = 'כל הארץ';
    currentHourly = ALERTS_DATA.hourly_all;
  } else {
    const total = hourly.reduce((a,b)=>a+b,0);
    currentLocation = loc;
    currentHourly = hourly;
    document.getElementById('locationStatus').textContent = `📍 ${loc} (${total} אזעקות)`;
    document.getElementById('locationInput').value = loc;
  }
  render();
}

function applyLocation() {
  const val = document.getElementById('locationInput').value.trim();
  if (!val) return resetLocation();
  setLocation(val);
  document.getElementById('suggestions').style.display = 'none';
}

function resetLocation() {
  currentLocation = 'כל הארץ';
  currentHourly = ALERTS_DATA.hourly_all;
  document.getElementById('locationStatus').textContent = '🌍 כל הארץ';
  document.getElementById('locationInput').value = '';
  render();
}

function onLocationInput() {
  const val = document.getElementById('locationInput').value.trim();
  const sug = document.getElementById('suggestions');
  if (val.length < 2) { sug.style.display = 'none'; return; }
  const matches = ALERTS_DATA.unique_locations.filter(u => u.includes(val)).slice(0, 12);
  if (matches.length === 0) { sug.style.display = 'none'; return; }
  sug.innerHTML = matches.map(m => `<div onclick="selectSuggestion('${m.replace(/'/g,"\\'")}')">📍 ${m}</div>`).join('');
  sug.style.display = 'block';
}

function selectSuggestion(loc) {
  document.getElementById('locationInput').value = loc;
  document.getElementById('suggestions').style.display = 'none';
  setLocation(loc);
}

async function useGPS() {
  document.getElementById('locationStatus').textContent = '📡 מאתר מיקום...';
  if (!navigator.geolocation) { document.getElementById('locationStatus').textContent = 'GPS לא זמין'; return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&accept-language=he`);
      const d = await r.json();
      const city = d.address?.city || d.address?.town || d.address?.village || '';
      if (city) setLocation(city);
      else document.getElementById('locationStatus').textContent = 'לא ניתן לזהות עיר';
    } catch { document.getElementById('locationStatus').textContent = 'שגיאה'; }
  }, () => { document.getElementById('locationStatus').textContent = 'GPS לא אושר'; });
}

// ===================== CALCULATIONS =====================
function safetyScore(startHour, durationMin, hourly) {
  const numHours = Math.ceil(durationMin / 60);
  let total = 0;
  for (let i = 0; i < numHours; i++) total += (hourly[(startHour + i) % 24] || 0);
  const max = Math.max(...hourly, 1) * numHours;
  return Math.max(0, Math.round(100 - (total / max) * 100));
}

function bestWindows(hourly, durationMin, n = 5) {
  return Array.from({length:24}, (_,h) => ({ hour: h, score: safetyScore(h, durationMin, hourly) }))
    .sort((a,b) => b.score - a.score).slice(0, n);
}

function scoreClass(s) { return s >= 70 ? 'c-safe' : s >= 40 ? 'c-mod' : 'c-risky'; }
function scoreBg(s) { return s >= 70 ? 'bg-safe' : s >= 40 ? 'bg-mod' : 'bg-risky'; }

function cellColor(count, max) {
  if (count === 0) return '#0d3d1a';
  const r = count / max;
  if (r < 0.15) return '#1a5c1a';
  if (r < 0.3)  return '#5c5c00';
  if (r < 0.5)  return '#7a4000';
  if (r < 0.7)  return '#993000';
  return '#cc1a00';
}

function pad(n) { return String(n).padStart(2,'0'); }
function fmt(h) { return `${pad(h)}:00`; }

// ===================== RENDER =====================
function render() {
  const hourly = currentHourly;
  const max = Math.max(...hourly, 1);
  const total = hourly.reduce((a,b)=>a+b,0);
  const quietest = hourly.indexOf(Math.min(...hourly));
  const busiest  = hourly.indexOf(Math.max(...hourly));
  const days = Object.keys(ALERTS_DATA.daily).length;

  const html = `
  <div class="grid">

    <!-- Stats -->
    <div class="card wide">
      <h2>📊 סטטיסטיקות - ${currentLocation}</h2>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num">${total.toLocaleString()}</div><div class="stat-label">אזעקות (${currentLocation})</div></div>
        <div class="stat-box"><div class="stat-num">${days}</div><div class="stat-label">ימים נבדקו</div></div>
        <div class="stat-box"><div class="stat-num">${Math.round(total/days).toLocaleString()}</div><div class="stat-label">ממוצע ליום</div></div>
        <div class="stat-box"><div class="stat-num c-safe">${fmt(quietest)}</div><div class="stat-label">🟢 הכי שקט</div></div>
        <div class="stat-box"><div class="stat-num c-risky">${fmt(busiest)}</div><div class="stat-label">🔴 הכי עמוס</div></div>
      </div>

      <div style="font-size:0.78em; color:#556688; margin-bottom:6px;">🌡️ מפת חום - אזעקות לפי שעה (העבר עכבר לפרטים)</div>
      <div class="hour-labels">${Array.from({length:24},(_,i)=>`<div class="hour-label">${pad(i)}</div>`).join('')}</div>
      <div class="hour-grid">
        ${hourly.map((c,h) => `<div class="hour-cell" style="background:${cellColor(c,max)}"
          onmouseenter="tip(event,${h},${c})" onmouseleave="hideTip()"></div>`).join('')}
      </div>
      <div style="display:flex;gap:16px;font-size:0.7em;color:#556688;flex-wrap:wrap;">
        <span>🟢 0 אזעקות</span><span>🟡 אזעקות בינוניות</span><span>🔴 אזעקות רבות</span>
      </div>
    </div>

    <!-- Activities -->
    <div class="card wide">
      <h2>🎯 השעה הכי טובה לכל פעילות - ${currentLocation}</h2>
      <div class="activities">
        ${ACTIVITIES.map(act => {
          const wins = bestWindows(hourly, act.duration, 4);
          const best = wins[0];
          const sc = scoreClass(best.score);
          const sb = scoreBg(best.score);
          return `<div class="act-card">
            <div class="act-icon">${act.icon}</div>
            <div class="act-name">${act.name}</div>
            <div class="act-best ${sc}">${fmt(best.hour)}</div>
            <div class="act-dur">${act.desc}</div>
            <div class="act-score-bar"><div class="act-score-fill ${sb}" style="width:${best.score}%"></div></div>
            <div style="font-size:0.7em;color:#556688;">ניקוד: ${best.score}/100</div>
            <div class="act-alts">
              ${wins.slice(1).map(w=>`<div class="alt-chip">${fmt(w.hour)}</div>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Chart hours -->
    <div class="card">
      <h2>📈 אזעקות לפי שעה - ${currentLocation}</h2>
      <div class="chart-wrap"><canvas id="chartH"></canvas></div>
    </div>

    <!-- Chart days -->
    <div class="card">
      <h2>📅 אזעקות לפי יום - כל הארץ</h2>
      <div class="chart-wrap"><canvas id="chartD"></canvas></div>
    </div>

    <!-- Safe windows -->
    <div class="card">
      <h2>✅ חלונות זמן מומלצים</h2>
      ${ACTIVITIES.map(act => {
        const wins = bestWindows(hourly, act.duration, 5);
        return `<div class="best-win">
          <h3>${act.icon} ${act.name} (${act.desc}):</h3>
          <div class="win-chips">
            ${wins.map(w=>`<div class="win-chip">${fmt(w.hour)} <span style="color:#4ade80">${w.score}%</span></div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Danger hours -->
    <div class="card">
      <h2>⚠️ שעות סכנה - הימנע</h2>
      ${[...hourly.map((c,h)=>({h,c}))].sort((a,b)=>b.c-a.c).slice(0,8).map(({h,c})=>`
        <div class="danger-row">
          <div class="danger-hour">${fmt(h)}</div>
          <div class="danger-bar-wrap"><div class="danger-bar-fill" style="width:${Math.round(c/max*100)}%"></div></div>
          <div class="danger-count">${c}</div>
        </div>`).join('')}
    </div>

  </div>
  <footer>נתונים: פיקוד העורף | 28.02.2026 - 03.03.2026 | ${ALERTS_DATA.unique_locations.length} יישובים | ${ALERTS_DATA.total.toLocaleString()} אזעקות</footer>
  `;

  document.getElementById('app').innerHTML = html;
  renderCharts(hourly);
}

function renderCharts(hourly) {
  // Destroy old charts
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  const defaults = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#556688', font: { size: 9 } }, grid: { color: '#1a2540' } },
      y: { ticks: { color: '#556688' }, grid: { color: '#1a2540' } }
    }
  };

  // Hourly bar
  const max = Math.max(...hourly, 1);
  charts.h = new Chart(document.getElementById('chartH').getContext('2d'), {
    type: 'bar',
    data: {
      labels: Array.from({length:24}, (_,i) => `${pad(i)}:00`),
      datasets: [{
        data: hourly,
        backgroundColor: hourly.map(c => {
          const r = c/max;
          return r < 0.2 ? '#22c55e88' : r < 0.5 ? '#f59e0b88' : '#ef444488';
        }),
        borderRadius: 4
      }]
    },
    options: { ...defaults }
  });

  // Daily line
  const dailyDates = Object.keys(ALERTS_DATA.daily).sort();
  charts.d = new Chart(document.getElementById('chartD').getContext('2d'), {
    type: 'line',
    data: {
      labels: dailyDates,
      datasets: [{
        data: dailyDates.map(d => ALERTS_DATA.daily[d]),
        borderColor: '#7eb3ff', backgroundColor: '#7eb3ff22',
        fill: true, tension: 0.3, pointBackgroundColor: '#7eb3ff'
      }]
    },
    options: { ...defaults }
  });
}

// ===================== TOOLTIP =====================
function tip(e, h, c) {
  const t = document.getElementById('tooltip');
  t.style.display = 'block';
  t.style.left = (e.clientX + 12) + 'px';
  t.style.top = (e.clientY - 35) + 'px';
  t.innerHTML = `<b>${pad(h)}:00–${pad((h+1)%24)}:00</b><br>${c} אזעקות`;
}
function hideTip() { document.getElementById('tooltip').style.display = 'none'; }

// Close suggestions on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.loc-wrap')) document.getElementById('suggestions').style.display = 'none';
});

init();
</script>
</body>
</html>
