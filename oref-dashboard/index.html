<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#x1F6E1;&#xFE0F; מתי בטוח לצאת?</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0b0f1a;
  color: #dde6ff;
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  background: #111827;
  border-bottom: 1px solid #1e2d4d;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.header-icon { font-size: 2em; }
.header-title { font-size: 1.4em; font-weight: 700; color: #7eb3ff; }
.header-sub { font-size: 0.8em; color: #556688; margin-top: 2px; }

/* ── SEARCH BAR ── */
.search-section {
  background: #111827;
  border-bottom: 1px solid #1e2d4d;
  padding: 14px 24px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.search-wrap { position: relative; flex: 1; min-width: 200px; }
#cityInput {
  width: 100%;
  background: #0b0f1a;
  border: 2px solid #1e2d4d;
  border-radius: 10px;
  color: #dde6ff;
  font-size: 1em;
  padding: 11px 16px;
  outline: none;
  transition: border-color 0.2s;
  text-align: right;
}
#cityInput:focus { border-color: #3a5fa8; }
#cityInput::placeholder { color: #334466; }

#dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0; left: 0;
  background: #111827;
  border: 1.5px solid #1e2d4d;
  border-radius: 10px;
  max-height: 240px;
  overflow-y: auto;
  z-index: 200;
  display: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
.drop-item {
  padding: 12px 16px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #1a2540;
  transition: background 0.1s;
}
.drop-item:last-child { border-bottom: none; }
.drop-item:hover { background: #1a2d50; }
.drop-name { font-size: 0.9em; }
.drop-count { font-size: 0.75em; color: #7eb3ff; background: #1a2540; border-radius: 5px; padding: 2px 8px; }

.btn {
  background: #1e3a7a;
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 0.95em;
  font-weight: 600;
  padding: 11px 20px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s;
}
.btn:hover { background: #2a4f9f; }
.btn.secondary {
  background: #1a2540;
  border: 1.5px solid #2a3f6e;
  color: #7eb3ff;
}
.btn.secondary:hover { background: #1e2d50; }

/* ── STATUS BAR ── */
#statusBar {
  background: #0d1220;
  border-bottom: 1px solid #1a2030;
  padding: 8px 24px;
  font-size: 0.8em;
  color: #556688;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
#statusBar .dot { width: 7px; height: 7px; border-radius: 50%; background: #556688; flex-shrink: 0; }
#statusBar .dot.green { background: #22c55e; }
#statusBar .dot.yellow { background: #f59e0b; }
#syncBtn {
  margin-right: auto;
  background: none;
  border: 1px solid #1e2d4d;
  border-radius: 6px;
  color: #556688;
  font-size: 0.8em;
  padding: 3px 10px;
  cursor: pointer;
}
#syncBtn:hover { color: #7eb3ff; border-color: #3a5fa8; }

/* ── MAIN CONTENT ── */
#mainContent {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

/* ── EMPTY STATE ── */
#emptyState {
  text-align: center;
  padding: 80px 20px;
}
.empty-icon { font-size: 4em; margin-bottom: 16px; }
.empty-title { font-size: 1.3em; color: #7eb3ff; margin-bottom: 8px; }
.empty-sub { font-size: 0.88em; color: #556688; }

/* ── CITY HERO ── */
.city-hero {
  background: linear-gradient(135deg, #111827, #0d1528);
  border: 1px solid #1e2d4d;
  border-radius: 16px;
  padding: 28px 24px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
.city-name { font-size: 1.8em; font-weight: 800; color: #7eb3ff; }
.city-meta { font-size: 0.82em; color: #556688; margin-top: 4px; }
.stat-chips { display: flex; gap: 12px; flex-wrap: wrap; }
.stat-chip {
  background: #1a2540;
  border: 1px solid #2a3f6e;
  border-radius: 10px;
  padding: 10px 18px;
  text-align: center;
}
.stat-chip .num { font-size: 1.6em; font-weight: 800; color: #7eb3ff; }
.stat-chip .lbl { font-size: 0.7em; color: #556688; margin-top: 2px; }

/* ── ACTIVITIES ── */
.section-title {
  font-size: 1em;
  font-weight: 700;
  color: #8899bb;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid #1e2d4d;
  display: flex;
  align-items: center;
  gap: 8px;
}

.activities-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.act-card {
  background: #111827;
  border: 1px solid #1e2d4d;
  border-radius: 14px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.act-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 4px;
  height: 100%;
  border-radius: 0 14px 14px 0;
}
.act-card.safe::before { background: #22c55e; }
.act-card.mod::before { background: #f59e0b; }
.act-card.risky::before { background: #ef4444; }

.act-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.act-icon { font-size: 1.8em; }
.act-name { font-size: 1em; font-weight: 700; }
.act-dur { font-size: 0.75em; color: #556688; }

.best-time {
  font-size: 2.6em;
  font-weight: 900;
  line-height: 1;
  margin-bottom: 4px;
}
.best-time.safe { color: #22c55e; }
.best-time.mod { color: #f59e0b; }
.best-time.risky { color: #ef4444; }

.score-bar {
  height: 6px;
  background: #1a2540;
  border-radius: 3px;
  margin: 10px 0 12px;
  overflow: hidden;
}
.score-fill { height: 100%; border-radius: 3px; transition: width 0.6s; }
.score-fill.safe { background: linear-gradient(90deg, #16a34a, #22c55e); }
.score-fill.mod { background: linear-gradient(90deg, #d97706, #f59e0b); }
.score-fill.risky { background: linear-gradient(90deg, #dc2626, #ef4444); }

.score-label { font-size: 0.72em; color: #556688; margin-bottom: 12px; }

.alt-windows { display: flex; flex-wrap: wrap; gap: 6px; }
.alt-chip {
  background: #1a2540;
  border: 1px solid #2a3f6e;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 0.75em;
  color: #8899bb;
}
.alt-chip span { color: #4ade80; font-size: 0.85em; margin-right: 3px; }

/* ── HEATMAP ── */
.heatmap-card {
  background: #111827;
  border: 1px solid #1e2d4d;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 28px;
}
.hour-row {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 3px;
  margin-bottom: 3px;
}
.hour-lbl { font-size: 0.5em; color: #556688; text-align: center; }
.hour-cell {
  height: 40px;
  border-radius: 5px;
  cursor: default;
  position: relative;
  transition: opacity 0.15s;
}
.hour-cell:hover { opacity: 0.75; }

.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.72em;
  color: #556688;
  margin-top: 10px;
}
.legend-bar {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, #0d3d1a, #1a5c1a, #5c5c00, #7a4000, #cc1a00);
}

/* ── CHARTS ── */
.charts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.chart-card {
  background: #111827;
  border: 1px solid #1e2d4d;
  border-radius: 14px;
  padding: 20px;
}
.chart-card h3 { font-size: 0.88em; color: #8899bb; margin-bottom: 14px; }
.chart-wrap { height: 180px; position: relative; }

/* ── DANGER TABLE ── */
.danger-card {
  background: #111827;
  border: 1px solid #1e2d4d;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 28px;
}
.danger-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.danger-hour { width: 52px; font-size: 0.82em; color: #ff6b6b; font-weight: 600; }
.danger-bar-wrap { flex: 1; background: #1a2030; border-radius: 4px; height: 14px; overflow: hidden; }
.danger-bar-fill { height: 100%; background: linear-gradient(90deg, #7f1d1d, #ef4444); border-radius: 4px; }
.danger-count { width: 38px; font-size: 0.78em; color: #ff6b6b; text-align: left; }

/* ── TOOLTIP ── */
#tooltip {
  position: fixed;
  background: #1a2540;
  border: 1px solid #3a5fa8;
  border-radius: 8px;
  padding: 8px 13px;
  font-size: 0.8em;
  pointer-events: none;
  z-index: 999;
  display: none;
  white-space: nowrap;
}

/* ── SPINNER ── */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(126,179,255,0.3);
  border-top-color: #7eb3ff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .header-title { font-size: 1.15em; }
  .best-time { font-size: 2em; }
  .hour-cell { height: 28px; }
  .hour-lbl { font-size: 0.4em; }
  .city-name { font-size: 1.4em; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-icon">&#x1F6E1;&#xFE0F;</div>
  <div>
    <div class="header-title">מתי בטוח לצאת?</div>
    <div class="header-sub">ניתוח אזעקות פיקוד העורף לפי מיקום</div>
  </div>
</div>

<!-- SEARCH -->
<div class="search-section">
  <div class="search-wrap">
    <input type="text" id="cityInput" placeholder="&#x1F50D; חפש ישוב..." autocomplete="off"
      oninput="onType()" onkeydown="onKey(event)" />
    <div id="dropdown"></div>
  </div>
  <button class="btn secondary" onclick="useGPS()">&#x1F4E1; GPS</button>
  <button class="btn" onclick="doSearch()">חפש</button>
</div>

<!-- STATUS -->
<div id="statusBar">
  <div class="dot" id="statusDot"></div>
  <span id="statusText">טוען נתונים...</span>
  <button id="syncBtn" onclick="syncNow()">&#x1F504; סנכרן</button>
</div>

<!-- CONTENT -->
<div id="mainContent">
  <div id="emptyState">
    <div class="empty-icon">&#x1F4CD;</div>
    <div class="empty-title">בחר ישוב לניתוח</div>
    <div class="empty-sub">חפש ישוב בשורת החיפוש או השתמש ב-GPS</div>
  </div>
  <div id="results" style="display:none"></div>
</div>

<div id="tooltip"></div>

<script>
// ════════════════════════════════════
//  CONFIG
// ════════════════════════════════════
const STORAGE_KEY = 'oref_alerts_v2';
const API_URL = 'https://api.tzevaadom.co.il/alerts-history/';
const FROM_TS = new Date('2026-02-28T00:00:00Z').getTime() / 1000;

const ACTIVITIES = [
  { id: 'shower',   icon: '&#x1F6BF;', name: 'מקלחת',      dur: 20, desc: '20 דקות', minHour: 0,  maxHour: 23, hoursNote: 'כל שעה' },
  { id: 'run',      icon: '&#x1F3C3;', name: 'ריצה בחוץ',   dur: 45, desc: '45 דקות', minHour: 6,  maxHour: 19, hoursNote: '06:00-20:00' },
  { id: 'grocery',  icon: '&#x1F6D2;', name: 'קניות בסופר', dur: 60, desc: '60 דקות', minHour: 6,  maxHour: 20, hoursNote: '06:00-21:00' },
];

// ════════════════════════════════════
//  STATE
// ════════════════════════════════════
// allAlerts: flat array of { city, time, threat }
// time = unix timestamp (seconds)
let allAlerts = [];
let locMap = {};        // { "שדרות": [alerts] }
let locList = [];       // sorted city names
let activeChart1 = null, activeChart2 = null;

// ════════════════════════════════════
//  STORAGE
// ════════════════════════════════════
function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { allAlerts = JSON.parse(raw); return true; }
  } catch(e) {}
  return false;
}

function saveToStorage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(allAlerts)); } catch(e) {}
}

// ════════════════════════════════════
//  FETCH & MERGE
// ════════════════════════════════════

// Convert tzevaadom group format to flat alert records
function flattenGroups(groups) {
  const flat = [];
  for (const group of groups) {
    for (const alert of (group.alerts || [])) {
      if (alert.isDrill) continue;
      if (alert.time < FROM_TS) continue;
      for (const city of (alert.cities || [])) {
        flat.push({ city, time: alert.time, threat: alert.threat || 1 });
      }
    }
  }
  return flat;
}

// Load seed file (same-origin, no CORS)
async function fetchSeed() {
  const res = await fetch('./alerts_seed.json');
  if (!res.ok) throw new Error('seed ' + res.status);
  const data = await res.json();
  // Seed may be flat already or group format
  if (Array.isArray(data) && data[0] && data[0].city) return data; // flat
  return flattenGroups(data); // group format
}

// Fetch latest from tzevaadom API
async function fetchLatest() {
  const res = await fetch(API_URL, {
    headers: { 'Referer': 'https://www.tzevaadom.co.il/' }
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const groups = await res.json();
  return flattenGroups(groups);
}

// Merge by city+time (dedup)
function mergeNew(incoming) {
  const keys = new Set(allAlerts.map(a => `${a.city}|${a.time}`));
  let added = 0;
  for (const a of incoming) {
    const k = `${a.city}|${a.time}`;
    if (!keys.has(k)) {
      allAlerts.push(a);
      keys.add(k);
      added++;
    }
  }
  return added;
}

function buildLocMap() {
  locMap = {};
  for (const a of allAlerts) {
    const loc = (a.city || '').trim();
    if (!loc) continue;
    if (!locMap[loc]) locMap[loc] = [];
    locMap[loc].push(a);
  }
  locList = Object.keys(locMap).sort();
}

// ════════════════════════════════════
//  DATE HELPERS
// ════════════════════════════════════
function pad(n) { return String(n).padStart(2, '0'); }
function fmtHour(h) { return `${pad(h)}:00`; }
function tsToDate(ts) {
  const d = new Date(ts * 1000);
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
}
function tsToHour(ts) {
  return new Date(ts * 1000).getHours();
}
function tsToDateKey(ts) {
  const d = new Date(ts * 1000);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function getDateRange() {
  if (!allAlerts.length) return null;
  const times = allAlerts.map(a => a.time).filter(Boolean);
  const minTs = Math.min(...times);
  const maxTs = Math.max(...times);
  const days = new Set(allAlerts.map(a => tsToDateKey(a.time))).size;
  return { from: tsToDate(minTs), to: tsToDate(maxTs), days };
}

// ════════════════════════════════════
//  SEARCH / MATCH
// ════════════════════════════════════
// Normalize Hebrew text for fuzzy matching
// Strips separators (comma, dash, slash) and extra whitespace
function normalize(s) {
  return s
    .replace(/[,،\-–—\/]+/g, ' ')  // replace all separators with space
    .replace(/[״׳"'«»]+/g, '')      // remove quotes
    .replace(/\s+/g, ' ')           // collapse whitespace
    .trim();
}

// Extract all meaningful words (length > 1) from a string
function words(s) {
  return normalize(s).split(' ').filter(w => w.length > 1);
}

// Score how well query matches a location (higher = better match)
function matchScore(loc, query) {
  const locN = normalize(loc);
  const qN   = normalize(query);

  // Exact normalized match
  if (locN === qN) return 100;
  // Location starts with query (e.g. "תל אביב" matches "תל אביב - מרכז")
  if (locN.startsWith(qN)) return 90;
  // Query starts with location
  if (qN.startsWith(locN)) return 85;
  // Location contains full query string
  if (locN.includes(qN)) return 80;
  // Query contained in location
  if (qN.includes(locN)) return 75;

  // Word-level: every query word appears (or starts) in location
  const qWords = words(query);
  const lWords = words(loc);
  const allMatch = qWords.every(qw =>
    lWords.some(lw => lw.startsWith(qw) || qw.startsWith(lw))
  );
  if (allMatch && qWords.length > 0) return 60;

  // At least one significant word matches
  const anyMatch = qWords.filter(qw => qw.length > 2).some(qw =>
    lWords.some(lw => lw.startsWith(qw) || qw.startsWith(lw))
  );
  if (anyMatch) return 30;

  return 0;
}

function searchLocs(query) {
  if (!query) return [];
  const q = query.trim();
  if (q.length < 1) return [];

  const scored = locList
    .map(loc => ({ loc, score: matchScore(loc, q) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score || (locMap[b.loc]?.length||0) - (locMap[a.loc]?.length||0));

  return scored.map(x => x.loc);
}

function getAlertsFor(query) {
  const matches = searchLocs(query);
  if (!matches.length) return { alerts: [], locs: [] };
  return {
    alerts: matches.flatMap(l => locMap[l] || []),
    locs: matches
  };
}

// ════════════════════════════════════
//  ANALYSIS
// ════════════════════════════════════
function buildHourly(alerts) {
  const h = new Array(24).fill(0);
  for (const a of alerts) {
    if (!a.time) continue;
    h[tsToHour(a.time)]++;
  }
  return h;
}

function buildDaily(alerts) {
  const d = {};
  for (const a of alerts) {
    if (!a.time) continue;
    const key = tsToDateKey(a.time);
    d[key] = (d[key] || 0) + 1;
  }
  return d;
}

// Score a window of `durMins` minutes starting at hour `h`
// Returns 0-100 (100 = perfectly safe)
function windowScore(h, durMins, hourly) {
  const slots = Math.ceil(durMins / 60);
  const maxPossible = Math.max(...hourly, 1) * slots;
  let total = 0;
  for (let i = 0; i < slots; i++) total += hourly[(h + i) % 24] || 0;
  const danger = total / maxPossible;
  return Math.max(0, Math.round((1 - danger) * 100));
}

// minHour/maxHour = allowed start-hour range (inclusive)
// maxHour means the activity must START by maxHour so it finishes within reason
function bestWindows(durMins, hourly, n = 5, minHour = 0, maxHour = 23) {
  const candidates = [];
  for (let h = minHour; h <= maxHour; h++) {
    // Make sure the window doesn't run past midnight for outdoor activities
    const endHour = h + Math.ceil(durMins / 60) - 1;
    if (maxHour < 23 && endHour > maxHour) continue;
    candidates.push({ hour: h, score: windowScore(h, durMins, hourly) });
  }
  return candidates.sort((a, b) => b.score - a.score).slice(0, n);
}

function scoreClass(s) { return s >= 70 ? 'safe' : s >= 40 ? 'mod' : 'risky'; }

function cellColor(c, max) {
  if (c === 0) return '#0d2a12';
  const r = c / max;
  if (r < 0.15) return '#1a5c20';
  if (r < 0.30) return '#5c6000';
  if (r < 0.50) return '#7a4000';
  if (r < 0.70) return '#993000';
  return '#cc1a00';
}

// ════════════════════════════════════
//  UI - DROPDOWN
// ════════════════════════════════════
function onType() {
  const q = document.getElementById('cityInput').value;
  const dd = document.getElementById('dropdown');
  if (q.length < 1) { dd.style.display = 'none'; return; }

  const matches = searchLocs(q).slice(0, 25);
  if (!matches.length) {
    dd.innerHTML = '<div class="drop-item"><span class="drop-name" style="color:#556688">לא נמצאו תוצאות</span></div>';
  } else {
    dd.innerHTML = matches.map(loc =>
      `<div class="drop-item" onclick="selectLoc('${loc.replace(/'/g, "\\'")}')">
        <span class="drop-name">&#x1F4CD; ${loc}</span>
        <span class="drop-count">${(locMap[loc]?.length || 0).toLocaleString()} אזעקות</span>
      </div>`
    ).join('');
  }
  dd.style.display = 'block';
}

function onKey(e) {
  if (e.key === 'Enter') { document.getElementById('dropdown').style.display = 'none'; doSearch(); }
  if (e.key === 'Escape') document.getElementById('dropdown').style.display = 'none';
}

function selectLoc(loc) {
  document.getElementById('cityInput').value = loc;
  document.getElementById('dropdown').style.display = 'none';
  showResults(loc);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) document.getElementById('dropdown').style.display = 'none';
});

// ════════════════════════════════════
//  UI - SEARCH & GPS
// ════════════════════════════════════
function doSearch() {
  const q = document.getElementById('cityInput').value.trim();
  if (!q) return;
  const { locs } = getAlertsFor(q);
  if (!locs.length) {
    setStatus('warn', `"${q}" לא נמצא בנתונים`);
    return;
  }
  showResults(q);
}

async function useGPS() {
  if (!navigator.geolocation) { setStatus('warn', 'GPS לא זמין'); return; }
  setStatus('load', 'מאתר מיקום...');
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      // Try Hebrew first, then English as fallback
      const tryLangs = ['he', 'en'];
      let city = '';
      let allCandidates = [];

      for (const lang of tryLangs) {
        const r = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&accept-language=${lang}`
        );
        const d = await r.json();
        const addr = d.address || {};
        const raw = [
          addr.city, addr.town, addr.village, addr.suburb,
          addr.municipality, addr.county
        ].filter(Boolean);
        // Also add first-word variants (e.g. "תל אביב - יפו" → "תל אביב")
        const candidates = [];
        for (const c of raw) {
          candidates.push(c);
          // Strip everything after dash/comma
          const stripped = c.split(/[\-,–]/)[0].trim();
          if (stripped && stripped !== c) candidates.push(stripped);
        }
        allCandidates.push(...candidates);
        if (!city && candidates.length) city = candidates[0];
      }

      if (!city) { setStatus('warn', 'לא ניתן לזהות עיר'); return; }

      // Try all candidates until we find a match
      let matched = '';
      for (const candidate of allCandidates) {
        const { locs } = getAlertsFor(candidate);
        if (locs.length) { matched = candidate; break; }
      }

      if (matched) {
        document.getElementById('cityInput').value = matched;
        document.getElementById('dropdown').style.display = 'none';
        showResults(matched);
        updateStatusBar();
      } else {
        // Show what GPS returned + open dropdown with closest matches
        document.getElementById('cityInput').value = city;
        setStatus('warn', `GPS: "${city}" — לא נמצא בדיוק, בחר מהרשימה:`);
        // Try broader search - take first word of each candidate
        const words = [...new Set(allCandidates.flatMap(c =>
          normalize(c).split(/\s+/).filter(w => w.length > 1)
        ))];
        let suggestions = [];
        for (const w of words) {
          suggestions.push(...searchLocs(w));
        }
        suggestions = [...new Set(suggestions)].slice(0, 15);
        const dd = document.getElementById('dropdown');
        if (suggestions.length) {
          dd.innerHTML = suggestions.map(loc =>
            `<div class="drop-item" onclick="selectLoc('${loc.replace(/'/g,"\\'")}')">
              <span class="drop-name">&#x1F4CD; ${loc}</span>
              <span class="drop-count">${(locMap[loc]?.length||0).toLocaleString()} אזעקות</span>
            </div>`
          ).join('');
          dd.style.display = 'block';
        }
      }
    } catch(e) { setStatus('warn', 'שגיאה בזיהוי מיקום'); }
  }, () => setStatus('warn', 'לא אושרה גישה ל-GPS'), { timeout: 10000 });
}

// ════════════════════════════════════
//  STATUS BAR
// ════════════════════════════════════
function setStatus(type, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'dot ' + (type === 'ok' ? 'green' : type === 'warn' ? 'yellow' : '');
  txt.innerHTML = type === 'load' ? `<span class="spinner"></span> ${text}` : text;
}

function updateStatusBar() {
  const range = getDateRange();
  if (range) {
    const count = allAlerts.length.toLocaleString();
    const locs = locList.length.toLocaleString();
    setStatus('ok', `${count} אזעקות | ${range.days} ימים (${range.from} &#x2013; ${range.to}) | ${locs} ישובים`);
  }
}

// ════════════════════════════════════
//  SYNC
// ════════════════════════════════════
async function syncNow() {
  setStatus('load', 'מסנכרן...');
  let added = 0;
  // Try seed first
  try {
    const seed = await fetchSeed();
    added += mergeNew(seed);
  } catch(e) {}
  // Try live API
  try {
    const fresh = await fetchLatest();
    added += mergeNew(fresh);
  } catch(e) {}

  if (added > 0) saveToStorage();
  buildLocMap();
  updateStatusBar();
  setStatus('ok', added > 0 ? `נוספו ${added} רשומות | ${allAlerts.length.toLocaleString()} סה"כ` : `עדכני | ${allAlerts.length.toLocaleString()} רשומות`);
}

// ════════════════════════════════════
//  RESULTS RENDERER
// ════════════════════════════════════
function showResults(query) {
  const { alerts, locs } = getAlertsFor(query);
  if (!alerts.length) { setStatus('warn', `"${query}" - לא נמצאו אזעקות`); return; }

  const label = locs.length === 1 ? locs[0] : query;
  const hourly = buildHourly(alerts);
  const daily  = buildDaily(alerts);
  const maxH   = Math.max(...hourly, 1);
  const range  = getDateRange();
  const locRange = (() => {
    const times = alerts.map(a => a.time).filter(Boolean);
    if (!times.length) return null;
    const days = new Set(alerts.map(a => tsToDateKey(a.time))).size;
    return { from: tsToDate(Math.min(...times)), to: tsToDate(Math.max(...times)), days };
  })();

  // Destroy old charts
  if (activeChart1) { activeChart1.destroy(); activeChart1 = null; }
  if (activeChart2) { activeChart2.destroy(); activeChart2 = null; }

  // Build activities HTML
  const activitiesHTML = ACTIVITIES.map(act => {
    const wins = bestWindows(act.dur, hourly, 5, act.minHour, act.maxHour);
    const best = wins[0];
    const cls = scoreClass(best.score);
    return `
      <div class="act-card ${cls}">
        <div class="act-header">
          <div class="act-icon">${act.icon}</div>
          <div>
            <div class="act-name">${act.name}</div>
            <div class="act-dur">${act.desc} &bull; ${act.hoursNote}</div>
          </div>
        </div>
        <div class="best-time ${cls}">${fmtHour(best.hour)}</div>
        <div style="font-size:0.75em;color:#556688;margin-top:2px;">
          ${best.score >= 70 ? '&#x2705; בטוח' : best.score >= 40 ? '&#x26A0;&#xFE0F; זהירות' : '&#x1F534; מסוכן'} &mdash; ניקוד ${best.score}/100
        </div>
        <div class="score-bar"><div class="score-fill ${cls}" style="width:${best.score}%"></div></div>
        <div style="font-size:0.72em;color:#7eb3ff;margin-bottom:8px;">חלונות נוספים:</div>
        <div class="alt-windows">
          ${wins.slice(1).map(w =>
            `<div class="alt-chip">${fmtHour(w.hour)}<span>${w.score}%</span></div>`
          ).join('')}
        </div>
      </div>`;
  }).join('');

  // Heatmap
  const heatmapHTML = `
    <div class="hour-row">
      ${Array.from({length:24},(_,i)=>`<div class="hour-lbl">${pad(i)}</div>`).join('')}
    </div>
    <div class="hour-row">
      ${hourly.map((c,h) => `
        <div class="hour-cell"
          style="background:${cellColor(c,maxH)}"
          onmouseenter="showTip(event,${h},${c})"
          onmouseleave="document.getElementById('tooltip').style.display='none'">
        </div>`).join('')}
    </div>`;

  // Danger top hours
  const dangerHTML = [...hourly.map((c,h)=>({h,c}))]
    .sort((a,b)=>b.c-a.c)
    .slice(0,8)
    .map(({h,c}) => `
      <div class="danger-row">
        <div class="danger-hour">${fmtHour(h)}</div>
        <div class="danger-bar-wrap"><div class="danger-bar-fill" style="width:${Math.round(c/maxH*100)}%"></div></div>
        <div class="danger-count">${c}</div>
      </div>`).join('');

  // Stat chips
  const quietHour = hourly.indexOf(Math.min(...hourly));
  const dangerHour = hourly.indexOf(Math.max(...hourly));
  const locDays = locRange?.days || 1;

  document.getElementById('emptyState').style.display = 'none';
  const results = document.getElementById('results');
  results.style.display = 'block';
  results.innerHTML = `
    <!-- City Hero -->
    <div class="city-hero">
      <div>
        <div class="city-name">&#x1F4CD; ${label}</div>
        <div class="city-meta">
          ${locRange ? `${locRange.from} &mdash; ${locRange.to} | ${locRange.days} ימים` : ''}
          ${locs.length > 1 ? ` | ${locs.length} אזורים` : ''}
        </div>
      </div>
      <div class="stat-chips">
        <div class="stat-chip">
          <div class="num" style="color:#ef4444">${alerts.length.toLocaleString()}</div>
          <div class="lbl">אזעקות</div>
        </div>
        <div class="stat-chip">
          <div class="num">${(alerts.length/locDays).toFixed(1)}</div>
          <div class="lbl">ליום בממוצע</div>
        </div>
        <div class="stat-chip">
          <div class="num" style="color:#22c55e">${fmtHour(quietHour)}</div>
          <div class="lbl">הכי שקט</div>
        </div>
        <div class="stat-chip">
          <div class="num" style="color:#ef4444">${fmtHour(dangerHour)}</div>
          <div class="lbl">הכי מסוכן</div>
        </div>
      </div>
    </div>

    <!-- Activities -->
    <div class="section-title">&#x1F3AF; המלצות לפעילויות</div>
    <div class="activities-grid">${activitiesHTML}</div>

    <!-- Heatmap -->
    <div class="section-title">&#x1F321;&#xFE0F; מפת חום - אזעקות לפי שעה</div>
    <div class="heatmap-card">
      ${heatmapHTML}
      <div class="heatmap-legend">
        <span>&#x1F7E2; שקט</span>
        <div class="legend-bar"></div>
        <span>&#x1F534; פעיל</span>
      </div>
    </div>

    <!-- Charts -->
    <div class="section-title">&#x1F4CA; גרפים</div>
    <div class="charts-grid">
      <div class="chart-card">
        <h3>אזעקות לפי שעה</h3>
        <div class="chart-wrap"><canvas id="chartHour"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>אזעקות לפי יום</h3>
        <div class="chart-wrap"><canvas id="chartDay"></canvas></div>
      </div>
    </div>

    <!-- Danger hours -->
    <div class="section-title">&#x26A0;&#xFE0F; שעות המסוכנות ביותר</div>
    <div class="danger-card">${dangerHTML}</div>

    <div style="text-align:center;font-size:0.72em;color:#334466;padding:10px 0 20px;">
      נתונים: פיקוד העורף | ${allAlerts.length.toLocaleString()} אזעקות בכל הארץ
    </div>
  `;

  // Chart: hourly
  const ctxH = document.getElementById('chartHour')?.getContext('2d');
  if (ctxH) {
    activeChart1 = new Chart(ctxH, {
      type: 'bar',
      data: {
        labels: Array.from({length:24}, (_,i) => `${pad(i)}:00`),
        datasets: [{
          data: hourly,
          backgroundColor: hourly.map(c => {
            const r = c / maxH;
            return r < 0.2 ? '#22c55e99' : r < 0.5 ? '#f59e0b99' : '#ef444499';
          }),
          borderRadius: 4,
        }]
      },
      options: chartOpts()
    });
  }

  // Chart: daily
  const ctxD = document.getElementById('chartDay')?.getContext('2d');
  if (ctxD) {
    const sortedDates = Object.keys(daily).sort();
    activeChart2 = new Chart(ctxD, {
      type: 'line',
      data: {
        labels: sortedDates.map(d => d.slice(5)), // MM-DD
        datasets: [{
          data: sortedDates.map(d => daily[d]),
          borderColor: '#7eb3ff',
          backgroundColor: '#7eb3ff18',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: '#7eb3ff',
        }]
      },
      options: chartOpts()
    });
  }

  window.scrollTo(0, 0);
}

function chartOpts() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#556688', font: { size: 9 } }, grid: { color: '#1a2030' } },
      y: { ticks: { color: '#556688' }, grid: { color: '#1a2030' } }
    }
  };
}

// ════════════════════════════════════
//  TOOLTIP
// ════════════════════════════════════
function showTip(e, h, c) {
  const tip = document.getElementById('tooltip');
  tip.style.display = 'block';
  tip.style.left = (e.clientX + 16) + 'px';
  tip.style.top  = (e.clientY - 42) + 'px';
  tip.innerHTML = `<b>${pad(h)}:00 &ndash; ${pad((h+1)%24)}:00</b><br>${c} אזעקות`;
}

// ════════════════════════════════════
//  INIT
// ════════════════════════════════════
async function init() {
  setStatus('load', 'טוען נתונים...');
  const hadStored = loadFromStorage();

  // Step 1: load seed file (same-origin, no CORS)
  if (!hadStored) {
    try {
      const seed = await fetchSeed();
      const added = mergeNew(seed);
      if (added > 0) { saveToStorage(); console.log('seed loaded:', added); }
    } catch(e) {
      console.warn('seed load failed:', e);
    }
  }

  // Step 2: try live API for newer records
  try {
    const fresh = await fetchLatest();
    const added = mergeNew(fresh);
    if (added > 0) saveToStorage();
  } catch(e) {
    console.warn('live API failed (CORS likely):', e.message);
  }

  if (allAlerts.length === 0) {
    setStatus('warn', 'לא ניתן לטעון נתונים.');
    return;
  }

  buildLocMap();
  updateStatusBar();
}

init();
</script>
