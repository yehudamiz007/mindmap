<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📞 ספר טלפונים - שיבא</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #18181f;
    --bg4: #1e1e28;
    --border: #2a2a3a;
    --border2: #353545;
    --accent: #06b6d4;
    --accent2: #0891b2;
    --accent3: #67e8f9;
    --text: #f0f0f8;
    --text2: #a8a8c0;
    --text3: #6868888;
    --green: #10b981;
    --purple: #8b5cf6;
    --orange: #f59e0b;
    --red: #ef4444;
    --pink: #ec4899;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 20px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ---- HEADER ---- */
  .header {
    background: linear-gradient(135deg, #0a0a0f 0%, #0d1a2a 50%, #0a0a1a 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 32px rgba(6,182,212,0.08);
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .logo {
    font-size: 2.6rem;
    line-height: 1;
  }

  .title-block h1 {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent3), var(--accent), #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .title-block .subtitle {
    color: var(--text2);
    font-size: 0.95rem;
    font-weight: 400;
  }

  /* ---- SEARCH ---- */
  .search-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .search-wrap .icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.3rem;
    color: var(--text2);
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    padding: 16px 54px 16px 20px;
    background: var(--bg3);
    border: 2px solid var(--border2);
    border-radius: 16px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 1.2rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    direction: rtl;
  }

  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(6,182,212,0.15);
  }

  #searchInput::placeholder { color: var(--text2); }

  /* ---- TABS ---- */
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 14px;
    scrollbar-width: none;
    flex-wrap: nowrap;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 8px 20px;
    border-radius: 50px;
    border: 1.5px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-family: 'Heebo', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(6,182,212,0.06);
  }

  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
    box-shadow: 0 0 16px rgba(6,182,212,0.35);
  }

  /* ---- MAIN ---- */
  .main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .count-bar {
    color: var(--text2);
    font-size: 0.95rem;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-bar strong {
    color: var(--accent);
    font-weight: 700;
  }

  /* ---- SECTION HEADER ---- */
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 32px 0 16px;
  }

  .section-letter {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 900;
    color: #000;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(6,182,212,0.3);
  }

  .section-label {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to left, transparent, var(--border2));
  }

  /* ---- GRID ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
    .title-block h1 { font-size: 1.5rem; }
  }

  /* ---- CARD ---- */
  .card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 24px;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px;
    height: 100%;
    background: var(--card-accent, var(--accent));
    border-radius: 0 20px 20px 0;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(6,182,212,0.12);
  }

  .card-dept {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .card-contact {
    font-size: 1rem;
    color: var(--text2);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-contact .icon { font-size: 0.9rem; }

  .card-phones {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .phone-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 1.05rem;
  }

  .phone-label {
    color: var(--text2);
    font-size: 0.85rem;
    font-weight: 600;
    min-width: 52px;
    padding-top: 2px;
    flex-shrink: 0;
  }

  .phone-value {
    color: var(--text);
    flex: 1;
    word-break: break-all;
  }

  a.phone-link {
    color: var(--accent3);
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
    transition: color 0.15s;
  }

  a.phone-link:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  .tel-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(6,182,212,0.12);
    border: 1px solid rgba(6,182,212,0.25);
    border-radius: 8px;
    padding: 2px 10px;
    font-size: 0.9rem;
    color: var(--accent3);
    font-weight: 600;
    margin-top: 2px;
  }

  .card-footer {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 12px;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 600;
  }

  .badge-section {
    background: rgba(99,102,241,0.12);
    border: 1px solid rgba(99,102,241,0.3);
    color: #a5b4fc;
  }

  .badge-tel {
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.3);
    color: #fcd34d;
  }

  /* ---- NO RESULTS ---- */
  .no-results {
    text-align: center;
    padding: 80px 20px;
    color: var(--text2);
  }

  .no-results .big { font-size: 3rem; margin-bottom: 12px; }
  .no-results p { font-size: 1.1rem; }

  /* ---- SCROLLBAR ---- */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

  /* ---- HIGHLIGHT ---- */
  mark {
    background: rgba(6,182,212,0.3);
    color: var(--accent3);
    border-radius: 3px;
    padding: 0 2px;
  }

  /* ---- CUSTOM CARD ACCENT ---- */
  .card.custom-entry {
    border-left: 4px solid var(--green);
  }

  .card-actions {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    gap: 6px;
    z-index: 2;
  }

  .card-action-btn {
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.15s, border-color 0.15s;
    padding: 0;
  }

  .card-action-btn:hover { background: var(--border); border-color: var(--accent); }

  /* ---- MOVE CATEGORY DROPDOWN ---- */
  .move-cat-wrap {
    position: relative;
    display: inline-block;
  }

  .move-cat-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-radius: 12px;
    min-width: 160px;
    max-width: 220px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 500;
    overflow: hidden;
    padding: 4px 0;
  }

  .move-cat-dropdown.open { display: block; }

  .move-cat-item {
    padding: 9px 14px;
    font-size: 0.9rem;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    transition: background 0.12s;
  }

  .move-cat-item:hover { background: var(--border); }
  .move-cat-item.current { color: var(--accent); font-weight: 600; }
  .move-cat-item .check { opacity: 0; font-size: 0.8rem; }
  .move-cat-item.current .check { opacity: 1; }

  /* ---- TOAST ---- */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    background: var(--bg4);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 10px 22px;
    color: var(--accent3);
    font-size: 1rem;
    font-weight: 600;
    z-index: 999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    direction: rtl;
  }

  .toast.show { opacity: 1; }

  /* ---- LOADING OVERLAY ---- */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    flex-direction: column;
    gap: 16px;
  }

  .loading-overlay.hidden { display: none; }

  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    color: var(--text2);
    font-size: 1.1rem;
    font-weight: 500;
  }

  /* ---- FAB ---- */
  .fab {
    position: fixed;
    bottom: 28px;
    left: 28px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    font-size: 2rem;
    font-weight: 700;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 24px rgba(6,182,212,0.45);
    transition: transform 0.15s, box-shadow 0.15s;
    z-index: 200;
    line-height: 1;
  }

  .fab:hover { transform: scale(1.08); box-shadow: 0 8px 32px rgba(6,182,212,0.6); }

  /* ---- FOOTER ---- */
  .app-footer {
    text-align: center;
    padding: 18px 24px;
    color: var(--text2);
    font-size: 0.78rem;
    border-top: 1px solid var(--border);
    margin-top: 32px;
    letter-spacing: 0.02em;
  }

  /* ---- TAB ADD ---- */
  .tab-add {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1.5px dashed var(--border2);
    background: transparent;
    color: var(--text2);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .tab-add:hover { border-color: var(--accent); color: var(--accent); background: rgba(6,182,212,0.08); }

  /* ---- MODAL OVERLAY ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 24px;
    padding: 32px 28px;
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 16px 64px rgba(0,0,0,0.6);
    direction: rtl;
  }

  .modal h2 {
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 22px;
    color: var(--accent3);
  }

  .modal-close {
    position: absolute;
    top: 16px;
    left: 16px;
    background: none;
    border: none;
    color: var(--text2);
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 8px;
    transition: color 0.15s, background 0.15s;
  }

  .modal-close:hover { color: var(--text); background: var(--border); }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg4);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 1.1rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    direction: rtl;
  }

  .form-group input:focus,
  .form-group select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(6,182,212,0.15);
  }

  .form-group select option { background: var(--bg4); color: var(--text); }

  .form-submit {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    color: #000;
    font-family: 'Heebo', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s, transform 0.1s;
  }

  .form-submit:hover { background: var(--accent2); transform: translateY(-1px); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">📞</div>
    <div class="title-block">
      <h1>ספר טלפונים - שיבא</h1>
      <div class="subtitle">מרכז רפואי שיבא - תל השומר</div>
    </div>
  </div>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input type="search" id="searchInput" placeholder="חיפוש לפי מחלקה, שם, טלפון..." autocomplete="off" />
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="הכל">הכל</button>
    <button class="tab" data-cat="מחלקות">מחלקות</button>
    <button class="tab" data-cat="ילדים">ילדים 👶</button>
    <button class="tab" data-cat="פסיכיאטריה">פסיכיאטריה</button>
    <button class="tab" data-cat="מעבדות">מעבדות 🔬</button>
    <button class="tab" data-cat="שונות">שונות 🔧</button>
  </div>
</div>

<div class="main">
  <div class="count-bar" id="countBar">טוען...</div>
  <div id="container"></div>
  <footer class="app-footer">© כל הזכויות שמורות לורדית מזרחי</footer>
</div>

<!-- ---- LOADING OVERLAY ---- -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">טוען נתונים...</div>
</div>

<!-- ---- FLOATING ADD BUTTON ---- -->
<button class="fab" id="fabAdd" title="הוסף רשומה">+</button>

<!-- ---- ADD/EDIT MODAL ---- -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <h2 id="modalTitle">➕ הוסף רשומה</h2>
    <form id="entryForm" autocomplete="off">
      <input type="hidden" id="editId" value="" />
      <div class="form-group">
        <label for="fDept">יעד *</label>
        <input type="text" id="fDept" placeholder="שם המחלקה / היעד" required />
      </div>
      <div class="form-group">
        <label for="fContact">א.א</label>
        <input type="text" id="fContact" placeholder="איש קשר" />
      </div>
      <div class="form-group">
        <label for="fPhone">טלפון</label>
        <input type="text" id="fPhone" placeholder="מספר טלפון" />
      </div>
      <div class="form-group">
        <label for="fAkhmash">אחמש</label>
        <input type="text" id="fAkhmash" placeholder="אחמש" />
      </div>
      <div class="form-group">
        <label for="fMorePhone">מס' טלפון</label>
        <input type="text" id="fMorePhone" placeholder="מספרים נוספים" />
      </div>
      <div class="form-group">
        <label for="fTel">טיל</label>
        <input type="text" id="fTel" placeholder="מספר טיל" />
      </div>
      <div class="form-group">
        <label for="fCategory">קטגוריה</label>
        <select id="fCategory"></select>
      </div>
      <button type="submit" class="form-submit">שמור</button>
    </form>
  </div>
</div>

<script>
// ============================================================

function parseMain() {
  const entries = [];
  const skipRows = new Set([0,1]);
  // find header repeat row
  const headerPatterns = ['יעד','אינדקס'];
  let currentLetter = '';

  RAW.forEach((row, i) => {
    if (skipRows.has(i)) return;
    const [, idx, tel, dept, contact, phone, akhmash, morePhone] = row;

    // skip sub-header row
    if (dept === 'יעד' || dept === 'מס\' טיל' || dept === 'מעבדות') return;

    // update letter index
    if (idx && typeof idx === 'string' && idx.length <= 2 && /^[\u05D0-\u05EA]/.test(idx.trim())) {
      currentLetter = idx.trim();
    }

    // skip if no dept name
    if (!dept || String(dept).trim() === '') return;

    const deptClean = String(dept).trim();
    const contactClean = contact ? String(contact).trim() : '';
    const phoneClean = phone ? String(phone).trim() : '';
    const akhmashClean = akhmash ? String(akhmash).trim() : '';
    const morePhoneClean = morePhone ? String(morePhone).trim() : '';
    const telNum = (tel !== null && tel !== undefined) ? String(tel).trim() : '';

    if (!deptClean) return;

    // Determine category
    let category = 'מחלקות';
    const deptLower = deptClean + contactClean;
    if (deptLower.includes('ילד') || deptLower.includes('ילדים') || deptLower.includes('פגים') ||
        deptLower.includes('יילוד') || deptLower.includes('בייבי') || deptLower.includes('ילוד')) {
      category = 'ילדים';
    } else if (deptLower.includes('פסיכיאטר') || deptLower.includes('פסיכ')) {
      category = 'פסיכיאטריה';
    }

    entries.push({
      letter: currentLetter,
      tel: telNum,
      dept: deptClean,
      contact: contactClean,
      phone: phoneClean,
      akhmash: akhmashClean,
      morePhone: morePhoneClean,
      category,
      section: 'מחלקות'
    });
  });
  return entries;
}

async function loadFromGitHub() {
  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.remove('hidden');
  try {
    // Fetch SHA via API
    const apiResp = await fetch(GH_API_URL, {
      headers: { 'Authorization': `token ${GH_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (apiResp.ok) {
      const meta = await apiResp.json();
      ghFileSha = meta.sha;
    } else if (apiResp.status === 404) {
      // File doesn't exist yet - use empty defaults
      ghFileSha = null;
      overlay.classList.add('hidden');
      renderTabs();
      populateCategoryDropdown();
      render();
      return;
    }

    // Fetch raw content (no auth needed for public repo, but add cache-buster)
    const rawResp = await fetch(GH_RAW_URL + '?t=' + Date.now());
    if (rawResp.ok) {
      const data = await rawResp.json();
      customEntries = Array.isArray(data.custom_contacts) ? data.custom_contacts : [];
      customCats = Array.isArray(data.custom_categories) ? data.custom_categories : [];
      builtinOverrides = (data.overrides && typeof data.overrides === 'object') ? data.overrides : {};
    }
  } catch(err) {
    console.error('loadFromGitHub error:', err);
    showToast('⚠️ שגיאה בטעינת נתונים');
  } finally {
    overlay.classList.add('hidden');
    renderTabs();
    populateCategoryDropdown();
    render();
  }
}

async function saveToGitHub() {
  const data = buildGitHubData();
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

  const body = {
    message: 'Update phonebook data',
    content: content,
    branch: 'main'
  };
  if (ghFileSha) body.sha = ghFileSha;

  try {
    const resp = await fetch(GH_API_URL, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${GH_TOKEN}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (resp.ok) {
      const result = await resp.json();
      ghFileSha = result.content.sha; // update SHA for next save
      showToast('\uD83D\uDCBE נשמר');
    } else {
      const errText = await resp.text();
      console.error('saveToGitHub error:', errText);

    }
  } catch(err) {

  }
}

function phoneLink(raw, highlight) {
  if (!raw || String(raw).trim() === '' || String(raw).trim() === 'null') return '';
  const str = String(raw).trim();
  // Try to extract a single cleanable phone number
  const cleaned = str.replace(/[\s\-]/g, '').replace(/^0/, '+972');
  const isCallable = /^[\+0-9]/.test(str) && str.replace(/[^0-9]/g,'').length >= 4;

  let display = highlight ? applyHighlight(str, highlight) : escHtml(str);
  if (isCallable) {
    const tel = str.replace(/[^\d\+\-\/]/g,'').split('/')[0].split(',')[0].trim();
    return `<a class="phone-link" href="tel:${tel}">📱 ${display}</a>`;
  }
  return `<span class="phone-value">${display}</span>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function applyHighlight(text, term) {
  if (!term) return escHtml(text);
  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escaped})`, 'gi');
  return escHtml(text).replace(re, '<mark>$1</mark>');
}

function buildCard(entry, searchTerm) {
  const accent = entry.isCustom ? 'var(--green)' : (ACCENT_BY_SECTION[entry.category] || '#06b6d4');
  const hl = (s) => s ? applyHighlight(s, searchTerm) : '';

  let phonesHtml = '';
  if (entry.phone) {
    phonesHtml += `<div class="phone-row">
      <span class="phone-label">טלפון:</span>
      <span class="phone-value">${phoneLink(entry.phone, searchTerm)}</span>
    </div>`;
  }
  if (entry.akhmash && entry.akhmash !== 'אין') {
    phonesHtml += `<div class="phone-row">
      <span class="phone-label">אחמש:</span>
      <span class="phone-value">${phoneLink(entry.akhmash, searchTerm)}</span>
    </div>`;
  }
  if (entry.morePhone) {
    phonesHtml += `<div class="phone-row">
      <span class="phone-label">נוסף:</span>
      <span class="phone-value">${hl(entry.morePhone) || escHtml(entry.morePhone)}</span>
    </div>`;
  }

  const footerItems = [];
  if (entry.tel) {
    footerItems.push(`<span class="badge badge-tel">🚁 טיל: ${escHtml(entry.tel)}</span>`);
  }
  if (entry.category !== 'מחלקות') {
    footerItems.push(`<span class="badge badge-section">${escHtml(entry.category)}</span>`);
  }

  // Build category dropdown options
  const allCatsForMove = [...BUILTIN_CATS.filter(c => c !== 'הכל'), ...customCats];
  const catOptionsHtml = allCatsForMove.map(cat => {
    const isCurrent = cat === entry.category;
    return `<div class="move-cat-item${isCurrent ? ' current' : ''}" data-cat="${escHtml(cat)}">
      <span class="check">✓</span>${escHtml(cat)}
    </div>`;
  }).join('');

  // Identify entry: custom uses id, builtin uses _overrideKey
  const moveDataAttr = entry.isCustom
    ? `data-move-type="custom" data-move-id="${escHtml(String(entry.id))}"`
    : `data-move-type="builtin" data-move-key="${escHtml(entry._overrideKey || entry.dept)}"`;

  const moveBtnHtml = `<div class="move-cat-wrap">
    <button class="card-action-btn move-cat-btn" title="העבר לקטגוריה" ${moveDataAttr}>📂</button>
    <div class="move-cat-dropdown">${catOptionsHtml}</div>
  </div>`;

  const actionsHtml = entry.isCustom
    ? `<div class="card-actions">
        ${moveBtnHtml}
        <button class="card-action-btn" title="ערוך" onclick="openEditModal('${entry.id}')">✏️</button>
        <button class="card-action-btn" title="מחק" onclick="deleteEntry('${entry.id}')">🗑️</button>
      </div>`
    : `<div class="card-actions">${moveBtnHtml}</div>`;

  return `<div class="card${entry.isCustom ? ' custom-entry' : ''}" style="--card-accent:${accent}">
    ${actionsHtml}
    <div class="card-dept">${hl(entry.dept)}</div>
    ${entry.contact ? `<div class="card-contact"><span class="icon">👤</span>${hl(entry.contact)}</div>` : ''}
    <div class="card-phones">${phonesHtml}</div>
    ${footerItems.length ? `<div class="card-footer">${footerItems.join('')}</div>` : ''}
  </div>`;
}

function getFiltered() {
  const term = currentSearch.trim().toLowerCase();
  return getAllEntries().filter(e => {
    // category filter
    if (currentCat !== 'הכל') {
      if (e.category !== currentCat) return false;
    }
    // search
    if (!term) return true;
    const searchable = [e.dept, e.contact, e.phone, e.akhmash, e.morePhone, e.tel, e.letter]
      .filter(Boolean).join(' ').toLowerCase();
    return searchable.includes(term);
  });
}

function render() {
  const filtered = getFiltered();
  const term = currentSearch.trim();
  const container = document.getElementById('container');
  const countBar = document.getElementById('countBar');

  const totalAll = getAllEntries().length;
  countBar.innerHTML = `מציג <strong>${filtered.length}</strong> מתוך <strong>${totalAll}</strong> רשומות`;

  if (filtered.length === 0) {
    container.innerHTML = `<div class="no-results">
      <div class="big">🔍</div>
      <p>לא נמצאו תוצאות עבור "${escHtml(term)}"</p>
    </div>`;
    return;
  }

  // Group by letter for main sections, flat for labs/misc/custom
  const builtinGrouped = ['הכל','מחלקות','ילדים','פסיכיאטריה'];
  if (!builtinGrouped.includes(currentCat)) {
    container.innerHTML = `<div class="grid">${filtered.map(e => buildCard(e, term)).join('')}</div>`;
    return;
  }

  // group by letter
  const groups = {};
  const groupOrder = [];
  filtered.forEach(e => {
    const key = e.letter || '?';
    if (!groups[key]) { groups[key] = []; groupOrder.push(key); }
    groups[key].push(e);
  });

  let html = '';
  groupOrder.forEach(letter => {
    html += `<div class="section-header">
      <div class="section-letter">${escHtml(letter)}</div>
      <span class="section-label">קבוצה ${escHtml(letter)}</span>
      <div class="section-line"></div>
    </div>`;
    html += `<div class="grid">${groups[letter].map(e => buildCard(e, term)).join('')}</div>`;
  });

  container.innerHTML = html;
}

  };

  if (editingId) {
    const idx = customEntries.findIndex(e => String(e.id) === String(editingId));
    if (idx !== -1) customEntries[idx] = newEntry;
  } else {
    customEntries.push(newEntry);
  }

  saveCustomEntries(customEntries);
  closeModal();
  render();
});

// ============================================================
// EVENT LISTENERS
// ============================================================
document.getElementById('searchInput').addEventListener('input', (e) => {
  currentSearch = e.target.value;
  render();
});

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentCat = tab.dataset.cat;
  render();
});

// ============================================================
// INIT
// ============================================================
loadFromGitHub();
</script>
