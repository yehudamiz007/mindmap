<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Sub-Agents Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07080f;
  --surface:rgba(255,255,255,0.04);
  --surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.07);
  --border-hover:rgba(255,255,255,0.14);
  --text:#e4e4e7;
  --text-dim:#71717a;
  --accent:#818cf8;
  --accent2:#a78bfa;
  --green:#34d399;
  --yellow:#fbbf24;
  --red:#f87171;
  --orange:#fb923c;
  --blue:#60a5fa;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:ltr}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(129,140,248,0.05) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(167,139,250,0.05) 0%,transparent 60%);
  pointer-events:none;
}
.container{position:relative;z-index:1;max-width:1300px;margin:0 auto;padding:28px 20px 80px}
.header{text-align:center;padding:40px 0 32px}
.header h1{font-size:2.4rem;font-weight:200;letter-spacing:-1px;
  background:linear-gradient(135deg,#e4e4e7,#818cf8,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--text-dim);margin-top:8px;font-size:.95rem}
.last-update{font-size:.78rem;color:var(--text-dim);margin-top:6px;opacity:.6}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px}
.summary-card .label{font-size:.78rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.summary-card .value{font-size:1.9rem;font-weight:300;letter-spacing:-1px}
.summary-card .sub{font-size:.78rem;color:var(--text-dim);margin-top:4px}
.value.green{color:var(--green)}
.value.yellow{color:var(--yellow)}
.value.accent{color:var(--accent)}
.controls{display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.sort-label{font-size:.82rem;color:var(--text-dim)}
.sort-btn{padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);cursor:pointer;font-size:.82rem;transition:.2s;font-family:inherit}
.sort-btn:hover{background:var(--surface2);color:var(--text)}
.sort-btn.active{background:rgba(129,140,248,.15);color:var(--accent);border-color:rgba(129,140,248,.3)}
.refresh-btn{margin-left:auto;padding:8px 18px;border-radius:10px;border:1px solid rgba(129,140,248,.3);
  background:rgba(129,140,248,.1);color:var(--accent);cursor:pointer;font-size:.85rem;
  transition:.2s;display:flex;align-items:center;gap:6px;font-family:inherit}
.refresh-btn:hover{background:rgba(129,140,248,.2)}
.refresh-btn.spinning .icon{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.table-header{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 1fr 1fr 80px;gap:0;
  padding:14px 20px;border-bottom:1px solid var(--border);
  font-size:.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.agent-row{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 1fr 1fr 80px;gap:0;
  padding:16px 20px;border-bottom:1px solid var(--border);transition:.2s;align-items:center}
.agent-row:last-child{border-bottom:none}
.agent-row:hover{background:var(--surface2)}
.cost-cell{display:flex;align-items:center;gap:10px}
.cost-bar-wrap{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.cost-bar{height:100%;border-radius:2px;transition:width .6s ease}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:.72rem}
.status-badge.active{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.2)}
.status-badge.idle{background:rgba(113,113,122,.12);color:var(--text-dim);border:1px solid rgba(113,113,122,.2)}
.status-badge.running{background:rgba(251,191,36,.12);color:var(--yellow);border:1px solid rgba(251,191,36,.2)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.dot.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.model-chip{font-size:.72rem;padding:2px 8px;border-radius:6px;background:rgba(129,140,248,.1);
  color:var(--accent);border:1px solid rgba(129,140,248,.2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:140px}
.empty-state{text-align:center;padding:80px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:3rem;margin-bottom:16px}
.empty-state p{font-size:1rem;margin-bottom:8px}
.empty-state small{font-size:.82rem;opacity:.6}
.loading{text-align:center;padding:60px 20px;color:var(--text-dim)}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
.token-val{font-size:.88rem;font-variant-numeric:tabular-nums}
.token-val.high{color:var(--red)}
.token-val.med{color:var(--yellow)}
.token-val.low{color:var(--green)}
.task-text{font-size:.82rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.cost-label{font-size:.82rem;font-variant-numeric:tabular-nums;min-width:56px;text-align:left}
.section-label{font-size:.78rem;color:var(--text-dim);margin-bottom:12px;padding-left:4px;letter-spacing:.3px}
.auto-refresh{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text-dim)}
.auto-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>🤖 Sub-Agents Dashboard</h1>
    <p>Real-time cost tracking & sub-agent status</p>
    <div class="last-update" id="lastUpdate">Loading...</div>
  </div>

  <div class="summary-grid" id="summaryGrid">
    <div class="summary-card"><div class="label">Active Sub-Agents</div><div class="value accent" id="totalAgents">-</div><div class="sub">Sessions</div></div>
    <div class="summary-card"><div class="label">Total Tokens</div><div class="value yellow" id="totalTokens">-</div><div class="sub">Input + Output</div></div>
    <div class="summary-card"><div class="label">Estimated Cost</div><div class="value green" id="totalCost">-</div><div class="sub">USD (estimate)</div></div>
    <div class="summary-card"><div class="label">Highest Cost</div><div class="value" id="highestCost" style="color:var(--red)">-</div><div class="sub" id="highestName">-</div></div>
    <div class="summary-card"><div class="label">Auto Refresh</div><div class="value" style="font-size:1.1rem;margin-top:4px"><span class="auto-refresh"><span class="auto-dot"></span> Every 30s</span></div><div class="sub" id="nextRefresh">-</div></div>
  </div>

  <div class="controls">
    <span class="sort-label">Sort:</span>
    <button class="sort-btn active" onclick="setSort('cost', event)">💰 Cost (high to low)</button>
    <button class="sort-btn" onclick="setSort('tokens', event)">📊 Tokens</button>
    <button class="sort-btn" onclick="setSort('name', event)">🔤 Name</button>
    <button class="sort-btn" onclick="setSort('updated', event)">🕐 Last Updated</button>
    <button class="refresh-btn" id="refreshBtn" onclick="loadData()"><span class="icon">🔄</span> Refresh</button>
  </div>

  <div class="section-label" id="agentCount">Loading...</div>
  <div class="table-wrap">
    <div class="table-header">
      <div>Name / ID</div>
      <div>Model</div>
      <div>Status</div>
      <div>Tokens</div>
      <div>Est. Cost</div>
      <div>Last Updated</div>
      <div></div>
    </div>
    <div id="agentList"><div class="loading"><div class="spinner"></div>Loading agents...</div></div>
  </div>

</div>

<script>
const PRICING = {
  'claude-sonnet-4-6':     { input: 3.00,  output: 15.00 },
  'claude-sonnet-4-5':     { input: 3.00,  output: 15.00 },
  'claude-opus-4-6':       { input: 15.00, output: 75.00 },
  'claude-opus-4-5':       { input: 15.00, output: 75.00 },
  'claude-haiku-3-5':      { input: 0.80,  output: 4.00  },
  'claude-haiku-3':        { input: 0.25,  output: 1.25  },
  'grok-4':                { input: 5.00,  output: 15.00 },
  'grok-3':                { input: 3.00,  output: 15.00 },
  'grok-3-mini':           { input: 0.30,  output: 0.50  },
  'mistral-large-latest':  { input: 2.00,  output: 6.00  },
  'gemini-2.0-flash':      { input: 0.10,  output: 0.40  },
  'gemini-1.5-pro':        { input: 1.25,  output: 5.00  },
  'default':               { input: 3.00,  output: 15.00 },
};

function getPrice(model) {
  if (!model) return PRICING.default;
  const directKey = Object.keys(PRICING).find(k => model.toLowerCase().includes(k.toLowerCase()));
  return PRICING[directKey] || PRICING.default;
}

function estimateCost(session) {
  const total = session.totalTokens || 0;
  const inputTokens  = total * 0.70;
  const outputTokens = total * 0.30;
  const p = getPrice(session.model);
  return (inputTokens / 1e6 * p.input) + (outputTokens / 1e6 * p.output);
}

function fmt(n, digits=2) {
  if (n === null || n === undefined || isNaN(n)) return '-';
  return n.toFixed(digits);
}

function fmtTokens(n) {
  if (!n) return '0';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return n.toString();
}

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'Just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return d.toLocaleDateString('en-US');
}

function getModelShort(model) {
  if (!model) return 'Unknown';
  return model.replace('anthropic/','').replace('xai/','').replace('mistral/','').replace('google/','');
}

function getTokenClass(tokens, ctx) {
  const pct = (tokens || 0) / (ctx || 200000);
  if (pct > 0.5) return 'high';
  if (pct > 0.2) return 'med';
  return 'low';
}

function getStatusBadge(session) {
  const diff = (Date.now() - (session.updatedAt || 0)) / 1000;
  if (diff < 30) return `<span class="status-badge running"><span class="dot pulse"></span>Running</span>`;
  if (diff < 300) return `<span class="status-badge active"><span class="dot"></span>Recent</span>`;
  return `<span class="status-badge idle"><span class="dot"></span>Idle</span>`;
}

function getCostColor(cost, maxCost) {
  if (!maxCost || maxCost === 0) return 'var(--green)';
  const pct = cost / maxCost;
  if (pct > 0.7) return 'var(--red)';
  if (pct > 0.35) return 'var(--yellow)';
  return 'var(--green)';
}

let sortKey = 'cost';
let allSessions = [];

function setSort(key, e) {
  sortKey = key;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  if (e && e.target) e.target.classList.add('active');
  renderTable(allSessions);
}

function sortSessions(sessions) {
  return [...sessions].sort((a, b) => {
    if (sortKey === 'cost')    return estimateCost(b) - estimateCost(a);
    if (sortKey === 'tokens')  return (b.totalTokens||0) - (a.totalTokens||0);
    if (sortKey === 'name')    return (a.displayName||'').localeCompare(b.displayName||'');
    if (sortKey === 'updated') return (b.updatedAt||0) - (a.updatedAt||0);
    return 0;
  });
}

function renderTable(sessions) {
  const list = document.getElementById('agentList');
  const sorted = sortSessions(sessions);

  if (sorted.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">🤖</div>
        <p>No active sub-agents</p>
        <small>Sub-agents will appear here once launched</small>
      </div>`;
    document.getElementById('agentCount').textContent = 'No active sub-agents';
    return;
  }

  const maxCost = Math.max(...sorted.map(estimateCost), 0.000001);

  list.innerHTML = sorted.map((s, i) => {
    const cost = estimateCost(s);
    const costColor = getCostColor(cost, maxCost);
    const barWidth = maxCost > 0 ? Math.round((cost / maxCost) * 100) : 0;
    const tokens = s.totalTokens || 0;
    const tokClass = getTokenClass(tokens, s.contextTokens);
    const modelShort = getModelShort(s.model);
    const name = s.displayName || s.key || 'Unknown';
    const shortName = name.length > 28 ? name.substring(0,25)+'...' : name;

    const lastMsg = s.messages && s.messages[0];
    let taskText = '-';
    if (lastMsg) {
      const content = lastMsg.content;
      if (typeof content === 'string') taskText = content;
      else if (Array.isArray(content)) {
        const txt = content.find(c => c.type === 'text');
        if (txt) taskText = txt.text;
      }
      taskText = taskText.replace(/\n/g,' ').substring(0, 80);
    }

    return `
    <div class="agent-row">
      <div>
        <div style="font-size:.88rem;font-weight:500" title="${name}">${shortName}</div>
        <div class="task-text" title="${taskText}">${taskText}</div>
      </div>
      <div><span class="model-chip" title="${s.model||''}">${modelShort}</span></div>
      <div>${getStatusBadge(s)}</div>
      <div><span class="token-val ${tokClass}" title="${tokens.toLocaleString()} tokens">${fmtTokens(tokens)}</span></div>
      <div>
        <div class="cost-cell">
          <span class="cost-label" style="color:${costColor}">$${fmt(cost,4)}</span>
          <div class="cost-bar-wrap"><div class="cost-bar" style="width:${barWidth}%;background:${costColor}"></div></div>
        </div>
      </div>
      <div style="font-size:.78rem;color:var(--text-dim)">${fmtTime(s.updatedAt)}</div>
      <div style="font-size:.72rem;color:var(--text-dim)">#${i+1}</div>
    </div>`;
  }).join('');

  const sortLabel = sortKey === 'cost' ? 'Cost' : sortKey === 'tokens' ? 'Tokens' : sortKey === 'name' ? 'Name' : 'Last Updated';
  document.getElementById('agentCount').textContent = `${sorted.length} sub-agent${sorted.length !== 1 ? 's' : ''} - sorted by ${sortLabel}`;
}

function updateSummary(sessions) {
  const total = sessions.length;
  const totalTok = sessions.reduce((a,s) => a+(s.totalTokens||0),0);
  const totalCost = sessions.reduce((a,s) => a+estimateCost(s),0);
  const sorted = sortSessions(sessions);
  const top = sorted[0];

  document.getElementById('totalAgents').textContent = total;
  document.getElementById('totalTokens').textContent = fmtTokens(totalTok);
  document.getElementById('totalCost').textContent = '$'+fmt(totalCost,4);
  if (top) {
    document.getElementById('highestCost').textContent = '$'+fmt(estimateCost(top),4);
    document.getElementById('highestName').textContent = (top.displayName||top.key||'').substring(0,20);
  } else {
    document.getElementById('highestCost').textContent = '-';
    document.getElementById('highestName').textContent = '-';
  }
}

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');

  try {
    const res = await fetch('http://localhost:3000/api/sessions?limit=100', {
      headers: { 'Content-Type': 'application/json' }
    });

    let sessions = [];
    if (res.ok) {
      const data = await res.json();
      sessions = data.sessions || data || [];
    } else {
      throw new Error('API unavailable');
    }

    allSessions = sessions.filter(s => s.kind === 'subagent' || s.key?.includes('subagent') || s.key?.includes('isolated'));
    if (allSessions.length === 0) {
      allSessions = sessions.filter(s => !s.key?.includes('main:whatsapp') && !s.key?.includes('main:telegram'));
    }

    renderTable(allSessions);
    updateSummary(allSessions);
    document.getElementById('lastUpdate').textContent = 'Last updated: ' + new Date().toLocaleTimeString('en-US');

  } catch (e) {
    showOfflineState(e.message);
  }

  btn.classList.remove('spinning');
}

function showOfflineState(msg) {
  const demo = [
    { key:'isolated-market-analysis', displayName:'Market Sentiment Analyzer', model:'xai/grok-3', totalTokens:45200, contextTokens:200000, updatedAt:Date.now()-120000, kind:'subagent', messages:[{role:'user',content:[{type:'text',text:'Analyze NVDA news sentiment'}]}] },
    { key:'isolated-tech-research', displayName:'Tech Research Agent', model:'anthropic/claude-sonnet-4-6', totalTokens:31800, contextTokens:200000, updatedAt:Date.now()-600000, kind:'subagent', messages:[{role:'user',content:[{type:'text',text:'Research AI chip market trends Q1 2026'}]}] },
    { key:'isolated-price-targets', displayName:'Price Target Aggregator', model:'anthropic/claude-sonnet-4-6', totalTokens:18500, contextTokens:200000, updatedAt:Date.now()-3600000, kind:'subagent', messages:[{role:'user',content:[{type:'text',text:'Analyst price targets TSLA'}]}] },
    { key:'isolated-portfolio-check', displayName:'Portfolio Monitor', model:'mistral/mistral-large-latest', totalTokens:9200, contextTokens:200000, updatedAt:Date.now()-86400000, kind:'subagent', messages:[{role:'user',content:[{type:'text',text:'Daily portfolio check'}]}] },
  ];

  allSessions = demo;
  renderTable(allSessions);
  updateSummary(allSessions);
  document.getElementById('lastUpdate').innerHTML =
    `<span style="color:var(--yellow)">⚠️ Offline mode - Gateway unavailable (${msg}) — showing demo data</span>`;
}

let countdown = 30;
setInterval(() => {
  countdown--;
  if (countdown <= 0) {
    countdown = 30;
    loadData();
  }
  document.getElementById('nextRefresh').textContent = `Auto-refresh in ${countdown}s`;
}, 1000);

loadData();
</script>
