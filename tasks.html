<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מנהל משימות</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0f0f13;--bg2:#1a1a22;--bg3:#22222e;--bg4:#2a2a38;
--border:#2e2e3e;--text:#e4e4ed;--text2:#9898ab;--text3:#6a6a80;
--accent:#6c5ce7;--accent2:#a29bfe;
--urgent:#ff4757;--high:#ff6b6b;--medium:#ffa502;--low:#2ed573;
--tag1:#6c5ce7;--tag2:#00cec9;--tag3:#fd79a8;--tag4:#fdcb6e;--tag5:#00b894;--tag6:#e17055;
--radius:8px;--radius2:12px;
--shadow:0 4px 24px rgba(0,0,0,.4);
--transition:all .2s ease;
}
html{font-size:14px}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
button{cursor:pointer;border:none;background:none;color:var(--text);font-family:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--text);background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
select{cursor:pointer}

/* Layout */
.app{display:flex;height:100vh}
.sidebar{width:260px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:var(--transition);z-index:100}
.sidebar.collapsed{width:0;overflow:hidden;border:none}
.sidebar-header{padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:1.1rem;font-weight:700;flex:1}
.sidebar-logo{width:28px;height:28px;background:var(--accent);border-radius:var(--radius);display:flex;align-items:center;justify-content:center}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px}
.nav-section{margin-bottom:16px}
.nav-section-title{font-size:.75rem;text-transform:uppercase;color:var(--text3);padding:8px 12px;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius);cursor:pointer;transition:var(--transition);font-size:.9rem}
.nav-item:hover{background:var(--bg3)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item .count{margin-right:auto;font-size:.75rem;color:var(--text3);background:var(--bg4);padding:1px 7px;border-radius:10px}
.nav-item.active .count{background:rgba(255,255,255,.2);color:#fff}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.topbar-right{display:flex;align-items:center;gap:12px;flex:1}
.menu-btn{display:none;padding:6px}
.board-title{font-size:1.2rem;font-weight:700}
.view-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:var(--radius);padding:3px}
.view-tab{padding:6px 14px;border-radius:6px;font-size:.85rem;color:var(--text2);transition:var(--transition)}
.view-tab:hover{color:var(--text)}
.view-tab.active{background:var(--accent);color:#fff}
.topbar-left{display:flex;align-items:center;gap:8px}
.search-box{position:relative;width:220px}
.search-box input{padding-right:32px;background:var(--bg3)}
.search-box svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3);pointer-events:none}
.btn{padding:8px 16px;border-radius:var(--radius);font-size:.85rem;transition:var(--transition);display:flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{color:var(--text2)}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:.8rem}
.btn-icon{padding:6px;border-radius:6px}
.btn-icon:hover{background:var(--bg3)}
.btn-icon svg{width:18px;height:18px}

.content{flex:1;overflow:auto;padding:20px 24px}

/* Kanban */
.kanban{display:flex;gap:16px;height:100%;min-height:0}
.kanban-col{min-width:280px;max-width:320px;flex:1;background:var(--bg2);border-radius:var(--radius2);display:flex;flex-direction:column;max-height:100%}
.col-header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.col-dot{width:10px;height:10px;border-radius:50%}
.col-title{font-weight:600;font-size:.9rem;flex:1}
.col-count{font-size:.8rem;color:var(--text3)}
.col-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.col-body.drag-over{background:rgba(108,92,231,.08)}

/* Task Card */
.task-card{background:var(--bg3);border-radius:var(--radius);padding:14px;cursor:grab;transition:var(--transition);border:1px solid transparent;position:relative}
.task-card:hover{border-color:var(--border);transform:translateY(-1px);box-shadow:var(--shadow)}
.task-card.dragging{opacity:.5;transform:rotate(2deg)}
.task-card-priority{position:absolute;top:0;right:0;width:4px;height:100%;border-radius:0 var(--radius) var(--radius) 0}
.task-card-title{font-weight:600;font-size:.9rem;margin-bottom:6px;padding-left:8px}
.task-card-desc{font-size:.8rem;color:var(--text2);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag{padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.task-card-footer{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--text3)}
.task-card-footer svg{width:14px;height:14px}
.subtask-progress{display:flex;align-items:center;gap:4px}
.progress-bar{width:40px;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.due-date{display:flex;align-items:center;gap:3px}
.due-date.overdue{color:var(--urgent)}
.add-task-btn{padding:10px;text-align:center;color:var(--text3);border-radius:var(--radius);cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem;flex-shrink:0;margin:8px}
.add-task-btn:hover{background:var(--bg3);color:var(--text)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--bg2);border-radius:var(--radius2);width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);transform:scale(.95);transition:transform .2s}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:1.1rem;font-weight:700}
.modal-body{padding:24px}
.modal-body .field{margin-bottom:16px}
.modal-body label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:6px;font-weight:600}
.modal-body .row{display:flex;gap:12px}
.modal-body .row>*{flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-start;gap:8px}
.priority-select{display:flex;gap:6px}
.priority-opt{padding:6px 12px;border-radius:var(--radius);font-size:.8rem;border:1px solid var(--border);transition:var(--transition);font-weight:600}
.priority-opt:hover,.priority-opt.sel{color:#fff}
.priority-opt[data-p="urgent"]:hover,.priority-opt[data-p="urgent"].sel{background:var(--urgent);border-color:var(--urgent)}
.priority-opt[data-p="high"]:hover,.priority-opt[data-p="high"].sel{background:var(--high);border-color:var(--high)}
.priority-opt[data-p="medium"]:hover,.priority-opt[data-p="medium"].sel{background:var(--medium);border-color:var(--medium)}
.priority-opt[data-p="low"]:hover,.priority-opt[data-p="low"].sel{background:var(--low);border-color:var(--low)}

/* Tags input */
.tags-input{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);min-height:38px;align-items:center;cursor:text}
.tags-input:focus-within{border-color:var(--accent)}
.tags-input .tag{display:flex;align-items:center;gap:4px;cursor:default}
.tags-input .tag button{font-size:.7rem;opacity:.7}
.tags-input .tag button:hover{opacity:1}
.tags-input input{border:none;background:none;padding:2px;min-width:80px;flex:1}
.tags-input input:focus{outline:none}
.tag-suggestions{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag-sug{cursor:pointer;opacity:.7;transition:var(--transition)}
.tag-sug:hover{opacity:1}

/* Subtasks */
.subtasks-list{display:flex;flex-direction:column;gap:6px}
.subtask-item{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg3);border-radius:6px}
.subtask-item input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent)}
.subtask-item .subtask-text{flex:1;font-size:.85rem}
.subtask-item .subtask-text.done{text-decoration:line-through;color:var(--text3)}
.subtask-item button{opacity:.5}
.subtask-item button:hover{opacity:1}
.add-subtask{display:flex;gap:6px;margin-top:6px}
.add-subtask input{flex:1}

/* Filters bar */
.filters-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-chip{padding:5px 12px;border-radius:16px;font-size:.8rem;background:var(--bg3);color:var(--text2);border:1px solid var(--border);transition:var(--transition);display:flex;align-items:center;gap:4px}
.filter-chip:hover{border-color:var(--accent)}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-chip select{background:transparent;border:none;color:inherit;font-size:inherit;padding:0;cursor:pointer}
.filter-chip select option{background:var(--bg2);color:var(--text)}

/* Calendar View */
.calendar{background:var(--bg2);border-radius:var(--radius2);overflow:hidden}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.cal-header h3{font-size:1rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day-name{padding:10px;text-align:center;font-size:.75rem;color:var(--text3);font-weight:600;border-bottom:1px solid var(--border)}
.cal-day{min-height:90px;padding:6px;border:1px solid var(--border);border-top:none;border-right:none;position:relative}
.cal-day:nth-child(7n){border-left:none}
.cal-day-num{font-size:.8rem;color:var(--text3);margin-bottom:4px}
.cal-day.today .cal-day-num{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal-day.other{opacity:.3}
.cal-task{font-size:.7rem;padding:2px 6px;border-radius:4px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg2);border-radius:var(--radius2);padding:20px;border:1px solid var(--border)}
.stat-card .label{font-size:.8rem;color:var(--text3);margin-bottom:8px}
.stat-card .value{font-size:2rem;font-weight:700}
.stat-card .sub{font-size:.8rem;color:var(--text3);margin-top:4px}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.chart-card{background:var(--bg2);border-radius:var(--radius2);padding:20px;border:1px solid var(--border)}
.chart-card h3{font-size:.9rem;margin-bottom:16px;color:var(--text2)}
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{width:70px;font-size:.8rem;color:var(--text2);text-align:left}
.bar-track{flex:1;height:24px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width .5s;display:flex;align-items:center;padding:0 8px;font-size:.75rem;color:#fff;font-weight:600}
.donut-container{display:flex;align-items:center;gap:20px}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:.8rem}
.legend-dot{width:10px;height:10px;border-radius:50%}

/* Board modal */
.board-form{display:flex;gap:8px;padding:12px}
.board-form input{flex:1}

/* Context menu */
.ctx-menu{position:fixed;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:4px;z-index:2000;min-width:160px;box-shadow:var(--shadow)}
.ctx-item{padding:8px 12px;border-radius:6px;font-size:.85rem;display:flex;align-items:center;gap:8px;cursor:pointer;transition:var(--transition)}
.ctx-item:hover{background:var(--bg3)}
.ctx-item.danger{color:var(--urgent)}
.ctx-item svg{width:16px;height:16px}

/* Kbd */
kbd{background:var(--bg4);padding:2px 6px;border-radius:4px;font-size:.7rem;font-family:monospace;border:1px solid var(--border)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg3);color:var(--text);padding:12px 24px;border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .3s;z-index:3000;font-size:.9rem}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;right:0;top:0;height:100%;z-index:200;width:260px;transform:translateX(100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .sidebar.collapsed{transform:translateX(100%)}
  .menu-btn{display:flex}
  .kanban{flex-direction:column}
  .kanban-col{min-width:100%;max-width:100%}
  .search-box{width:140px}
  .topbar{padding:10px 14px}
  .content{padding:14px}
  .view-tabs{display:none}
  .mobile-view-tabs{display:flex !important}
}
.mobile-view-tabs{display:none;gap:4px;background:var(--bg3);border-radius:var(--radius);padding:3px;margin-bottom:12px}
.mobile-view-tabs .view-tab{flex:1;text-align:center}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3)}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:.4}
.empty-state p{font-size:.9rem}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .2s ease}

/* Import/Export */
.import-export{padding:16px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
.import-export .btn{font-size:.75rem;padding:5px 10px}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 5h6"/></svg></div>
      <h1>משימות</h1>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">תצוגות</div>
        <div class="nav-item active" data-view="kanban" onclick="switchView('kanban')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="9" y="3" width="6" height="12" rx="1"/><rect x="15" y="3" width="6" height="15" rx="1"/></svg>
          לוח קנבן
        </div>
        <div class="nav-item" data-view="calendar" onclick="switchView('calendar')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          לוח שנה
        </div>
        <div class="nav-item" data-view="stats" onclick="switchView('stats')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
          סטטיסטיקות
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">פרויקטים <button class="btn-icon" onclick="showNewBoard()" title="פרויקט חדש"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div id="boardsList"></div>
      </div>
    </nav>
    <div class="import-export">
      <button class="btn btn-ghost btn-sm" onclick="exportData()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> ייצוא</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg> ייבוא</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="topbar-right">
        <button class="menu-btn btn-icon" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <span class="board-title" id="boardTitle">פרויקט ראשי</span>
        <div class="view-tabs" id="viewTabs">
          <button class="view-tab active" data-view="kanban" onclick="switchView('kanban')">קנבן</button>
          <button class="view-tab" data-view="calendar" onclick="switchView('calendar')">לוח שנה</button>
          <button class="view-tab" data-view="stats" onclick="switchView('stats')">סטטיסטיקות</button>
        </div>
      </div>
      <div class="topbar-left">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="חיפוש... ( / )" oninput="applyFilters()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
        <button class="btn btn-primary" onclick="openTaskModal()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> חדש</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="taskModalTitle">משימה חדשה</h2>
      <button class="btn-icon" onclick="closeTaskModal()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field"><label>כותרת</label><input type="text" id="taskTitle" placeholder="שם המשימה"></div>
      <div class="field"><label>תיאור</label><textarea id="taskDesc" placeholder="תיאור המשימה"></textarea></div>
      <div class="row">
        <div class="field"><label>עדיפות</label>
          <div class="priority-select" id="prioritySelect">
            <button class="priority-opt" data-p="urgent" onclick="setPriority('urgent')">דחוף</button>
            <button class="priority-opt" data-p="high" onclick="setPriority('high')">גבוה</button>
            <button class="priority-opt sel" data-p="medium" onclick="setPriority('medium')">בינוני</button>
            <button class="priority-opt" data-p="low" onclick="setPriority('low')">נמוך</button>
          </div>
        </div>
        <div class="field"><label>תאריך יעד</label><input type="date" id="taskDue"></div>
      </div>
      <div class="row">
        <div class="field"><label>סטטוס</label>
          <select id="taskStatus">
            <option value="todo">לביצוע</option>
            <option value="progress">בתהליך</option>
            <option value="review">בבדיקה</option>
            <option value="done">הושלם</option>
          </select>
        </div>
        <div class="field"><label>אחראי</label><input type="text" id="taskAssignee" placeholder="שם"></div>
      </div>
      <div class="field">
        <label>תגיות</label>
        <div class="tags-input" id="tagsInput" onclick="this.querySelector('input').focus()">
          <input type="text" id="tagInput" placeholder="הוסף תגית..." onkeydown="handleTagKey(event)">
        </div>
        <div class="tag-suggestions" id="tagSuggestions"></div>
      </div>
      <div class="field">
        <label>משימות משנה</label>
        <div class="subtasks-list" id="subtasksList"></div>
        <div class="add-subtask">
          <input type="text" id="newSubtask" placeholder="משימת משנה חדשה..." onkeydown="if(event.key==='Enter')addSubtask()">
          <button class="btn btn-ghost btn-sm" onclick="addSubtask()">הוסף</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="saveTask()">שמור</button>
      <button class="btn btn-ghost" onclick="closeTaskModal()">ביטול</button>
      <button class="btn btn-ghost danger" id="deleteTaskBtn" style="margin-right:auto;color:var(--urgent);display:none" onclick="deleteTask()">מחק</button>
    </div>
  </div>
</div>

<!-- Board Modal -->
<div class="modal-overlay" id="boardModal">
  <div class="modal" style="width:400px">
    <div class="modal-header">
      <h2>פרויקט חדש</h2>
      <button class="btn-icon" onclick="closeBoardModal()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field"><label>שם הפרויקט</label><input type="text" id="boardName" placeholder="שם הפרויקט" onkeydown="if(event.key==='Enter')createBoard()"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="createBoard()">צור</button>
      <button class="btn btn-ghost" onclick="closeBoardModal()">ביטול</button>
    </div>
  </div>
</div>

<!-- Context Menu -->
<div class="ctx-menu" id="ctxMenu" style="display:none"></div>
<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
const STATUSES = [
  {id:'todo',name:'לביצוע',color:'#6c5ce7'},
  {id:'progress',name:'בתהליך',color:'#0984e3'},
  {id:'review',name:'בבדיקה',color:'#ffa502'},
  {id:'done',name:'הושלם',color:'#2ed573'}
];
const PRIORITIES = {urgent:{name:'דחוף',color:'#ff4757'},high:{name:'גבוה',color:'#ff6b6b'},medium:{name:'בינוני',color:'#ffa502'},low:{name:'נמוך',color:'#2ed573'}};
const TAG_COLORS = ['#6c5ce7','#00cec9','#fd79a8','#fdcb6e','#00b894','#e17055','#0984e3','#d63031','#636e72','#a29bfe'];
const STORAGE_KEY = 'taskManagerData';

let state = loadState();
let currentView = 'kanban';
let editingTaskId = null;
let modalTags = [];
let modalSubtasks = [];
let dragTask = null;
let activeFilters = {priority:'',tag:'',assignee:''};

function defaultState(){
  return {
    boards:[{id:genId(),name:'פרויקט ראשי'}],
    activeBoardId:null,
    tasks:[],
    tags:[
      {name:'באג',color:'#d63031'},{name:'פיצ\'ר',color:'#6c5ce7'},{name:'שיפור',color:'#00cec9'},
      {name:'דחוף',color:'#ff4757'},{name:'תיעוד',color:'#fdcb6e'}
    ],
    calMonth:new Date().getMonth(),
    calYear:new Date().getFullYear()
  };
}
function loadState(){
  try{const d=localStorage.getItem(STORAGE_KEY);if(d){const s=JSON.parse(d);if(!s.boards||!s.boards.length){return defaultState()}s.activeBoardId=s.activeBoardId||s.boards[0].id;return s}}catch(e){}
  const s=defaultState();s.activeBoardId=s.boards[0].id;return s;
}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

// ===== BOARD =====
function boardTasks(){return state.tasks.filter(t=>t.boardId===state.activeBoardId)}
function renderBoards(){
  const el=document.getElementById('boardsList');
  el.innerHTML=state.boards.map(b=>`
    <div class="nav-item ${b.id===state.activeBoardId?'active':''}" onclick="switchBoard('${b.id}')" oncontextmenu="boardCtx(event,'${b.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>
      ${b.name}
      <span class="count">${state.tasks.filter(t=>t.boardId===b.id).length}</span>
    </div>
  `).join('');
}
function switchBoard(id){state.activeBoardId=id;saveState();renderBoards();renderView()}
function showNewBoard(){document.getElementById('boardModal').classList.add('open');document.getElementById('boardName').value='';setTimeout(()=>document.getElementById('boardName').focus(),100)}
function closeBoardModal(){document.getElementById('boardModal').classList.remove('open')}
function createBoard(){
  const name=document.getElementById('boardName').value.trim();
  if(!name)return;
  const b={id:genId(),name};state.boards.push(b);state.activeBoardId=b.id;saveState();closeBoardModal();renderBoards();renderView();toast('פרויקט נוצר');
}
function boardCtx(e,id){
  e.preventDefault();
  if(state.boards.length<=1)return;
  showCtx(e.clientX,e.clientY,[
    {label:'מחק פרויקט',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>',cls:'danger',fn:()=>{
      state.tasks=state.tasks.filter(t=>t.boardId!==id);
      state.boards=state.boards.filter(b=>b.id!==id);
      if(state.activeBoardId===id)state.activeBoardId=state.boards[0].id;
      saveState();renderBoards();renderView();toast('פרויקט נמחק');
    }}
  ]);
}

// ===== VIEW SWITCH =====
function switchView(v){
  currentView=v;
  document.querySelectorAll('.view-tab,.nav-item[data-view]').forEach(el=>{
    el.classList.toggle('active',el.dataset.view===v);
  });
  renderView();
}
function renderView(){
  const c=document.getElementById('content');
  document.getElementById('boardTitle').textContent=state.boards.find(b=>b.id===state.activeBoardId)?.name||'';
  if(currentView==='kanban')renderKanban(c);
  else if(currentView==='calendar')renderCalendar(c);
  else if(currentView==='stats')renderStats(c);
}

// ===== FILTERS =====
function getFilteredTasks(){
  let tasks=boardTasks();
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  if(q)tasks=tasks.filter(t=>t.title.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q)||(t.tags||[]).some(tg=>tg.toLowerCase().includes(q)));
  if(activeFilters.priority)tasks=tasks.filter(t=>t.priority===activeFilters.priority);
  if(activeFilters.tag)tasks=tasks.filter(t=>(t.tags||[]).includes(activeFilters.tag));
  if(activeFilters.assignee)tasks=tasks.filter(t=>(t.assignee||'').includes(activeFilters.assignee));
  return tasks;
}
function applyFilters(){renderView()}
function renderFiltersBar(){
  const allTags=[...new Set(boardTasks().flatMap(t=>t.tags||[]))];
  return `<div class="filters-bar">
    <select class="filter-chip" onchange="activeFilters.priority=this.value;applyFilters()">
      <option value="">כל העדיפויות</option>
      ${Object.entries(PRIORITIES).map(([k,v])=>`<option value="${k}" ${activeFilters.priority===k?'selected':''}>${v.name}</option>`).join('')}
    </select>
    <select class="filter-chip" onchange="activeFilters.tag=this.value;applyFilters()">
      <option value="">כל התגיות</option>
      ${allTags.map(t=>`<option value="${t}" ${activeFilters.tag===t?'selected':''}>${t}</option>`).join('')}
    </select>
    <input class="filter-chip" style="width:120px;padding:5px 12px" placeholder="אחראי..." value="${activeFilters.assignee}" oninput="activeFilters.assignee=this.value;applyFilters()">
    ${(activeFilters.priority||activeFilters.tag||activeFilters.assignee)?`<button class="filter-chip" onclick="activeFilters={priority:'',tag:'',assignee:''};applyFilters()" style="color:var(--urgent)">✕ נקה</button>`:''}
  </div>`;
}

// ===== KANBAN =====
function renderKanban(c){
  const tasks=getFilteredTasks();
  c.innerHTML=`
    <div class="mobile-view-tabs">
      <button class="view-tab active" data-view="kanban" onclick="switchView('kanban')">קנבן</button>
      <button class="view-tab" data-view="calendar" onclick="switchView('calendar')">לוח שנה</button>
      <button class="view-tab" data-view="stats" onclick="switchView('stats')">סטטיסטיקות</button>
    </div>
    ${renderFiltersBar()}
    <div class="kanban">${STATUSES.map(s=>{
      const colTasks=tasks.filter(t=>t.status===s.id).sort((a,b)=>(a.order||0)-(b.order||0));
      return `<div class="kanban-col">
        <div class="col-header">
          <div class="col-dot" style="background:${s.color}"></div>
          <div class="col-title">${s.name}</div>
          <div class="col-count">${colTasks.length}</div>
        </div>
        <div class="col-body" data-status="${s.id}"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="dropTask(event,this)">
          ${colTasks.map(t=>renderTaskCard(t)).join('')}
        </div>
        <div class="add-task-btn" onclick="openTaskModal(null,'${s.id}')">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          הוסף משימה
        </div>
      </div>`;
    }).join('')}</div>`;
}
function renderTaskCard(t){
  const p=PRIORITIES[t.priority]||PRIORITIES.medium;
  const subs=t.subtasks||[];
  const doneSubs=subs.filter(s=>s.done).length;
  const dueClass=t.due&&new Date(t.due)<new Date()&&t.status!=='done'?'overdue':'';
  return `<div class="task-card fade-in" draggable="true" data-id="${t.id}"
    ondragstart="dragStart(event)" ondragend="dragEnd(event)"
    onclick="openTaskModal('${t.id}')" oncontextmenu="taskCtx(event,'${t.id}')">
    <div class="task-card-priority" style="background:${p.color}"></div>
    <div class="task-card-title">${esc(t.title)}</div>
    ${t.desc?`<div class="task-card-desc">${esc(t.desc)}</div>`:''}
    ${(t.tags||[]).length?`<div class="task-card-tags">${t.tags.map(tg=>`<span class="tag" style="background:${getTagColor(tg)}33;color:${getTagColor(tg)}">${esc(tg)}</span>`).join('')}</div>`:''}
    <div class="task-card-footer">
      ${subs.length?`<div class="subtask-progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><div class="progress-bar"><div class="progress-fill" style="width:${subs.length?doneSubs/subs.length*100:0}%"></div></div>${doneSubs}/${subs.length}</div>`:''}
      ${t.due?`<div class="due-date ${dueClass}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${formatDate(t.due)}</div>`:''}
      ${t.assignee?`<span style="margin-right:auto">${esc(t.assignee)}</span>`:''}
    </div>
  </div>`;
}

// ===== DRAG & DROP =====
function dragStart(e){
  dragTask=e.target.dataset.id;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function dragEnd(e){e.target.classList.remove('dragging');dragTask=null}
function dropTask(e,col){
  e.preventDefault();col.classList.remove('drag-over');
  if(!dragTask)return;
  const t=state.tasks.find(t=>t.id===dragTask);
  if(t){t.status=col.dataset.status;saveState();renderView();toast('משימה הועברה')}
}

// ===== TASK MODAL =====
function openTaskModal(id,status){
  editingTaskId=id||null;
  const modal=document.getElementById('taskModal');
  const delBtn=document.getElementById('deleteTaskBtn');
  if(id){
    const t=state.tasks.find(t=>t.id===id);if(!t)return;
    document.getElementById('taskModalTitle').textContent='עריכת משימה';
    document.getElementById('taskTitle').value=t.title;
    document.getElementById('taskDesc').value=t.desc||'';
    document.getElementById('taskDue').value=t.due||'';
    document.getElementById('taskStatus').value=t.status;
    document.getElementById('taskAssignee').value=t.assignee||'';
    setPriority(t.priority||'medium');
    modalTags=[...(t.tags||[])];
    modalSubtasks=(t.subtasks||[]).map(s=>({...s}));
    delBtn.style.display='block';
  } else {
    document.getElementById('taskModalTitle').textContent='משימה חדשה';
    document.getElementById('taskTitle').value='';
    document.getElementById('taskDesc').value='';
    document.getElementById('taskDue').value='';
    document.getElementById('taskStatus').value=status||'todo';
    document.getElementById('taskAssignee').value='';
    setPriority('medium');
    modalTags=[];modalSubtasks=[];
    delBtn.style.display='none';
  }
  renderModalTags();renderModalSubtasks();
  modal.classList.add('open');
  setTimeout(()=>document.getElementById('taskTitle').focus(),100);
}
function closeTaskModal(){document.getElementById('taskModal').classList.remove('open');editingTaskId=null}
function setPriority(p){
  document.querySelectorAll('.priority-opt').forEach(el=>el.classList.toggle('sel',el.dataset.p===p));
  document.getElementById('prioritySelect').dataset.value=p;
}
function saveTask(){
  const title=document.getElementById('taskTitle').value.trim();
  if(!title){toast('נא להזין כותרת');return}
  const data={
    title,
    desc:document.getElementById('taskDesc').value.trim(),
    priority:document.getElementById('prioritySelect').dataset.value||'medium',
    due:document.getElementById('taskDue').value,
    status:document.getElementById('taskStatus').value,
    assignee:document.getElementById('taskAssignee').value.trim(),
    tags:[...modalTags],
    subtasks:modalSubtasks.map(s=>({...s})),
    boardId:state.activeBoardId
  };
  if(editingTaskId){
    const t=state.tasks.find(t=>t.id===editingTaskId);
    if(t)Object.assign(t,data,{updatedAt:Date.now()});
  } else {
    state.tasks.push({id:genId(),order:boardTasks().filter(t=>t.status===data.status).length,...data,createdAt:Date.now(),updatedAt:Date.now()});
  }
  // Sync new tags
  data.tags.forEach(tg=>{if(!state.tags.find(t=>t.name===tg))state.tags.push({name:tg,color:TAG_COLORS[state.tags.length%TAG_COLORS.length]})});
  saveState();closeTaskModal();renderView();toast(editingTaskId?'משימה עודכנה':'משימה נוצרה');
}
function deleteTask(){
  if(!editingTaskId)return;
  state.tasks=state.tasks.filter(t=>t.id!==editingTaskId);
  saveState();closeTaskModal();renderView();toast('משימה נמחקה');
}

// Tags in modal
function renderModalTags(){
  const container=document.getElementById('tagsInput');
  const input=document.getElementById('tagInput');
  container.innerHTML=modalTags.map((t,i)=>`<span class="tag" style="background:${getTagColor(t)}44;color:${getTagColor(t)}">${esc(t)} <button onclick="event.stopPropagation();modalTags.splice(${i},1);renderModalTags()">×</button></span>`).join('');
  container.appendChild(input);
  // Suggestions
  const sug=document.getElementById('tagSuggestions');
  sug.innerHTML=state.tags.filter(t=>!modalTags.includes(t.name)).map(t=>`<span class="tag tag-sug" style="background:${t.color}44;color:${t.color}" onclick="modalTags.push('${t.name}');renderModalTags()">${esc(t.name)}</span>`).join('');
}
function handleTagKey(e){
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();
    const v=e.target.value.trim().replace(',','');
    if(v&&!modalTags.includes(v)){modalTags.push(v);e.target.value='';renderModalTags()}
  }
  if(e.key==='Backspace'&&!e.target.value&&modalTags.length){modalTags.pop();renderModalTags()}
}

// Subtasks in modal
function renderModalSubtasks(){
  document.getElementById('subtasksList').innerHTML=modalSubtasks.map((s,i)=>`
    <div class="subtask-item">
      <input type="checkbox" ${s.done?'checked':''} onchange="modalSubtasks[${i}].done=this.checked">
      <span class="subtask-text ${s.done?'done':''}">${esc(s.text)}</span>
      <button onclick="modalSubtasks.splice(${i},1);renderModalSubtasks()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
  `).join('');
}
function addSubtask(){
  const inp=document.getElementById('newSubtask');
  const v=inp.value.trim();if(!v)return;
  modalSubtasks.push({text:v,done:false});inp.value='';renderModalSubtasks();
}

// ===== CALENDAR =====
function renderCalendar(c){
  const tasks=getFilteredTasks().filter(t=>t.due);
  const y=state.calYear,m=state.calMonth;
  const first=new Date(y,m,1);
  const startDay=(first.getDay()+1)%7; // adjust for Hebrew week (Sun=0)
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=new Date();
  const monthNames=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const dayNames=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];

  let cells='';
  // Previous month days
  const prevDays=new Date(y,m,0).getDate();
  for(let i=startDay-1;i>=0;i--)cells+=`<div class="cal-day other"><div class="cal-day-num">${prevDays-i}</div></div>`;
  // Current month
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    const dayTasks=tasks.filter(t=>t.due===dateStr);
    cells+=`<div class="cal-day ${isToday?'today':''}">
      <div class="cal-day-num">${d}</div>
      ${dayTasks.slice(0,3).map(t=>`<div class="cal-task" style="background:${PRIORITIES[t.priority]?.color||'#6c5ce7'}" onclick="openTaskModal('${t.id}')">${esc(t.title)}</div>`).join('')}
      ${dayTasks.length>3?`<div style="font-size:.7rem;color:var(--text3)">+${dayTasks.length-3} נוספות</div>`:''}
    </div>`;
  }
  // Next month
  const totalCells=startDay+daysInMonth;
  const remaining=totalCells%7===0?0:7-totalCells%7;
  for(let i=1;i<=remaining;i++)cells+=`<div class="cal-day other"><div class="cal-day-num">${i}</div></div>`;

  c.innerHTML=`
    <div class="mobile-view-tabs"><button class="view-tab" data-view="kanban" onclick="switchView('kanban')">קנבן</button><button class="view-tab active" data-view="calendar" onclick="switchView('calendar')">לוח שנה</button><button class="view-tab" data-view="stats" onclick="switchView('stats')">סטטיסטיקות</button></div>
    ${renderFiltersBar()}
    <div class="calendar fade-in">
      <div class="cal-header">
        <button class="btn btn-ghost" onclick="state.calMonth--;if(state.calMonth<0){state.calMonth=11;state.calYear--}saveState();renderView()">◀</button>
        <h3>${monthNames[m]} ${y}</h3>
        <button class="btn btn-ghost" onclick="state.calMonth++;if(state.calMonth>11){state.calMonth=0;state.calYear++}saveState();renderView()">▶</button>
      </div>
      <div class="cal-grid">
        ${dayNames.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>`;
}

// ===== STATS =====
function renderStats(c){
  const tasks=boardTasks();
  const total=tasks.length;
  const done=tasks.filter(t=>t.status==='done').length;
  const overdue=tasks.filter(t=>t.due&&new Date(t.due)<new Date()&&t.status!=='done').length;
  const rate=total?Math.round(done/total*100):0;

  const byStatus=STATUSES.map(s=>({...s,count:tasks.filter(t=>t.status===s.id).length}));
  const byPriority=Object.entries(PRIORITIES).map(([k,v])=>({id:k,...v,count:tasks.filter(t=>t.priority===k).length}));
  const maxStatus=Math.max(...byStatus.map(s=>s.count),1);
  const maxPriority=Math.max(...byPriority.map(p=>p.count),1);

  c.innerHTML=`
    <div class="mobile-view-tabs"><button class="view-tab" data-view="kanban" onclick="switchView('kanban')">קנבן</button><button class="view-tab" data-view="calendar" onclick="switchView('calendar')">לוח שנה</button><button class="view-tab active" data-view="stats" onclick="switchView('stats')">סטטיסטיקות</button></div>
    <div class="stats-grid fade-in">
      <div class="stat-card"><div class="label">סה״כ משימות</div><div class="value">${total}</div></div>
      <div class="stat-card"><div class="label">הושלמו</div><div class="value" style="color:var(--low)">${done}</div><div class="sub">${rate}% הושלם</div></div>
      <div class="stat-card"><div class="label">בתהליך</div><div class="value" style="color:#0984e3">${tasks.filter(t=>t.status==='progress').length}</div></div>
      <div class="stat-card"><div class="label">באיחור</div><div class="value" style="color:var(--urgent)">${overdue}</div></div>
    </div>
    <div class="charts-grid fade-in">
      <div class="chart-card">
        <h3>לפי סטטוס</h3>
        <div class="bar-chart">${byStatus.map(s=>`
          <div class="bar-row">
            <div class="bar-label">${s.name}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${s.count/maxStatus*100}%;background:${s.color}">${s.count}</div></div>
          </div>`).join('')}
        </div>
      </div>
      <div class="chart-card">
        <h3>לפי עדיפות</h3>
        <div class="bar-chart">${byPriority.map(p=>`
          <div class="bar-row">
            <div class="bar-label">${p.name}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${p.count/maxPriority*100}%;background:${p.color}">${p.count}</div></div>
          </div>`).join('')}
        </div>
      </div>
      <div class="chart-card">
        <h3>קצב השלמה</h3>
        <div class="donut-container">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--bg)" stroke-width="12"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--low)" stroke-width="12"
              stroke-dasharray="${rate*3.14} ${314-rate*3.14}" stroke-dashoffset="78.5"
              stroke-linecap="round" transform="rotate(-90 60 60)"/>
            <text x="60" y="65" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700">${rate}%</text>
          </svg>
          <div class="donut-legend">
            <div class="legend-item"><div class="legend-dot" style="background:var(--low)"></div> הושלם (${done})</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--bg4)"></div> נותר (${total-done})</div>
          </div>
        </div>
      </div>
    </div>`;
}

// ===== CONTEXT MENU =====
function showCtx(x,y,items){
  const m=document.getElementById('ctxMenu');
  m.innerHTML=items.map(i=>`<div class="ctx-item ${i.cls||''}">${i.icon||''}${i.label}</div>`).join('');
  m.style.display='block';m.style.left=Math.min(x,window.innerWidth-180)+'px';m.style.top=Math.min(y,window.innerHeight-items.length*40)+'px';
  m.querySelectorAll('.ctx-item').forEach((el,idx)=>el.onclick=()=>{m.style.display='none';items[idx].fn()});
  setTimeout(()=>document.addEventListener('click',()=>m.style.display='none',{once:true}),10);
}
function taskCtx(e,id){
  e.preventDefault();e.stopPropagation();
  showCtx(e.clientX,e.clientY,[
    {label:'ערוך',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',fn:()=>openTaskModal(id)},
    {label:'שכפל',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>',fn:()=>{
      const t=state.tasks.find(t=>t.id===id);if(!t)return;
      state.tasks.push({...JSON.parse(JSON.stringify(t)),id:genId(),title:t.title+' (עותק)',createdAt:Date.now()});
      saveState();renderView();toast('משימה שוכפלה');
    }},
    {label:'מחק',cls:'danger',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>',fn:()=>{
      state.tasks=state.tasks.filter(t=>t.id!==id);saveState();renderView();toast('משימה נמחקה');
    }}
  ]);
}

// ===== IMPORT/EXPORT =====
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tasks-backup.json';a.click();toast('נתונים יוצאו');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{state=JSON.parse(r.result);if(!state.boards)throw'';state.activeBoardId=state.activeBoardId||state.boards[0]?.id;saveState();renderBoards();renderView();toast('נתונים יובאו')}catch(e){toast('קובץ לא תקין')}};
  r.readAsText(f);e.target.value='';
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();openTaskModal()}
  if(e.key==='/'){e.preventDefault();document.getElementById('searchInput').focus()}
  if(e.key==='Escape'){closeTaskModal();closeBoardModal();document.getElementById('ctxMenu').style.display='none'}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeTaskModal();closeBoardModal()}
});

// ===== UTILS =====
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function formatDate(d){if(!d)return'';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('he-IL',{day:'numeric',month:'short'})}
function getTagColor(name){const t=state.tags.find(t=>t.name===name);return t?t.color:TAG_COLORS[name.length%TAG_COLORS.length]}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebar').classList.toggle('collapsed')}

// Close modals on overlay click
document.getElementById('taskModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeTaskModal()});
document.getElementById('boardModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeBoardModal()});

// ===== INIT =====
if(!state.activeBoardId&&state.boards.length)state.activeBoardId=state.boards[0].id;
renderBoards();renderView();
</script>
</body>
</html>
